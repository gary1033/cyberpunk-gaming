<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON MEMORIES｜角色立繪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1018;color:#e5eaf2;font:16px/1.5 system-ui,"Microsoft JhengHei",sans-serif}header,main{max-width:1500px;margin:auto;padding:28px}header{border-bottom:1px solid #30394a}h1{margin:4px 0;font-size:30px}p{margin:5px 0;color:#a6b3c6}.eyebrow{color:#63d7e8;letter-spacing:3px;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}button,select{font:inherit;background:#182231;color:#edf4ff;border:1px solid #465a70;border-radius:6px;padding:7px 12px}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #5cdeef;outline-offset:3px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}article{overflow:hidden;border:1px solid #2b394b;border-radius:10px;background:#101925}article h2{font-size:19px;margin:0}.card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;gap:8px}.card-head span{font-size:12px;color:#95a6ba}.portrait{display:block;width:100%;height:360px;object-fit:contain}.surface{background-color:#171b26;background-image:linear-gradient(45deg,#202632 25%,transparent 25%),linear-gradient(-45deg,#202632 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202632 75%),linear-gradient(-45deg,transparent 75%,#202632 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}body[data-background=dark] .surface{background:#080b12}body[data-background=light] .surface{background:#eef0f4}.chooser{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;gap:8px}.chooser a{font-size:13px;color:#72d8e8}details{border-top:1px solid #2b394b}summary{cursor:pointer;padding:10px 15px;color:#a7bdcf;font-size:13px}.expressions{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}.expressions figure{margin:0}.expressions img{width:100%;height:220px;object-fit:contain}.expressions figcaption{text-align:center;font-size:12px;padding:4px;color:#b8c7d9}@media(max-width:1100px){main{grid-template-columns:repeat(3,minmax(0,1fr))}.portrait{height:320px}}@media(max-width:750px){header,main{padding:16px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.portrait{height:280px}.card-head{display:block}.chooser{display:block}.chooser a{display:block;margin-top:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<body data-background="checker">
<header><div class="eyebrow">NEON MEMORIES / CHARACTER COLLECTION</div><h1>同一座城市，十二張面孔。</h1><p>12 位角色 · 50 個表情 · 1024 × 1536 透明立繪</p><p>統一墨線、分階陰影與光源；保留每位角色的辨識特徵。切換表情可比對臉型與服裝。</p><div class="controls"><label>檢視背景 <select id="background"><option value="checker">透明棋盤</option><option value="dark">深色</option><option value="light">淺色</option></select></label><button id="cycle" type="button" aria-pressed="false">輪播表情</button><span id="status" role="status"></span></div></header>
<main id="cast"></main>
<script>
const cast=[['kai','凱·川崎',['default','serious','surprised','thoughtful']],['mei_ling','林美玲',['default','worried','nervous','relieved','frightened']],['ajie','阿傑',['default','suspicious','nervous','angry','cooperative']],['snake','蛇女',['default','amused','serious','threatening']],['dr_chen','Dr. 陳',['default','nervous','frightened','relieved']],['ghost','幽靈',['default','hostile','cautious','revealed']],['zhao_ming','趙明',['default','conflicted','nervous','determined','sincere','sad']],['kid','小鬼',['default','excited','serious','angry']],['mask_merchant','面具商人',['default','interested','suspicious']],['dr_xiao','蕭博士',['default','calm','intense','philosophical','amused','cracking']],['hao_ran','林浩然',['default','dazed','confused','hopeful']],['echo_ai','AI「迴響」',['default']]];
const labels={default:'平常',serious:'認真',surprised:'驚訝',thoughtful:'思考',worried:'擔心',nervous:'緊張',relieved:'釋懷',frightened:'恐懼',suspicious:'懷疑',angry:'憤怒',cooperative:'配合',amused:'玩味',threatening:'威脅',hostile:'敵意',cautious:'戒備',revealed:'揭露',conflicted:'矛盾',determined:'堅定',sincere:'真誠',sad:'悲傷',excited:'興奮',interested:'感興趣',calm:'冷靜',intense:'強烈',philosophical:'沉思',cracking:'失控',dazed:'恍惚',confused:'困惑',hopeful:'希望'};
const staging=new URLSearchParams(location.search).has('stage');
const path=(id,mood)=>staging?`../assets/generated/characters/${id}_${mood}.png`:`../assets/sprites/characters/${id}_${mood}.png`;
for(const [id,name,moods] of cast){
 const card=document.createElement('article');
 card.innerHTML=`<div class="card-head"><h2>${name}</h2><span>${moods.length} 個表情</span></div><div class="surface"><img class="portrait" src="${path(id,'default')}" alt="${name}：平常"></div><div class="chooser"><select aria-label="${name}的表情">${moods.map(m=>`<option value="${m}">${labels[m]}</option>`).join('')}</select><a href="${path(id,'default')}" target="_blank" rel="noopener">開啟原圖 ↗</a></div><details><summary>並排查看全部表情</summary><div class="expressions">${moods.map(m=>`<figure class="surface"><img src="${path(id,m)}" alt="${name}：${labels[m]}" loading="lazy"><figcaption>${labels[m]}</figcaption></figure>`).join('')}</div></details>`;
 const select=card.querySelector('select');
 select.addEventListener('change',()=>{card.querySelector('.portrait').src=path(id,select.value);card.querySelector('.portrait').alt=`${name}：${labels[select.value]}`;card.querySelector('a').href=path(id,select.value)});
 document.querySelector('#cast').append(card);
}
document.querySelector('#background').addEventListener('change',event=>document.body.dataset.background=event.target.value);
let timer=null;
document.querySelector('#cycle').addEventListener('click',event=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>document.querySelectorAll('article select').forEach(select=>{select.selectedIndex=(select.selectedIndex+1)%select.options.length;select.dispatchEvent(new Event('change'))}),2000)}event.target.textContent=timer?'停止輪播':'輪播表情';event.target.setAttribute('aria-pressed',String(Boolean(timer)));document.querySelector('#status').textContent=timer?'每 2 秒切換一次':''});
</script>
</body></html>
