name: NEON MEMORIES CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  data-integrity:
    name: Data Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Godot 4.6.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run full test suite
        env:
          GODOT_BIN: /usr/local/bin/godot
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          bash tests/run_tests.sh 2>&1 | tee /tmp/neon-tests.log

      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-log
          path: /tmp/neon-tests.log
          if-no-files-found: ignore

  structure-check:
    name: Project Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project.godot exists
        run: test -f project.godot

      - name: Count scene files
        run: |
          count=$(find scenes -name "*.tscn" | wc -l)
          echo "Found $count scene files"
          [ "$count" -ge 15 ] || (echo "Expected at least 15 scenes" && exit 1)

      - name: Count GDScript files
        run: |
          count=$(find scripts -name "*.gd" | wc -l)
          echo "Found $count GDScript files"
          [ "$count" -ge 10 ] || (echo "Expected at least 10 scripts" && exit 1)

      - name: Check for debug prints
        run: |
          if grep -rn "print(" scripts/ --include="*.gd" | grep -v "^.*:#"; then
            echo "⚠ Warning: print statements found (review before release)"
          else
            echo "✓ No debug print statements"
          fi
