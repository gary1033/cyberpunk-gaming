<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_warm" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e0e22"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="neon_blue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft_glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccb090"/>
      <stop offset="50%" stop-color="#c4a884"/>
      <stop offset="100%" stop-color="#b09070"/>
    </linearGradient>
    <linearGradient id="coat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaeaf2"/>
      <stop offset="30%" stop-color="#d8d8e8"/>
      <stop offset="70%" stop-color="#c8c8d8"/>
      <stop offset="100%" stop-color="#b8b8c8"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2244"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="hair_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e32"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="glass_fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3377ee" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2266cc" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="relief_aura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4488ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="exhale_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aaccee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#aaccee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background - slightly warmer tone -->
  <rect width="256" height="384" fill="url(#bg_warm)"/>
  <rect width="256" height="384" fill="url(#relief_aura)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle" filter="url(#neon_blue)">Dr. 陳</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle">Dr. 陳</text>

  <!-- Neck - relaxed -->
  <path d="M115,162 Q115,170 116,180 L140,180 Q141,170 141,162" fill="url(#skin_grad)"/>

  <!-- Body - shoulders dropped, relaxed posture -->
  <path d="M128,178 Q128,194 128,212 L128,384 L53,384 L53,270 Q53,230 86,218 Q110,206 128,178 Z" fill="url(#shirt_grad)"/>
  <path d="M128,178 Q128,194 128,212 L128,384 L203,384 L203,270 Q203,230 170,218 Q146,206 128,178 Z" fill="url(#shirt_grad)"/>

  <!-- Lab coat - neat, settled -->
  <path d="M86,218 Q66,224 56,246 Q53,258 53,270 L53,384 L84,384 L84,242 Q86,230 94,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M170,218 Q190,224 200,246 Q203,258 203,270 L203,384 L172,384 L172,242 Q170,230 162,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>

  <!-- Lab coat lapels - neat -->
  <path d="M100,192 L118,230 L100,244" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M156,192 L138,230 L156,244" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Lapel fold lines -->
  <path d="M106,200 Q112,218 110,234" fill="none" stroke="#a8a8c0" stroke-width="0.4" opacity="0.4"/>
  <path d="M150,200 Q144,218 146,234" fill="none" stroke="#a8a8c0" stroke-width="0.4" opacity="0.4"/>

  <!-- Shirt collar -->
  <path d="M110,190 L128,215 L146,190" fill="none" stroke="#1a2244" stroke-width="1.5"/>
  <!-- Tie -->
  <path d="M125,210 L128,232 L131,210" fill="#1a3366" stroke="#2a4488" stroke-width="0.5" opacity="0.6"/>

  <!-- Arms - hanging relaxed at sides, shoulders dropped -->
  <path d="M53,270 Q52,300 53,335 Q54,360 56,384" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M203,270 Q204,300 203,335 Q202,360 200,384" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Hands relaxed -->
  <path d="M53,374 Q50,378 52,384 L62,384 Q64,378 60,374 Q56,372 53,374 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.4"/>
  <path d="M200,374 Q203,378 201,384 L191,384 Q189,378 193,374 Q197,372 200,374 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.4"/>
  <!-- Finger details -->
  <path d="M54,380 L58,380" fill="none" stroke="#b09070" stroke-width="0.3" opacity="0.3"/>
  <path d="M196,380 L200,380" fill="none" stroke="#b09070" stroke-width="0.3" opacity="0.3"/>

  <!-- Shoulders visibly dropped -->
  <path d="M86,218 Q66,228 56,250" fill="none" stroke="#b0b0c0" stroke-width="0.4" opacity="0.5"/>
  <path d="M170,218 Q190,228 200,250" fill="none" stroke="#b0b0c0" stroke-width="0.4" opacity="0.5"/>

  <!-- Coat pocket with pen -->
  <rect x="160" y="264" width="22" height="28" rx="2" fill="none" stroke="#b0b0c0" stroke-width="0.8" opacity="0.5"/>
  <line x1="168" y1="258" x2="168" y2="268" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="168" cy="257" r="1.5" fill="#4488ff" opacity="0.5"/>

  <!-- Head - slightly tilted down in relief, chin dropped -->
  <path d="M93,82 Q93,52 128,46 Q163,52 163,82 L163,124 Q163,142 154,152 Q143,164 128,166 Q113,164 103,152 Q93,142 93,124 Z" fill="url(#skin_grad)"/>
  <!-- Relaxed face shadow -->
  <path d="M102,130 Q110,148 120,155 Q126,158 128,158 Q130,158 136,155 Q146,148 154,130" fill="#a08060" opacity="0.1"/>

  <!-- Hair - neat, combed -->
  <path d="M91,78 Q91,50 128,44 Q165,50 165,78 L165,72 Q165,48 128,42 Q91,48 91,72 Z" fill="url(#hair_grad)"/>
  <path d="M89,72 Q87,60 94,52 Q107,44 120,44" fill="url(#hair_grad)"/>
  <path d="M167,72 Q169,60 162,52 Q149,44 123,44" fill="url(#hair_grad)"/>
  <!-- Hair strands - neatly combed -->
  <path d="M100,54 Q110,48 120,46" fill="none" stroke="#2a2a3e" stroke-width="0.8" opacity="0.4"/>
  <path d="M105,58 Q115,50 125,46" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.3"/>
  <path d="M145,56 Q140,48 132,46" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.3"/>

  <!-- Ears -->
  <path d="M91,108 Q85,102 84,110 Q84,120 88,124 Q91,118 91,108 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.4"/>
  <path d="M165,108 Q171,102 172,110 Q172,120 168,124 Q165,118 165,108 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.4"/>
  <path d="M87,110 Q86,114 87,118" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.4"/>
  <path d="M169,110 Q170,114 169,118" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.4"/>

  <!-- Glasses - pushed up on nose, sitting higher than usual -->
  <rect x="96" y="98" rx="3" ry="3" width="26" height="18" fill="url(#glass_fill)" stroke="#4488ff" stroke-width="1.2" opacity="0.85"/>
  <rect x="134" y="98" rx="3" ry="3" width="26" height="18" fill="url(#glass_fill)" stroke="#4488ff" stroke-width="1.2" opacity="0.85"/>
  <!-- Bridge - pushed up -->
  <path d="M122,106 Q128,102 134,106" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.8"/>
  <!-- Temples -->
  <line x1="96" y1="104" x2="90" y2="102" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <line x1="160" y1="104" x2="166" y2="102" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <!-- Warm lens reflections -->
  <path d="M100,101 L106,101 L104,104" fill="#ffffff" opacity="0.1"/>
  <path d="M138,101 L144,101 L142,104" fill="#ffffff" opacity="0.1"/>
  <!-- Gentle glare -->
  <line x1="100" y1="109" x2="106" y2="103" stroke="#4488ff" stroke-width="0.3" opacity="0.12"/>
  <line x1="138" y1="109" x2="144" y2="103" stroke="#4488ff" stroke-width="0.3" opacity="0.12"/>

  <!-- Eyes - softened, half-closed with relief, slightly squinted from smile -->
  <!-- Left eye -->
  <ellipse cx="109" cy="108" rx="8" ry="4" fill="#1a1a2e"/>
  <ellipse cx="109" cy="108" rx="8" ry="4" fill="none" stroke="#2a2020" stroke-width="0.3"/>
  <circle cx="109" cy="108" r="3" fill="#443322"/>
  <circle cx="109" cy="108" r="1.5" fill="#0a0a1a"/>
  <circle cx="111" cy="107" r="0.8" fill="#ffffff" opacity="0.6"/>
  <!-- Relaxed lower lid -->
  <path d="M101,110 Q109,113 117,110" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.3"/>

  <!-- Right eye -->
  <ellipse cx="147" cy="108" rx="8" ry="4" fill="#1a1a2e"/>
  <ellipse cx="147" cy="108" rx="8" ry="4" fill="none" stroke="#2a2020" stroke-width="0.3"/>
  <circle cx="147" cy="108" r="3" fill="#443322"/>
  <circle cx="147" cy="108" r="1.5" fill="#0a0a1a"/>
  <circle cx="149" cy="107" r="0.8" fill="#ffffff" opacity="0.6"/>
  <path d="M139,110 Q147,113 155,110" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.3"/>

  <!-- Eyebrows - relaxed, gently curved -->
  <path d="M98,98 Q109,94 120,98" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M136,98 Q147,94 158,98" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M128,112 Q127,120 125,128 Q123,132 126,134 Q128,135 130,134 Q133,132 131,128 Q129,120 128,112" fill="none" stroke="#a08060" stroke-width="0.7" opacity="0.4"/>

  <!-- Mouth - small warm smile of relief -->
  <path d="M114,144 Q120,150 128,152 Q136,150 142,144" fill="none" stroke="#8a6a5a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Smile crinkle lines -->
  <path d="M112,143 Q111,140 112,137" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.35"/>
  <path d="M144,143 Q145,140 144,137" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.35"/>
  <!-- Lower lip suggestion -->
  <path d="M120,152 Q128,155 136,152" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.2"/>

  <!-- Exhale breath wisps - visible sigh of relief -->
  <path d="M134,148 Q142,146 152,148 Q160,152 168,150" fill="none" stroke="url(#exhale_grad)" stroke-width="1.5" opacity="0.2" filter="url(#soft_glow)"/>
  <path d="M136,152 Q145,150 155,153 Q162,156 170,154" fill="none" stroke="url(#exhale_grad)" stroke-width="1" opacity="0.15"/>

  <!-- Cheek warmth - slight flush from relief -->
  <ellipse cx="99" cy="130" rx="10" ry="6" fill="#cc8866" opacity="0.06"/>
  <ellipse cx="157" cy="130" rx="10" ry="6" fill="#cc8866" opacity="0.06"/>

  <!-- Crow's feet from smile -->
  <path d="M91,106 Q89,104 87,103" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.25"/>
  <path d="M165,106 Q167,104 169,103" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.25"/>

  <!-- ID badge - hanging straight -->
  <rect x="68" y="282" width="16" height="22" rx="2" fill="#1a1a2e" stroke="#4488ff" stroke-width="0.5" opacity="0.6"/>
  <rect x="71" y="285" width="10" height="6" rx="1" fill="#4488ff" opacity="0.2"/>
  <line x1="71" y1="295" x2="81" y2="295" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Ambient - calm, warm -->
  <ellipse cx="128" cy="300" rx="85" ry="30" fill="#4488ff" opacity="0.025"/>
  <ellipse cx="128" cy="150" rx="50" ry="25" fill="#4488ff" opacity="0.015"/>
</svg>