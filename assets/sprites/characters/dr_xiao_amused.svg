  <path d="M90,198 Q94,178 104,168 L110,162 Q116,158 122,156 L128,154 L134,156 Q140,158 146,162 L152,168 Q162,178 166,198 L158,206 Q148,196 138,190 Q132,188 128,186 Q124,188 118,190 Q108,196 98,206 Z" fill="#141428" stroke="#aaccff" stroke-width="0.6" opacity="0.9"/>
  <path d="M100,200 Q110,192 118,188 Q124,186 128,184 Q132,186 138,188 Q146,192 156,200" fill="none" stroke="#aaccff" stroke-width="0.8" opacity="0.35"/>

