    <path d="M104,114 Q110,110 118,111 Q121,114 120,117 Q116,119 108,119 Q105,117 104,115 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M104,114 Q110,110 118,111 Q121,114" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="112" cy="115" rx="5" ry="4" fill="url(#irisL)"/>
    <ellipse cx="112" cy="114.5" rx="2.2" ry="2.5" fill="#0a0a14"/>
    <circle cx="109" cy="113" r="1.8" fill="#ffffff" opacity="0.9"/>
