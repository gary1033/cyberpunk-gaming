    <path d="M86,108 Q82,86 86,64 Q92,44 108,34 Q120,26 128,24 Q136,26 148,34 Q164,44 170,64 Q174,86 170,108 Q166,96 158,86 Q148,76 138,72 Q128,68 118,72 Q108,76 98,86 Q90,96 86,108 Z" fill="#6a6a7a"/>
    <path d="M92,90 Q96,72 110,56 Q120,44 128,40 L118,48 Q106,58 98,76 Z" fill="#8a8a9a" opacity="0.7"/>
    <path d="M164,90 Q160,72 146,56 Q136,44 128,40 L138,48 Q150,58 158,76 Z" fill="#8a8a9a" opacity="0.7"/>
    <path d="M104,52 Q116,44 128,42 Q140,44 152,52" fill="none" stroke="#d0d0e0" stroke-width="2.5" opacity="0.5"/>
    <path d="M100,66 Q114,56 128,54 Q142,56 156,66" fill="none" stroke="#c0c0d0" stroke-width="1.5" opacity="0.35"/>
    <path d="M88,104 Q86,90 88,74" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.6"/>
    <path d="M168,104 Q170,90 168,74" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.6"/>
    <path d="M86,108 Q84,116 84,126 Q84,134 86,140" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>
    <path d="M170,108 Q172,116 172,126 Q172,134 170,140" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>

