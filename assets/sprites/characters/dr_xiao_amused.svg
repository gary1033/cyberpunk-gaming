    <path d="M101,106 Q110,103 120,106" fill="none" stroke="#8a8a9a" stroke-width="1.8" opacity="0.75"/>
    <path d="M136,104 Q146,101 155,105" fill="none" stroke="#8a8a9a" stroke-width="1.8" opacity="0.75"/>

    <!-- Nose -->
    <path d="M126,130 Q128,134 130,130" fill="none" stroke="#c8aa90" stroke-width="0.8" opacity="0.5"/>

