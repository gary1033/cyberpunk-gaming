  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#88bbff" stroke-width="1" opacity="0.3"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="14" fill="#aaccff" text-anchor="middle" filter="url(#glow)">蕭博士</text>

  <!-- Holographic data -->
  <line x1="20" y1="340" x2="62" y2="340" stroke="#88bbff" stroke-width="0.3" opacity="0.1"/>
  <line x1="194" y1="336" x2="236" y2="336" stroke="#88bbff" stroke-width="0.3" opacity="0.1"/>

  <!-- Body -->
  <path d="M56,230 Q50,250 44,302 L38,384 H218 L212,302 Q206,250 200,230 Q188,208 174,198 L166,194 Q152,186 128,182 Q104,186 90,194 L82,198 Q68,208 56,230 Z" fill="#0c0c1a"/>
  <path d="M56,230 Q62,250 66,280 L68,384 H100 L96,280 Q92,250 86,230 Z" fill="#08081a" opacity="0.6"/>
  <path d="M200,230 Q194,250 190,280 L188,384 H156 L160,280 Q164,250 170,230 Z" fill="#08081a" opacity="0.6"/>
  <path d="M128,188 L128,384" fill="none" stroke="#aaccff" stroke-width="0.3" opacity="0.08"/>

