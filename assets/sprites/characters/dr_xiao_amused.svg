  <!-- Coat accent -->
  <circle cx="128" cy="212" r="3" fill="none" stroke="#aaccff" stroke-width="0.6" opacity="0.28"/>
  <circle cx="128" cy="212" r="1" fill="#88bbff" opacity="0.28"/>

  <!-- Particles -->
  <circle cx="28" cy="78" r="1.1" fill="#88bbff" opacity="0.13"/>
  <circle cx="226" cy="92" r="0.7" fill="#aaccff" opacity="0.1"/>
  <circle cx="38" cy="260" r="0.9" fill="#88bbff" opacity="0.1"/>
  <circle cx="216" cy="242" r="0.6" fill="#aaccff" opacity="0.13"/>
  <circle cx="18" cy="178" r="0.8" fill="#88bbff" opacity="0.07"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>

  <!-- Expression label -->
