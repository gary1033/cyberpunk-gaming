    <path d="M88,108 Q82,104 82,112 Q82,120 86,122" fill="#f2d4b8" opacity="0.5"/>
    <path d="M168,108 Q174,104 174,112 Q174,120 170,122" fill="#f2d4b8" opacity="0.5"/>
