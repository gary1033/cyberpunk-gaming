    <path d="M136,111 Q144,110 152,114 Q152,117 148,119 Q138,119 136,117 Q136,114 136,111 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M136,114 Q144,110 152,114" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="144" cy="115" rx="5" ry="4" fill="url(#irisR)"/>
    <ellipse cx="144" cy="114.5" rx="2.2" ry="2.5" fill="#0a0a14"/>
    <circle cx="141" cy="113" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="146" cy="116" r="0.9" fill="#ffffff" opacity="0.55"/>
    <circle cx="143" cy="116" r="0.5" fill="#ffffff" opacity="0.35"/>
    <!-- Crinkle lines -->
    <path d="M142,118 Q148,120 152,119" fill="none" stroke="#d4b498" stroke-width="0.6" opacity="0.5"/>
    <path d="M143,120 Q147,121 151,120" fill="none" stroke="#d4b498" stroke-width="0.4" opacity="0.3"/>

