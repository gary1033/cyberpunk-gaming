    <path d="M92,112 Q96,120 100,126 Q104,130 106,128 Q102,122 98,114 Z" fill="#d4b498" opacity="0.35"/>
    <path d="M164,112 Q160,120 156,126 Q152,130 150,128 Q154,122 158,114 Z" fill="#d4b498" opacity="0.35"/>

