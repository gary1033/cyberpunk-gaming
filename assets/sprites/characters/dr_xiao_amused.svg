<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="da_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="da_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dcc8"/>
      <stop offset="100%" stop-color="#dcc4a8"/>
    </linearGradient>
    <linearGradient id="da_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="30%" stop-color="#2a2a38"/>
      <stop offset="50%" stop-color="#c0c0d0"/>
      <stop offset="70%" stop-color="#2a2a38"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <radialGradient id="da_glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <filter id="da_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#da_bg)"/>
  <rect width="256" height="384" fill="url(#da_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle" filter="url(#da_neon)">蕭博士</text>

  <!-- Body -->
  <path d="M58,228 Q52,248 44,300 L38,384 H218 L212,300 Q206,248 198,228 Q186,206 172,196 L165,192 Q150,184 128,180 Q106,184 91,192 L84,196 Q70,206 58,228 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.5" opacity="0.9"/>
  <path d="M128,186 L128,384" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.2"/>

  <!-- High collar -->
  <path d="M92,196 Q95,180 106,170 L112,164 Q118,160 124,158 L128,156 L132,158 Q138,160 144,164 L150,170 Q161,180 164,196 L158,204 Q148,194 138,188 Q132,186 128,184 Q124,186 118,188 Q108,194 98,204 Z" fill="#151528" stroke="#ff3344" stroke-width="0.8" opacity="0.95"/>
  <path d="M98,198 Q108,190 118,186 Q124,184 128,182 Q132,184 138,186 Q148,190 158,198" fill="none" stroke="#ff3344" stroke-width="1" opacity="0.6"/>

  <!-- Neck -->
  <rect x="118" y="156" width="20" height="18" rx="4" fill="url(#da_skin)" opacity="0.9"/>

  <!-- Head - slight tilt, anime V-chin -->
  <g transform="rotate(3, 128, 114)">
    <path d="M88,120 Q86,96 90,76 Q96,56 110,46 Q120,40 128,38 Q136,40 146,46 Q160,56 166,76 Q170,96 168,120 Q166,136 160,148 Q152,158 140,164 Q132,168 128,168 Q124,168 116,164 Q104,158 96,148 Q90,136 88,120 Z" fill="url(#da_skin)" opacity="0.95"/>

    <!-- Eyes - knowing, slightly narrowed with amusement, anime -->
    <!-- Left eye -->
    <path d="M104,114 Q110,110 120,111 Q123,114 122,117 Q118,120 110,120 Q105,118 104,115 Z" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="112" cy="115" rx="5" ry="4.5" fill="#1a0808"/>
    <ellipse cx="112" cy="114.5" rx="3.5" ry="3.5" fill="#440011"/>
    <ellipse cx="113" cy="114" rx="2.5" ry="2.5" fill="#ff3344" opacity="0.7"/>
    <circle cx="109" cy="112" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="114" cy="116" r="1" fill="#ffffff" opacity="0.6"/>
    <!-- Right eye -->
    <path d="M134,111 Q144,110 152,114 Q152,118 146,120 Q137,120 134,117 Q134,114 134,111 Z" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="144" cy="115" rx="5" ry="4.5" fill="#1a0808"/>
    <ellipse cx="144" cy="114.5" rx="3.5" ry="3.5" fill="#440011"/>
    <ellipse cx="143" cy="114" rx="2.5" ry="2.5" fill="#ff3344" opacity="0.7"/>
    <circle cx="141" cy="112" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="146" cy="116" r="1" fill="#ffffff" opacity="0.6"/>

    <!-- Eyebrows - one slightly raised, amused -->
    <path d="M101,106 Q110,102 122,105" fill="none" stroke="#1a1a28" stroke-width="2" opacity="0.75"/>
    <path d="M134,103 Q146,100 155,104" fill="none" stroke="#1a1a28" stroke-width="2" opacity="0.75"/>

    <!-- Small anime nose -->
    <path d="M126,128 Q128,132 130,128" fill="none" stroke="#c4a888" stroke-width="0.8" opacity="0.5"/>

    <!-- Mouth - thin knowing smile -->
    <path d="M116,139 Q120,142 124,143 Q128,144 132,143 Q136,142 140,139" fill="none" stroke="#a07060" stroke-width="1.2" opacity="0.75"/>

    <!-- Hair -->
    <path d="M86,110 Q82,88 86,66 Q92,46 108,36 Q120,28 128,26 Q136,28 148,36 Q164,46 170,66 Q174,88 170,110 Q166,98 158,88 Q148,78 138,74 Q128,70 118,74 Q108,78 98,88 Q90,98 86,110 Z" fill="url(#da_hair)" opacity="0.95"/>
    <path d="M96,100 Q100,78 114,62 Q122,54 128,50" fill="none" stroke="#e0e0f0" stroke-width="1.2" opacity="0.5"/>
    <path d="M160,100 Q156,78 142,62 Q134,54 128,50" fill="none" stroke="#e0e0f0" stroke-width="1.2" opacity="0.5"/>
    <path d="M104,56 Q116,48 128,46 Q140,48 152,56" fill="none" stroke="#e8e8f8" stroke-width="1.5" opacity="0.35"/>
    <path d="M88,106 Q86,92 88,76" fill="none" stroke="#c0c0d0" stroke-width="2.5" opacity="0.6"/>
    <path d="M168,106 Q170,92 168,76" fill="none" stroke="#c0c0d0" stroke-width="2.5" opacity="0.6"/>

    <!-- Ears -->
    <path d="M88,110 Q82,106 82,114 Q82,122 86,124" fill="url(#da_skin)" opacity="0.6"/>
    <path d="M168,110 Q174,106 174,114 Q174,122 170,124" fill="url(#da_skin)" opacity="0.6"/>
  </g>

  <!-- Red accent -->
  <circle cx="128" cy="210" r="3" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.5"/>
  <circle cx="128" cy="210" r="1" fill="#ff3344" opacity="0.4"/>

  <!-- Ambient particles -->
  <circle cx="30" cy="80" r="1.2" fill="#ff3344" opacity="0.18"/>
  <circle cx="225" cy="95" r="0.8" fill="#ff3344" opacity="0.14"/>
  <circle cx="40" cy="260" r="1" fill="#ff3344" opacity="0.14"/>
  <circle cx="215" cy="240" r="0.7" fill="#ff3344" opacity="0.18"/>
  <circle cx="20" cy="180" r="0.9" fill="#ff3344" opacity="0.1"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
</svg>