<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a0f1a" />
      <stop offset="100%" stop-color="#0a0a1a" />
    </radialGradient>
    <filter id="neon_blue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glass_reflect">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a882" />
      <stop offset="100%" stop-color="#b09070" />
    </linearGradient>
    <linearGradient id="coat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8f0" />
      <stop offset="50%" stop-color="#d0d0e0" />
      <stop offset="100%" stop-color="#b8b8c8" />
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2244" />
      <stop offset="100%" stop-color="#0d1530" />
    </linearGradient>
    <linearGradient id="hair_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0d0d1a" />
    </linearGradient>
    <linearGradient id="glass_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2266cc" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle" filter="url(#neon_blue)">Dr.陳</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle">Dr.陳</text>

  <!-- Neck -->
  <rect x="114" y="160" width="28" height="28" rx="4" fill="url(#skin_grad)"/>

  <!-- Body - lab coat over dark shirt -->
  <!-- Inner shirt -->
  <path d="M128,186 Q128,198 128,210 L128,384 L55,384 L55,270 Q55,230 88,218 Q112,206 128,186 Z" fill="url(#shirt_grad)"/>
  <path d="M128,186 Q128,198 128,210 L128,384 L201,384 L201,270 Q201,230 168,218 Q144,206 128,186 Z" fill="url(#shirt_grad)"/>

  <!-- Lab coat - white, open front -->
  <path d="M88,218 Q68,224 58,244 Q55,255 55,270 L55,384 L85,384 L85,240 Q88,228 95,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M168,218 Q188,224 198,244 Q201,255 201,270 L201,384 L171,384 L171,240 Q168,228 161,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>

  <!-- Lab coat lapels -->
  <path d="M100,195 L118,230 L100,240" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M156,195 L138,230 L156,240" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>

  <!-- Shirt collar visible -->
  <path d="M110,192 L128,215 L146,192" fill="none" stroke="#1a2244" stroke-width="1.5"/>

  <!-- Lab coat pocket with pen -->
  <rect x="160" y="260" width="22" height="28" rx="2" fill="none" stroke="#b0b0c0" stroke-width="0.8" opacity="0.6"/>
  <line x1="168" y1="255" x2="168" y2="265" stroke="#4488ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="168" cy="254" r="1.5" fill="#4488ff" opacity="0.6"/>

  <!-- Blue accent line on coat -->
  <line x1="85" y1="250" x2="85" y2="384" stroke="#4488ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="171" y1="250" x2="171" y2="384" stroke="#4488ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Arms at sides in coat -->
  <path d="M55,270 Q54,300 55,330 Q56,355 58,380" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M201,270 Q202,300 201,330 Q200,355 198,380" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Hands visible at bottom -->
  <path d="M55,370 Q52,375 54,380 L62,380 Q64,375 60,370" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>
  <path d="M198,370 Q201,375 199,380 L191,380 Q189,375 193,370" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>

  <!-- Head -->
  <path d="M94,82 Q94,52 128,46 Q162,52 162,82 L162,122 Q162,140 153,150 Q143,162 128,164 Q113,162 103,150 Q94,140 94,122 Z" fill="url(#skin_grad)"/>

  <!-- Hair - neat, parted, dark -->
  <path d="M92,78 Q92,50 128,44 Q164,50 164,78 L164,72 Q164,48 128,42 Q92,48 92,72 Z" fill="url(#hair_grad)"/>
  <!-- Hair part line -->
  <path d="M120,44 Q122,50 122,62" fill="none" stroke="#0a0a14" stroke-width="0.8" opacity="0.5"/>
  <!-- Hair volume left -->
  <path d="M90,72 Q88,60 95,52 Q108,44 120,44" fill="url(#hair_grad)"/>
  <!-- Hair volume right -->
  <path d="M166,72 Q168,60 161,52 Q148,44 122,44" fill="url(#hair_grad)"/>
  <!-- Hair highlight -->
  <path d="M100,55 Q110,48 120,46" fill="none" stroke="#2a2a3e" stroke-width="1" opacity="0.4"/>

  <!-- Glasses - rectangular frames -->
  <rect x="96" y="100" rx="3" ry="3" width="26" height="18" fill="url(#glass_grad)" stroke="#4488ff" stroke-width="1.2" opacity="0.8"/>
  <rect x="134" y="100" rx="3" ry="3" width="26" height="18" fill="url(#glass_grad)" stroke="#4488ff" stroke-width="1.2" opacity="0.8"/>
  <!-- Bridge -->
  <path d="M122,108 Q128,104 134,108" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.8"/>
  <!-- Temples -->
  <line x1="96" y1="106" x2="90" y2="104" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <line x1="160" y1="106" x2="166" y2="104" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <!-- Glass reflection -->
  <path d="M100,103 L106,103 L104,106" fill="#ffffff" opacity="0.08"/>
  <path d="M138,103 L144,103 L142,106" fill="#ffffff" opacity="0.08"/>

  <!-- Eyes behind glasses - mild expression -->
  <ellipse cx="109" cy="109" rx="8" ry="5" fill="#1a1a2e"/>
  <ellipse cx="147" cy="109" rx="8" ry="5" fill="#1a1a2e"/>
  <circle cx="109" cy="109" r="3" fill="#443322"/>
  <circle cx="147" cy="109" r="3" fill="#443322"/>
  <circle cx="109" cy="109" r="1.5" fill="#0a0a1a"/>
  <circle cx="147" cy="109" r="1.5" fill="#0a0a1a"/>
  <circle cx="111" cy="108" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="149" cy="108" r="0.8" fill="#ffffff" opacity="0.6"/>

  <!-- Eyebrows - neutral, neat -->
  <path d="M98,97 Q109,94 120,97" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M136,97 Q147,94 158,97" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M128,112 L125,128 Q128,131 131,128 Z" fill="#a08060" opacity="0.4"/>

  <!-- Mouth - mild, neutral -->
  <path d="M118,142 Q128,145 138,142" fill="none" stroke="#8a6a5a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="92" cy="112" rx="5" ry="9" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>
  <ellipse cx="164" cy="112" rx="5" ry="9" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>

  <!-- ID badge on coat -->
  <rect x="68" y="280" width="16" height="22" rx="2" fill="#1a1a2e" stroke="#4488ff" stroke-width="0.5" opacity="0.6"/>
  <rect x="71" y="283" width="10" height="6" rx="1" fill="#4488ff" opacity="0.2"/>
  <line x1="71" y1="293" x2="81" y2="293" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="71" y1="296" x2="79" y2="296" stroke="#4488ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Ambient -->
  <ellipse cx="128" cy="300" rx="80" ry="30" fill="#4488ff" opacity="0.02"/>
</svg>