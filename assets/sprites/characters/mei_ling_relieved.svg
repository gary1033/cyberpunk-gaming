<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="irisGradL" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6b4030"/>
      <stop offset="50%" stop-color="#4a2518"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="irisGradR" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6b4030"/>
      <stop offset="50%" stop-color="#4a2518"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="earringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#ff3388" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

