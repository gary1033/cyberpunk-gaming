  <path d="M100,133 Q110,127 122,133 Q110,138 100,133 Z" fill="white" stroke="#2a2035" stroke-width="0.5"/>
  <ellipse cx="111" cy="133" rx="5" ry="4.5" fill="url(#irisGrad)"/>
  <circle cx="111" cy="133" r="2.8" fill="#1a0a0a"/>
  <circle cx="109" cy="131" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="113" cy="134" r="0.6" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease -->
  <path d="M101,129 Q110,124 121,129" fill="none" stroke="#c4a090" stroke-width="0.5" opacity="0.4"/>
  <!-- Eyelashes -->
  <path d="M100,133 Q98,130 96,129" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M122,133 Q124,130 125,128" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <!-- Upper eyelid - slightly more closed for soft look -->
  <path d="M100,133 Q110,127 122,133" fill="none" stroke="#1a1020" stroke-width="1.2"/>
  <!-- Lower lid slightly raised in soft expression -->
  <path d="M102,135 Q110,137 120,135" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.3"/>

  <!-- Right eye -->
  <path d="M134,133 Q146,127 156,133 Q146,138 134,133 Z" fill="white" stroke="#2a2035" stroke-width="0.5"/>
  <ellipse cx="145" cy="133" rx="5" ry="4.5" fill="url(#irisGrad)"/>
  <circle cx="145" cy="133" r="2.8" fill="#1a0a0a"/>
  <circle cx="143" cy="131" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="147" cy="134" r="0.6" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease -->
  <path d="M135,129 Q146,124 155,129" fill="none" stroke="#c4a090" stroke-width="0.5" opacity="0.4"/>
  <!-- Eyelashes -->
  <path d="M134,133 Q132,130 131,129" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M156,133 Q158,130 160,129" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <!-- Upper eyelid -->
  <path d="M134,133 Q146,127 156,133" fill="none" stroke="#1a1020" stroke-width="1.2"/>
  <!-- Lower lid slightly raised -->
  <path d="M136,135 Q146,137 154,135" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.3"/>

  <!-- Nose -->
