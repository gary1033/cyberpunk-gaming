  <path d="M173,130 Q176,165 179,210 Q180,235 179,255" fill="#12101e" opacity="0.5"/>

  <!-- === FACIAL FEATURES - RELIEVED === -->

  <!-- Eyebrows - relaxed, natural gentle arch -->
  <path d="M98,123 Q108,118 120,121" fill="none" stroke="#1a1020" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M136,121 Q148,118 158,123" fill="none" stroke="#1a1020" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M100,122 Q108,117.5 118,120.5" fill="none" stroke="#1a1020" stroke-width="0.8" opacity="0.3"/>
  <path d="M138,120.5 Q148,117.5 156,122" fill="none" stroke="#1a1020" stroke-width="0.8" opacity="0.3"/>

  <!-- Eyes - soft, warm, slightly more closed (relaxed) -->
