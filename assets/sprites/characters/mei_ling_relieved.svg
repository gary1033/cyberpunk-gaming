  <circle cx="168" cy="267" r="1" fill="#ff0066" opacity="0.5"/>
  <path d="M65,277 L70,277 L70,282 L75,282 L75,290" fill="none" stroke="#ff0066" stroke-width="0.4" opacity="0.3"/>
  <rect x="73" y="290" width="4" height="2" fill="#ff0066" opacity="0.3"/>
  <path d="M191,277 L186,277 L186,282 L181,282 L181,290" fill="none" stroke="#ff0066" stroke-width="0.4" opacity="0.3"/>
  <rect x="179" y="290" width="4" height="2" fill="#ff0066" opacity="0.3"/>

  <!-- Jacket seam lines -->
  <path d="M90,247 Q100,282 105,342" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.6"/>
  <path d="M166,247 Q156,282 151,342" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.6"/>

  <!-- Inner shirt neckline -->
  <path d="M113,228 Q120,237 128,240 Q136,237 143,228" fill="none" stroke="#333355" stroke-width="1"/>

  <!-- Neck - relaxed -->
  <path d="M118,220 Q117,207 119,194 L137,194 Q139,207 138,220" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.3"/>
  <path d="M120,212 Q128,217 136,212" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.3"/>

