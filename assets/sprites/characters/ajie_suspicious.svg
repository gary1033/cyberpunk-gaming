<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="neon_orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4956e"/>
      <stop offset="100%" stop-color="#a47a58"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#neon_orange)">阿傑</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle">阿傑</text>

  <!-- Neck -->
  <rect x="100" y="195" width="56" height="30" rx="6" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1"/>

  <!-- Body / Shoulders -->
  <path d="M128,222 L128,384 L30,384 L30,272 Q30,230 78,218 Q108,210 128,222 Z" fill="url(#shirt_grad)"/>
  <path d="M128,222 L128,384 L226,384 L226,272 Q226,230 178,218 Q148,210 128,222 Z" fill="url(#shirt_grad)"/>
  <path d="M78,218 Q52,224 38,246 Q30,260 30,272" fill="none" stroke="#2a2a4e" stroke-width="2"/>
  <path d="M178,218 Q204,224 218,246 Q226,260 226,272" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Crossed arms -->
  <path d="M34,272 Q44,295 75,315 Q105,328 145,316 Q162,308 172,296" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1.5"/>
  <path d="M222,272 Q212,295 181,315 Q151,328 111,316 Q94,308 84,296" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1.5"/>

  <!-- Circuit tattoos left arm -->
  <g filter="url(#neon_orange)" opacity="0.8">
    <path d="M48,280 L58,280 L58,294 L70,294 L70,308 L82,308" fill="none" stroke="#ff8800" stroke-width="2"/>
    <circle cx="48" cy="280" r="3" fill="#ff8800"/>
    <circle cx="70" cy="294" r="3" fill="#ff8800"/>
    <circle cx="82" cy="308" r="3" fill="#ff8800"/>
  </g>

  <!-- Circuit tattoos right arm -->
  <g filter="url(#neon_orange)" opacity="0.8">
    <path d="M208,280 L198,280 L198,294 L186,294 L186,308 L174,308" fill="none" stroke="#ff8800" stroke-width="2"/>
    <circle cx="208" cy="280" r="3" fill="#ff8800"/>
    <circle cx="186" cy="294" r="3" fill="#ff8800"/>
    <circle cx="174" cy="308" r="3" fill="#ff8800"/>
  </g>

  <!-- Shirt V-neck -->
  <path d="M96,222 L128,254 L160,222" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Head -->
  <path d="M78,90 Q78,42 128,36 Q178,42 178,90 L178,150 Q178,168 164,180 Q150,192 128,194 Q106,192 92,180 Q78,168 78,150 Z" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="2"/>

  <!-- Bald/buzzcut -->
  <path d="M84,72 Q128,40 172,72" fill="#5a4030" opacity="0.25"/>
  <ellipse cx="128" cy="56" rx="34" ry="12" fill="#b08860" opacity="0.1"/>

  <!-- Ears -->
  <ellipse cx="76" cy="130" rx="8" ry="14" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1.5"/>
  <ellipse cx="180" cy="130" rx="8" ry="14" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1.5"/>

  <!-- Left eye - SQUINTING (narrower) -->
  <path d="M92,120 Q108,113 124,120" fill="#1a1a2e"/>
  <path d="M92,120 Q108,126 124,120" fill="#1a1a2e"/>
  <circle cx="108" cy="120" r="7" fill="#8b5a2b"/>
  <circle cx="108" cy="120" r="4.5" fill="#0a0a1a"/>
  <circle cx="105" cy="118" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="111" cy="121" r="1.2" fill="#ffffff" opacity="0.5"/>
  <!-- Heavier squint lid -->
  <path d="M90,120 Q108,110 126,120" fill="none" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right eye - MORE OPEN (raised brow side) -->
  <path d="M132,118 Q148,106 164,118" fill="#1a1a2e"/>
  <path d="M132,118 Q148,132 164,118" fill="#1a1a2e"/>
  <circle cx="148" cy="119" r="10" fill="#8b5a2b"/>
  <circle cx="148" cy="119" r="6" fill="#0a0a1a"/>
  <circle cx="144" cy="115" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="152" cy="122" r="1.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="147" cy="117" r="1.2" fill="#ffffff" opacity="0.35"/>
  <path d="M130,118 Q148,104 166,118" fill="none" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left eyebrow - lowered (squint side) -->
  <path d="M90,112 Q108,107 126,114" fill="none" stroke="#2a1a0a" stroke-width="4" stroke-linecap="round"/>
  <!-- Right eyebrow - RAISED high -->
  <path d="M130,98 Q148,90 166,98" fill="none" stroke="#2a1a0a" stroke-width="4" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M126,140 Q128,146 130,140" fill="none" stroke="#8a6040" stroke-width="1.2" opacity="0.45"/>

  <!-- Mouth - suspicious, one corner pulled -->
  <path d="M116,162 Q124,166 134,163 Q140,159 144,154" fill="none" stroke="#6a4030" stroke-width="2" stroke-linecap="round"/>

  <!-- Scar -->
  <line x1="88" y1="142" x2="97" y2="152" stroke="#b08860" stroke-width="1.2" opacity="0.45"/>

  <!-- Circuit glow on neck -->
  <g filter="url(#neon_orange)" opacity="0.45">
    <path d="M110,200 L110,210 L122,210" fill="none" stroke="#ff8800" stroke-width="1.2"/>
    <circle cx="122" cy="210" r="2" fill="#ff8800"/>
  </g>

  <ellipse cx="128" cy="310" rx="80" ry="30" fill="#ff8800" opacity="0.03"/>
</svg>