  <path d="M222,272 Q212,295 181,315 Q151,328 111,316 Q94,308 84,296" fill="#c89068"/>
  <path d="M34,272 Q44,295 75,315 Q85,320 95,318 Q72,308 54,288 Q44,278 42,272 Z" fill="#2a1a0a" opacity="0.3"/>
  <path d="M222,272 Q212,295 181,315 Q171,320 161,318 Q184,308 202,288 Q212,278 214,272 Z" fill="#2a1a0a" opacity="0.3"/>

