  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff6600" stroke-width="1.5" opacity="0.45"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#ff6600" stroke-width="0.5" opacity="0.2"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ff6600" text-anchor="middle" filter="url(#neonGlow)">阿傑 AJIE</text>
  <line x1="40" y1="37" x2="216" y2="37" stroke="#ff6600" stroke-width="0.5" opacity="0.3"/>

