<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gh-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gh-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff6666"/>
      <stop offset="60%" stop-color="#ff2244"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gh-red-aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <filter id="gh-glow-red">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gh-glow-soft">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gh-glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gh-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#aa44ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gh-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="40%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gh-bg)"/>
  <rect width="256" height="384" fill="url(#gh-red-aura)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gh-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#gh-glow-purple)">幽靈</text>

  <!-- Cloak body - leaning forward menacingly -->
  <path d="M38,150 C38,128 58,105 82,95 L98,88 C110,82 120,78 128,76 C136,78 146,82 158,88 L174,95 C198,105 218,128 218,150 L225,255 C228,300 220,345 212,370 L44,370 C36,345 28,300 31,255 Z" fill="url(#gh-cloak)"/>
  <path d="M38,150 C38,128 58,105 82,95 L98,88 C110,82 120,78 128,76 C136,78 146,82 158,88 L174,95 C198,105 218,128 218,150 L225,255 C228,300 220,345 212,370 L44,370 C36,345 28,300 31,255 Z" fill="#ff2244" opacity="0.04"/>

  <!-- Cloak edge highlights -->
  <path d="M38,150 C38,128 58,105 82,95 L98,88" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.5"/>
  <path d="M218,150 C218,128 198,105 174,95 L158,88" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.5"/>

  <!-- Large anime hood - forward tilt for menace -->
  <path d="M65,148 C65,92 78,58 96,44 C108,34 118,29 128,27 C138,29 148,34 160,44 C178,58 191,92 191,148 C191,165 178,180 162,185 L128,190 L94,185 C78,180 65,165 65,148 Z" fill="#1a1030"/>

  <!-- Hood outer edge - red glow -->
  <path d="M65,148 C65,92 78,58 96,44 C108,34 118,29 128,27 C138,29 148,34 160,44 C178,58 191,92 191,148" fill="none" stroke="#ff2244" stroke-width="1.8" opacity="0.6"/>

  <!-- Hood inner shadow -->
  <path d="M78,144 C78,100 88,70 102,60 C112,52 120,48 128,46 C136,48 144,52 154,60 C168,70 178,100 178,144 C178,156 168,168 156,172 L128,176 L100,172 C88,168 78,156 78,144 Z" fill="#0d0818"/>

  <!-- Deep shadow -->
  <ellipse cx="128" cy="128" rx="40" ry="34" fill="#050210"/>

  <!-- Anime eyes - RED, NARROWED, MENACING - left -->
  <ellipse cx="108" cy="126" rx="13" ry="6" fill="url(#gh-eye-glow)" filter="url(#gh-glow-red)"/>
  <!-- Narrowed angry anime eye -->
  <ellipse cx="108" cy="126" rx="9" ry="4.5" fill="#ff2244" opacity="0.9"/>
  <ellipse cx="108" cy="126" rx="5" ry="3" fill="#ff6666"/>
  <!-- Angry top lid cutting in -->
  <path d="M96,122 L120,124" fill="none" stroke="#050210" stroke-width="3.5"/>
  <!-- Highlights still visible through anger -->
  <ellipse cx="105" cy="124" rx="2.5" ry="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="112" cy="127" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Anime eyes - RED, NARROWED - right -->
  <ellipse cx="148" cy="126" rx="13" ry="6" fill="url(#gh-eye-glow)" filter="url(#gh-glow-red)"/>
  <ellipse cx="148" cy="126" rx="9" ry="4.5" fill="#ff2244" opacity="0.9"/>
  <ellipse cx="148" cy="126" rx="5" ry="3" fill="#ff6666"/>
  <path d="M136,124 L160,122" fill="none" stroke="#050210" stroke-width="3.5"/>
  <ellipse cx="145" cy="124" rx="2.5" ry="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="152" cy="127" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Intense ambient glow -->
  <ellipse cx="128" cy="126" rx="42" ry="25" fill="#ff2244" opacity="0.1" filter="url(#gh-glow-soft)"/>

  <!-- Red energy crackling -->
  <path d="M55,185 L50,205 L60,200 L53,225" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>
  <path d="M201,180 L206,200 L196,195 L203,220" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>

  <!-- Shoulder definition - hunched -->
  <path d="M58,168 C64,155 82,146 100,150" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>
  <path d="M198,168 C192,155 174,146 156,150" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>

  <!-- Cloak fold lines -->
  <path d="M88,210 C93,250 91,290 88,340" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.25"/>
  <path d="M128,190 C128,235 130,285 128,345" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.15"/>
  <path d="M168,210 C163,250 165,290 168,340" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.25"/>

  <!-- Red ambient particles -->
  <circle cx="40" cy="195" r="1.5" fill="#ff2244" opacity="0.5"/>
  <circle cx="215" cy="175" r="1.5" fill="#ff2244" opacity="0.45"/>
  <circle cx="55" cy="295" r="1" fill="#aa44ff" opacity="0.4"/>
  <circle cx="200" cy="305" r="1.2" fill="#ff2244" opacity="0.4"/>
  <circle cx="30" cy="260" r="0.8" fill="#ff2244" opacity="0.35"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#ff2244" text-anchor="middle" opacity="0.5">[hostile]</text>
</svg>