<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gh-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gh-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff6666"/>
      <stop offset="60%" stop-color="#ff2244"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gh-red-aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <filter id="gh-glow-red">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gh-glow-soft">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gh-glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gh-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#aa44ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gh-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="40%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gh-bg)"/>
  <rect width="256" height="384" fill="url(#gh-red-aura)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gh-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#gh-glow-purple)">幽靈</text>

  <!-- Cloak body - leaning forward menacingly -->
  <path d="M32,160 C32,136 54,110 80,98 L98,90 C112,84 122,80 128,78 C134,80 144,84 158,90 L176,98 C202,110 224,136 224,160 L230,265 C232,308 224,350 216,375 L40,375 C32,350 24,308 26,265 Z" fill="url(#gh-cloak)"/>
  <path d="M32,160 C32,136 54,110 80,98 L98,90 C112,84 122,80 128,78 C134,80 144,84 158,90 L176,98 C202,110 224,136 224,160 L230,265 C232,308 224,350 216,375 L40,375 C32,350 24,308 26,265 Z" fill="#ff2244" opacity="0.04"/>

  <!-- Cloak edge highlights -->
  <path d="M32,160 C32,136 54,110 80,98 L98,90" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.5"/>
  <path d="M224,160 C224,136 202,110 176,98 L158,90" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.5"/>

  <!-- Large anime hood - forward tilt for menace -->
  <path d="M58,158 C58,90 74,52 94,36 C108,24 120,18 128,16 C136,18 148,24 162,36 C182,52 198,90 198,158 C198,178 182,194 164,199 L128,204 L92,199 C74,194 58,178 58,158 Z" fill="#1a1030"/>

  <!-- Hood outer edge - red glow -->
  <path d="M58,158 C58,90 74,52 94,36 C108,24 120,18 128,16 C136,18 148,24 162,36 C182,52 198,90 198,158" fill="none" stroke="#ff2244" stroke-width="1.8" opacity="0.6"/>

  <!-- Hood inner shadow -->
  <path d="M72,154 C72,98 82,66 100,54 C112,44 122,40 128,38 C134,40 144,44 156,54 C174,66 184,98 184,154 C184,168 174,180 160,184 L128,188 L96,184 C82,180 72,168 72,154 Z" fill="#0d0818"/>

  <!-- Deep shadow -->
  <ellipse cx="128" cy="132" rx="44" ry="38" fill="#050210"/>

  <!-- Anime eyes - RED, NARROWED, MENACING - left -->
  <ellipse cx="106" cy="130" rx="15" ry="7" fill="url(#gh-eye-glow)" filter="url(#gh-glow-red)"/>
  <ellipse cx="106" cy="130" rx="10" ry="5" fill="#ff2244" opacity="0.9"/>
  <ellipse cx="106" cy="130" rx="6" ry="3.5" fill="#ff6666"/>
  <!-- Angry top lid cutting in -->
  <path d="M92,125 L120,128" fill="none" stroke="#050210" stroke-width="4"/>
  <!-- Highlights -->
  <ellipse cx="102" cy="127" rx="3" ry="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="110" cy="131" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Anime eyes - RED, NARROWED - right -->
  <ellipse cx="150" cy="130" rx="15" ry="7" fill="url(#gh-eye-glow)" filter="url(#gh-glow-red)"/>
  <ellipse cx="150" cy="130" rx="10" ry="5" fill="#ff2244" opacity="0.9"/>
  <ellipse cx="150" cy="130" rx="6" ry="3.5" fill="#ff6666"/>
  <path d="M136,128 L164,125" fill="none" stroke="#050210" stroke-width="4"/>
  <ellipse cx="146" cy="127" rx="3" ry="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="154" cy="131" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Intense ambient glow -->
  <ellipse cx="128" cy="130" rx="48" ry="28" fill="#ff2244" opacity="0.1" filter="url(#gh-glow-soft)"/>

  <!-- Red energy crackling -->
  <path d="M50,195 L44,218 L56,212 L48,238" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>
  <path d="M206,190 L212,213 L200,207 L208,233" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>

  <!-- Shoulder definition - hunched -->
  <path d="M52,178 C58,164 78,154 98,158" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>
  <path d="M204,178 C198,164 178,154 158,158" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.4"/>

  <!-- Cloak fold lines -->
  <path d="M86,220 C91,260 89,300 86,350" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.25"/>
  <path d="M128,204 C128,248 130,298 128,358" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.15"/>
  <path d="M170,220 C165,260 167,300 170,350" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.25"/>

  <!-- Red ambient particles -->
  <circle cx="36" cy="205" r="1.5" fill="#ff2244" opacity="0.5"/>
  <circle cx="220" cy="185" r="1.5" fill="#ff2244" opacity="0.45"/>
  <circle cx="50" cy="305" r="1" fill="#aa44ff" opacity="0.4"/>
  <circle cx="206" cy="315" r="1.2" fill="#ff2244" opacity="0.4"/>
  <circle cx="26" cy="270" r="0.8" fill="#ff2244" opacity="0.35"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#ff2244" text-anchor="middle" opacity="0.5">[hostile]</text>
</svg>