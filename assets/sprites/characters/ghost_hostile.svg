<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gh-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a10"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gh-red-aura" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gh-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff6666"/>
      <stop offset="60%" stop-color="#ff2244"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gh-glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gh-glow-wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gh-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#aa44ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gh-cloak-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="50%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="gh-holo-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2244" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8833cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gh-holo-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8833cc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4466" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background with red aura -->
  <rect width="256" height="384" fill="url(#gh-bg)"/>
  <rect width="256" height="384" fill="url(#gh-red-aura)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gh-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#glow)">幽靈</text>

  <!-- Cloak body - wider, flared out aggressively, shoulders raised -->
  <path d="M22,168 L42,118 L70,96 L100,84 L128,76 L156,84 L186,96 L214,118 L234,168 L240,278 C242,318 234,358 226,375 L30,375 C22,358 14,318 16,278 Z" fill="url(#gh-cloak-main)"/>
  <path d="M22,168 L42,118 L70,96 L100,84 L128,76 L156,84 L186,96 L214,118 L234,168 L240,278 C242,318 234,358 226,375 L30,375 C22,358 14,318 16,278 Z" fill="#ff2244" opacity="0.04"/>

  <!-- Cel-shaded cloak shadow blocks -->
  <path d="M22,168 L42,118 L70,96 L100,84 L106,112 L62,148 L40,200 L30,278 L30,375 C22,358 14,318 16,278 Z" fill="#0d0818" opacity="0.6"/>
  <path d="M234,168 L214,118 L186,96 L156,84 L150,112 L194,148 L216,200 L226,278 L226,375 C234,358 242,318 240,278 Z" fill="#140e28" opacity="0.4"/>

  <!-- Holographic shimmer patches - red tinted -->
  <path d="M45,195 L68,170 L85,215 L58,258 Z" fill="url(#gh-holo-1)"/>
  <path d="M180,188 L210,205 L205,255 L175,235 Z" fill="url(#gh-holo-2)"/>

  <!-- Cloak edge highlights - red angry -->
  <path d="M22,168 L42,118 L70,96 L100,84" fill="none" stroke="#ff2244" stroke-width="2" opacity="0.6"/>
  <path d="M234,168 L214,118 L186,96 L156,84" fill="none" stroke="#ff2244" stroke-width="2" opacity="0.6"/>

  <!-- Angular fold lines -->
  <path d="M70,180 L65,245 L78,315 L72,370" fill="none" stroke="#ff2244" stroke-width="0.8" opacity="0.2"/>
  <path d="M128,155 L128,250 L130,340" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.12"/>
  <path d="M186,180 L191,245 L178,315 L184,370" fill="none" stroke="#ff2244" stroke-width="0.8" opacity="0.2"/>

  <!-- Large angular hood - tilted forward menacingly -->
  <path d="M52,164 L64,88 L80,52 L98,32 L114,18 L128,12 L142,18 L158,32 L176,52 L192,88 L204,164 L196,198 L166,210 L128,215 L90,210 L60,198 Z" fill="#1a1030"/>

  <!-- Hood cel-shade shadow -->
  <path d="M52,164 L64,88 L80,52 L98,32 L114,18 L128,12 L118,32 L102,52 L85,85 L74,136 L66,192 L60,198 Z" fill="#0d0818" opacity="0.5"/>

  <!-- Hood outer edge - red glow for hostility -->
  <path d="M52,164 L64,88 L80,52 L98,32 L114,18 L128,12 L142,18 L158,32 L176,52 L192,88 L204,164" fill="none" stroke="#ff2244" stroke-width="2.2" opacity="0.65"/>

  <!-- Hood inner shadow -->
  <path d="M68,160 L78,98 L92,70 L108,52 L122,40 L128,36 L134,40 L148,52 L164,70 L178,98 L188,160 L182,188 L160,196 L128,200 L96,196 L74,188 Z" fill="#0d0818"/>

  <!-- Deep void -->
  <ellipse cx="128" cy="130" rx="46" ry="42" fill="#050210"/>

  <!-- Anime eyes - RED, NARROWED, MENACING - left -->
  <rect x="94" y="126" width="24" height="8" rx="4" fill="url(#gh-eye-glow)" filter="url(#gh-glow-intense)"/>
  <rect x="97" y="127.5" width="18" height="5" rx="2.5" fill="#ff2244" opacity="0.95"/>
  <rect x="100" y="128" width="12" height="4" rx="2" fill="#ff6666"/>
  <!-- Angry lid cutting across top -->
  <path d="M92,124 L120,127" fill="none" stroke="#050210" stroke-width="4.5"/>
  <!-- Highlights -->
  <ellipse cx="103" cy="128.5" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="112" cy="130.5" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Anime eyes - RED, NARROWED - right -->
  <rect x="138" y="126" width="24" height="8" rx="4" fill="url(#gh-eye-glow)" filter="url(#gh-glow-intense)"/>
  <rect x="141" y="127.5" width="18" height="5" rx="2.5" fill="#ff2244" opacity="0.95"/>
  <rect x="144" y="128" width="12" height="4" rx="2" fill="#ff6666"/>
  <path d="M136,127 L164,124" fill="none" stroke="#050210" stroke-width="4.5"/>
  <ellipse cx="147" cy="128.5" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="156" cy="130.5" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Intense ambient eye glow -->
  <ellipse cx="128" cy="130" rx="50" ry="28" fill="#ff2244" opacity="0.12" filter="url(#gh-glow-wide)"/>

  <!-- Red energy crackling - lightning bolts -->
  <path d="M40,195 L32,220 L46,212 L36,242" fill="none" stroke="#ff2244" stroke-width="1.2" opacity="0.5"/>
  <path d="M216,190 L224,215 L210,207 L220,237" fill="none" stroke="#ff2244" stroke-width="1.2" opacity="0.5"/>
  <path d="M48,280 L42,298 L52,292 L44,310" fill="none" stroke="#ff2244" stroke-width="0.8" opacity="0.3"/>
  <path d="M208,270 L214,288 L204,282 L212,300" fill="none" stroke="#ff2244" stroke-width="0.8" opacity="0.3"/>

  <!-- Shoulder definition - raised aggressively -->
  <path d="M38,184 L58,164 L84,155 L105,152" fill="none" stroke="#ff2244" stroke-width="1.2" opacity="0.45"/>
  <path d="M218,184 L198,164 L172,155 L151,152" fill="none" stroke="#ff2244" stroke-width="1.2" opacity="0.45"/>

  <!-- Digital glitch artifacts - more chaotic -->
  <rect x="32" y="215" width="14" height="2.5" fill="#ff2244" opacity="0.4"/>
  <rect x="205" y="240" width="10" height="2" fill="#ff4466" opacity="0.35"/>
  <rect x="48" y="295" width="8" height="1.5" fill="#aa44ff" opacity="0.3"/>
  <rect x="195" y="175" width="16" height="1.5" fill="#ff2244" opacity="0.3"/>
  <rect x="80" y="350" width="12" height="2" fill="#ff2244" opacity="0.2"/>
  <rect x="155" y="345" width="18" height="1.5" fill="#ff4466" opacity="0.2"/>

  <!-- Red ambient particles -->
  <circle cx="32" cy="205" r="1.5" fill="#ff2244" opacity="0.5"/>
  <circle cx="224" cy="188" r="1.5" fill="#ff2244" opacity="0.45"/>
  <circle cx="46" cy="310" r="1.2" fill="#aa44ff" opacity="0.4"/>
  <circle cx="210" cy="320" r="1" fill="#ff2244" opacity="0.4"/>
  <circle cx="22" cy="268" r="0.8" fill="#ff4466" opacity="0.35"/>

  <!-- State label -->
  <text x="128" y="370" font-family="'Courier New', monospace" font-size="10" fill="#ff2244" text-anchor="middle" opacity="0.5">[hostile]</text>
</svg>