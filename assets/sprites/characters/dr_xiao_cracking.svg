<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="dk_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="dk_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ad8a"/>
      <stop offset="50%" stop-color="#c0a07a"/>
      <stop offset="100%" stop-color="#a8906e"/>
    </linearGradient>
    <linearGradient id="dk_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="25%" stop-color="#c0c0cc"/>
      <stop offset="45%" stop-color="#2a2a35"/>
      <stop offset="65%" stop-color="#b8b8c8"/>
      <stop offset="80%" stop-color="#2a2a35"/>
      <stop offset="100%" stop-color="#c0c0cc"/>
    </linearGradient>
    <linearGradient id="dk_hair_loose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a48"/>
      <stop offset="50%" stop-color="#c0c0cc"/>
      <stop offset="100%" stop-color="#2a2a35"/>
    </linearGradient>
    <linearGradient id="dk_collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a30"/>
      <stop offset="100%" stop-color="#0d0d1e"/>
    </linearGradient>
    <linearGradient id="dk_collar_inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222240"/>
      <stop offset="100%" stop-color="#151528"/>
    </linearGradient>
    <radialGradient id="dk_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dk_sweat" cx="0.3" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#bbddee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#88aacc" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="dk_neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dk_distort">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dk_tremble">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#dk_bg)"/>
  <rect width="256" height="384" fill="url(#dk_glow)"/>

  <!-- Frame border - flickering, unstable -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.55"/>
  <!-- Glitch offset frame segments -->
  <line x1="4" y1="120" x2="252" y2="120" stroke="#ff3344" stroke-width="0.5" opacity="0.15"/>
  <rect x="6" y="118" width="40" height="4" fill="#ff3344" opacity="0.08"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle" filter="url(#dk_neon)">蕭博士</text>
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle">蕭博士</text>

  <!-- Body - hunched, tense, breaking posture -->
  <path d="M60,220 Q54,242 48,290 L42,384 H214 L208,290 Q202,242 196,220 Q184,200 170,190 L162,186 Q148,178 128,176 Q108,178 94,186 L86,190 Q72,200 60,220 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.5" opacity="0.9"/>
  <!-- Body center line - broken symmetry -->
  <path d="M128,180 L130,280 L128,384" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.15"/>

  <!-- Collar - loosened, disheveled, falling open -->
  <path d="M94,190 Q96,174 106,164 L112,158 Q118,154 124,152 L128,150 L132,152 Q138,154 144,158 L150,164 Q160,174 162,190 L155,197 Q145,188 135,183 Q130,180 128,179 Q126,180 121,183 Q111,188 101,197 Z" fill="url(#dk_collar)" stroke="#ff3344" stroke-width="0.8" opacity="0.85"/>
  <!-- Collar opened/loosened - showing more neck/chest -->
  <path d="M118,176 Q122,168 128,164 Q134,168 138,176" fill="url(#dk_skin)" opacity="0.5"/>
  <!-- Collar flaps pulled apart -->
  <path d="M112,168 Q108,178 104,190" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.4"/>
  <path d="M144,168 Q148,178 152,190" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.4"/>
  <!-- Collar fold wrinkles -->
  <path d="M106,172 Q108,176 105,182" fill="none" stroke="#222240" stroke-width="0.6" opacity="0.5"/>
  <path d="M150,172 Q148,176 151,182" fill="none" stroke="#222240" stroke-width="0.6" opacity="0.5"/>
  <!-- Inner collar lining visible from loosening -->
  <path d="M110,165 Q114,158 120,155" fill="url(#dk_collar_inner)" stroke="#ff3344" stroke-width="0.3" opacity="0.5"/>
  <path d="M146,165 Q142,158 136,155" fill="url(#dk_collar_inner)" stroke="#ff3344" stroke-width="0.3" opacity="0.5"/>

  <!-- Hand gripping own arm - self-comforting, desperate -->
  <path d="M82,268 Q78,258 82,248 Q88,238 96,236 Q104,240 108,250 Q110,260 106,272 Q102,282 96,286 L86,284 Q80,278 82,268 Z" fill="url(#dk_skin)" opacity="0.75" filter="url(#dk_distort)"/>
  <!-- Finger details on gripping hand -->
  <path d="M86,248 Q84,244 86,240" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.4"/>
  <path d="M92,240 Q90,236 92,234" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.4"/>
  <path d="M98,242 Q96,238 98,236" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.4"/>
  <!-- White knuckles from gripping -->
  <circle cx="88" cy="244" r="1.5" fill="#d8c0a0" opacity="0.4"/>
  <circle cx="94" cy="238" r="1.5" fill="#d8c0a0" opacity="0.4"/>

  <!-- Other arm trembling -->
  <path d="M170,260 Q176,250 180,242 Q182,236 178,232" fill="none" stroke="url(#dk_skin)" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#dk_tremble)"/>
  <!-- Trembling hand -->
  <path d="M174,236 Q170,228 172,222 Q176,218 180,222 Q182,228 178,234 Z" fill="url(#dk_skin)" opacity="0.6" filter="url(#dk_tremble)"/>

  <!-- Neck - tendons visible, strained -->
  <path d="M118,162 Q118,152 120,145 L128,142 L136,145 Q138,152 138,162" fill="url(#dk_skin)" opacity="0.9"/>
  <!-- Prominent neck tendons from strain -->
  <path d="M121,148 L120,164" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.4"/>
  <path d="M135,148 L136,164" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.4"/>
  <path d="M128,144 L128,158" fill="none" stroke="#a08060" stroke-width="0.3" opacity="0.25"/>

  <!-- Head shape -->
  <ellipse cx="128" cy="106" rx="40" ry="47" fill="url(#dk_skin)" opacity="0.95"/>

  <!-- Face shadow - deep, haggard -->
  <path d="M98,120 Q104,136 114,146 Q122,152 128,154 Q134,152 142,146 Q152,136 158,120" fill="#907858" opacity="0.35"/>
  <!-- Hollowed cheek shadows -->
  <ellipse cx="102" cy="125" rx="8" ry="12" fill="#806850" opacity="0.15"/>
  <ellipse cx="154" cy="125" rx="8" ry="12" fill="#806850" opacity="0.15"/>

  <!-- Heavy sweat drops - desperation -->
  <path d="M96,88 Q95,94 96,100" fill="none" stroke="url(#dk_sweat)" stroke-width="1" opacity="0.5"/>
  <circle cx="96" cy="101" r="1.5" fill="#aaccdd" opacity="0.4"/>
  <path d="M162,90 Q161,96 162,102" fill="none" stroke="url(#dk_sweat)" stroke-width="0.8" opacity="0.4"/>
  <circle cx="162" cy="103" r="1.2" fill="#aaccdd" opacity="0.3"/>
  <!-- Forehead sweat -->
  <circle cx="112" cy="78" r="1" fill="#aaddee" opacity="0.3"/>
  <circle cx="138" cy="76" r="1.2" fill="#aaddee" opacity="0.35"/>
  <circle cx="125" cy="74" r="0.8" fill="#aaddee" opacity="0.25"/>
  <!-- Sweat running down temple -->
  <path d="M160,86 Q159,92 160,100 Q160,106 158,112" fill="none" stroke="#88bbcc" stroke-width="0.5" opacity="0.3"/>

  <!-- Eyes - wide, desperate, bloodshot, unhinged -->
  <!-- Left eye -->
  <path d="M102,104 Q110,96 122,100 Q126,104 126,110 Q122,117 112,118 Q102,116 102,104 Z" fill="#f0ece8" opacity="0.95"/>
  <circle cx="113" cy="108" r="5" fill="#1a0808"/>
  <circle cx="114" cy="107" r="2.2" fill="#ff3344" opacity="0.85"/>
  <circle cx="115" cy="106.5" r="0.8" fill="#ffffff"/>
  <!-- Heavy bloodshot veins -->
  <path d="M102,106 L107,107" fill="none" stroke="#ff4444" stroke-width="0.4" opacity="0.5"/>
  <path d="M102,109 L107,108.5" fill="none" stroke="#ff4444" stroke-width="0.35" opacity="0.4"/>
  <path d="M102,112 L106,111" fill="none" stroke="#ff4444" stroke-width="0.3" opacity="0.35"/>
  <path d="M120,101 L118,104" fill="none" stroke="#ff4444" stroke-width="0.3" opacity="0.3"/>
  <!-- Bags under eyes - exhaustion -->
  <path d="M104,116 Q110,120 118,117" fill="none" stroke="#907050" stroke-width="0.7" opacity="0.5"/>
  <path d="M105,118 Q110,121 117,119" fill="none" stroke="#907050" stroke-width="0.4" opacity="0.3"/>

  <!-- Right eye -->
  <path d="M132,100 Q142,96 154,104 Q154,116 146,118 Q136,117 132,110 Q132,104 132,100 Z" fill="#f0ece8" opacity="0.95"/>
  <circle cx="143" cy="108" r="5" fill="#1a0808"/>
  <circle cx="142" cy="107" r="2.2" fill="#ff3344" opacity="0.85"/>
  <circle cx="141" cy="106.5" r="0.8" fill="#ffffff"/>
  <path d="M154,106 L149,107" fill="none" stroke="#ff4444" stroke-width="0.4" opacity="0.5"/>
  <path d="M154,109 L149,108.5" fill="none" stroke="#ff4444" stroke-width="0.35" opacity="0.4"/>
  <path d="M154,112 L150,111" fill="none" stroke="#ff4444" stroke-width="0.3" opacity="0.35"/>
  <path d="M136,101 L138,104" fill="none" stroke="#ff4444" stroke-width="0.3" opacity="0.3"/>
  <path d="M138,117 Q144,121 152,118" fill="none" stroke="#907050" stroke-width="0.7" opacity="0.5"/>
  <path d="M139,119 Q144,122 151,120" fill="none" stroke="#907050" stroke-width="0.4" opacity="0.3"/>

  <!-- Eyebrows - raised in anguish, asymmetric from distress -->
  <path d="M102,94 Q108,88 118,92" fill="none" stroke="#2a2a35" stroke-width="2.5" opacity="0.9"/>
  <path d="M138,91 Q146,87 155,93" fill="none" stroke="#2a2a35" stroke-width="2.5" opacity="0.9"/>
  <!-- Deep forehead creases -->
  <path d="M112,86 Q116,83 120,86" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.5"/>
  <path d="M136,85 Q140,82 144,85" fill="none" stroke="#a08060" stroke-width="0.6" opacity="0.5"/>
  <path d="M116,83 Q120,80 124,83" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.4"/>
  <path d="M132,82 Q136,79 140,82" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.4"/>
  <path d="M120,80 Q124,78 128,80" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.3"/>

  <!-- Nose - flared nostrils, strained -->
  <path d="M128,106 Q127,116 125,124 Q123,128 124,132 Q128,135 132,132 Q133,128 131,124 Q129,116 128,106" fill="none" stroke="#a08060" stroke-width="1" opacity="0.6"/>
  <!-- Flared nostrils -->
  <ellipse cx="124" cy="131" rx="3" ry="2" fill="#907050" opacity="0.2"/>
  <ellipse cx="132" cy="131" rx="3" ry="2" fill="#907050" opacity="0.2"/>

  <!-- Mouth - grimacing, teeth clenched, desperate expression -->
  <path d="M114,138 Q118,134 122,133 Q128,131 134,133 Q138,134 142,138" fill="none" stroke="#8a6050" stroke-width="1.8" opacity="0.85"/>
  <path d="M116,139 Q122,142 128,142 Q134,142 140,139" fill="#7a5040" opacity="0.3"/>
  <!-- Teeth clenched visible -->
  <path d="M118,137 L138,137" fill="none" stroke="#ccbbaa" stroke-width="1.5" opacity="0.25"/>
  <!-- Deep nasolabial folds - face cracking -->
  <path d="M110,130 Q109,135 110,142" fill="none" stroke="#a08060" stroke-width="0.7" opacity="0.5"/>
  <path d="M146,130 Q147,135 146,142" fill="none" stroke="#a08060" stroke-width="0.7" opacity="0.5"/>
  <!-- Chin quivering -->
  <path d="M120,148 Q128,152 136,148" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.3" filter="url(#dk_tremble)"/>

  <!-- Hair - DISHEVELED, strands loose, slicked-back breaking apart -->
  <path d="M88,92 Q85,76 88,64 Q94,48 108,40 Q118,34 128,32 Q138,34 148,40 Q162,48 168,64 Q171,76 168,92 Q164,82 156,76 Q146,70 136,68 Q128,66 120,68 Q110,70 100,76 Q92,82 88,92 Z" fill="url(#dk_hair)" opacity="0.95"/>

  <!-- Loose strands falling forward - facade breaking -->
  <path d="M110,68 Q106,78 108,94 Q109,100 108,108" fill="none" stroke="#c0c0cc" stroke-width="1.2" opacity="0.6"/>
  <path d="M118,64 Q114,76 116,92 Q117,100 115,106" fill="none" stroke="#888899" stroke-width="1" opacity="0.5"/>
  <path d="M145,66 Q150,78 148,94 Q147,102 148,108" fill="none" stroke="#c0c0cc" stroke-width="1" opacity="0.5"/>
  <path d="M138,62 Q142,74 140,90 Q139,98 140,104" fill="none" stroke="#888899" stroke-width="0.8" opacity="0.45"/>
  <!-- More wild loose strands -->
  <path d="M94,88 Q90,96 92,108 Q93,115 90,120" fill="none" stroke="#c0c0cc" stroke-width="1.5" opacity="0.55"/>
  <path d="M162,86 Q166,94 164,106 Q163,113 166,118" fill="none" stroke="#c0c0cc" stroke-width="1.3" opacity="0.5"/>
  <!-- Hair sticking up from running hands through it -->
  <path d="M120,38 Q118,30 120,26" fill="none" stroke="#888899" stroke-width="1" opacity="0.4"/>
  <path d="M136,36 Q138,28 136,24" fill="none" stroke="#c0c0cc" stroke-width="0.8" opacity="0.35"/>
  <!-- Side hair coming undone -->
  <path d="M90,80 Q86,90 88,104" fill="none" stroke="url(#dk_hair_loose)" stroke-width="2.5" opacity="0.6"/>
  <path d="M166,78 Q170,88 168,104" fill="none" stroke="url(#dk_hair_loose)" stroke-width="2.5" opacity="0.6"/>

  <!-- Silver streak highlights in messy hair -->
  <path d="M98,72 Q104,56 116,44" fill="none" stroke="#e0e0ee" stroke-width="1" opacity="0.45"/>
  <path d="M158,72 Q152,56 140,44" fill="none" stroke="#e0e0ee" stroke-width="1" opacity="0.45"/>

  <!-- Ears -->
  <path d="M88,100 Q83,96 82,104 Q82,114 86,118 Q88,112 88,100 Z" fill="url(#dk_skin)" opacity="0.8"/>
  <path d="M168,100 Q173,96 174,104 Q174,114 170,118 Q168,112 168,100 Z" fill="url(#dk_skin)" opacity="0.8"/>

  <!-- Glitch / crack effect lines - more prominent -->
  <line x1="16" y1="142" x2="58" y2="142" stroke="#ff3344" stroke-width="1" opacity="0.35"/>
  <line x1="198" y1="158" x2="244" y2="158" stroke="#ff3344" stroke-width="0.8" opacity="0.3"/>
  <line x1="8" y1="248" x2="48" y2="246" stroke="#ff3344" stroke-width="0.6" opacity="0.25"/>
  <line x1="210" y1="240" x2="248" y2="242" stroke="#ff3344" stroke-width="0.5" opacity="0.2"/>
  <!-- Crack lines across face area -->
  <line x1="80" y1="108" x2="90" y2="106" stroke="#ff3344" stroke-width="0.4" opacity="0.15"/>
  <line x1="166" y1="110" x2="176" y2="108" stroke="#ff3344" stroke-width="0.4" opacity="0.15"/>

  <!-- Red accent point -->
  <circle cx="128" cy="200" r="3.5" fill="none" stroke="#ff3344" stroke-width="1" opacity="0.45"/>
  <circle cx="128" cy="200" r="1.2" fill="#ff3344" opacity="0.35"/>

  <!-- Ambient particles - erratic, more numerous -->
  <circle cx="24" cy="68" r="1.8" fill="#ff3344" opacity="0.3"/>
  <circle cx="232" cy="84" r="1.5" fill="#ff3344" opacity="0.25"/>
  <circle cx="36" cy="252" r="1.5" fill="#ff3344" opacity="0.22"/>
  <circle cx="220" cy="232" r="1.2" fill="#ff3344" opacity="0.28"/>
  <circle cx="12" cy="172" r="1.3" fill="#ff3344" opacity="0.2"/>
  <circle cx="244" cy="162" r="1.6" fill="#ff3344" opacity="0.22"/>
  <circle cx="50" cy="324" r="1" fill="#ff3344" opacity="0.18"/>
  <circle cx="204" cy="314" r="1.1" fill="#ff3344" opacity="0.2"/>
  <circle cx="128" cy="370" r="0.8" fill="#ff3344" opacity="0.15"/>
  <circle cx="70" cy="48" r="1" fill="#ff3344" opacity="0.18"/>
  <circle cx="186" cy="52" r="1.2" fill="#ff3344" opacity="0.2"/>

  <!-- Scanlines - denser for tension -->
  <line x1="0" y1="50" x2="256" y2="50" stroke="#ff3344" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="100" x2="256" y2="100" stroke="#ff3344" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="150" x2="256" y2="150" stroke="#ff3344" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#ff3344" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="250" x2="256" y2="250" stroke="#ff3344" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff3344" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="350" x2="256" y2="350" stroke="#ff3344" stroke-width="0.3" opacity="0.08"/>
</svg>