  <circle cx="109" cy="109" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="115" cy="114" r="1.3" fill="#ffffff" opacity="0.6"/>
  <circle cx="110" cy="115" r="0.6" fill="#ffffff" opacity="0.4"/>
