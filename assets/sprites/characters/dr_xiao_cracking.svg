  <ellipse cx="144" cy="112" rx="2" ry="3" fill="#0a0a14"/>
  <circle cx="141" cy="109" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="147" cy="114" r="1.3" fill="#ffffff" opacity="0.6"/>
  <circle cx="142" cy="115" r="0.6" fill="#ffffff" opacity="0.4"/>
