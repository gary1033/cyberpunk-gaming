  <ellipse cx="156" cy="124" rx="6" ry="10" fill="#c8a888" opacity="0.2"/>

  <!-- Sweat drops -->
  <path d="M96,88 Q95,94 96,100" fill="none" stroke="url(#sweat)" stroke-width="0.8" opacity="0.4"/>
  <circle cx="96" cy="101" r="1.2" fill="#aaccdd" opacity="0.35"/>
  <circle cx="112" cy="78" r="0.8" fill="#aaddee" opacity="0.25"/>
  <circle cx="140" cy="76" r="1" fill="#aaddee" opacity="0.28"/>
  <path d="M162" y1="88" x2="161" y2="100" fill="none" stroke="url(#sweat)" stroke-width="0.7" opacity="0.35"/>

  <!-- Neural interface - glitching, overloaded -->
  <circle cx="86" cy="98" r="5" fill="none" stroke="#88bbff" stroke-width="1.2" opacity="0.7" filter="url(#glow)"/>
  <circle cx="86" cy="98" r="3" fill="#88bbff" opacity="0.45"/>
  <circle cx="86" cy="98" r="1.5" fill="#aaccff" opacity="0.85"/>
  <line x1="81" y1="98" x2="72" y2="95" stroke="#88bbff" stroke-width="0.8" opacity="0.5"/>
  <line x1="86" y1="93" x2="83" y2="84" stroke="#88bbff" stroke-width="0.8" opacity="0.5"/>
  <line x1="91" y1="98" x2="96" y2="102" stroke="#88bbff" stroke-width="0.6" opacity="0.4"/>
