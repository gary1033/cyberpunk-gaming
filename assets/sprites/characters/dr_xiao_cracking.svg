  <ellipse cx="112" cy="112" rx="11" ry="9" fill="url(#eyeGlow)" opacity="0.3"/>
  <!-- Bloodshot veins -->
  <path d="M100,110 L106,111" fill="none" stroke="#ff6666" stroke-width="0.3" opacity="0.3"/>
  <path d="M100,114 L105,113" fill="none" stroke="#ff6666" stroke-width="0.25" opacity="0.25"/>
  <!-- Bags under eyes -->
  <path d="M103,122 Q108,126 118,123" fill="none" stroke="#c8a888" stroke-width="0.6" opacity="0.45"/>

