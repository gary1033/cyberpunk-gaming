  <path d="M118,164 Q118,154 120,148 L128,144 L136,148 Q138,154 138,164" fill="#eedcca" opacity="0.9"/>
  <path d="M121,150 L120,166" fill="none" stroke="#c8aa90" stroke-width="0.5" opacity="0.35"/>
  <path d="M135,150 L136,166" fill="none" stroke="#c8aa90" stroke-width="0.5" opacity="0.35"/>

  <!-- Head -->
  <path d="M88,116 Q86,92 90,72 Q96,52 110,42 Q120,36 128,34 Q136,36 146,42 Q160,52 166,72 Q170,92 168,116 Q166,132 160,144 Q152,154 140,160 Q132,164 128,164 Q124,164 116,160 Q104,154 96,144 Q90,132 88,116 Z" fill="#f2d4b8" opacity="0.95"/>
  <!-- Deeper face shadows - haggard -->
  <path d="M88,116 Q90,128 96,138 L104,146 Q96,136 92,124 Q90,116 88,116 Z" fill="#c8a888" opacity="0.55"/>
  <path d="M168,116 Q166,128 160,138 L152,146 Q160,136 164,124 Q166,116 168,116 Z" fill="#c8a888" opacity="0.55"/>
