  <path d="M138,123 Q144,127 153,124" fill="none" stroke="#c8a888" stroke-width="0.6" opacity="0.45"/>

  <!-- Eyebrows - raised unevenly, asymmetric anguish -->
  <path d="M100,96 Q110,92 120,96" fill="none" stroke="#8a8a9a" stroke-width="2.5" opacity="0.9"/>
  <path d="M138,94 Q148,90 158,95" fill="none" stroke="#8a8a9a" stroke-width="2.3" opacity="0.88"/>
  <!-- Forehead creases -->
  <path d="M112,88 Q116,86 120,88" fill="none" stroke="#c8aa90" stroke-width="0.5" opacity="0.4"/>
  <path d="M136,87 Q140,85 144,87" fill="none" stroke="#c8aa90" stroke-width="0.5" opacity="0.4"/>
  <path d="M120,85 Q124,83 128,85" fill="none" stroke="#c8aa90" stroke-width="0.4" opacity="0.3"/>

  <!-- Nose - slightly flared -->
  <path d="M126,130 Q128,135 130,130" fill="none" stroke="#c8aa90" stroke-width="0.9" opacity="0.55"/>
  <ellipse cx="125" cy="133" rx="2.5" ry="1.5" fill="#c8aa90" opacity="0.12"/>
  <ellipse cx="131" cy="133" rx="2.5" ry="1.5" fill="#c8aa90" opacity="0.12"/>

  <!-- Mouth - grimacing, twitch, composure breaking -->
  <path d="M116,140 Q120,137 124,136 Q128,135 132,136 Q136,137 140,140" fill="none" stroke="#8a6050" stroke-width="1.5" opacity="0.8"/>
  <!-- Slight teeth showing from grimace -->
  <path d="M120,139 L136,139" fill="none" stroke="#e8dcd0" stroke-width="1.2" opacity="0.2"/>
  <!-- Mouth twitch - asymmetric -->
  <path d="M116,140 Q114,142 113,141" fill="none" stroke="#8a6050" stroke-width="0.6" opacity="0.4" filter="url(#tremble)"/>
  <!-- Deep nasolabial folds -->
  <path d="M108,130 Q107,136 108,144" fill="none" stroke="#c8aa90" stroke-width="0.6" opacity="0.4"/>
  <path d="M148,130 Q149,136 148,144" fill="none" stroke="#c8aa90" stroke-width="0.6" opacity="0.4"/>

  <!-- Hair - DISHEVELED, loose strands, facade breaking -->
  <path d="M86,106 Q82,84 86,62 Q92,42 108,32 Q120,24 128,22 Q136,24 148,32 Q164,42 170,62 Q174,84 170,106 Q166,94 158,84 Q148,74 138,70 Q128,66 118,70 Q110,74 100,84 Q92,94 86,106 Z" fill="#6a6a7a"/>
  <path d="M92,88 Q96,70 110,54 Q120,42 128,38 L118,46 Q106,56 98,74 Z" fill="#8a8a9a" opacity="0.7"/>
  <path d="M164,88 Q160,70 146,54 Q136,42 128,38 L138,46 Q150,56 158,74 Z" fill="#8a8a9a" opacity="0.7"/>
  <!-- Shine bands -->
  <path d="M104,50 Q116,42 128,40 Q140,42 152,50" fill="none" stroke="#d0d0e0" stroke-width="2" opacity="0.45"/>
  <!-- Loose strands falling forward -->
  <path d="M110,66 Q106,78 108,94 Q109,100 108,108" fill="none" stroke="#b0b0c0" stroke-width="1.2" opacity="0.55"/>
  <path d="M118,62 Q114,74 116,90 Q117,98 115,106" fill="none" stroke="#8a8a9a" stroke-width="1" opacity="0.45"/>
  <path d="M145,64 Q150,76 148,92 Q147,100 148,108" fill="none" stroke="#b0b0c0" stroke-width="1" opacity="0.45"/>
  <!-- Wild loose strands -->
  <path d="M94,86 Q90,94 92,106 Q93,112 90,118" fill="none" stroke="#b0b0c0" stroke-width="1.4" opacity="0.5"/>
  <path d="M164,84 Q168,92 166,104 Q165,110 168,116" fill="none" stroke="#b0b0c0" stroke-width="1.2" opacity="0.45"/>
  <!-- Hair sticking up -->
  <path d="M120,36 Q118,28 120,24" fill="none" stroke="#8a8a9a" stroke-width="0.8" opacity="0.35"/>
  <path d="M136,34 Q138,26 136,22" fill="none" stroke="#b0b0c0" stroke-width="0.7" opacity="0.3"/>
  <!-- Side temple hair -->
  <path d="M88,102 Q86,88 88,72" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.55"/>
  <path d="M170,102 Q172,88 170,72" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.55"/>
  <path d="M86,106 Q84,114 84,124 Q84,132 86,138" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>
  <path d="M170,106 Q172,114 172,124 Q172,132 170,138" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>

  <!-- Ears -->
  <path d="M88,106 Q82,102 82,110 Q82,118 86,120" fill="#f2d4b8" opacity="0.5"/>
  <path d="M170,106 Q176,102 176,110 Q176,118 172,120" fill="#f2d4b8" opacity="0.5"/>

  <!-- Glitch / crack effect lines -->
  <line x1="14" y1="144" x2="54" y2="144" stroke="#88bbff" stroke-width="0.8" opacity="0.25"/>
  <line x1="200" y1="160" x2="244" y2="160" stroke="#88bbff" stroke-width="0.6" opacity="0.2"/>
  <line x1="8" y1="250" x2="44" y2="248" stroke="#88bbff" stroke-width="0.5" opacity="0.18"/>
  <line x1="212" y1="242" x2="248" y2="244" stroke="#88bbff" stroke-width="0.4" opacity="0.15"/>
  <!-- Crack lines near face -->
  <line x1="78" y1="108" x2="88" y2="106" stroke="#88bbff" stroke-width="0.3" opacity="0.12"/>
  <line x1="168" y1="110" x2="178" y2="108" stroke="#88bbff" stroke-width="0.3" opacity="0.12"/>

  <!-- Coat accent -->
  <circle cx="128" cy="204" r="3.5" fill="none" stroke="#aaccff" stroke-width="0.8" opacity="0.35"/>
  <circle cx="128" cy="204" r="1.2" fill="#88bbff" opacity="0.3"/>

  <!-- Particles - erratic, more numerous -->
  <circle cx="22" cy="66" r="1.6" fill="#88bbff" opacity="0.22"/>
  <circle cx="234" cy="82" r="1.3" fill="#aaccff" opacity="0.18"/>
  <circle cx="34" cy="254" r="1.3" fill="#88bbff" opacity="0.16"/>
  <circle cx="222" cy="234" r="1" fill="#aaccff" opacity="0.2"/>
  <circle cx="10" cy="174" r="1.1" fill="#88bbff" opacity="0.14"/>
  <circle cx="246" cy="164" r="1.4" fill="#aaccff" opacity="0.16"/>
  <circle cx="48" cy="326" r="0.9" fill="#88bbff" opacity="0.12"/>
  <circle cx="206" cy="316" r="1" fill="#aaccff" opacity="0.14"/>
  <circle cx="128" cy="368" r="0.7" fill="#88bbff" opacity="0.1"/>
  <circle cx="68" cy="46" r="0.8" fill="#88bbff" opacity="0.12"/>
  <circle cx="188" cy="50" r="1" fill="#aaccff" opacity="0.14"/>

  <!-- Scanlines - denser -->
  <line x1="0" y1="50" x2="256" y2="50" stroke="#aaccff" stroke-width="0.3" opacity="0.07"/>
  <line x1="0" y1="100" x2="256" y2="100" stroke="#aaccff" stroke-width="0.3" opacity="0.07"/>
  <line x1="0" y1="150" x2="256" y2="150" stroke="#aaccff" stroke-width="0.3" opacity="0.07"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#aaccff" stroke-width="0.3" opacity="0.07"/>
  <line x1="0" y1="250" x2="256" y2="250" stroke="#aaccff" stroke-width="0.3" opacity="0.07"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#aaccff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="350" x2="256" y2="350" stroke="#aaccff" stroke-width="0.3" opacity="0.06"/>

  <!-- Expression label -->
  <text x="128" y="374" font-family="monospace" font-size="10" fill="#aaccff" text-anchor="middle" opacity="0.6">CRACKING</text>
</svg>
