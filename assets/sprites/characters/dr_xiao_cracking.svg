<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#040410"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#88bbff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#88bbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisL" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="30%" stop-color="#bbccdd"/>
      <stop offset="100%" stop-color="#889aaa"/>
    </radialGradient>
    <radialGradient id="irisR" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="30%" stop-color="#bbccdd"/>
      <stop offset="100%" stop-color="#889aaa"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#88bbff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#88bbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sweat" cx="0.3" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#bbddee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#88aacc" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tremble" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg)"/>
  <rect width="256" height="384" fill="url(#bgGlow)"/>

  <!-- Frame - flickering, unstable -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#88bbff" stroke-width="1.2" opacity="0.45"/>
  <!-- Glitch segments -->
  <line x1="4" y1="120" x2="252" y2="120" stroke="#88bbff" stroke-width="0.5" opacity="0.12"/>
  <rect x="6" y="118" width="36" height="4" fill="#88bbff" opacity="0.06"/>
  <rect x="210" y="200" width="40" height="3" fill="#88bbff" opacity="0.05"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="14" fill="#aaccff" text-anchor="middle" filter="url(#glow)">蕭博士</text>
  <!-- Glitched double text -->
  <text x="130" y="28" font-family="monospace" font-size="14" fill="#aaccff" text-anchor="middle" opacity="0.15">蕭博士</text>

  <!-- Body - hunched, tense -->
  <path d="M58,224 Q52,244 46,294 L40,384 H216 L210,294 Q204,244 198,224 Q186,204 172,194 L164,190 Q150,182 128,178 Q106,182 92,190 L84,194 Q70,204 58,224 Z" fill="#0c0c1a"/>
  <path d="M58,224 Q64,244 68,274 L70,384 H102 L98,274 Q94,244 88,224 Z" fill="#08081a" opacity="0.6"/>
  <path d="M198,224 Q192,244 188,274 L186,384 H154 L158,274 Q162,244 168,224 Z" fill="#08081a" opacity="0.6"/>
  <path d="M128,182 L130,280 L128,384" fill="none" stroke="#aaccff" stroke-width="0.3" opacity="0.1"/>

  <!-- Collar - loosened, disheveled -->
  <path d="M92,194 Q95,176 105,166 L111,160 Q117,156 123,154 L128,152 L133,154 Q139,156 145,160 L151,166 Q161,176 164,194 L157,201 Q147,192 137,186 Q131,184 128,182 Q125,184 119,186 Q109,192 99,201 Z" fill="#141428" stroke="#aaccff" stroke-width="0.7" opacity="0.85"/>
  <!-- Collar opened -->
  <path d="M118,178 Q122,170 128,166 Q134,170 138,178" fill="#eedcca" opacity="0.4"/>
  <!-- Collar flaps pulled apart -->
  <path d="M112,170 Q108,180 104,192" fill="none" stroke="#aaccff" stroke-width="0.6" opacity="0.3"/>
  <path d="M144,170 Q148,180 152,192" fill="none" stroke="#aaccff" stroke-width="0.6" opacity="0.3"/>

  <!-- One hand gripping own arm -->
  <path d="M82,270 Q78,260 82,250 Q88,240 96,238 Q104,242 108,252 Q110,262 106,274 Q102,284 96,288 L86,286 Q80,280 82,270 Z" fill="#f2d4b8" opacity="0.7" filter="url(#tremble)"/>
  <!-- White knuckles -->
  <circle cx="88" cy="246" r="1.2" fill="#f8e8d8" opacity="0.35"/>
  <circle cx="94" cy="240" r="1.2" fill="#f8e8d8" opacity="0.35"/>

  <!-- Other arm trembling -->
  <path d="M170,262 Q176,252 180,244 Q182,238 178,234" fill="none" stroke="#f2d4b8" stroke-width="3.5" stroke-linecap="round" opacity="0.5" filter="url(#tremble)"/>

