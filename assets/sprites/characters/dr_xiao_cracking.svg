  <line x1="78" y1="94" x2="74" y2="90" stroke="#aaccff" stroke-width="0.5" opacity="0.3"/>
  <line x1="82" y1="92" x2="80" y2="86" stroke="#aaccff" stroke-width="0.4" opacity="0.25"/>

  <!-- Eyes - WIDE, desperate, unhinged, showing instability -->
  <!-- Left eye - WIDE OPEN showing whites -->
  <path d="M100,108 Q108,100 122,102 Q126,108 126,116 Q122,124 112,124 Q102,122 100,112 Z" fill="#f0ece8" opacity="0.95"/>
  <path d="M100,108 Q108,100 122,102 Q126,108" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
