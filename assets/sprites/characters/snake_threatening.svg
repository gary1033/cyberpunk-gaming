<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="intense_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="eye_grad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffee44"/>
      <stop offset="30%" stop-color="#ffcc22"/>
      <stop offset="65%" stop-color="#cc8800"/>
      <stop offset="100%" stop-color="#884400"/>
    </radialGradient>
    <linearGradient id="skin_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d0b0"/>
      <stop offset="100%" stop-color="#dbb896"/>
    </linearGradient>
    <linearGradient id="skin_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c49a78"/>
      <stop offset="100%" stop-color="#b08868"/>
    </linearGradient>
    <linearGradient id="hair_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a2a"/>
      <stop offset="50%" stop-color="#0d1a1a"/>
      <stop offset="100%" stop-color="#0a2a2a"/>
    </linearGradient>
    <linearGradient id="dress_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="mask_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a5a4a"/>
      <stop offset="50%" stop-color="#1a4a3a"/>
      <stop offset="100%" stop-color="#0a3a2a"/>
    </linearGradient>
    <linearGradient id="mask_highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="threat_ambient" cx="50%" cy="40%" r="0.5">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background - darker, more intense -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect width="256" height="384" fill="url(#threat_ambient)"/>
  <!-- Neon border - doubled for menace -->
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <rect x="5" y="5" width="246" height="374" rx="5" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle" filter="url(#glow)">蛇女</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">蛇女</text>

