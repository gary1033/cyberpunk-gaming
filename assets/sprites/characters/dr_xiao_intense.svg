<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="di_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="di_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dcc8"/>
      <stop offset="100%" stop-color="#dcc4a8"/>
    </linearGradient>
    <linearGradient id="di_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="30%" stop-color="#2a2a38"/>
      <stop offset="50%" stop-color="#c0c0d0"/>
      <stop offset="70%" stop-color="#2a2a38"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <radialGradient id="di_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="di_eye_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <filter id="di_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="di_eye_fire">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#di_bg)"/>
  <rect width="256" height="384" fill="url(#di_glow)"/>

  <!-- Frame border - brighter -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle" filter="url(#di_neon)">蕭博士</text>

  <!-- Body - leaning forward -->
  <path d="M56,224 Q50,244 42,296 L36,384 H220 L214,296 Q208,244 200,224 Q188,204 174,194 L167,190 Q152,182 130,178 Q108,182 93,190 L86,194 Q72,204 56,224 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.5" opacity="0.9"/>
  <path d="M130,184 L130,384" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.25"/>

  <!-- Arms forward -->
  <path d="M56,224 Q60,248 65,278 Q68,292 75,302 L95,308 Q98,300 96,288 Q94,272 90,256 Q86,242 80,232 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.3" opacity="0.85"/>
  <path d="M200,224 Q196,248 191,278 Q188,292 181,302 L161,308 Q158,300 160,288 Q162,272 166,256 Q170,242 176,232 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.3" opacity="0.85"/>

  <!-- High collar -->
  <path d="M93,194 Q96,178 106,168 L112,162 Q118,158 124,156 L130,154 L136,156 Q142,158 148,162 L154,168 Q164,178 166,194 L160,202 Q150,192 140,186 Q134,184 130,182 Q126,184 120,186 Q110,192 100,202 Z" fill="#151528" stroke="#ff3344" stroke-width="0.8" opacity="0.95"/>
  <path d="M100,196 Q110,188 120,184 Q126,182 130,180 Q134,182 140,184 Q150,188 160,196" fill="none" stroke="#ff3344" stroke-width="1.2" opacity="0.7"/>

  <!-- Neck -->
  <rect x="118" y="154" width="22" height="18" rx="4" fill="url(#di_skin)" opacity="0.9"/>

  <!-- Head - slightly forward, anime V-chin -->
  <path d="M88,116 Q86,92 90,72 Q96,52 110,42 Q120,36 130,34 Q140,36 150,42 Q164,52 170,72 Q174,92 172,116 Q170,132 164,144 Q156,154 144,160 Q136,164 130,164 Q124,164 116,160 Q104,154 96,144 Q90,132 88,116 Z" fill="url(#di_skin)" opacity="0.95"/>

  <!-- Eyes - wide, burning with passion, anime style -->
  <!-- Left eye - WIDE OPEN -->
  <path d="M100,110 Q108,102 122,105 Q126,110 125,118 Q120,124 110,124 Q102,122 100,114 Z" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="112" cy="113" rx="7" ry="7" fill="#1a0808"/>
  <ellipse cx="112" cy="113" rx="5.5" ry="5.5" fill="#440011"/>
  <ellipse cx="113" cy="112" rx="3.5" ry="3.5" fill="#ff3344" opacity="0.9" filter="url(#di_eye_fire)"/>
  <circle cx="108" cy="109" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="115" cy="115" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="110" cy="116" r="1" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="112" cy="113" rx="10" ry="8" fill="url(#di_eye_glow)" opacity="0.3"/>
  <!-- Right eye - WIDE OPEN -->
  <path d="M136,105 Q148,102 158,110 Q158,122 150,124 Q140,124 136,118 Q136,110 136,105 Z" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="148" cy="113" rx="7" ry="7" fill="#1a0808"/>
  <ellipse cx="148" cy="113" rx="5.5" ry="5.5" fill="#440011"/>
  <ellipse cx="147" cy="112" rx="3.5" ry="3.5" fill="#ff3344" opacity="0.9" filter="url(#di_eye_fire)"/>
  <circle cx="144" cy="109" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="151" cy="115" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="146" cy="116" r="1" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="148" cy="113" rx="10" ry="8" fill="url(#di_eye_glow)" opacity="0.3"/>

  <!-- Eyebrows - furrowed intensely -->
  <path d="M100,100 Q110,96 122,100" fill="none" stroke="#1a1a28" stroke-width="2.5" opacity="0.9"/>
  <path d="M138,100 Q150,96 160,100" fill="none" stroke="#1a1a28" stroke-width="2.5" opacity="0.9"/>

  <!-- Small anime nose -->
  <path d="M128,126 Q130,130 132,126" fill="none" stroke="#c4a888" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - slightly parted, passionate -->
  <path d="M119,138 Q124,142 130,142 Q136,142 141,138" fill="none" stroke="#a07060" stroke-width="1.2" opacity="0.8"/>
  <path d="M121,139 Q126,142 130,142 Q134,142 139,139" fill="#7a5040" opacity="0.3"/>

  <!-- Hair -->
  <path d="M86,106 Q82,84 86,62 Q92,42 108,32 Q120,24 130,22 Q140,24 150,32 Q166,42 172,62 Q176,84 172,106 Q168,94 160,84 Q150,74 140,70 Q130,66 120,70 Q110,74 100,84 Q92,94 86,106 Z" fill="url(#di_hair)" opacity="0.95"/>
  <path d="M96,96 Q100,74 114,58 Q122,50 130,46" fill="none" stroke="#e0e0f0" stroke-width="1.2" opacity="0.5"/>
  <path d="M162,96 Q158,74 144,58 Q136,50 130,46" fill="none" stroke="#e0e0f0" stroke-width="1.2" opacity="0.5"/>
  <path d="M104,52 Q116,44 128,42 Q140,44 152,52" fill="none" stroke="#e8e8f8" stroke-width="1.5" opacity="0.35"/>
  <path d="M88,102 Q86,88 88,72" fill="none" stroke="#c0c0d0" stroke-width="2.5" opacity="0.6"/>
  <path d="M170,102 Q172,88 170,72" fill="none" stroke="#c0c0d0" stroke-width="2.5" opacity="0.6"/>

  <!-- Ears -->
  <path d="M88,108 Q82,104 82,112 Q82,120 86,122" fill="url(#di_skin)" opacity="0.6"/>
  <path d="M170,108 Q176,104 176,112 Q176,120 172,122" fill="url(#di_skin)" opacity="0.6"/>

  <!-- Red accent -->
  <circle cx="130" cy="206" r="3" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.6"/>
  <circle cx="130" cy="206" r="1.2" fill="#ff3344" opacity="0.5"/>

  <!-- Ambient particles - more intense -->
  <circle cx="28" cy="75" r="1.5" fill="#ff3344" opacity="0.25"/>
  <circle cx="228" cy="90" r="1" fill="#ff3344" opacity="0.2"/>
  <circle cx="35" cy="255" r="1.2" fill="#ff3344" opacity="0.18"/>
  <circle cx="220" cy="235" r="0.9" fill="#ff3344" opacity="0.22"/>
  <circle cx="18" cy="175" r="1.1" fill="#ff3344" opacity="0.15"/>
  <circle cx="238" cy="165" r="1.3" fill="#ff3344" opacity="0.18"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
</svg>