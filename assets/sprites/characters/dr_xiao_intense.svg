<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="di_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="di_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a882"/>
      <stop offset="100%" stop-color="#a8906e"/>
    </linearGradient>
    <linearGradient id="di_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="40%" stop-color="#c0c0cc"/>
      <stop offset="60%" stop-color="#2a2a35"/>
      <stop offset="85%" stop-color="#c0c0cc"/>
      <stop offset="100%" stop-color="#2a2a35"/>
    </linearGradient>
    <radialGradient id="di_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="di_eye_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <filter id="di_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="di_eye_fire">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#di_bg)"/>
  <rect width="256" height="384" fill="url(#di_glow)"/>

  <!-- Frame border - brighter -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle" filter="url(#di_neon)">蕭博士</text>

  <!-- Body - leaning forward -->
  <path d="M58,215 Q52,235 45,285 L40,380 H216 L210,285 Q204,235 198,215 Q187,198 174,188 L167,184 Q152,176 130,173 Q108,176 93,184 L86,188 Q73,198 58,215 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.5" opacity="0.9"/>
  <path d="M130,178 L130,380" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.25"/>
  <path d="M95,193 Q98,248 96,318" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.18"/>
  <path d="M163,193 Q160,248 162,318" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.18"/>

  <!-- Arms - forward -->
  <path d="M58,215 Q60,240 65,270 Q68,285 75,295 L95,300 Q98,292 96,280 Q94,265 90,248 Q86,235 80,225 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.3" opacity="0.85"/>
  <path d="M198,215 Q196,240 191,270 Q188,285 181,295 L161,300 Q158,292 160,280 Q162,265 166,248 Q170,235 176,225 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.3" opacity="0.85"/>

  <!-- High collar -->
  <path d="M93,188 Q96,173 106,163 L111,158 Q116,154 122,152 L130,150 L138,152 Q143,154 148,158 L153,163 Q163,173 166,188 L160,196 Q150,186 140,181 Q134,178 130,177 Q126,178 120,181 Q110,186 100,196 Z" fill="#151528" stroke="#ff3344" stroke-width="0.8" opacity="0.95"/>
  <path d="M100,190 Q110,182 120,178 Q126,176 130,175 Q134,176 140,178 Q150,182 160,190" fill="none" stroke="#ff3344" stroke-width="1.2" opacity="0.7"/>

  <!-- Neck -->
  <path d="M120,163 Q120,153 122,146 L130,143 L138,146 Q140,153 140,163" fill="url(#di_skin)" opacity="0.9"/>

  <!-- Head shape - slightly forward -->
  <ellipse cx="130" cy="108" rx="38" ry="45" fill="url(#di_skin)" opacity="0.95"/>

  <!-- Face shadow -->
  <path d="M102,118 Q107,133 117,143 Q124,148 130,150 Q136,148 143,143 Q153,133 158,118" fill="#b09870" opacity="0.3"/>

  <!-- Eyes - wide, burning with passion -->
  <path d="M105,106 Q112,100 122,103 Q124,106 124,110 Q121,115 112,116 Q105,114 105,106 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="114" cy="108" r="4" fill="#1a0808"/>
  <circle cx="115" cy="107" r="2" fill="#ff3344" opacity="0.9" filter="url(#di_eye_fire)"/>
  <circle cx="116" cy="107" r="0.6" fill="#ffffff"/>
  <ellipse cx="114" cy="108" rx="8" ry="6" fill="url(#di_eye_glow)" opacity="0.3"/>
  <path d="M136,103 Q144,100 152,106 Q152,114 145,116 Q137,115 136,110 Q136,106 136,103 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="144" cy="108" r="4" fill="#1a0808"/>
  <circle cx="143" cy="107" r="2" fill="#ff3344" opacity="0.9" filter="url(#di_eye_fire)"/>
  <circle cx="142" cy="107" r="0.6" fill="#ffffff"/>
  <ellipse cx="144" cy="108" rx="8" ry="6" fill="url(#di_eye_glow)" opacity="0.3"/>
  <!-- Eyebrows - furrowed -->
  <path d="M104,97 Q112,94 122,97" fill="none" stroke="#2a2a35" stroke-width="2.2" opacity="0.85"/>
  <path d="M136,97 Q146,94 154,97" fill="none" stroke="#2a2a35" stroke-width="2.2" opacity="0.85"/>
  <path d="M120,92 L124,90" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.4"/>
  <path d="M134,90 L138,92" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.4"/>
  <path d="M100,108 L96,106" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.4"/>
  <path d="M158,108 L162,106" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.4"/>

  <!-- Nose -->
  <path d="M130,106 Q129,116 127,124 Q126,128 128,130 Q130,131 132,130 Q134,128 133,124 Q131,116 130,106" fill="none" stroke="#a08060" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - slightly open, passionate -->
  <path d="M119,136 Q124,139 130,139 Q136,139 141,136" fill="none" stroke="#8a6050" stroke-width="1.4" opacity="0.8"/>
  <path d="M121,137 Q126,140 130,140 Q134,140 139,137" fill="#7a5040" opacity="0.3"/>

  <!-- Hair -->
  <path d="M92,93 Q90,78 92,66 Q97,50 110,42 Q120,36 130,34 Q140,36 150,42 Q163,50 168,66 Q170,78 168,93 Q164,86 157,80 Q147,73 137,70 Q130,68 123,70 Q113,73 103,80 Q96,86 92,93 Z" fill="url(#di_hair)" opacity="0.95"/>
  <path d="M102,88 Q107,73 117,63 Q124,58 130,56" fill="none" stroke="#e0e0ee" stroke-width="0.8" opacity="0.4"/>
  <path d="M158,88 Q153,73 143,63 Q136,58 130,56" fill="none" stroke="#e0e0ee" stroke-width="0.8" opacity="0.4"/>
  <path d="M94,98 Q92,88 94,76" fill="none" stroke="#c0c0cc" stroke-width="2" opacity="0.6"/>
  <path d="M166,98 Q168,88 166,76" fill="none" stroke="#c0c0cc" stroke-width="2" opacity="0.6"/>

  <!-- Ears -->
  <path d="M92,103 Q87,98 86,106 Q86,114 90,116 Q92,113 92,103 Z" fill="url(#di_skin)" opacity="0.8"/>
  <path d="M168,103 Q173,98 174,106 Q174,114 170,116 Q168,113 168,103 Z" fill="url(#di_skin)" opacity="0.8"/>

  <!-- Red accent -->
  <circle cx="130" cy="198" r="3" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.6"/>
  <circle cx="130" cy="198" r="1.2" fill="#ff3344" opacity="0.5"/>

  <!-- Ambient particles -->
  <circle cx="28" cy="75" r="1.5" fill="#ff3344" opacity="0.25"/>
  <circle cx="228" cy="90" r="1" fill="#ff3344" opacity="0.2"/>
  <circle cx="35" cy="255" r="1.2" fill="#ff3344" opacity="0.18"/>
  <circle cx="220" cy="235" r="0.9" fill="#ff3344" opacity="0.22"/>
  <circle cx="18" cy="175" r="1.1" fill="#ff3344" opacity="0.15"/>
  <circle cx="238" cy="165" r="1.3" fill="#ff3344" opacity="0.18"/>
  <circle cx="50" cy="140" r="0.8" fill="#ff3344" opacity="0.12"/>
  <circle cx="206" cy="130" r="0.7" fill="#ff3344" opacity="0.14"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
</svg>