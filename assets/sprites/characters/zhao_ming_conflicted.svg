<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="50%" stop-color="#4a2a10"/>
      <stop offset="100%" stop-color="#2a1508"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>
  <line x1="20" y1="40" x2="20" y2="384" stroke="#ffaa00" stroke-width="0.3" opacity="0.08"/>
  <line x1="236" y1="0" x2="236" y2="384" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ffaa00" stroke-width="1.2" opacity="0.25"/>

  <!-- Name -->
  <text x="128" y="28" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ffaa00" text-anchor="middle" filter="url(#glow)">趙明</text>

  <!-- Suit body -->
  <path d="M52,275 Q60,252 84,238 L100,230 Q115,224 128,222 Q141,224 156,230 L172,238 Q196,252 204,275 L212,384 L44,384 Z" fill="url(#suitGrad)"/>
  <!-- Suit shadow left cel-shade -->
  <path d="M52,275 Q60,252 84,238 L100,230 Q110,226 118,224 L118,384 L44,384 Z" fill="#0e0e1e" opacity="0.5"/>
  <!-- Suit lapels -->
  <path d="M88,236 L74,260 L106,250 L116,232 Z" fill="#222240"/>
  <path d="M168,236 L182,260 L150,250 L140,232 Z" fill="#282848"/>
  <!-- Shirt V -->
  <path d="M112,232 L128,252 L144,232" fill="#d8d8e8" stroke="#c0c0d0" stroke-width="0.5"/>
  <!-- Tie slightly loosened -->
  <path d="M124,246 L127,242 L131,246 L130,310 L128,316 L126,310 Z" fill="#1a1a2e" stroke="#ffaa00" stroke-width="0.6" opacity="0.7"/>
  <path d="M123,242 L128,236 L133,242 L131,248 L124,248 Z" fill="#222240"/>
  <!-- Tie glow lines -->
  <line x1="127" y1="260" x2="129" y2="260" stroke="#ffaa00" stroke-width="0.5" opacity="0.35"/>
  <line x1="127" y1="275" x2="129" y2="275" stroke="#ffaa00" stroke-width="0.5" opacity="0.35"/>
  <line x1="127" y1="290" x2="129" y2="290" stroke="#ffaa00" stroke-width="0.5" opacity="0.35"/>
  <!-- Suit neon accent lines -->
  <line x1="68" y1="278" x2="68" y2="384" stroke="#ffaa00" stroke-width="0.8" opacity="0.15" filter="url(#glow)"/>
  <line x1="188" y1="278" x2="188" y2="384" stroke="#ffaa00" stroke-width="0.8" opacity="0.15" filter="url(#glow)"/>
  <!-- ZhengTek badge -->
  <rect x="80" y="248" width="12" height="8" rx="1.5" fill="#1a2a3a" stroke="#ffaa00" stroke-width="0.6" opacity="0.7"/>
  <text x="86" y="255" font-family="monospace" font-size="5" fill="#ffaa00" text-anchor="middle" opacity="0.8">ZT</text>
  <circle cx="86" cy="252" r="8" fill="none" stroke="#ffaa00" stroke-width="0.3" opacity="0.12" filter="url(#glowSoft)"/>
  <!-- Pocket square -->
  <path d="M166,250 L172,244 L178,250 L175,256 L169,256 Z" fill="#ffaa00" opacity="0.12"/>
  <!-- Smart watch glow -->
  <rect x="46" y="320" width="10" height="14" rx="2" fill="#1a1a2a" stroke="#ffaa00" stroke-width="0.5" opacity="0.4"/>
  <rect x="48" y="323" width="6" height="8" rx="1" fill="#ffaa00" opacity="0.1"/>

  <!-- Neck -->
  <path d="M115,216 Q128,222 141,216 L139,234 Q128,240 117,234 Z" fill="#d8b898"/>
  <path d="M115,216 Q128,220 141,216 L140,224 Q128,228 116,224 Z" fill="#c4a080" opacity="0.4"/>

  <!-- Head - slightly turned, looking away -->
  <path d="M82,130 Q80,105 90,88 Q102,72 130,68 Q158,72 168,88 Q178,105 176,130 L176,155 Q174,175 164,190 Q154,204 142,212 Q136,216 128,218 Q120,216 114,212 Q102,204 92,190 Q84,175 82,155 Z" fill="#d8b898"/>
  <!-- Face shadow left cel-shade -->
  <path d="M82,130 Q80,105 90,88 Q96,80 106,74 L102,130 L100,160 Q92,175 94,190 Q98,198 110,208 L114,212 Q102,204 92,190 Q84,175 82,155 Z" fill="#c4a080" opacity="0.5"/>
  <!-- Jaw shadows -->
  <path d="M92,190 Q102,204 114,212 Q120,216 128,218 L128,208 Q116,202 106,192 Z" fill="#b89068" opacity="0.3"/>
  <path d="M164,190 Q154,204 142,212 Q136,216 128,218 L128,208 Q140,202 150,192 Z" fill="#b89068" opacity="0.2"/>
  <!-- Furrow lines between brows -->
  <line x1="125" y1="130" x2="126" y2="137" stroke="#c4a080" stroke-width="0.7" opacity="0.35"/>
  <line x1="130" y1="130" x2="129" y2="137" stroke="#c4a080" stroke-width="0.7" opacity="0.35"/>

  <!-- Ears -->
  <ellipse cx="82" cy="148" rx="5" ry="10" fill="#d8b898"/>
  <ellipse cx="82" cy="148" rx="3" ry="7" fill="#c4a080" opacity="0.3"/>
  <ellipse cx="176" cy="148" rx="5" ry="10" fill="#d8b898"/>
  <!-- Earpiece -->
  <rect x="170" y="144" width="4" height="9" rx="1" fill="#1a2a3a" stroke="#ffaa00" stroke-width="0.5"/>
  <circle cx="172" cy="146" r="0.8" fill="#ffaa00"/>
  <circle cx="172" cy="150" r="0.6" fill="#ffaa00" opacity="0.6"/>

  <!-- Hair - neat corporate side-part -->
  <path d="M70,128 Q68,100 82,78 Q98,58 130,54 Q162,58 176,78 Q190,100 188,128 L186,116 Q182,98 170,84 Q156,68 130,64 Q102,68 88,84 Q76,98 72,116 Z" fill="#1a1a2a"/>
  <path d="M70,128 Q68,100 82,78 Q92,64 108,58 L104,82 Q90,96 80,116 L74,128 Z" fill="#0e0e18"/>
  <path d="M188,128 Q190,100 176,78 Q170,68 158,62 L162,84 Q176,98 184,116 Z" fill="#141422" opacity="0.5"/>
  <!-- Clean side-part -->
  <path d="M108,60 Q118,56 128,58" fill="none" stroke="#2a2a3e" stroke-width="1.5" opacity="0.6"/>
  <!-- Stray strand - conflicted dishevelment -->
  <path d="M120,60 C118,50 122,44 127,50" fill="none" stroke="#1a1a2a" stroke-width="1.5"/>
  <!-- Hair shine -->
  <path d="M92,76 Q110,68 130,64 Q150,68 168,76 L164,84 Q150,76 130,72 Q110,76 96,84 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Eyes - looking slightly to the side -->
  <!-- Right eye -->
  <path d="M90,148 Q100,136 108,135 Q116,136 122,148 Q116,156 108,157 Q100,156 90,148 Z" fill="#f0f0f5"/>
  <path d="M88,148 Q98,134 108,132 Q118,134 124,148" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M92,150 Q100,157 108,158 Q116,157 120,150" fill="none" stroke="#8a7a6a" stroke-width="0.6"/>
  <!-- Iris shifted left (looking away) -->
  <circle cx="105" cy="148" r="11" fill="url(#irisGrad)"/>
  <circle cx="105" cy="148" r="11" fill="none" stroke="#2a1508" stroke-width="0.8" opacity="0.5"/>
  <circle cx="105" cy="149" r="5" fill="#0a0a0a"/>
  <circle cx="110" cy="143" r="3.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="100" cy="153" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="108" cy="152" r="0.8" fill="#ffffff" opacity="0.3"/>

  <!-- Left eye -->
  <path d="M134,148 Q144,136 152,135 Q160,136 166,148 Q160,156 152,157 Q144,156 134,148 Z" fill="#f0f0f5"/>
  <path d="M132,148 Q142,134 152,132 Q162,134 168,148" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M136,150 Q144,157 152,158 Q160,157 164,150" fill="none" stroke="#8a7a6a" stroke-width="0.6"/>
  <!-- Iris shifted left -->
  <circle cx="149" cy="148" r="11" fill="url(#irisGrad)"/>
  <circle cx="149" cy="148" r="11" fill="none" stroke="#2a1508" stroke-width="0.8" opacity="0.5"/>
  <circle cx="149" cy="149" r="5" fill="#0a0a0a"/>
  <circle cx="154" cy="143" r="3.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="144" cy="153" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="152" cy="152" r="0.8" fill="#ffffff" opacity="0.3"/>

  <!-- Eyebrows - one raised slightly, conflicted -->
  <path d="M88,128 Q100,124 120,128" fill="none" stroke="#1a1a2a" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M136,126 Q156,121 168,128" fill="none" stroke="#1a1a2a" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Worry lines between brows -->
  <line x1="125" y1="124" x2="124" y2="130" stroke="#c4a080" stroke-width="0.6" opacity="0.3"/>
  <line x1="131" y1="124" x2="132" y2="130" stroke="#c4a080" stroke-width="0.6" opacity="0.3"/>

  <!-- Nose -->
  <path d="M127,173 L128,178 L132,176" fill="none" stroke="#b89068" stroke-width="1" stroke-linecap="round"/>

  <!-- Mouth - tense, conflicted -->
  <path d="M118,196 Q123,194 128,194 Q133,194 138,196" fill="none" stroke="#c08a70" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Tension lines at mouth corners -->
  <path d="M116,196 L118,198" fill="none" stroke="#b89068" stroke-width="0.6" opacity="0.4"/>
  <path d="M140,196 L138,198" fill="none" stroke="#b89068" stroke-width="0.6" opacity="0.4"/>

  <!-- Ambient particles -->
  <circle cx="28" cy="95" r="1" fill="#ffaa00" opacity="0.18"/>
  <circle cx="225" cy="75" r="0.8" fill="#ffaa00" opacity="0.12"/>
  <circle cx="38" cy="310" r="1.2" fill="#ffaa00" opacity="0.12"/>
  <circle cx="215" cy="350" r="0.8" fill="#ffaa00" opacity="0.1"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="'Courier New', monospace" font-size="10" fill="#ffaa00" text-anchor="middle" opacity="0.5">[conflicted]</text>
</svg>