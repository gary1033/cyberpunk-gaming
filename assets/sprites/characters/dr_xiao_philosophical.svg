<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="dp_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="dp_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dcc8"/>
      <stop offset="100%" stop-color="#dcc4a8"/>
    </linearGradient>
    <linearGradient id="dp_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="30%" stop-color="#2a2a38"/>
      <stop offset="50%" stop-color="#c0c0d0"/>
      <stop offset="70%" stop-color="#2a2a38"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <radialGradient id="dp_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <filter id="dp_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#dp_bg)"/>
  <rect width="256" height="384" fill="url(#dp_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle" filter="url(#dp_neon)">蕭博士</text>

  <!-- Body -->
  <path d="M58,228 Q52,248 44,300 L38,384 H218 L212,300 Q206,248 198,228 Q186,206 172,196 L165,192 Q150,184 128,180 Q106,184 91,192 L84,196 Q70,206 58,228 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.5" opacity="0.9"/>
  <path d="M128,186 L128,384" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.2"/>

  <!-- One hand raised to chin - contemplative gesture -->
  <path d="M155,256 Q162,268 165,282 Q168,292 172,302 L185,308 Q190,298 188,282 Q185,266 178,250 Q172,238 165,232 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.3" opacity="0.85"/>
  <path d="M145,248 Q150,242 155,246 Q160,250 162,258 L164,268 Q165,276 162,282 Q158,288 152,286 L148,282 Q144,278 142,270 Q140,260 145,248 Z" fill="url(#dp_skin)" opacity="0.8"/>

  <!-- High collar -->
  <path d="M92,196 Q95,180 106,170 L112,164 Q118,160 124,158 L128,156 L132,158 Q138,160 144,164 L150,170 Q161,180 164,196 L158,204 Q148,194 138,188 Q132,186 128,184 Q124,186 118,188 Q108,194 98,204 Z" fill="#151528" stroke="#ff3344" stroke-width="0.8" opacity="0.95"/>
  <path d="M98,198 Q108,190 118,186 Q124,184 128,182 Q132,184 138,186 Q148,190 158,198" fill="none" stroke="#ff3344" stroke-width="1" opacity="0.6"/>

  <!-- Neck - tilted slightly upward -->
  <rect x="118" y="152" width="20" height="20" rx="4" fill="url(#dp_skin)" opacity="0.9"/>

  <!-- Head - tilted upward, anime V-chin -->
  <g transform="rotate(-5, 128, 108)">
    <path d="M88,118 Q86,94 90,74 Q96,54 110,44 Q120,38 128,36 Q136,38 146,44 Q160,54 166,74 Q170,94 168,118 Q166,134 160,146 Q152,156 140,162 Q132,166 128,166 Q124,166 116,162 Q104,156 96,146 Q90,134 88,118 Z" fill="url(#dp_skin)" opacity="0.95"/>

    <!-- Eyes - looking upward, contemplative, anime -->
    <!-- Left eye -->
    <path d="M103,112 Q110,106 120,108 Q123,112 122,118 Q118,122 110,122 Q104,120 103,114 Z" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="112" cy="112" rx="5.5" ry="5.5" fill="#1a0808"/>
    <ellipse cx="112" cy="112" rx="4" ry="4" fill="#440011"/>
    <ellipse cx="113" cy="111" rx="2.8" ry="2.8" fill="#ff3344" opacity="0.7"/>
    <circle cx="109" cy="109" r="2.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="114" cy="114" r="1.3" fill="#ffffff" opacity="0.6"/>
    <circle cx="110" cy="114" r="0.7" fill="#ffffff" opacity="0.4"/>
    <!-- Right eye -->
    <path d="M134,108 Q144,106 153,112 Q153,120 146,122 Q137,122 134,118 Q134,112 134,108 Z" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="144" cy="112" rx="5.5" ry="5.5" fill="#1a0808"/>
    <ellipse cx="144" cy="112" rx="4" ry="4" fill="#440011"/>
    <ellipse cx="143" cy="111" rx="2.8" ry="2.8" fill="#ff3344" opacity="0.7"/>
    <circle cx="141" cy="109" r="2.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="146" cy="114" r="1.3" fill="#ffffff" opacity="0.6"/>
    <circle cx="142" cy="114" r="0.7" fill="#ffffff" opacity="0.4"/>

    <!-- Eyebrows - slightly raised, thoughtful -->
    <path d="M101,102 Q110,98 122,100" fill="none" stroke="#1a1a28" stroke-width="2" opacity="0.75"/>
    <path d="M134,100 Q146,98 155,102" fill="none" stroke="#1a1a28" stroke-width="2" opacity="0.75"/>

    <!-- Small anime nose -->
    <path d="M126,126 Q128,130 130,126" fill="none" stroke="#c4a888" stroke-width="0.8" opacity="0.5"/>

    <!-- Mouth - slightly parted, contemplative -->
    <path d="M118,138 Q123,140 128,140 Q133,140 138,138" fill="none" stroke="#a07060" stroke-width="1" opacity="0.6"/>

    <!-- Hair -->
    <path d="M86,108 Q82,86 86,64 Q92,44 108,34 Q120,26 128,24 Q136,26 148,34 Q164,44 170,64 Q174,86 170,108 Q166,96 158,86 Q148,76 138,72 Q128,68 118,72 Q108,76 98,86 Q90,96 86,108 Z" fill="url(#dp_hair)" opacity="0.95"/>
    <path d="M96,98 Q100,76 114,60 Q122,52 128,48" fill="none" stroke="#e0e0f0" stroke-width="1.2" opacity="0.5"/>
    <path d="M160,98 Q156,76 142,60 Q134,52 128,48" fill="none" stroke="#e0e0f0" stroke-width="1.2" opacity="0.5"/>
    <path d="M104,54 Q116,46 128,44 Q140,46 152,54" fill="none" stroke="#e8e8f8" stroke-width="1.5" opacity="0.35"/>
    <path d="M88,104 Q86,90 88,74" fill="none" stroke="#c0c0d0" stroke-width="2.5" opacity="0.6"/>
    <path d="M168,104 Q170,90 168,74" fill="none" stroke="#c0c0d0" stroke-width="2.5" opacity="0.6"/>

    <!-- Ears -->
    <path d="M88,108 Q82,104 82,112 Q82,120 86,122" fill="url(#dp_skin)" opacity="0.6"/>
    <path d="M168,108 Q174,104 174,112 Q174,120 170,122" fill="url(#dp_skin)" opacity="0.6"/>
  </g>

  <!-- Red accent -->
  <circle cx="128" cy="210" r="3" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.5"/>
  <circle cx="128" cy="210" r="1" fill="#ff3344" opacity="0.4"/>

  <!-- Ambient particles -->
  <circle cx="30" cy="75" r="1.2" fill="#ff3344" opacity="0.18"/>
  <circle cx="225" cy="90" r="0.8" fill="#ff3344" opacity="0.14"/>
  <circle cx="40" cy="260" r="1" fill="#ff3344" opacity="0.14"/>
  <circle cx="215" cy="240" r="0.7" fill="#ff3344" opacity="0.18"/>
  <circle cx="20" cy="175" r="0.9" fill="#ff3344" opacity="0.1"/>
  <circle cx="235" cy="165" r="1.1" fill="#ff3344" opacity="0.14"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
</svg>