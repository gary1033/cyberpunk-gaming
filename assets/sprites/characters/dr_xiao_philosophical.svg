    <path d="M88,104 Q86,90 88,74" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.6"/>
    <path d="M168,104 Q170,90 168,74" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.6"/>
    <path d="M86,108 Q84,116 84,126 Q84,134 86,140" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>
    <path d="M170,108 Q172,116 172,126 Q172,134 170,140" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>

    <!-- Ears -->
