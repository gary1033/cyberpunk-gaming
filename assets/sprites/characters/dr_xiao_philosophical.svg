<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#040410"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#88bbff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#88bbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisL" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="40%" stop-color="#99aabb"/>
      <stop offset="100%" stop-color="#667788"/>
    </radialGradient>
    <radialGradient id="irisR" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="40%" stop-color="#99aabb"/>
      <stop offset="100%" stop-color="#667788"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

