<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0d0d24"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="neon_blue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sweat_glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a882"/>
      <stop offset="50%" stop-color="#c0a07a"/>
      <stop offset="100%" stop-color="#a88868"/>
    </linearGradient>
    <linearGradient id="skin_pale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b898"/>
      <stop offset="100%" stop-color="#bca080"/>
    </linearGradient>
    <linearGradient id="coat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaeaf2"/>
      <stop offset="30%" stop-color="#d8d8e8"/>
      <stop offset="70%" stop-color="#c8c8d8"/>
      <stop offset="100%" stop-color="#b0b0c4"/>
    </linearGradient>
    <linearGradient id="coat_shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0d0"/>
      <stop offset="100%" stop-color="#a0a0b8"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2244"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="hair_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e32"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="glass_fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3377ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2266cc" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sweat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aaddff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88ccff" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="fear_aura" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4488ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect width="256" height="384" fill="url(#fear_aura)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.3"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle" filter="url(#neon_blue)">Dr. 陳</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle">Dr. 陳</text>

  <!-- Neck - stiff, leaning back -->
  <path d="M114,160 Q114,168 116,176 L140,176 Q142,168 142,160" fill="url(#skin_grad)"/>
  <line x1="123" y1="163" x2="122" y2="174" stroke="#b09070" stroke-width="0.4" opacity="0.3"/>
  <line x1="133" y1="163" x2="134" y2="174" stroke="#b09070" stroke-width="0.4" opacity="0.3"/>

  <!-- Body - leaning back, tense posture -->
  <path d="M128,176 Q128,192 128,210 L128,384 L55,384 L55,275 Q55,235 88,218 Q112,204 128,176 Z" fill="url(#shirt_grad)"/>
  <path d="M128,176 Q128,192 128,210 L128,384 L201,384 L201,275 Q201,235 168,218 Q144,204 128,176 Z" fill="url(#shirt_grad)"/>

  <!-- Lab coat - rumpled from startled movement -->
  <path d="M88,218 Q66,225 56,248 Q53,260 53,278 L53,384 L86,384 L86,244 Q88,230 95,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M168,218 Q190,225 200,248 Q203,260 203,278 L203,384 L170,384 L170,244 Q168,230 161,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>

  <!-- Lab coat lapels - askew -->
  <path d="M100,192 L118,230 L100,244" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M156,192 L138,230 L156,244" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Lapel fold detail -->
  <path d="M104,200 Q112,220 110,236" fill="none" stroke="#a8a8c0" stroke-width="0.5" opacity="0.4"/>
  <path d="M152,200 Q144,220 146,236" fill="none" stroke="#a8a8c0" stroke-width="0.5" opacity="0.4"/>

  <!-- Shirt collar -->
  <path d="M110,190 L128,215 L146,190" fill="none" stroke="#1a2244" stroke-width="1.5"/>
  <!-- Tie loosened -->
  <path d="M125,210 L128,230 L131,210" fill="#1a3366" stroke="#2a4488" stroke-width="0.5" opacity="0.6"/>

  <!-- Left arm - raised defensively -->
  <path d="M53,278 Q56,260 66,248 Q78,236 92,228" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Left hand - fingers splayed in alarm -->
  <path d="M68,238 Q64,230 66,222 Q70,214 76,218 Q80,226 76,234 Q72,240 68,238 Z" fill="url(#skin_pale)" stroke="#b09070" stroke-width="0.5"/>
  <!-- Left fingers spread wide -->
  <path d="M72,218 Q68,208 70,202" fill="none" stroke="url(#skin_grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M76,216 Q76,206 78,200" fill="none" stroke="url(#skin_grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66,222 Q60,214 58,208" fill="none" stroke="url(#skin_grad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M64,228 Q58,222 55,218" fill="none" stroke="url(#skin_grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Fingertip details -->
  <circle cx="70" cy="201" r="1.5" fill="url(#skin_pale)" opacity="0.8"/>
  <circle cx="78" cy="199" r="1.5" fill="url(#skin_pale)" opacity="0.8"/>
  <circle cx="57" cy="207" r="1.4" fill="url(#skin_pale)" opacity="0.7"/>

  <!-- Right arm - also raised -->
  <path d="M203,278 Q200,260 190,248 Q178,236 164,228" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Right hand up defensively -->
  <path d="M188,238 Q192,230 190,222 Q186,214 180,218 Q176,226 180,234 Q184,240 188,238 Z" fill="url(#skin_pale)" stroke="#b09070" stroke-width="0.5"/>
  <!-- Right fingers spread -->
  <path d="M184,218 Q188,208 186,202" fill="none" stroke="url(#skin_grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180,216 Q180,206 178,200" fill="none" stroke="url(#skin_grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M190,222 Q196,214 198,208" fill="none" stroke="url(#skin_grad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M192,228 Q198,222 201,218" fill="none" stroke="url(#skin_grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Coat pocket detail -->
  <rect x="160" y="270" width="20" height="26" rx="2" fill="none" stroke="#b0b0c0" stroke-width="0.6" opacity="0.5"/>
  <line x1="167" y1="265" x2="167" y2="274" stroke="#4488ff" stroke-width="1.2" opacity="0.5"/>
  <circle cx="167" cy="264" r="1.2" fill="#4488ff" opacity="0.5"/>

  <!-- Head - pulled back, leaning away -->
  <path d="M92,78 Q92,48 128,42 Q164,48 164,78 L164,120 Q164,140 154,150 Q143,162 128,164 Q113,162 102,150 Q92,140 92,120 Z" fill="url(#skin_grad)"/>
  <!-- Face shadow from leaning back -->
  <path d="M100,130 Q108,145 118,152 Q125,156 128,156 Q131,156 138,152 Q148,145 156,130" fill="#a08060" opacity="0.15"/>

  <!-- Hair - disheveled from startled movement -->
  <path d="M90,74 Q90,46 128,40 Q166,46 166,74 L166,68 Q166,44 128,38 Q90,44 90,68 Z" fill="url(#hair_grad)"/>
  <path d="M88,68 Q86,56 93,48 Q106,40 120,40" fill="url(#hair_grad)"/>
  <path d="M168,68 Q170,56 163,48 Q150,40 124,40" fill="url(#hair_grad)"/>
  <!-- Combed-over strands now messy -->
  <path d="M100,48 Q96,40 98,44 Q96,50 100,54" fill="url(#hair_grad)" opacity="0.9"/>
  <path d="M152,50 Q156,42 154,46 Q152,52 150,50" fill="url(#hair_grad)" opacity="0.8"/>
  <!-- Stray hair strands from being startled -->
  <path d="M108,44 Q104,36 106,32" fill="none" stroke="#1a1a2e" stroke-width="1.2" opacity="0.6"/>
  <path d="M148,44 Q152,36 150,32" fill="none" stroke="#1a1a2e" stroke-width="1" opacity="0.5"/>
  <path d="M128,40 Q128,34 130,30" fill="none" stroke="#1a1a2e" stroke-width="0.8" opacity="0.4"/>

  <!-- Ears -->
  <path d="M90,106 Q84,100 83,108 Q83,118 87,122 Q90,118 90,106 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.4"/>
  <path d="M166,106 Q172,100 173,108 Q173,118 169,122 Q166,118 166,106 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.4"/>
  <!-- Inner ear detail -->
  <path d="M86,108 Q85,112 86,116" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.5"/>
  <path d="M170,108 Q171,112 170,116" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.5"/>

  <!-- Glasses - askew from being startled, tilted -->
  <rect x="93" y="96" rx="3" ry="3" width="28" height="20" fill="url(#glass_fill)" stroke="#4488ff" stroke-width="1.3" opacity="0.85" transform="rotate(-5, 107, 106)"/>
  <rect x="133" y="97" rx="3" ry="3" width="28" height="20" fill="url(#glass_fill)" stroke="#4488ff" stroke-width="1.3" opacity="0.85" transform="rotate(-3, 147, 107)"/>
  <!-- Bridge - slightly crooked -->
  <path d="M121,105 Q127,100 133,104" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.8"/>
  <!-- Temples -->
  <line x1="93" y1="102" x2="87" y2="100" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <line x1="161" y1="103" x2="167" y2="101" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <!-- Lens reflections -->
  <path d="M97,100 L103,100 L101,103" fill="#ffffff" opacity="0.12"/>
  <path d="M137,101 L143,101 L141,104" fill="#ffffff" opacity="0.1"/>
  <!-- Lens glare lines -->
  <line x1="98" y1="108" x2="104" y2="102" stroke="#4488ff" stroke-width="0.3" opacity="0.15"/>
  <line x1="138" y1="109" x2="144" y2="103" stroke="#4488ff" stroke-width="0.3" opacity="0.15"/>

  <!-- Eyes - WIDE OPEN with fright, whites visible all around -->
  <!-- Left eye -->
  <ellipse cx="107" cy="106" rx="10" ry="8" fill="#e8e4e0"/>
  <ellipse cx="107" cy="106" rx="10" ry="8" fill="none" stroke="#2a2020" stroke-width="0.5"/>
  <circle cx="107" cy="106" r="4" fill="#443322"/>
  <circle cx="107" cy="106" r="2" fill="#0a0a1a"/>
  <!-- Fear-contracted pupil -->
  <circle cx="107" cy="106" r="1" fill="#000000"/>
  <!-- Bright reflections showing shock -->
  <circle cx="109" cy="104" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="105" cy="108" r="0.7" fill="#ffffff" opacity="0.5"/>
  <!-- Bloodshot from stress -->
  <path d="M97" y1="104" x2="100" y2="105" fill="none" stroke="#cc4444" stroke-width="0.3" opacity="0.3"/>

  <!-- Right eye -->
  <ellipse cx="147" cy="106" rx="10" ry="8" fill="#e8e4e0"/>
  <ellipse cx="147" cy="106" rx="10" ry="8" fill="none" stroke="#2a2020" stroke-width="0.5"/>
  <circle cx="147" cy="106" r="4" fill="#443322"/>
  <circle cx="147" cy="106" r="2" fill="#0a0a1a"/>
  <circle cx="147" cy="106" r="1" fill="#000000"/>
  <circle cx="149" cy="104" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="145" cy="108" r="0.7" fill="#ffffff" opacity="0.5"/>

  <!-- Eyebrows - raised very high in shock/terror -->
  <path d="M95,86 Q107,78 122,86" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M134,86 Q149,78 161,86" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Forehead wrinkles from raised brows -->
  <path d="M104,78 Q128,72 152,78" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.35"/>
  <path d="M108,82 Q128,77 148,82" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.25"/>
  <path d="M112,74 Q128,70 144,74" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.2"/>

  <!-- Sweat drops - multiple, large -->
  <path d="M170,84 Q172,90 170,96 Q168,90 170,84 Z" fill="url(#sweat_grad)" filter="url(#sweat_glow)"/>
  <path d="M174,96 Q175,100 174,104 Q173,100 174,96 Z" fill="url(#sweat_grad)" opacity="0.7"/>
  <path d="M86,90 Q87,95 86,100 Q85,95 86,90 Z" fill="url(#sweat_grad)" opacity="0.6"/>
  <path d="M82,102 Q83,106 82,110 Q81,106 82,102 Z" fill="url(#sweat_grad)" opacity="0.4"/>
  <!-- Sweat beads on forehead -->
  <circle cx="115" cy="76" r="1" fill="#88ccff" opacity="0.35"/>
  <circle cx="140" cy="74" r="0.8" fill="#88ccff" opacity="0.3"/>

  <!-- Nose -->
  <path d="M128,110 Q127,118 125,126 Q123,130 125,133 Q128,135 131,133 Q133,130 131,126 Q129,118 128,110" fill="none" stroke="#a08060" stroke-width="0.8" opacity="0.45"/>

  <!-- Mouth - open wide in shock/fear -->
  <ellipse cx="128" cy="146" rx="12" ry="9" fill="#2a1a1a"/>
  <path d="M116,143 Q128,137 140,143" fill="none" stroke="#8a6a5a" stroke-width="1.8"/>
  <path d="M118,149 Q128,155 138,149" fill="none" stroke="#8a6a5a" stroke-width="1.2"/>
  <!-- Upper teeth visible -->
  <path d="M119,143 L137,143" fill="none" stroke="#ccbbaa" stroke-width="2" opacity="0.35"/>
  <!-- Lower teeth -->
  <path d="M121,149 L135,149" fill="none" stroke="#ccbbaa" stroke-width="1.2" opacity="0.2"/>
  <!-- Mouth interior shadow -->
  <ellipse cx="128" cy="146" rx="8" ry="5" fill="#1a0a0a" opacity="0.4"/>
  <!-- Lips tension lines -->
  <path d="M114,142 Q112,140 114,138" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>
  <path d="M142,142 Q144,140 142,138" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>

  <!-- Chin tension -->
  <path d="M118,156 Q128,162 138,156" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.2"/>

  <!-- ID badge - swinging from sudden movement -->
  <rect x="68" y="280" width="16" height="22" rx="2" fill="#1a1a2e" stroke="#4488ff" stroke-width="0.5" opacity="0.6" transform="rotate(8, 76, 291)"/>
  <rect x="71" y="283" width="10" height="6" rx="1" fill="#4488ff" opacity="0.2" transform="rotate(8, 76, 291)"/>
  <line x1="70" y1="293" x2="82" y2="293" stroke="#4488ff" stroke-width="0.5" opacity="0.3" transform="rotate(8, 76, 291)"/>

  <!-- Ambient fear lighting -->
  <ellipse cx="128" cy="300" rx="90" ry="35" fill="#4488ff" opacity="0.02"/>
  <ellipse cx="128" cy="110" rx="55" ry="35" fill="#4488ff" opacity="0.018"/>

  <!-- Scanlines for tension -->
  <line x1="0" y1="80" x2="256" y2="80" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="160" x2="256" y2="160" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="320" x2="256" y2="320" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
</svg>