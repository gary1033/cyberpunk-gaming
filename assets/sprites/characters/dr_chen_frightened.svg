<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0d0d24"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sweat_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="iris_grad_l" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6b4422"/>
      <stop offset="50%" stop-color="#3d2211"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </radialGradient>
    <radialGradient id="iris_grad_r" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6b4422"/>
      <stop offset="50%" stop-color="#3d2211"/>
      <stop offset="100%" stop-color="#1a0e06"/>
    </radialGradient>
    <linearGradient id="glass_lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2266cc" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="coat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eeeef4"/>
      <stop offset="100%" stop-color="#c8c8d6"/>
    </linearGradient>
    <linearGradient id="badge_holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#66aaff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4488ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sweat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbddff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#88ccff" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="fear_aura" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4488ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background - slightly more intense -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect width="256" height="384" fill="url(#fear_aura)"/>
  <rect x="3" y="3" width="250" height="378" rx="5" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.3"/>
  <!-- Tension scanlines -->
  <line x1="0" y1="80" x2="256" y2="80" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="160" x2="256" y2="160" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="320" x2="256" y2="320" stroke="#4488ff" stroke-width="0.3" opacity="0.06"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle" filter="url(#glow)">Dr. 陳</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#66aaff" text-anchor="middle">Dr. 陳</text>

  <!-- === BODY - leaning back, tense === -->
  <!-- Neck stiff -->
  <path d="M114,162 Q114,170 116,180 L140,180 Q142,170 142,162" fill="#f0cba8"/>
  <line x1="124" y1="165" x2="123" y2="178" stroke="#d4a878" stroke-width="0.5" opacity="0.3"/>

  <!-- Dark undershirt -->
  <path d="M128,178 L128,384 L55,384 L55,275 Q55,235 88,218 Q112,204 128,178Z" fill="#0d1530"/>
  <path d="M128,178 L128,384 L201,384 L201,275 Q201,235 168,218 Q144,204 128,178Z" fill="#0d1530"/>

  <!-- Lab coat - slightly rumpled -->
  <path d="M88,218 Q66,225 56,248 Q53,260 53,278 L53,384 L86,384 L86,244 Q88,230 95,222" fill="url(#coat_grad)" stroke="#b8b8c8" stroke-width="0.5"/>
  <path d="M168,218 Q190,225 200,248 Q203,260 203,278 L203,384 L170,384 L170,244 Q168,230 161,222" fill="url(#coat_grad)" stroke="#b8b8c8" stroke-width="0.5"/>
  <!-- Coat cel-shadow -->
  <path d="M53,278 L53,384 L70,384 L70,265 Q66,252 68,240" fill="#b8b8cc" opacity="0.4"/>
  <path d="M203,278 L203,384 L186,384 L186,265 Q190,252 188,240" fill="#b8b8cc" opacity="0.4"/>

  <!-- Lapels -->
  <path d="M100,192 L118,230 L100,244" fill="url(#coat_grad)" stroke="#b8b8c8" stroke-width="0.5"/>
  <path d="M156,192 L138,230 L156,244" fill="url(#coat_grad)" stroke="#b8b8c8" stroke-width="0.5"/>
  <!-- Collar -->
  <path d="M110,190 L128,215 L146,190" fill="none" stroke="#0d1530" stroke-width="1.8"/>

  <!-- Tech lines -->
  <line x1="86" y1="260" x2="86" y2="384" stroke="#4488ff" stroke-width="0.6" opacity="0.12"/>
  <line x1="170" y1="260" x2="170" y2="384" stroke="#4488ff" stroke-width="0.6" opacity="0.12"/>

  <!-- Pocket -->
  <rect x="160" y="270" width="20" height="26" rx="2" fill="none" stroke="#b0b0c0" stroke-width="0.6" opacity="0.5"/>
  <line x1="167" y1="265" x2="167" y2="274" stroke="#4488ff" stroke-width="1.2" opacity="0.5"/>
  <circle cx="167" cy="264" r="1.2" fill="#4488ff" opacity="0.5"/>

  <!-- Badge - swinging -->
  <rect x="66" y="278" width="18" height="24" rx="2" fill="#0d1020" stroke="#4488ff" stroke-width="0.6" opacity="0.6" transform="rotate(8, 75, 290)"/>
  <rect x="69" y="281" width="12" height="7" rx="1" fill="url(#badge_holo)" opacity="0.4" transform="rotate(8, 75, 290)"/>

  <!-- Left arm - raised defensively -->
  <path d="M53,278 Q56,260 66,248 Q78,236 92,228" fill="url(#coat_grad)" stroke="#b8b8c8" stroke-width="0.4"/>
  <path d="M68,238 Q64,230 66,222 Q70,214 76,218 Q80,226 76,234 Q72,240 68,238Z" fill="#f0cba8" stroke="#d4a878" stroke-width="0.4"/>
  <!-- Splayed fingers -->
  <path d="M72,218 Q68,208 70,202" fill="none" stroke="#f0cba8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M76,216 Q76,206 78,200" fill="none" stroke="#f0cba8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66,222 Q60,214 58,208" fill="none" stroke="#f0cba8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M64,228 Q58,222 55,218" fill="none" stroke="#f0cba8" stroke-width="2" stroke-linecap="round"/>

  <!-- Right arm - also raised -->
  <path d="M203,278 Q200,260 190,248 Q178,236 164,228" fill="url(#coat_grad)" stroke="#b8b8c8" stroke-width="0.4"/>
  <path d="M188,238 Q192,230 190,222 Q186,214 180,218 Q176,226 180,234 Q184,240 188,238Z" fill="#f0cba8" stroke="#d4a878" stroke-width="0.4"/>
  <path d="M184,218 Q188,208 186,202" fill="none" stroke="#f0cba8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M180,216 Q180,206 178,200" fill="none" stroke="#f0cba8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M190,222 Q196,214 198,208" fill="none" stroke="#f0cba8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- === HEAD - pulled back === -->
  <path d="M92,80 Q92,50 128,44 Q164,50 164,80 L164,122 Q164,140 154,150 Q142,162 128,164 Q114,162 102,150 Q92,140 92,122Z" fill="#f0cba8"/>
  <!-- Cel-shadow -->
  <path d="M92,96 Q92,84 102,76 L92,96 L92,126 Q94,140 104,150 Q110,156 116,159 L114,162 Q102,150 92,140Z" fill="#d4a878" opacity="0.35"/>
  <!-- Chin tension shadow -->
  <path d="M110,152 Q120,158 128,158 Q136,158 146,152" fill="#d4a878" opacity="0.15"/>

  <!-- Ears -->
  <path d="M90,108 Q84,102 83,110 Q83,120 87,124 Q90,118 90,108Z" fill="#f0cba8" stroke="#d4a878" stroke-width="0.4"/>
  <path d="M166,108 Q172,102 173,110 Q173,120 169,124 Q166,118 166,108Z" fill="#f0cba8" stroke="#d4a878" stroke-width="0.4"/>

  <!-- Hair - disheveled from startled movement -->
  <path d="M90,76 Q90,48 128,42 Q166,48 166,76 L166,70 Q166,46 128,40 Q90,46 90,70Z" fill="#1a1a2e"/>
  <path d="M88,70 Q86,58 94,48 Q107,42 121,42" fill="#1a1a2e"/>
  <path d="M168,70 Q170,58 162,48 Q150,42 124,42" fill="#1a1a2e"/>
  <!-- Stray strands - startled -->
  <path d="M108,44 Q104,36 106,32" fill="none" stroke="#1a1a2e" stroke-width="1.2" opacity="0.6"/>
  <path d="M148,44 Q152,36 150,32" fill="none" stroke="#1a1a2e" stroke-width="1" opacity="0.5"/>
  <path d="M128,42 Q128,36 130,32" fill="none" stroke="#1a1a2e" stroke-width="0.8" opacity="0.4"/>
  <!-- Messy strands -->
  <path d="M100,50 Q96,42 98,46 Q96,52 100,54" fill="#1a1a2e" opacity="0.9"/>
  <path d="M154,52 Q158,44 156,48 Q154,54 152,52" fill="#1a1a2e" opacity="0.8"/>

  <!-- === GLASSES - askew, tilted from being startled === -->
  <rect x="93" y="96" rx="3" ry="3" width="28" height="20" fill="url(#glass_lens)" stroke="#4488ff" stroke-width="1.3" opacity="0.85" transform="rotate(-5, 107, 106)"/>
  <rect x="133" y="97" rx="3" ry="3" width="28" height="20" fill="url(#glass_lens)" stroke="#4488ff" stroke-width="1.3" opacity="0.85" transform="rotate(-3, 147, 107)"/>
  <!-- Bridge crooked -->
  <path d="M121,105 Q127,100 133,104" fill="none" stroke="#4488ff" stroke-width="1.1" opacity="0.8"/>
  <!-- Temples -->
  <line x1="93" y1="102" x2="87" y2="100" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <line x1="161" y1="103" x2="167" y2="101" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <!-- Glare -->
  <path d="M97,100 L104,100 L101,104" fill="#ffffff" opacity="0.12"/>
  <path d="M137,101 L144,101 L141,105" fill="#ffffff" opacity="0.1"/>

  <!-- === EYES - VERY WIDE, small pupils (fear) === -->
  <!-- Left eye - whites visible all around -->
  <path d="M97,107 Q103,96 109,94 Q115,96 121,107" fill="#eae6e0" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M98,107 Q109,116 120,107" fill="#eae6e0" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Smaller iris = more white showing = fear -->
  <circle cx="109" cy="105" r="6" fill="url(#iris_grad_l)"/>
  <circle cx="109" cy="105" r="3" fill="#1a0e06"/>
  <!-- Contracted pupil -->
  <circle cx="109" cy="105" r="1.5" fill="#000000"/>
  <!-- Bright shock highlights -->
  <circle cx="112" cy="102" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="106" cy="107" r="1.3" fill="#ffffff" opacity="0.5"/>
  <circle cx="111" cy="108" r="0.6" fill="#ffffff" opacity="0.3"/>

  <!-- Right eye -->
  <path d="M137,107 Q143,96 149,94 Q155,96 161,107" fill="#eae6e0" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M138,107 Q149,116 160,107" fill="#eae6e0" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="149" cy="105" r="6" fill="url(#iris_grad_r)"/>
  <circle cx="149" cy="105" r="3" fill="#1a0e06"/>
  <circle cx="149" cy="105" r="1.5" fill="#000000"/>
  <circle cx="152" cy="102" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="146" cy="107" r="1.3" fill="#ffffff" opacity="0.5"/>
  <circle cx="151" cy="108" r="0.6" fill="#ffffff" opacity="0.3"/>

  <!-- Eyebrows - raised very high in shock -->
  <path d="M96,84 Q109,76 122,84" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M134,84 Q149,76 162,84" fill="none" stroke="#1a1a2e" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Forehead wrinkles -->
  <path d="M104,78 Q128,72 152,78" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.3"/>
  <path d="M108,82 Q128,77 148,82" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.2"/>

  <!-- Multiple sweat drops - anime style -->
  <path d="M172,84 Q174,92 172,100 Q170,92 172,84Z" fill="url(#sweat_grad)" filter="url(#sweat_glow)"/>
  <path d="M176,98 Q177,103 176,108 Q175,103 176,98Z" fill="url(#sweat_grad)" opacity="0.7"/>
  <path d="M86,90 Q87,96 86,102 Q85,96 86,90Z" fill="url(#sweat_grad)" opacity="0.6"/>
  <path d="M82,104 Q83,108 82,112 Q81,108 82,104Z" fill="url(#sweat_grad)" opacity="0.4"/>
  <!-- Forehead sweat beads -->
  <circle cx="115" cy="78" r="1" fill="#88ccff" opacity="0.35"/>
  <circle cx="140" cy="76" r="0.8" fill="#88ccff" opacity="0.3"/>

  <!-- Nose -->
  <path d="M128,112 L126,128 Q128,131 130,128Z" fill="#d4a878" opacity="0.4"/>

  <!-- Mouth - open wide in shock, anime style -->
  <ellipse cx="128" cy="148" rx="13" ry="10" fill="#2a1a1a"/>
  <path d="M115,144 Q128,137 141,144" fill="none" stroke="#6a4a3a" stroke-width="2"/>
  <path d="M117,152 Q128,158 139,152" fill="none" stroke="#6a4a3a" stroke-width="1.5"/>
  <!-- Teeth visible -->
  <path d="M118,144 L138,144" fill="none" stroke="#ccbbaa" stroke-width="2.2" opacity="0.35"/>
  <!-- Inner mouth shadow -->
  <ellipse cx="128" cy="148" rx="8" ry="5" fill="#1a0a0a" opacity="0.4"/>

  <!-- Ambient -->
  <ellipse cx="128" cy="300" rx="90" ry="35" fill="#4488ff" opacity="0.02"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="'Courier New', monospace" font-size="11" fill="#4488ff" text-anchor="middle" opacity="0.5">[ FRIGHTENED ]</text>
</svg>