<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="kd-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1a08"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="kd-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="50%" stop-color="#142214"/>
      <stop offset="100%" stop-color="#0c180c"/>
    </linearGradient>
    <linearGradient id="kd-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#d0b088"/>
    </linearGradient>
    <linearGradient id="kd-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="kd-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="kd-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44cc00"/>
      <stop offset="50%" stop-color="#88ff00"/>
      <stop offset="100%" stop-color="#44cc00"/>
    </linearGradient>
    <linearGradient id="kd-neon-stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#44cc00" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="kd-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="kd-glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="kd-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#44cc00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#kd-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#kd-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#88ff00" text-anchor="middle" filter="url(#kd-glow)">小鬼</text>

  <!-- Hoodie body - oversized on small frame -->
  <path d="M58,180 C58,168 72,155 88,150 L108,144 C116,141 122,140 128,139 C134,140 140,141 148,144 L168,150 C184,155 198,168 198,180 L204,275 C206,315 202,348 198,370 L58,370 C54,348 50,315 52,275 Z" fill="url(#kd-hoodie)"/>
  <!-- Neon lime patches/stripes on hoodie -->
  <path d="M68,200 L78,200 L78,230 L68,230 Z" fill="#88ff00" opacity="0.12"/>
  <path d="M178,200 L188,200 L188,230 L178,230 Z" fill="#88ff00" opacity="0.12"/>
  <!-- Neon stripe down sleeves -->
  <path d="M60,185 Q62,220 58,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.15"/>
  <path d="M196,185 Q194,220 198,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.15"/>
  <!-- Horizontal neon accent stripe across chest -->
  <path d="M80,210 L176,210" fill="none" stroke="#88ff00" stroke-width="1.5" opacity="0.1"/>

  <!-- Hoodie pocket/kangaroo pouch -->
  <path d="M90,260 L166,260 L168,295 C168,305 160,310 128,310 C96,310 88,305 88,295 Z" fill="#0c180c" opacity="0.6"/>
  <path d="M90,260 L166,260" fill="none" stroke="#88ff00" stroke-width="0.5" opacity="0.2"/>

  <!-- Hoodie seam lines -->
  <path d="M128,165 L128,370" fill="none" stroke="#88ff00" stroke-width="0.3" opacity="0.1"/>
  <path d="M85,200 C90,240 88,290 86,340" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.12"/>
  <path d="M171,200 C166,240 168,290 170,340" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.12"/>

  <!-- Hoodie drawstrings -->
  <line x1="120" y1="165" x2="118" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.25"/>
  <line x1="136" y1="165" x2="138" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.25"/>
  <rect x="116" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.3"/>
  <rect x="136" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.3"/>

  <!-- T-shirt visible at collar -->
  <path d="M112,155 C118,150 124,148 128,147 C132,148 138,150 144,155" fill="#1a1a28"/>
  <path d="M122,155 L128,148 L134,155" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.4"/>

  <!-- Neck - thin, young -->
  <path d="M118,132 L118,150 C118,153 122,155 128,155 C134,155 138,153 138,150 L138,132" fill="url(#kd-skin)"/>

  <!-- Hoodie hood bunched behind neck -->
  <path d="M105,138 C110,145 118,148 128,148 C138,148 146,145 151,138 L155,145 C155,155 145,162 128,163 C111,162 101,155 101,145 Z" fill="#1a2a1a"/>
  <path d="M105,138 C110,145 118,148 128,148 C138,148 146,145 151,138" fill="none" stroke="#88ff00" stroke-width="0.5" opacity="0.2"/>

  <!-- Head shape - rounder, younger proportions -->
  <path d="M98,82 C98,55 110,42 128,40 C146,42 158,55 158,82 L158,112 C158,132 146,142 128,142 C110,142 98,132 98,112 Z" fill="url(#kd-skin)"/>

  <!-- Hair - messy, spiky, brown -->
  <path d="M96,80 C96,52 110,36 128,34 C146,36 160,52 160,80" fill="url(#kd-hair)"/>
  <!-- Spiky hair tufts -->
  <path d="M108,40 L104,28 L112,36" fill="url(#kd-hair)"/>
  <path d="M122,36 L118,22 L126,32" fill="url(#kd-hair)"/>
  <path d="M136,35 L140,20 L142,32" fill="url(#kd-hair)"/>
  <path d="M148,38 L154,26 L152,36" fill="url(#kd-hair)"/>
  <!-- Hair sides -->
  <path d="M96,78 C96,68 98,58 102,52" fill="none" stroke="#1a1008" stroke-width="3"/>
  <path d="M160,78 C160,68 158,58 154,52" fill="none" stroke="#1a1008" stroke-width="3"/>
  <!-- Brown hair strand detail -->
  <path d="M106,44 Q104,52 106,62" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.6"/>
  <path d="M150,42 Q152,50 150,60" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.6"/>
  <!-- Green-tinted hair highlights -->
  <path d="M112,38 L108,26" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.3"/>
  <path d="M140,34 L144,22" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.3"/>

  <!-- VR Goggles on forehead -->
  <path d="M100,68 C100,60 108,55 128,55 C148,55 156,60 156,68 L156,78 C156,82 148,85 128,85 C108,85 100,82 100,78 Z" fill="url(#kd-goggles)"/>
  <!-- Goggle strap -->
  <path d="M96,72 L100,72" fill="none" stroke="#2a2a3a" stroke-width="3"/>
  <path d="M156,72 L160,72" fill="none" stroke="#2a2a3a" stroke-width="3"/>
  <!-- Goggle lenses -->
  <ellipse cx="116" cy="72" rx="10" ry="7" fill="#0a0a14"/>
  <ellipse cx="116" cy="72" rx="8" ry="5.5" fill="url(#kd-goggle-lens)" opacity="0.3"/>
  <ellipse cx="140" cy="72" rx="10" ry="7" fill="#0a0a14"/>
  <ellipse cx="140" cy="72" rx="8" ry="5.5" fill="url(#kd-goggle-lens)" opacity="0.3"/>
  <!-- Goggle rim glow -->
  <ellipse cx="116" cy="72" rx="10" ry="7" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="140" cy="72" rx="10" ry="7" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.4"/>
  <!-- Goggle bridge -->
  <path d="M126,72 L130,72" fill="none" stroke="#2a2a3a" stroke-width="2"/>
  <!-- Lens reflections -->
  <path d="M110,69 Q114,67 118,69" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.25"/>
  <path d="M134,69 Q138,67 142,69" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.25"/>

  <!-- Ears -->
  <ellipse cx="95" cy="95" rx="5" ry="7" fill="#d0b088"/>
  <ellipse cx="161" cy="95" rx="5" ry="7" fill="#d0b088"/>
  <!-- Small ear stud -->
  <circle cx="94" cy="92" r="1.2" fill="#88ff00" opacity="0.5"/>

  <!-- Eyebrows - expressive, mischievous -->
  <path d="M105,88 C108,86 114,86 120,87" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.7"/>
  <path d="M136,87 C142,86 148,86 151,88" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.7"/>

  <!-- Eyes - large, bright, young -->
  <ellipse cx="113" cy="96" rx="9" ry="7" fill="#e8e8f0"/>
  <ellipse cx="113" cy="96" rx="5" ry="5" fill="#1a3a08"/>
  <ellipse cx="113" cy="96" rx="3" ry="3" fill="#0a0a0a"/>
  <circle cx="111" cy="94" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="115" cy="94" r="0.8" fill="#88ff00" opacity="0.4"/>

  <ellipse cx="143" cy="96" rx="9" ry="7" fill="#e8e8f0"/>
  <ellipse cx="143" cy="96" rx="5" ry="5" fill="#1a3a08"/>
  <ellipse cx="143" cy="96" rx="3" ry="3" fill="#0a0a0a"/>
  <circle cx="141" cy="94" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="145" cy="94" r="0.8" fill="#88ff00" opacity="0.4"/>

  <!-- Nose - small, young -->
  <path d="M128,98 L126,110 L128,112 L130,110" fill="none" stroke="#c0a078" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - mischievous grin showing teeth -->
  <path d="M116,120 C120,126 128,128 136,126 C140,122 140,120 140,120" fill="none" stroke="#a08060" stroke-width="1.2"/>
  <!-- Teeth showing in grin -->
  <path d="M120,122 C124,124 132,124 136,122" fill="#e8e8f0" opacity="0.3"/>
  <!-- Dimple hints -->
  <path d="M114,120 Q116,122 116,120" fill="none" stroke="#c0a078" stroke-width="0.5" opacity="0.3"/>
  <path d="M140,120 Q142,118 142,120" fill="none" stroke="#c0a078" stroke-width="0.5" opacity="0.3"/>

  <!-- Freckles -->
  <circle cx="108" cy="106" r="0.8" fill="#c0a078" opacity="0.3"/>
  <circle cx="112" cy="108" r="0.6" fill="#c0a078" opacity="0.25"/>
  <circle cx="144" cy="106" r="0.8" fill="#c0a078" opacity="0.3"/>
  <circle cx="148" cy="108" r="0.6" fill="#c0a078" opacity="0.25"/>

  <!-- Shoulder definition -->
  <path d="M58,180 C63,170 75,162 88,158" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.2"/>
  <path d="M198,180 C193,170 181,162 168,158" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.2"/>

  <!-- Neon patch on hoodie shoulder -->
  <rect x="64" y="175" width="8" height="12" rx="1" fill="#88ff00" opacity="0.08"/>
  <rect x="184" y="175" width="8" height="12" rx="1" fill="#88ff00" opacity="0.08"/>

  <!-- Ambient digital particles -->
  <circle cx="38" cy="195" r="1" fill="#88ff00" opacity="0.4"/>
  <circle cx="218" cy="175" r="1.2" fill="#88ff00" opacity="0.35"/>
  <circle cx="52" cy="305" r="0.8" fill="#44cc00" opacity="0.3"/>
  <circle cx="204" cy="295" r="1" fill="#88ff00" opacity="0.25"/>
  <circle cx="30" cy="255" r="0.8" fill="#88ff00" opacity="0.2"/>
  <circle cx="226" cy="250" r="0.6" fill="#44cc00" opacity="0.18"/>
</svg>