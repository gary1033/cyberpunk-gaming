<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#06061a"/>
    </radialGradient>
    <radialGradient id="iris-l" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#88cc66"/>
      <stop offset="40%" stop-color="#55aa44"/>
      <stop offset="100%" stop-color="#2a6622"/>
    </radialGradient>
    <radialGradient id="iris-r" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#88cc66"/>
      <stop offset="40%" stop-color="#55aa44"/>
      <stop offset="100%" stop-color="#2a6622"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="50%" stop-color="#121a22"/>
      <stop offset="100%" stop-color="#0a1218"/>
    </linearGradient>
    <linearGradient id="hoodie-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#060c12"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ccff"/>
      <stop offset="50%" stop-color="#0099dd"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </linearGradient>
    <linearGradient id="hair-shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#88eeff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.35"/>

  <!-- Name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00ccff" text-anchor="middle" filter="url(#glow)">小鬼</text>

  <!-- Hoodie body - oversized on small frame -->
  <path d="M55,182 C55,168 70,154 88,148 L108,142 C116,139 122,138 128,137 C134,138 140,139 148,142 L168,148 C186,154 201,168 201,182 L207,278 C209,318 205,350 201,372 L55,372 C51,350 47,318 49,278 Z" fill="url(#hoodie)"/>
  <!-- Hoodie shadow cel-shade -->
  <path d="M55,182 C55,168 70,154 88,148 L108,142 C116,139 122,138 128,137 L128,372 L55,372 C51,350 47,318 49,278 Z" fill="url(#hoodie-shadow)" opacity="0.3"/>
  <!-- Neon accent stripes -->
  <path d="M68,200 L78,200 L78,240 L68,240 Z" fill="#00ccff" opacity="0.1"/>
  <path d="M178,200 L188,200 L188,240 L178,240 Z" fill="#00ccff" opacity="0.1"/>
  <path d="M58,186 Q60,225 56,268" fill="none" stroke="#00ccff" stroke-width="2.5" opacity="0.12"/>
  <path d="M198,186 Q196,225 200,268" fill="none" stroke="#00ccff" stroke-width="2.5" opacity="0.12"/>
  <!-- Chest horizontal accent -->
  <path d="M78,215 L178,215" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.08"/>

  <!-- USB drives clipped to hoodie -->
  <rect x="172" y="200" width="4" height="10" rx="1" fill="#1a2a3a" stroke="#00ccff" stroke-width="0.5" opacity="0.6"/>
  <rect x="173" y="201" width="2" height="3" rx="0.5" fill="#00ccff" opacity="0.3"/>
  <rect x="178" y="204" width="4" height="10" rx="1" fill="#1a2a3a" stroke="#00ccff" stroke-width="0.5" opacity="0.5"/>
  <rect x="179" y="205" width="2" height="3" rx="0.5" fill="#00ccff" opacity="0.25"/>

  <!-- Hoodie kangaroo pocket -->
  <path d="M88,262 L168,262 L170,298 C170,308 162,314 128,314 C94,314 86,308 86,298 Z" fill="#0a1218" opacity="0.6"/>
  <path d="M88,262 L168,262" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.15"/>

  <!-- Center seam -->
  <path d="M128,166 L128,372" fill="none" stroke="#00ccff" stroke-width="0.3" opacity="0.08"/>

  <!-- Drawstrings -->
  <line x1="120" y1="166" x2="117" y2="204" stroke="#00ccff" stroke-width="1" opacity="0.2"/>
  <line x1="136" y1="166" x2="139" y2="204" stroke="#00ccff" stroke-width="1" opacity="0.2"/>
  <rect x="115" y="202" width="4" height="6" rx="1" fill="#00ccff" opacity="0.25"/>
  <rect x="137" y="202" width="4" height="6" rx="1" fill="#00ccff" opacity="0.25"/>

  <!-- T-shirt visible at collar -->
  <path d="M112,156 C118,150 124,148 128,147 C132,148 138,150 144,156" fill="#1a1a2a"/>
  <path d="M122,156 L128,148 L134,156" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.3"/>

  <!-- Neck - thin, young -->
  <path d="M118,130 L118,152 C118,155 122,157 128,157 C134,157 138,155 138,152 L138,130" fill="#e0c8a0"/>
  <path d="M118,130 L118,152 C118,155 122,157 128,157 L128,130" fill="#c8b090" opacity="0.3"/>

  <!-- Hoodie hood bunched behind neck -->
  <path d="M104,136 C110,144 118,147 128,147 C138,147 146,144 152,136 L156,144 C156,154 146,162 128,163 C110,162 100,154 100,144 Z" fill="#121a22"/>

  <!-- Head shape - rounder, younger proportions -->
  <path d="M94,80 C94,50 108,36 128,34 C148,36 162,50 162,80 L162,114 C162,136 148,148 128,148 C108,148 94,136 94,114 Z" fill="#e0c8a0"/>
  <!-- Face shadow cel-shade -->
  <path d="M94,80 C94,50 108,36 128,34 L128,148 C108,148 94,136 94,114 Z" fill="#c8b090" opacity="0.2"/>

  <!-- Hair - electric blue, messy chunky spikes -->
  <path d="M92,78 C92,46 108,28 128,26 C148,28 164,46 164,78" fill="url(#hair)"/>
  <!-- Big chunky spikes -->
  <path d="M104,34 L96,14 L114,30" fill="url(#hair)"/>
  <path d="M118,28 L110,6 L124,22" fill="url(#hair)"/>
  <path d="M134,26 L140,4 L146,22" fill="url(#hair)"/>
  <path d="M150,30 L162,12 L158,28" fill="url(#hair)"/>
  <path d="M92,58 L82,48 L92,68" fill="url(#hair)"/>
  <path d="M164,58 L174,48 L164,68" fill="url(#hair)"/>
  <!-- Hair sides -->
  <path d="M92,76 C92,64 94,52 100,44" fill="none" stroke="#0088bb" stroke-width="4"/>
  <path d="M164,76 C164,64 162,52 156,44" fill="none" stroke="#0088bb" stroke-width="4"/>
  <!-- Hair shine -->
  <path d="M108,30 C114,26 124,24 128,26 C120,30 112,40 108,50 Z" fill="url(#hair-shine)"/>
  <!-- Hair strand details -->
  <path d="M102,40 Q100,50 102,62" fill="none" stroke="#00aadd" stroke-width="2" opacity="0.5"/>
  <path d="M154,38 Q156,48 154,60" fill="none" stroke="#00aadd" stroke-width="2" opacity="0.5"/>

  <!-- Headphones around neck -->
  <path d="M86,120 C86,108 100,100 128,100 C156,100 170,108 170,120" fill="none" stroke="#2a2a3a" stroke-width="5"/>
  <ellipse cx="86" cy="126" rx="7" ry="9" fill="#2a2a3a"/>
  <ellipse cx="86" cy="126" rx="5" ry="7" fill="#1a1a28"/>
  <ellipse cx="86" cy="126" rx="3" ry="5" fill="#00ccff" opacity="0.15"/>
  <ellipse cx="170" cy="126" rx="7" ry="9" fill="#2a2a3a"/>
  <ellipse cx="170" cy="126" rx="5" ry="7" fill="#1a1a28"/>
  <ellipse cx="170" cy="126" rx="3" ry="5" fill="#00ccff" opacity="0.15"/>
  <!-- Headphone accent glow -->
  <ellipse cx="86" cy="126" rx="7" ry="9" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="170" cy="126" rx="7" ry="9" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.3"/>

  <!-- Ears -->
  <ellipse cx="91" cy="98" rx="5" ry="8" fill="#d8b890"/>
  <ellipse cx="165" cy="98" rx="5" ry="8" fill="#d8b890"/>
  <!-- Ear piercing -->
  <circle cx="90" cy="94" r="1.5" fill="#00ccff" opacity="0.6"/>

  <!-- Eyebrows - cocky, one raised -->
  <path d="M101,88 C105,85 112,84 120,86" fill="none" stroke="#0077aa" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M136,84 C143,82 150,84 155,88" fill="none" stroke="#0077aa" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Left eye - large shounen style -->
  <ellipse cx="112" cy="100" rx="12" ry="10" fill="#f0f0f8"/>
  <path d="M100,96 C104,90 112,88 124,96" fill="none" stroke="#0a0a1a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="112" cy="101" r="8" fill="url(#iris-l)"/>
  <circle cx="112" cy="101" r="4" fill="#0a0a0a"/>
  <circle cx="108" cy="97" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="116" cy="97" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="114" cy="105" r="1" fill="#00ccff" opacity="0.4"/>
  <path d="M102,106 C106,110 118,110 122,106" fill="none" stroke="#c8b090" stroke-width="0.8" opacity="0.5"/>

  <!-- Right eye -->
  <ellipse cx="144" cy="100" rx="12" ry="10" fill="#f0f0f8"/>
  <path d="M132,96 C136,90 144,88 156,96" fill="none" stroke="#0a0a1a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="144" cy="101" r="8" fill="url(#iris-r)"/>
  <circle cx="144" cy="101" r="4" fill="#0a0a0a"/>
  <circle cx="140" cy="97" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="148" cy="97" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="146" cy="105" r="1" fill="#00ccff" opacity="0.4"/>
  <path d="M134,106 C138,110 150,110 154,106" fill="none" stroke="#c8b090" stroke-width="0.8" opacity="0.5"/>

  <!-- Nose - small button -->
  <circle cx="128" cy="114" r="2" fill="#c8b090" opacity="0.5"/>

  <!-- Mouth - cocky grin -->
  <path d="M114,124 C118,130 128,133 138,130 C142,126 142,124 142,124" fill="none" stroke="#8a6848" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M118,126 C122,130 134,130 138,126" fill="#f0f0f0" opacity="0.35"/>
  <!-- Fang tooth -->
  <path d="M136,126 L138,129 L140,126" fill="#f0f0f0" opacity="0.4"/>

  <!-- Freckles -->
  <circle cx="104" cy="110" r="1" fill="#c8b090" opacity="0.3"/>
  <circle cx="108" cy="112" r="0.8" fill="#c8b090" opacity="0.25"/>
  <circle cx="148" cy="110" r="1" fill="#c8b090" opacity="0.3"/>
  <circle cx="152" cy="112" r="0.8" fill="#c8b090" opacity="0.25"/>

  <!-- Fingerless gloves with band-aids -->
  <path d="M55,182 C60,170 73,160 88,156" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.15"/>
  <path d="M201,182 C196,170 183,160 168,156" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.15"/>

  <!-- Holographic display floating near hand -->
  <rect x="178" y="190" width="36" height="24" rx="2" fill="#00ccff" opacity="0.05" filter="url(#glowSoft)"/>
  <line x1="182" y1="196" x2="208" y2="196" stroke="#00ccff" stroke-width="0.6" opacity="0.15"/>
  <line x1="182" y1="200" x2="200" y2="200" stroke="#00ccff" stroke-width="0.5" opacity="0.12"/>
  <line x1="182" y1="204" x2="204" y2="204" stroke="#00ccff" stroke-width="0.5" opacity="0.12"/>
  <rect x="178" y="190" width="36" height="24" rx="2" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.15"/>

  <!-- Ambient digital particles -->
  <circle cx="36" cy="195" r="1.2" fill="#00ccff" opacity="0.35"/>
  <circle cx="220" cy="175" r="1.5" fill="#00ccff" opacity="0.3"/>
  <circle cx="50" cy="308" r="1" fill="#00ddee" opacity="0.25"/>
  <circle cx="206" cy="298" r="1.2" fill="#00ccff" opacity="0.2"/>
  <circle cx="28" cy="258" r="0.8" fill="#00ccff" opacity="0.18"/>
  <circle cx="228" cy="252" r="0.7" fill="#00ddee" opacity="0.15"/>

  <!-- Expression label -->
  <text x="128" y="368" font-family="'Courier New', monospace" font-size="10" fill="#00ccff" text-anchor="middle" opacity="0.5">[default]</text>
</svg>