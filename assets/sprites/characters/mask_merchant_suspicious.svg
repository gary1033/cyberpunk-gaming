<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="ms_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#04040c"/>
    </linearGradient>
    <linearGradient id="ms_mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc3300"/>
      <stop offset="30%" stop-color="#882200"/>
      <stop offset="60%" stop-color="#dd4400"/>
      <stop offset="100%" stop-color="#993300"/>
    </linearGradient>
    <linearGradient id="ms_robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16162a"/>
      <stop offset="100%" stop-color="#0a0a16"/>
    </linearGradient>
    <radialGradient id="ms_glow" cx="0.5" cy="0.38" r="0.4">
      <stop offset="0%" stop-color="#cc3300" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#cc3300" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ms_mask_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#ms_bg)"/>
  <rect width="256" height="384" fill="url(#ms_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.3"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ffaa00" text-anchor="middle" filter="url(#glow)">面具商人</text>

  <!-- Body / dark merchant robe - pulled back, guarded posture -->
  <path d="M66,222 Q60,242 54,278 L50,315 H206 L202,278 Q196,242 190,222 Q178,204 168,194 L160,190 Q146,182 128,178 Q110,182 96,190 L88,194 Q76,204 66,222 Z" fill="url(#ms_robe)" stroke="#ffaa00" stroke-width="0.3" opacity="0.95"/>
  <!-- Hard shadow blocks - cel shading -->
  <path d="M66,222 Q60,242 54,278 L50,315 H100 L106,278 Q110,242 114,222 Q104,208 96,190 L88,194 Q76,204 66,222 Z" fill="#0c0c1a" opacity="0.65"/>
  <path d="M190,222 Q196,242 202,278 L206,315 H156 L150,278 Q146,242 142,222 Q152,208 160,190 L168,194 Q178,204 190,222 Z" fill="#0c0c1a" opacity="0.65"/>
  <!-- Robe fold lines -->
  <path d="M100,202 Q104,242 102,280 L100,312" fill="none" stroke="#ffaa00" stroke-width="0.25" opacity="0.18"/>
  <path d="M156,202 Q152,242 154,280 L156,312" fill="none" stroke="#ffaa00" stroke-width="0.25" opacity="0.18"/>

  <!-- Belt with merchandise - partially hidden -->
  <rect x="76" y="268" width="104" height="6" rx="2" fill="#1a1a30" stroke="#ffaa00" stroke-width="0.4" opacity="0.6"/>
  <rect x="86" y="263" width="7" height="12" rx="1" fill="#0a1520" stroke="#cc3300" stroke-width="0.5" opacity="0.5"/>
  <rect x="98" y="264" width="5" height="10" rx="1" fill="#0a1520" stroke="#882200" stroke-width="0.4" opacity="0.4"/>
  <rect x="160" y="262" width="5" height="13" rx="2" fill="#0a1520" stroke="#993300" stroke-width="0.4" opacity="0.4"/>
  <rect x="170" y="263" width="6" height="11" rx="1" fill="#0a1520" stroke="#cc3300" stroke-width="0.4" opacity="0.5"/>

  <!-- Arms crossed / guarded posture -->
  <path d="M72,248 Q80,258 92,266 Q104,272 116,274 L122,276 Q116,286 112,298 Q110,308 108,315 L76,315 Q72,300 70,278 Q69,262 72,248 Z" fill="#121228" stroke="#ffaa00" stroke-width="0.3" opacity="0.8"/>
  <path d="M184,248 Q176,258 164,266 Q152,272 140,274 L134,276 Q140,286 144,298 Q146,308 148,315 L180,315 Q184,300 186,278 Q187,262 184,248 Z" fill="#121228" stroke="#ffaa00" stroke-width="0.3" opacity="0.8"/>

  <!-- Robe collar - higher, more closed off -->
  <path d="M96,194 Q102,180 114,174 Q124,170 128,168 Q132,170 142,174 Q154,180 160,194 L156,202 Q144,192 128,186 Q112,192 100,202 Z" fill="#121228" stroke="#ffaa00" stroke-width="0.5" opacity="0.95"/>

  <!-- Hood - deeper shadows, head tilted -->
  <path d="M78,194 Q70,164 74,132 Q78,104 88,84 Q100,64 118,52 Q128,46 132,44 Q134,46 142,52 Q158,64 168,84 Q178,104 182,132 Q186,164 180,194 Q168,184 154,176 Q142,172 128,168 Q114,172 102,176 Q88,184 78,194 Z" fill="#0c0c24" stroke="#ffaa00" stroke-width="0.35" opacity="0.95"/>
  <!-- Hood inner shadow - deeper -->
  <path d="M88,188 Q84,162 88,132 Q92,108 100,92 Q110,76 124,66 Q130,62 132,60 Q134,62 140,66 Q152,76 162,92 Q170,108 174,132 Q178,162 174,188" fill="#060614" opacity="0.85"/>

  <!-- Holographic mask - darkened red/orange, face-shaped, head tilted slightly -->
  <g transform="rotate(-3, 128, 130)">
    <path d="M128,88 Q154,92 162,114 Q166,132 162,154 Q156,170 142,178 Q134,182 128,182 Q122,182 114,178 Q100,170 94,154 Q90,132 94,114 Q102,92 128,88 Z" fill="url(#ms_mask)" opacity="0.75" filter="url(#ms_mask_glow)"/>

    <!-- Geometric patterns - darker, more angular, threatening -->
    <!-- Hexagon top - distorted -->
    <polygon points="128,94 140,100 140,114 128,120 116,114 116,100" fill="none" stroke="#ff6644" stroke-width="0.7" opacity="0.35"/>
    <!-- Sharp triangles -->
    <polygon points="104,116 114,104 122,116" fill="none" stroke="#cc3300" stroke-width="0.6" opacity="0.3"/>
    <polygon points="134,104 144,116 154,104" fill="none" stroke="#cc3300" stroke-width="0.6" opacity="0.3"/>
    <!-- Lower hexagon -->
    <polygon points="128,136 136,141 136,151 128,156 120,151 120,141" fill="none" stroke="#882200" stroke-width="0.6" opacity="0.28"/>
    <!-- Warning triangles - pointing down -->
    <polygon points="104,136 112,128 118,136" fill="none" stroke="#993300" stroke-width="0.5" opacity="0.22"/>
    <polygon points="138,128 146,136 154,128" fill="none" stroke="#993300" stroke-width="0.5" opacity="0.22"/>

    <!-- Dark iridescent patches -->
    <ellipse cx="114" cy="110" rx="8" ry="6" fill="#882200" opacity="0.15"/>
    <ellipse cx="142" cy="110" rx="8" ry="6" fill="#cc3300" opacity="0.12"/>
    <ellipse cx="128" cy="148" rx="10" ry="7" fill="#993300" opacity="0.1"/>

    <!-- Eyes through mask slits - NARROWED, suspicious squint -->
    <!-- Left eye slit - narrow, angular -->
    <path d="M104,114 Q114,110 124,114 Q114,117 104,114 Z" fill="#0a0808" opacity="0.95"/>
    <ellipse cx="114" cy="114" rx="7" ry="2.5" fill="#1a0800" opacity="0.85"/>
    <ellipse cx="114" cy="114" rx="5" ry="2" fill="#cc3300" opacity="0.7"/>
    <ellipse cx="114" cy="114" rx="3" ry="1.5" fill="#ff4422" opacity="0.85"/>
    <circle cx="112" cy="113.5" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="116" cy="114.5" r="0.6" fill="#ffffff" opacity="0.5"/>
    <!-- Right eye slit - narrow, angular -->
    <path d="M132,114 Q142,110 152,114 Q142,117 132,114 Z" fill="#0a0808" opacity="0.95"/>
    <ellipse cx="142" cy="114" rx="7" ry="2.5" fill="#1a0800" opacity="0.85"/>
    <ellipse cx="142" cy="114" rx="5" ry="2" fill="#cc3300" opacity="0.7"/>
    <ellipse cx="142" cy="114" rx="3" ry="1.5" fill="#ff4422" opacity="0.85"/>
    <circle cx="140" cy="113.5" r="1.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="144" cy="114.5" r="0.6" fill="#ffffff" opacity="0.5"/>

    <!-- Heavy V-shaped brow lines - suspicious -->
    <path d="M104,108 Q112,106 124,110" fill="none" stroke="#ff4422" stroke-width="1.3" opacity="0.55"/>
    <path d="M132,110 Q144,106 152,108" fill="none" stroke="#ff4422" stroke-width="1.3" opacity="0.55"/>
    <!-- Inner brow furrow -->
    <path d="M123,108 L128,107 L133,108" fill="none" stroke="#cc3300" stroke-width="0.6" opacity="0.4"/>

    <!-- Flat disapproving mouth -->
    <path d="M118,160 L138,160" fill="none" stroke="#cc3300" stroke-width="0.7" opacity="0.4"/>
    <path d="M118,160 Q116,162 115,163" fill="none" stroke="#882200" stroke-width="0.4" opacity="0.3"/>
    <path d="M138,160 Q140,162 141,163" fill="none" stroke="#882200" stroke-width="0.4" opacity="0.3"/>
  </g>

  <!-- Stall / counter surface -->
  <rect x="20" y="313" width="216" height="6" rx="2" fill="#1a1a2e" stroke="#ffaa00" stroke-width="0.4" opacity="0.7"/>
  <rect x="14" y="317" width="228" height="62" rx="3" fill="#0e0e1e" stroke="#ffaa00" stroke-width="0.3" opacity="0.45"/>

  <!-- Merchandise on stall - fewer visible -->
  <rect x="30" y="322" width="16" height="14" rx="2" fill="#0a0a18" stroke="#882200" stroke-width="0.5" opacity="0.4"/>
  <rect x="54" y="324" width="12" height="12" rx="2" fill="#0a0a18" stroke="#993300" stroke-width="0.4" opacity="0.3"/>
  <rect x="188" y="322" width="14" height="14" rx="2" fill="#0a0a18" stroke="#882200" stroke-width="0.5" opacity="0.4"/>

  <!-- Floating holographic data - warning style -->
  <g opacity="0.4" filter="url(#glow)">
    <rect x="28" y="206" width="28" height="12" rx="2" fill="none" stroke="#cc3300" stroke-width="0.5"/>
    <text x="42" y="215" font-family="monospace" font-size="6" fill="#cc3300" text-anchor="middle">ALERT</text>
  </g>
  <g opacity="0.35" filter="url(#glow)">
    <rect x="200" y="196" width="30" height="12" rx="2" fill="none" stroke="#993300" stroke-width="0.5"/>
    <text x="215" y="205" font-family="monospace" font-size="5" fill="#993300" text-anchor="middle">SCAN...</text>
  </g>

  <!-- Fewer shimmer particles - dimmer, redder -->
  <circle cx="120" cy="92" r="0.8" fill="#cc3300" opacity="0.4"/>
  <circle cx="144" cy="100" r="0.6" fill="#882200" opacity="0.35"/>
  <circle cx="114" cy="152" r="0.9" fill="#993300" opacity="0.3"/>
  <circle cx="150" cy="136" r="0.5" fill="#cc3300" opacity="0.3"/>

  <!-- Ambient particles - fewer, dimmer, warning tones -->
  <circle cx="34" cy="82" r="1.2" fill="#ffaa00" opacity="0.2"/>
  <circle cx="222" cy="96" r="0.8" fill="#cc3300" opacity="0.15"/>
  <circle cx="42" cy="252" r="1" fill="#993300" opacity="0.15"/>
  <circle cx="214" cy="238" r="0.7" fill="#ffaa00" opacity="0.18"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>

  <!-- Expression label -->
  <text x="128" y="374" font-family="monospace" font-size="10" fill="#cc3300" text-anchor="middle" opacity="0.6">SUSPICIOUS</text>
</svg>