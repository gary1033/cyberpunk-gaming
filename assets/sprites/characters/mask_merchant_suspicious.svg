<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="ms_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="ms_mask_holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ddbb" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#880044"/>
      <stop offset="60%" stop-color="#00ddbb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#440088"/>
    </linearGradient>
    <linearGradient id="ms_robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <radialGradient id="ms_glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#00ddbb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ddbb" stop-opacity="0"/>
    </radialGradient>
    <filter id="ms_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ms_holo_glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#ms_bg)"/>
  <rect width="256" height="384" fill="url(#ms_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#00ddbb" stroke-width="1.5" opacity="0.35"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#00ddbb" text-anchor="middle" filter="url(#ms_neon)">面具商人</text>

  <!-- Stall / counter surface -->
  <rect x="20" y="305" width="216" height="8" rx="2" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.8"/>
  <rect x="15" y="311" width="226" height="68" rx="3" fill="#111122" stroke="#00ddbb" stroke-width="0.5" opacity="0.5"/>
  <rect x="30" y="318" width="18" height="14" rx="2" fill="#0d0d1a" stroke="#00ddbb" stroke-width="0.5" opacity="0.3"/>
  <rect x="55" y="320" width="14" height="12" rx="2" fill="#0d0d1a" stroke="#dd00ff" stroke-width="0.5" opacity="0.2"/>
  <rect x="185" y="318" width="16" height="14" rx="2" fill="#0d0d1a" stroke="#0088ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Body / dark robe - pulled back, guarded -->
  <path d="M74,218 Q70,230 65,274 L62,305 H194 L191,274 Q186,230 182,218 Q172,202 162,194 L156,190 Q142,184 128,182 Q114,184 100,190 L94,194 Q84,202 74,218 Z" fill="url(#ms_robe)" stroke="#00ddbb" stroke-width="0.5" opacity="0.9"/>
  <path d="M98,202 Q102,238 100,276 L99,302" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.3"/>
  <path d="M158,202 Q154,238 156,276 L157,302" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.3"/>

  <!-- Arms crossed / guarded posture -->
  <path d="M78,238 Q85,248 95,256 Q105,263 115,266 L120,268 Q115,276 110,288 Q107,298 106,305 L80,305 Q76,292 74,268 Q73,252 78,238 Z" fill="#151528" stroke="#00ddbb" stroke-width="0.4" opacity="0.8"/>
  <path d="M178,238 Q171,248 161,256 Q151,263 141,266 L136,268 Q141,276 146,288 Q149,298 150,305 L176,305 Q180,292 182,268 Q183,252 178,238 Z" fill="#151528" stroke="#00ddbb" stroke-width="0.4" opacity="0.8"/>

  <!-- Robe collar - higher, more closed off -->
  <path d="M100,194 Q104,182 114,176 Q122,172 128,171 Q134,172 142,176 Q152,182 156,194 L152,200 Q142,190 128,186 Q114,190 104,200 Z" fill="#151528" stroke="#00ddbb" stroke-width="0.8" opacity="0.9"/>

  <!-- Hood - pulled deeper, more shadowed -->
  <path d="M84,192 Q78,168 80,140 Q82,114 90,96 Q100,78 116,66 Q126,60 128,58 Q130,60 140,66 Q156,78 166,96 Q174,114 176,140 Q178,168 174,192 Q164,184 150,176 Q140,172 128,171 Q116,172 106,176 Q92,184 84,192 Z" fill="#10102a" stroke="#00ddbb" stroke-width="0.5" opacity="0.95"/>
  <path d="M92,186 Q88,164 90,138 Q92,114 100,98 Q108,84 120,76 Q126,72 128,70 Q130,72 136,76 Q148,84 156,98 Q164,114 166,138 Q168,164 166,186" fill="#08081a" opacity="0.8"/>

  <!-- Holographic mask - dimmer, anime oval -->
  <ellipse cx="128" cy="132" rx="28" ry="38" fill="url(#ms_mask_holo)" opacity="0.7" filter="url(#ms_holo_glow)"/>

  <!-- Mask surface details - muted lines -->
  <path d="M112,104 Q120,100 128,98 Q136,100 144,104" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>
  <path d="M110,120 Q118,116 128,114 Q138,116 146,120" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.25"/>
  <path d="M108,136 Q118,132 128,130 Q138,132 148,136" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- Mask eyes - narrow, suspicious squint, anime style -->
  <!-- Left eye - narrowed -->
  <ellipse cx="116" cy="118" rx="10" ry="4" fill="#0a1520" opacity="0.9"/>
  <ellipse cx="116" cy="118" rx="6" ry="3" fill="#00ddbb" opacity="0.6"/>
  <ellipse cx="116" cy="118" rx="4" ry="2.5" fill="#00ffee" opacity="0.7"/>
  <circle cx="114" cy="117" r="1.5" fill="#ffffff" opacity="0.8"/>
  <!-- Right eye - narrowed -->
  <ellipse cx="140" cy="118" rx="10" ry="4" fill="#0a1520" opacity="0.9"/>
  <ellipse cx="140" cy="118" rx="6" ry="3" fill="#00ddbb" opacity="0.6"/>
  <ellipse cx="140" cy="118" rx="4" ry="2.5" fill="#00ffee" opacity="0.7"/>
  <circle cx="138" cy="117" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Lowered heavy brow lines - suspicious V shape -->
  <path d="M104,113 Q112,111 124,114" fill="none" stroke="#00ddbb" stroke-width="1.4" opacity="0.6"/>
  <path d="M132,114 Q144,111 152,113" fill="none" stroke="#00ddbb" stroke-width="1.4" opacity="0.6"/>
  <!-- Inner brow furrow -->
  <path d="M124,112 L128,111 L132,112" fill="none" stroke="#00ddbb" stroke-width="0.6" opacity="0.4"/>

  <!-- Small nose -->
  <path d="M126,132 Q128,135 130,132" fill="none" stroke="#00ddbb" stroke-width="0.5" opacity="0.3"/>

  <!-- Mask mouth - flat disapproving line -->
  <path d="M119,148 L137,148" fill="none" stroke="#00ddbb" stroke-width="0.8" opacity="0.4"/>
  <path d="M119,148 Q118,150 117,151" fill="none" stroke="#00ddbb" stroke-width="0.5" opacity="0.3"/>
  <path d="M137,148 Q138,150 139,151" fill="none" stroke="#00ddbb" stroke-width="0.5" opacity="0.3"/>

  <!-- Fewer shimmer particles - dimmer -->
  <circle cx="118" cy="100" r="0.8" fill="#880044" opacity="0.5"/>
  <circle cx="140" cy="110" r="0.6" fill="#440088" opacity="0.4"/>
  <circle cx="115" cy="142" r="0.9" fill="#00ddbb" opacity="0.3"/>

  <!-- Ambient particles - fewer, dimmer -->
  <circle cx="35" cy="85" r="1.2" fill="#00ddbb" opacity="0.2"/>
  <circle cx="220" cy="100" r="0.8" fill="#00ddbb" opacity="0.15"/>
  <circle cx="45" cy="255" r="1" fill="#00ddbb" opacity="0.15"/>
  <circle cx="210" cy="240" r="0.7" fill="#00ddbb" opacity="0.2"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
</svg>