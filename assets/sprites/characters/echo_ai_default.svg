<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05051a"/>
      <stop offset="50%" stop-color="#0a0820"/>
      <stop offset="100%" stop-color="#05051a"/>
    </linearGradient>
    <!-- Core ambient glow -->
    <radialGradient id="core_aura" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#66eeff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#aa66ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Iris gradients -->
    <radialGradient id="iris_l" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ccffff"/>
      <stop offset="55%" stop-color="#00ddff"/>
      <stop offset="80%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#004466"/>
    </radialGradient>
    <radialGradient id="iris_r" cx="55%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#eeccff"/>
      <stop offset="55%" stop-color="#bb66ff"/>
      <stop offset="80%" stop-color="#7722cc"/>
      <stop offset="100%" stop-color="#330066"/>
    </radialGradient>
    <!-- Body translucent fill -->
    <linearGradient id="body_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaddff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#8866ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- Hair energy gradients -->
    <linearGradient id="hair_cyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00eeff" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#00ccff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#88eeff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hair_violet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cc66ff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#aa44ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dd99ff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="hair_white" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ddeeff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Shoulder/body glow gradient -->
    <linearGradient id="contour_glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00eeff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#aa66ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00eeff" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Circuit pattern color -->
    <linearGradient id="circuit_col" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow_strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow_soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eye_bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg)"/>
  <rect width="256" height="384" fill="url(#core_aura)"/>

  <!-- Subtle scan lines -->
  <line x1="0" y1="80" x2="256" y2="80" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="160" x2="256" y2="160" stroke="#aa44ff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="320" x2="256" y2="320" stroke="#aa44ff" stroke-width="0.3" opacity="0.05"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00eeff" text-anchor="middle" filter="url(#glow)">迴響</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">迴響</text>

  <!-- ====== BODY - translucent humanoid form ====== -->

  <!-- Torso silhouette fill -->
  <path d="M128,108 Q106,112 95,135 Q88,155 86,175 Q82,195 76,215 Q70,240 68,270 L66,310 Q64,345 68,384 L88,384 Q92,350 96,320 Q100,290 108,270 L128,265 L148,270 Q156,290 160,320 Q164,350 168,384 L188,384 Q192,345 190,310 L188,270 Q186,240 180,215 Q174,195 170,175 Q168,155 161,135 Q150,112 128,108 Z" fill="url(#body_fill)" opacity="0.5"/>

  <!-- Body contour lines - glowing outlines -->
  <!-- Left contour -->
  <path d="M128,108 Q106,112 95,135 Q88,155 86,175 Q82,195 76,215 Q70,240 68,270 L66,310 Q64,345 68,384" fill="none" stroke="#00eeff" stroke-width="1.5" opacity="0.5" filter="url(#glow)"/>
  <!-- Right contour -->
  <path d="M128,108 Q150,112 161,135 Q168,155 170,175 Q174,195 180,215 Q186,240 188,270 L190,310 Q192,345 188,384" fill="none" stroke="#aa66ff" stroke-width="1.5" opacity="0.5" filter="url(#glow)"/>
  <!-- Inner left leg -->
  <path d="M108,270 Q112,300 96,320 Q92,350 88,384" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.3"/>
  <!-- Inner right leg -->
  <path d="M148,270 Q144,300 160,320 Q164,350 168,384" fill="none" stroke="#9955ff" stroke-width="0.8" opacity="0.3"/>
  <!-- Center line -->
  <path d="M128,108 L128,265" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.15"/>

  <!-- Internal circuit patterns visible through translucent body -->
  <path d="M110,150 L118,150 L118,165 L128,165 L128,180 L138,180 L138,165 L146,165 L146,150" fill="none" stroke="url(#circuit_col)" stroke-width="0.8" opacity="0.35"/>
  <path d="M100,190 L112,190 L112,200 L128,200 L128,210 L144,210 L144,200 L156,200 L156,190" fill="none" stroke="url(#circuit_col)" stroke-width="0.7" opacity="0.25"/>
  <circle cx="128" cy="165" r="3" fill="none" stroke="#00eeff" stroke-width="0.6" opacity="0.3"/>
  <circle cx="128" cy="165" r="1" fill="#00eeff" opacity="0.4"/>
  <circle cx="128" cy="200" r="2.5" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.25"/>
  <circle cx="128" cy="200" r="0.8" fill="#aa44ff" opacity="0.35"/>
  <path d="M108,230 L120,225 L128,235 L136,225 L148,230" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.2"/>
  <path d="M96,260 L110,255 L128,260 L146,255 L160,260" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.15"/>

  <!-- ====== ARMS - data stream style ====== -->
  <!-- Left arm -->
  <path d="M95,135 Q80,142 68,158 Q56,178 48,200 Q44,218 46,236" fill="none" stroke="#00eeff" stroke-width="1.4" opacity="0.45" filter="url(#glow)"/>
  <path d="M95,138 Q82,146 72,162 Q62,182 54,204 Q50,220 52,238" fill="none" stroke="#aa66ff" stroke-width="0.9" opacity="0.3"/>
  <!-- Left hand dissolve -->
  <path d="M46,236 Q42,246 40,254" fill="none" stroke="#00eeff" stroke-width="1" opacity="0.3"/>
  <path d="M46,236 Q48,248 44,258" fill="none" stroke="#aa66ff" stroke-width="0.7" opacity="0.2"/>
  <circle cx="40" cy="256" r="1.5" fill="#00eeff" opacity="0.25"/>
  <circle cx="46" cy="260" r="1" fill="#aa66ff" opacity="0.2"/>

  <!-- Right arm -->
  <path d="M161,135 Q176,142 188,158 Q200,178 208,200 Q212,218 210,236" fill="none" stroke="#aa66ff" stroke-width="1.4" opacity="0.45" filter="url(#glow)"/>
  <path d="M161,138 Q174,146 184,162 Q194,182 202,204 Q206,220 204,238" fill="none" stroke="#00eeff" stroke-width="0.9" opacity="0.3"/>
  <!-- Right hand dissolve -->
  <path d="M210,236 Q214,246 216,254" fill="none" stroke="#aa66ff" stroke-width="1" opacity="0.3"/>
  <path d="M210,236 Q208,248 212,258" fill="none" stroke="#00eeff" stroke-width="0.7" opacity="0.2"/>
  <circle cx="216" cy="256" r="1.5" fill="#aa66ff" opacity="0.25"/>
  <circle cx="210" cy="260" r="1" fill="#00eeff" opacity="0.2"/>

  <!-- ====== NECK ====== -->
  <path d="M118,108 L118,96" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.4"/>
  <path d="M138,108 L138,96" fill="none" stroke="#aa55ff" stroke-width="1" opacity="0.4"/>

  <!-- ====== HEAD - anime proportions ====== -->

  <!-- Head shape - V-chin, large cranium, androgynous -->
  <path d="M100,72 Q98,56 104,44 Q112,34 128,32 Q144,34 152,44 Q158,56 156,72 Q155,80 152,86 Q146,94 138,98 Q132,100 128,100 Q124,100 118,98 Q110,94 104,86 Q101,80 100,72 Z" fill="url(#body_fill)" opacity="0.6"/>
  <!-- Head contour glow -->
  <path d="M100,72 Q98,56 104,44 Q112,34 128,32 Q144,34 152,44 Q158,56 156,72 Q155,80 152,86 Q146,94 138,98 Q132,100 128,100 Q124,100 118,98 Q110,94 104,86 Q101,80 100,72 Z" fill="none" stroke="#00ddff" stroke-width="1.2" opacity="0.45" filter="url(#glow_soft)"/>

  <!-- ====== HAIR - flowing energy streams upward ====== -->
  <!-- Main flowing strands going UP and outward -->
  <path d="M128,34 Q128,20 126,8 Q124,0 120,-8" fill="none" stroke="url(#hair_white)" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
  <path d="M124,36 Q118,22 110,12 Q104,4 96,-4" fill="none" stroke="url(#hair_cyan)" stroke-width="2.5" opacity="0.55" filter="url(#glow)"/>
  <path d="M132,36 Q138,22 146,12 Q152,4 160,-4" fill="none" stroke="url(#hair_violet)" stroke-width="2.5" opacity="0.55" filter="url(#glow)"/>
  <path d="M118,40 Q108,28 98,20 Q88,14 78,10" fill="none" stroke="url(#hair_cyan)" stroke-width="2" opacity="0.45" filter="url(#glow_soft)"/>
  <path d="M138,40 Q148,28 158,20 Q168,14 178,10" fill="none" stroke="url(#hair_violet)" stroke-width="2" opacity="0.45" filter="url(#glow_soft)"/>
  <path d="M112,44 Q100,34 88,28 Q76,24 66,22" fill="none" stroke="url(#hair_white)" stroke-width="1.5" opacity="0.35"/>
  <path d="M144,44 Q156,34 168,28 Q180,24 190,22" fill="none" stroke="url(#hair_white)" stroke-width="1.5" opacity="0.35"/>
  <!-- Side wisps flowing down slightly then curving up -->
  <path d="M100,60 Q92,54 84,44 Q78,36 72,32" fill="none" stroke="url(#hair_cyan)" stroke-width="1.8" opacity="0.4" filter="url(#glow_soft)"/>
  <path d="M156,60 Q164,54 172,44 Q178,36 184,32" fill="none" stroke="url(#hair_violet)" stroke-width="1.8" opacity="0.4" filter="url(#glow_soft)"/>
  <!-- Wispy floating strands -->
  <path d="M128,32 Q130,16 136,4" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3"/>
  <path d="M120,38 Q112,18 106,6" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.25"/>
  <path d="M136,38 Q144,18 150,6" fill="none" stroke="#bb77ff" stroke-width="1" opacity="0.25"/>

  <!-- ====== FACE ====== -->

  <!-- Subtle face guide lines -->
  <path d="M108,84 Q118,80 128,79 Q138,80 148,84" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>

  <!-- ====== EYES - large, glowing, shounen style ====== -->

  <!-- LEFT EYE -->
  <!-- Outer glow -->
  <ellipse cx="115" cy="70" rx="13" ry="10" fill="#00ddff" opacity="0.08" filter="url(#glow_strong)"/>
  <!-- Eye white area -->
  <ellipse cx="115" cy="70" rx="11" ry="8.5" fill="#0a1525" opacity="0.7"/>
  <!-- Iris -->
  <ellipse cx="115" cy="71" rx="8" ry="7.5" fill="url(#iris_l)" filter="url(#eye_bloom)"/>
  <!-- Pupil -->
  <ellipse cx="115" cy="71" rx="3.5" ry="4" fill="#001122"/>
  <!-- Highlights - multiple bright spots (shounen style) -->
  <circle cx="112" cy="67" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="118" cy="74" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="113" cy="73" r="0.8" fill="#aaeeff" opacity="0.5"/>
  <!-- THICK upper eyelid - glowing color -->
  <path d="M103,66 Q108,60 115,58 Q122,60 127,66" fill="none" stroke="#00ddff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" filter="url(#glow_soft)"/>
  <!-- Lower eyelid subtle -->
  <path d="M105,75 Q110,79 115,80 Q120,79 125,75" fill="none" stroke="#00aacc" stroke-width="1" opacity="0.4"/>
  <!-- Eye glow rings -->
  <ellipse cx="115" cy="70" rx="14" ry="11" fill="none" stroke="#00ddff" stroke-width="0.5" opacity="0.2"/>

  <!-- RIGHT EYE -->
  <!-- Outer glow -->
  <ellipse cx="141" cy="70" rx="13" ry="10" fill="#aa55ff" opacity="0.08" filter="url(#glow_strong)"/>
  <!-- Eye white area -->
  <ellipse cx="141" cy="70" rx="11" ry="8.5" fill="#0a1525" opacity="0.7"/>
  <!-- Iris -->
  <ellipse cx="141" cy="71" rx="8" ry="7.5" fill="url(#iris_r)" filter="url(#eye_bloom)"/>
  <!-- Pupil -->
  <ellipse cx="141" cy="71" rx="3.5" ry="4" fill="#110022"/>
  <!-- Highlights -->
  <circle cx="138" cy="67" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="144" cy="74" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="139" cy="73" r="0.8" fill="#ddbbff" opacity="0.5"/>
  <!-- THICK upper eyelid - glowing violet -->
  <path d="M129,66 Q134,60 141,58 Q148,60 153,66" fill="none" stroke="#aa55ff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" filter="url(#glow_soft)"/>
  <!-- Lower eyelid -->
  <path d="M131,75 Q136,79 141,80 Q146,79 151,75" fill="none" stroke="#8833cc" stroke-width="1" opacity="0.4"/>
  <!-- Eye glow rings -->
  <ellipse cx="141" cy="70" rx="14" ry="11" fill="none" stroke="#aa55ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Nose - subtle glowing line -->
  <path d="M128,78 Q127,84 128,88 Q129,89 130,88" fill="none" stroke="#88ccff" stroke-width="0.7" opacity="0.25"/>

  <!-- Mouth - subtle, gentle expression with mix of wisdom and sadness -->
  <path d="M120,93 Q124,95 128,95.5 Q132,95 136,93" fill="none" stroke="#88aadd" stroke-width="0.9" opacity="0.3"/>
  <!-- Slight shadow under lips -->
  <path d="M122,96 Q128,97.5 134,96" fill="none" stroke="#6688bb" stroke-width="0.5" opacity="0.15"/>

  <!-- Eyebrows - subtle glowing arcs -->
  <path d="M104,56 Q110,52 118,54" fill="none" stroke="#00ccee" stroke-width="1.2" opacity="0.35"/>
  <path d="M138,54 Q146,52 152,56" fill="none" stroke="#9944ee" stroke-width="1.2" opacity="0.35"/>

  <!-- ====== FLOATING DATA FRAGMENTS ====== -->

  <!-- Binary/hex text fragments -->
  <text x="22" y="68" font-family="monospace" font-size="5.5" fill="#00ccff" opacity="0.18">01101</text>
  <text x="210" y="78" font-family="monospace" font-size="5.5" fill="#aa55ff" opacity="0.16">10110</text>
  <text x="18" y="180" font-family="monospace" font-size="5" fill="#00eeff" opacity="0.12">FF3A</text>
  <text x="210" y="200" font-family="monospace" font-size="5" fill="#bb66ff" opacity="0.12">C7E2</text>
  <text x="30" y="290" font-family="monospace" font-size="5" fill="#00ddff" opacity="0.09">A0B1</text>
  <text x="200" y="310" font-family="monospace" font-size="5" fill="#9944ff" opacity="0.09">D4F8</text>
  <text x="40" y="350" font-family="monospace" font-size="4.5" fill="#ffffff" opacity="0.07">2E9C</text>
  <text x="190" y="360" font-family="monospace" font-size="4.5" fill="#00ccff" opacity="0.07">7B3D</text>

  <!-- ====== FLOATING PARTICLES ====== -->

  <!-- Cyan particles -->
  <circle cx="32" cy="50" r="2" fill="#00eeff" opacity="0.5" filter="url(#glow_soft)"/>
  <circle cx="224" cy="62" r="1.8" fill="#00eeff" opacity="0.45" filter="url(#glow_soft)"/>
  <circle cx="42" cy="140" r="1.5" fill="#00ddff" opacity="0.35"/>
  <circle cx="218" cy="155" r="1.3" fill="#00ddff" opacity="0.3"/>
  <circle cx="28" cy="240" r="1.6" fill="#00eeff" opacity="0.3"/>
  <circle cx="232" cy="270" r="1.4" fill="#00ccff" opacity="0.25"/>
  <circle cx="55" cy="310" r="1.2" fill="#00eeff" opacity="0.25"/>
  <circle cx="196" cy="340" r="1" fill="#00ddff" opacity="0.2"/>

  <!-- Violet particles -->
  <circle cx="48" cy="90" r="1.6" fill="#aa55ff" opacity="0.45" filter="url(#glow_soft)"/>
  <circle cx="208" cy="110" r="1.8" fill="#bb66ff" opacity="0.4" filter="url(#glow_soft)"/>
  <circle cx="38" cy="195" r="1.3" fill="#9944ff" opacity="0.3"/>
  <circle cx="220" cy="220" r="1.5" fill="#aa55ff" opacity="0.3"/>
  <circle cx="52" cy="270" r="1.1" fill="#bb66ff" opacity="0.25"/>
  <circle cx="200" cy="290" r="1.4" fill="#9944ff" opacity="0.25"/>
  <circle cx="175" cy="355" r="1.2" fill="#aa55ff" opacity="0.2"/>

  <!-- White particles -->
  <circle cx="128" cy="18" r="2.2" fill="#ffffff" opacity="0.5" filter="url(#glow_soft)"/>
  <circle cx="60" cy="160" r="1.3" fill="#ffffff" opacity="0.3"/>
  <circle cx="198" cy="175" r="1.1" fill="#ffffff" opacity="0.25"/>
  <circle cx="80" cy="330" r="1" fill="#ffffff" opacity="0.2"/>
  <circle cx="240" cy="345" r="0.9" fill="#ffffff" opacity="0.2"/>
  <circle cx="15" cy="320" r="1.2" fill="#eeddff" opacity="0.2"/>

  <!-- Diamond-shaped particles -->
  <rect x="236" y="42" width="3" height="3" fill="#00eeff" opacity="0.35" transform="rotate(45,237.5,43.5)"/>
  <rect x="16" y="130" width="2.5" height="2.5" fill="#aa55ff" opacity="0.3" transform="rotate(45,17.25,131.25)"/>
  <rect x="238" y="180" width="2" height="2" fill="#ffffff" opacity="0.2" transform="rotate(45,239,181)"/>
  <rect x="20" y="360" width="2.5" height="2.5" fill="#00ddff" opacity="0.2" transform="rotate(45,21.25,361.25)"/>
  <rect x="225" y="330" width="2" height="2" fill="#bb66ff" opacity="0.2" transform="rotate(45,226,331)"/>

  <!-- ====== DIGITAL GLITCH ARTIFACTS ====== -->
  <!-- Small horizontal offset rectangles -->
  <rect x="95" y="125" width="18" height="1.5" fill="#00eeff" opacity="0.08" rx="0.5"/>
  <rect x="142" y="148" width="14" height="1" fill="#aa55ff" opacity="0.07" rx="0.5"/>
  <rect x="88" y="210" width="22" height="1.5" fill="#00ddff" opacity="0.06" rx="0.5"/>
  <rect x="148" y="240" width="16" height="1" fill="#bb66ff" opacity="0.05" rx="0.5"/>
  <rect x="105" y="295" width="20" height="1" fill="#00eeff" opacity="0.04" rx="0.5"/>

  <!-- Particle connection lines -->
  <line x1="32" y1="50" x2="48" y2="90" stroke="#00ccff" stroke-width="0.2" opacity="0.1"/>
  <line x1="224" y1="62" x2="208" y2="110" stroke="#aa55ff" stroke-width="0.2" opacity="0.08"/>
  <line x1="42" y1="140" x2="38" y2="195" stroke="#00ddff" stroke-width="0.15" opacity="0.06"/>
  <line x1="218" y1="155" x2="220" y2="220" stroke="#bb66ff" stroke-width="0.15" opacity="0.06"/>

  <!-- ====== SHOULDER ACCENT GLOW ====== -->
  <circle cx="90" cy="130" r="4" fill="#00eeff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="166" cy="130" r="4" fill="#aa55ff" opacity="0.12" filter="url(#glow)"/>

  <!-- Expression label -->
  <text x="128" y="376" font-family="'Courier New', monospace" font-size="10" fill="#667799" text-anchor="middle" opacity="0.6">[default]</text>
</svg>