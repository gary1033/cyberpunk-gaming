<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gc-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#120a20"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="gc-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1238"/>
      <stop offset="40%" stop-color="#140c26"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <linearGradient id="gc-cloak-sheen" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.05"/>
      <stop offset="40%" stop-color="#aa44ff" stop-opacity="0.02"/>
      <stop offset="70%" stop-color="#7722cc" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="gc-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bb88dd"/>
      <stop offset="35%" stop-color="#7733aa"/>
      <stop offset="70%" stop-color="#553388"/>
      <stop offset="100%" stop-color="#553388" stop-opacity="0"/>
    </radialGradient>
    <filter id="gc-glow-dim">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gc-glow-soft">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gc-glow-title">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="gc-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gc-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gc-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#gc-glow-title)">幽靈</text>

  <!-- Cloak body - pulled back, tighter, retreating posture, shifted right slightly -->
  <path d="M65,155 C65,135 80,115 98,108 L108,102 C116,97 125,94 133,92 C140,94 148,97 156,102 L165,108 C182,115 196,135 196,155 L202,250 C204,300 198,348 192,370 L68,370 C62,348 56,300 58,250 Z" fill="url(#gc-cloak)"/>
  <path d="M65,155 C65,135 80,115 98,108 L108,102 C116,97 125,94 133,92 C140,94 148,97 156,102 L165,108 C182,115 196,135 196,155 L202,250 C204,300 198,348 192,370 L68,370 C62,348 56,300 58,250 Z" fill="url(#gc-cloak-sheen)"/>

  <!-- Cloak edge highlights - very subdued -->
  <path d="M65,155 C65,135 80,115 98,108 L108,102" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>
  <path d="M196,155 C196,135 182,115 165,108 L156,102" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>
  <path d="M58,250 L68,370" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>
  <path d="M202,250 L192,370" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>

  <!-- Hood shape - pulled very tight, hunched forward -->
  <path d="M86,152 C86,110 94,82 107,70 C115,62 126,58 133,56 C140,58 149,62 158,70 C170,82 178,110 178,152 C178,164 170,175 157,179 L133,183 L110,179 C97,175 86,164 86,152 Z" fill="#140c26"/>

  <!-- Hood outer edge - very dim -->
  <path d="M86,152 C86,110 94,82 107,70 C115,62 126,58 133,56 C140,58 149,62 158,70 C170,82 178,110 178,152" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.22"/>

  <!-- Hood inner shadow - very deep -->
  <path d="M95,148 C95,118 100,92 112,82 C118,76 126,72 133,70 C140,72 148,76 154,82 C166,92 171,118 171,148 C171,158 165,167 155,171 L133,174 L112,171 C101,167 95,158 95,148 Z" fill="#080410"/>

  <!-- Deep shadow inside hood -->
  <ellipse cx="133" cy="138" rx="28" ry="24" fill="#040208"/>

  <!-- Glowing eyes - dimmer, narrower, wary squint -->
  <ellipse cx="120" cy="136" rx="4.5" ry="2.2" fill="url(#gc-eye-glow)" filter="url(#gc-glow-dim)"/>
  <ellipse cx="120" cy="136" rx="2" ry="1.2" fill="#bb88dd"/>

  <ellipse cx="146" cy="136" rx="4.5" ry="2.2" fill="url(#gc-eye-glow)" filter="url(#gc-glow-dim)"/>
  <ellipse cx="146" cy="136" rx="2" ry="1.2" fill="#bb88dd"/>

  <!-- Very faint ambient eye glow -->
  <ellipse cx="133" cy="136" rx="20" ry="12" fill="#aa44ff" opacity="0.02" filter="url(#gc-glow-soft)"/>

  <!-- Shoulders hunched inward - guarded, pulled back -->
  <path d="M80,178 C84,168 96,163 110,165" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.18"/>
  <path d="M182,178 C178,168 166,163 152,165" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.18"/>

  <!-- Arms drawn in close - protective stance -->
  <path d="M82,195 C84,218 87,245 90,275" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>
  <path d="M180,195 C178,218 175,245 172,275" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>

  <!-- Hands clasped tight -->
  <path d="M90,275 C92,280 96,284 102,282" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.12"/>
  <path d="M172,275 C170,280 166,284 160,282" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.12"/>

  <!-- Cloak fold lines - tight, compressed -->
  <path d="M105,210 C108,250 106,290 104,340" fill="none" stroke="#aa44ff" stroke-width="0.35" opacity="0.1"/>
  <path d="M133,183 C133,230 134,285 133,345" fill="none" stroke="#aa44ff" stroke-width="0.3" opacity="0.07"/>
  <path d="M160,210 C157,250 159,290 161,340" fill="none" stroke="#aa44ff" stroke-width="0.35" opacity="0.1"/>

  <!-- Inner fold details -->
  <path d="M120,205 C121,245 119,295 118,345" fill="none" stroke="#7722cc" stroke-width="0.25" opacity="0.06"/>
  <path d="M148,205 C147,245 149,295 150,345" fill="none" stroke="#7722cc" stroke-width="0.25" opacity="0.06"/>

  <!-- Very subtle reflective patches -->
  <ellipse cx="90" cy="260" rx="8" ry="20" fill="#aa44ff" opacity="0.02" transform="rotate(-6,90,260)"/>
  <ellipse cx="174" cy="240" rx="7" ry="18" fill="#aa44ff" opacity="0.02" transform="rotate(5,174,240)"/>

  <!-- Voice distortion - barely visible, whispering -->
  <line x1="126" y1="150" x2="140" y2="150" stroke="#aa44ff" stroke-width="0.25" opacity="0.1"/>
  <line x1="129" y1="153" x2="137" y2="153" stroke="#aa44ff" stroke-width="0.2" opacity="0.07"/>

  <!-- Sparse ambient particles -->
  <circle cx="55" cy="220" r="0.6" fill="#aa44ff" opacity="0.18"/>
  <circle cx="200" cy="200" r="0.7" fill="#7722cc" opacity="0.15"/>
  <circle cx="72" cy="320" r="0.5" fill="#7722cc" opacity="0.2"/>
  <circle cx="188" cy="330" r="0.4" fill="#aa44ff" opacity="0.12"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[cautious]</text>
</svg>