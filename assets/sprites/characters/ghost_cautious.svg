<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gc-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#120a20"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="gc-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1238"/>
      <stop offset="40%" stop-color="#140c26"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <radialGradient id="gc-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bb88dd"/>
      <stop offset="35%" stop-color="#7733aa"/>
      <stop offset="70%" stop-color="#553388"/>
      <stop offset="100%" stop-color="#553388" stop-opacity="0"/>
    </radialGradient>
    <filter id="gc-glow-dim">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gc-glow-soft">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gc-glow-title">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gc-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gc-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gc-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#gc-glow-title)">幽靈</text>

  <!-- Cloak body - pulled back, retreating posture, shifted right -->
  <path d="M62,168 C62,148 78,125 98,115 L110,108 C118,103 126,100 133,98 C140,100 148,103 156,108 L166,115 C186,125 200,148 200,168 L206,260 C208,308 202,355 196,375 L64,375 C58,355 52,308 54,260 Z" fill="url(#gc-cloak)"/>
  <path d="M62,168 C62,148 78,125 98,115 L110,108 C118,103 126,100 133,98 C140,100 148,103 156,108 L166,115 C186,125 200,148 200,168 L206,260 C208,308 202,355 196,375 L64,375 C58,355 52,308 54,260 Z" fill="#aa44ff" opacity="0.03"/>

  <!-- Cloak edge highlights - very subdued -->
  <path d="M62,168 C62,148 78,125 98,115 L110,108" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>
  <path d="M200,168 C200,148 186,125 166,115 L156,108" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>

  <!-- Hood shape - pulled tight, hunched -->
  <path d="M82,162 C82,108 92,76 108,62 C118,52 128,48 133,46 C138,48 148,52 158,62 C174,76 184,108 184,162 C184,178 174,190 160,194 L133,198 L106,194 C92,190 82,178 82,162 Z" fill="#140c26"/>

  <!-- Hood outer edge - very dim -->
  <path d="M82,162 C82,108 92,76 108,62 C118,52 128,48 133,46 C138,48 148,52 158,62 C174,76 184,108 184,162" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.22"/>

  <!-- Hood inner shadow -->
  <path d="M92,158 C92,118 98,90 112,78 C120,70 128,66 133,64 C138,66 146,70 154,78 C168,90 174,118 174,158 C174,170 166,180 154,184 L133,188 L112,184 C100,180 92,170 92,158 Z" fill="#080410"/>

  <!-- Deep shadow inside hood -->
  <ellipse cx="133" cy="144" rx="32" ry="28" fill="#040208"/>

  <!-- Glowing eyes - dimmer, narrower, wary squint -->
  <ellipse cx="118" cy="142" rx="6" ry="3" fill="url(#gc-eye-glow)" filter="url(#gc-glow-dim)"/>
  <ellipse cx="118" cy="142" rx="3" ry="1.8" fill="#bb88dd"/>
  <!-- Small highlight -->
  <circle cx="117" cy="141" r="1" fill="#ffffff" opacity="0.5"/>

  <ellipse cx="148" cy="142" rx="6" ry="3" fill="url(#gc-eye-glow)" filter="url(#gc-glow-dim)"/>
  <ellipse cx="148" cy="142" rx="3" ry="1.8" fill="#bb88dd"/>
  <circle cx="147" cy="141" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Very faint ambient eye glow -->
  <ellipse cx="133" cy="142" rx="24" ry="14" fill="#aa44ff" opacity="0.02" filter="url(#gc-glow-soft)"/>

  <!-- Shoulders hunched inward -->
  <path d="M76,192 C80,182 94,176 110,178" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.18"/>
  <path d="M188,192 C184,182 170,176 154,178" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.18"/>

  <!-- Arms drawn in close -->
  <path d="M78,208 C80,232 84,258 86,288" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>
  <path d="M184,208 C182,232 178,258 176,288" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>

  <!-- Cloak fold lines -->
  <path d="M102,225 C106,265 104,305 102,355" fill="none" stroke="#aa44ff" stroke-width="0.35" opacity="0.1"/>
  <path d="M133,198 C133,242 134,298 133,358" fill="none" stroke="#aa44ff" stroke-width="0.3" opacity="0.07"/>
  <path d="M162,225 C158,265 160,305 162,355" fill="none" stroke="#aa44ff" stroke-width="0.35" opacity="0.1"/>

  <!-- Subtle reflective patches -->
  <ellipse cx="86" cy="270" rx="8" ry="20" fill="#aa44ff" opacity="0.02" transform="rotate(-6,86,270)"/>
  <ellipse cx="178" cy="250" rx="7" ry="18" fill="#aa44ff" opacity="0.02" transform="rotate(5,178,250)"/>

  <!-- Sparse ambient particles -->
  <circle cx="50" cy="230" r="0.6" fill="#aa44ff" opacity="0.18"/>
  <circle cx="205" cy="210" r="0.7" fill="#7722cc" opacity="0.15"/>
  <circle cx="68" cy="330" r="0.5" fill="#7722cc" opacity="0.2"/>
  <circle cx="192" cy="340" r="0.4" fill="#aa44ff" opacity="0.12"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[cautious]</text>
</svg>