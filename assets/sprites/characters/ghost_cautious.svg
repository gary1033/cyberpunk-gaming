<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gc-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#120a20"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gc-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bb88dd"/>
      <stop offset="35%" stop-color="#7733aa"/>
      <stop offset="70%" stop-color="#553388"/>
      <stop offset="100%" stop-color="#553388" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gc-glow-dim" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gc-glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gc-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gc-cloak-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1238"/>
      <stop offset="50%" stop-color="#140c26"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <linearGradient id="gc-holo-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44ddcc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#44ddcc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8833cc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background - darker, more withdrawn -->
  <rect width="256" height="384" fill="url(#gc-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gc-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#glow)">幽靈</text>

  <!-- Cloak body - narrower, pulled in, withdrawn posture, slightly off-center -->
  <path d="M55,178 L72,140 L92,120 L112,108 L133,100 L152,108 L170,120 L188,140 L205,178 L210,268 C212,310 206,352 200,375 L60,375 C54,352 48,310 50,268 Z" fill="url(#gc-cloak-main)"/>

  <!-- Cel-shaded cloak shadow blocks - tight -->
  <path d="M55,178 L72,140 L92,120 L112,108 L116,130 L82,158 L66,208 L56,268 L56,375 L60,375 C54,352 48,310 50,268 Z" fill="#080410" opacity="0.6"/>
  <path d="M205,178 L188,140 L170,120 L152,108 L148,130 L178,158 L194,208 L204,268 L204,375 L200,375 C206,352 212,310 210,268 Z" fill="#100a20" opacity="0.35"/>

  <!-- Very subtle holographic shimmer -->
  <path d="M75,210 L90,195 L100,230 L82,255 Z" fill="url(#gc-holo-1)"/>
  <path d="M168,220 L182,205 L188,248 L172,260 Z" fill="#5566ff" opacity="0.03"/>

  <!-- Cloak edge highlights - very subdued -->
  <path d="M55,178 L72,140 L92,120 L112,108" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.22"/>
  <path d="M205,178 L188,140 L170,120 L152,108" fill="none" stroke="#aa44ff" stroke-width="0.7" opacity="0.22"/>

  <!-- Angular fold lines - tighter -->
  <path d="M86,200 L83,252 L90,310 L86,365" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>
  <path d="M133,172 L133,250 L134,340" fill="none" stroke="#aa44ff" stroke-width="0.3" opacity="0.07"/>
  <path d="M176,200 L179,252 L172,310 L176,365" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>

  <!-- Hood shape - pulled tight, hunched close, slightly off-center -->
  <path d="M78,168 L86,110 L96,82 L110,62 L124,48 L133,44 L142,48 L156,62 L168,82 L178,110 L186,168 L180,192 L158,200 L133,204 L108,200 L84,192 Z" fill="#140c26"/>

  <!-- Hood cel-shade shadow - tighter -->
  <path d="M78,168 L86,110 L96,82 L110,62 L124,48 L133,44 L126,58 L114,76 L100,100 L92,148 L86,186 L84,192 Z" fill="#080410" opacity="0.5"/>

  <!-- Hood outer edge - dim -->
  <path d="M78,168 L86,110 L96,82 L110,62 L124,48 L133,44 L142,48 L156,62 L168,82 L178,110 L186,168" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.22"/>

  <!-- Hood inner shadow -->
  <path d="M90,164 L96,118 L106,94 L116,76 L128,64 L133,60 L138,64 L150,76 L160,94 L170,118 L176,164 L170,184 L156,190 L133,194 L110,190 L94,184 Z" fill="#080410"/>

  <!-- Deep void inside hood -->
  <ellipse cx="133" cy="144" rx="34" ry="30" fill="#040208"/>

  <!-- Glowing eye slits - dimmer, narrower, wary squint -->
  <rect x="110" y="140" width="14" height="4" rx="2" fill="url(#gc-eye-glow)" filter="url(#gc-glow-dim)"/>
  <rect x="112" y="140.5" width="10" height="3" rx="1.5" fill="#7733aa" opacity="0.8"/>
  <rect x="114" y="141" width="6" height="2" rx="1" fill="#bb88dd" opacity="0.7"/>
  <!-- Tiny highlight -->
  <circle cx="115" cy="141.5" r="1" fill="#ffffff" opacity="0.5"/>

  <rect x="140" y="140" width="14" height="4" rx="2" fill="url(#gc-eye-glow)" filter="url(#gc-glow-dim)"/>
  <rect x="142" y="140.5" width="10" height="3" rx="1.5" fill="#7733aa" opacity="0.8"/>
  <rect x="144" y="141" width="6" height="2" rx="1" fill="#bb88dd" opacity="0.7"/>
  <circle cx="145" cy="141.5" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Very faint ambient eye glow -->
  <ellipse cx="133" cy="142" rx="26" ry="14" fill="#aa44ff" opacity="0.03" filter="url(#gc-glow-soft)"/>

  <!-- Shoulders hunched inward - angular -->
  <path d="M66,196 L78,184 L98,178 L112,176" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.18"/>
  <path d="M198,196 L186,184 L166,178 L152,176" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.18"/>

  <!-- Arms drawn in close - subtle fold -->
  <path d="M72,210 L76,240 L80,275 L82,305" fill="none" stroke="#aa44ff" stroke-width="0.35" opacity="0.08"/>
  <path d="M192,210 L188,240 L184,275 L182,305" fill="none" stroke="#aa44ff" stroke-width="0.35" opacity="0.08"/>

  <!-- Digital glitch artifacts - sparse, muted -->
  <rect x="60" y="235" width="6" height="1.5" fill="#aa44ff" opacity="0.15"/>
  <rect x="185" y="260" width="8" height="1" fill="#553388" opacity="0.12"/>
  <rect x="74" y="330" width="5" height="1" fill="#7722cc" opacity="0.1"/>

  <!-- Sparse ambient particles -->
  <circle cx="48" cy="232" r="0.6" fill="#aa44ff" opacity="0.18"/>
  <circle cx="208" cy="215" r="0.7" fill="#7722cc" opacity="0.15"/>
  <circle cx="64" cy="335" r="0.5" fill="#7722cc" opacity="0.2"/>
  <circle cx="196" cy="345" r="0.4" fill="#aa44ff" opacity="0.12"/>

  <!-- State label -->
  <text x="128" y="370" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[cautious]</text>
</svg>