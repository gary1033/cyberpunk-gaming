<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeL">
      <path d="M90,152 Q100,140 110,139 Q120,140 126,152 Q120,160 110,161 Q100,160 90,152 Z"/>
    </clipPath>
    <clipPath id="eyeR">
      <path d="M130,152 Q140,140 150,139 Q160,140 166,152 Q160,160 150,161 Q140,160 130,152 Z"/>
    </clipPath>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="256" height="384" fill="#08081a"/>
  <rect x="0" y="0" width="256" height="384" fill="#0a0a20" opacity="0.8"/>
  <!-- Subtle vignette -->
  <ellipse cx="128" cy="180" rx="140" ry="200" fill="#10102a" opacity="0.5"/>

  <!-- Neon border frame -->
  <rect x="4" y="4" width="248" height="376" rx="3" fill="none" stroke="#00e5e5" stroke-width="1.2" opacity="0.25"/>

  <!-- Name label -->
  <text x="128" y="26" font-family="monospace" font-size="18" fill="#00e5e5" text-anchor="middle" filter="url(#glow)" opacity="0.85">凱</text>

  <!-- === COAT === -->
  <!-- Main coat shape -->
  <path d="M52,280 Q60,255 82,240 L100,232 Q115,226 128,224 Q141,226 156,232 L174,240 Q196,255 204,280 L212,384 L44,384 Z" fill="#12122a"/>
  <!-- Coat outline (thick outer contour - JJK style) -->
  <path d="M52,280 Q60,255 82,240 L100,232 Q115,226 128,224 Q141,226 156,232 L174,240 Q196,255 204,280" fill="none" stroke="#0a0a18" stroke-width="2.5"/>
  <!-- Coat cel-shadow (hard edge, cold-shifted) -->
  <path d="M52,280 Q60,255 82,240 L100,232 Q112,227 122,225 L122,384 L44,384 Z" fill="#08081e" opacity="0.7"/>
  <!-- Collar left -->
  <path d="M90,238 L74,264 L106,252 L116,234 Z" fill="#1a1a38"/>
  <!-- Collar right -->
  <path d="M166,238 L182,264 L150,252 L140,234 Z" fill="#1e1e3c"/>
  <!-- Popped collar left -->
  <path d="M76,262 L70,222 L86,220 L96,248 Z" fill="#161634" stroke="#0a0a18" stroke-width="1.5"/>
  <!-- Popped collar right -->
  <path d="M180,262 L186,222 L170,220 L160,248 Z" fill="#1a1a38" stroke="#0a0a18" stroke-width="1.5"/>
  <!-- Coat center line -->
  <line x1="128" y1="238" x2="128" y2="384" stroke="#222244" stroke-width="1"/>
  <!-- Shirt V -->
  <path d="M114,234 L128,254 L142,234" fill="#0e0e24" stroke="#1a1a36" stroke-width="0.5"/>
  <!-- Neon accent lines on coat -->
  <line x1="68" y1="282" x2="68" y2="384" stroke="#00e5e5" stroke-width="1" opacity="0.35" filter="url(#glow)"/>
  <line x1="188" y1="282" x2="188" y2="384" stroke="#00e5e5" stroke-width="1" opacity="0.35" filter="url(#glow)"/>
  <!-- Coat fold shadows -->
  <path d="M80,270 Q85,300 84,340 L82,384 L60,384 Q62,330 68,290 Z" fill="#06061a" opacity="0.4"/>
  <path d="M176,270 Q172,300 173,340 L174,384 L196,384 Q194,330 188,290 Z" fill="#06061a" opacity="0.3"/>

  <!-- === NECK === -->
  <path d="M116,218 Q128,224 140,218 L138,236 Q128,242 118,236 Z" fill="#e0bc96"/>
  <!-- Neck shadow (hard edge, cold-shifted - chin cast shadow) -->
  <path d="M116,218 Q128,222 140,218 L139,228 Q128,232 117,228 Z" fill="#a08068" opacity="0.6"/>

  <!-- === HEAD === -->
  <!-- Face base - JJK proportions: slightly more realistic, smooth V-chin -->
  <path d="M82,132 Q80,110 88,92 Q98,76 128,72 Q158,76 168,92 Q176,110 174,132 L174,158 Q172,176 162,190 Q152,202 140,210 Q134,214 128,216 Q122,214 116,210 Q104,202 94,190 Q84,176 82,158 Z" fill="#e8c4a0"/>
  <!-- Face outer contour (thick - JJK defining feature) -->
  <path d="M82,132 Q80,110 88,92 Q98,76 128,72 Q158,76 168,92 Q176,110 174,132 L174,158 Q172,176 162,190 Q152,202 140,210 Q134,214 128,216 Q122,214 116,210 Q104,202 94,190 Q84,176 82,158 Z" fill="none" stroke="#2a1a10" stroke-width="2"/>
  <!-- Face shadow left (hard edge cel-shading, cold-shifted) -->
  <path d="M82,132 Q80,110 88,92 Q94,82 106,76 L102,132 L100,162 Q92,178 94,192 Q98,200 110,208 L116,210 Q104,202 94,190 Q84,176 82,158 Z" fill="#b8946e" opacity="0.55"/>
  <!-- Jaw shadow - strong, JJK style -->
  <path d="M94,190 Q104,202 116,210 Q122,214 128,216 L128,206 Q116,200 106,192 Z" fill="#a08060" opacity="0.45"/>
  <path d="M162,190 Q152,202 140,210 Q134,214 128,216 L128,206 Q140,200 150,192 Z" fill="#a08060" opacity="0.3"/>
  <!-- Forehead shadow from hair -->
  <path d="M86,105 Q100,100 128,98 Q156,100 170,105 L168,115 Q155,108 128,106 Q101,108 88,115 Z" fill="#c8a480" opacity="0.35"/>

  <!-- === EARS === -->
  <ellipse cx="82" cy="150" rx="5" ry="10" fill="#e8c4a0" stroke="#2a1a10" stroke-width="1"/>
  <ellipse cx="82" cy="150" rx="3" ry="7" fill="#c8a480" opacity="0.3"/>
  <ellipse cx="174" cy="150" rx="5" ry="10" fill="#e8c4a0" stroke="#2a1a10" stroke-width="1"/>
  <!-- Cyber implant right ear -->
  <rect x="169" y="146" width="4" height="9" rx="1" fill="#0a1a2a" stroke="#00cccc" stroke-width="0.6"/>
  <circle cx="171" cy="148" r="0.8" fill="#00ffff"/>
  <circle cx="171" cy="152" r="0.6" fill="#00ffff" opacity="0.6"/>

  <!-- === HAIR === -->
  <!-- Main hair mass -->
  <path d="M68,132 Q66,104 80,80 Q96,60 128,56 Q160,60 176,80 Q190,104 188,132 L186,120 Q182,102 170,86 Q156,72 128,68 Q100,72 86,86 Q74,102 70,120 Z" fill="#d8d8e8"/>
  <!-- Hair outer contour (thick bold line) -->
  <path d="M68,132 Q66,104 80,80 Q96,60 128,56 Q160,60 176,80 Q190,104 188,132" fill="none" stroke="#1a1a2a" stroke-width="2.5"/>
  <!-- Hair shadow block left (cold-shifted, hard edge) -->
  <path d="M68,132 Q66,104 80,80 Q88,66 106,60 L102,82 Q88,98 78,120 L72,132 Z" fill="#9898b0" opacity="0.7"/>

  <!-- Wild spiky top - flowing tapered strands (JJK style: dynamic, pointed) -->
  <path d="M100,68 L86,24 Q94,48 112,62 Z" fill="#e4e4f0" stroke="#1a1a2a" stroke-width="1.8"/>
  <path d="M112,62 L96,10 Q106,42 128,56 Z" fill="#ececf4" stroke="#1a1a2a" stroke-width="1.8"/>
  <path d="M128,56 L120,2 Q126,34 140,54 Z" fill="#f0f0f8" stroke="#1a1a2a" stroke-width="2"/>
  <path d="M140,54 L150,8 Q148,40 160,60 Z" fill="#ececf4" stroke="#1a1a2a" stroke-width="1.8"/>
  <path d="M160,60 L172,22 Q166,48 174,70 Z" fill="#e4e4f0" stroke="#1a1a2a" stroke-width="1.8"/>
  <!-- Extra tall center spike -->
  <path d="M122,58 L114,0 Q120,30 136,52 Z" fill="#f4f4fc" stroke="#1a1a2a" stroke-width="1.5"/>

  <!-- Spike cel-shade shadows (hard edge) -->
  <path d="M100,68 L86,24 Q90,40 98,55 Z" fill="#9898b0" opacity="0.5"/>
  <path d="M128,56 L120,2 Q122,26 128,42 Z" fill="#a0a0b8" opacity="0.4"/>
  <path d="M112,62 L96,10 Q100,32 110,50 Z" fill="#9898b0" opacity="0.45"/>

  <!-- Side hair strands - flowing, tapered to points (not zigzag) -->
  <!-- Left side -->
  <path d="M68,132 Q62,148 56,172 Q50,198 46,220 L42,200 Q48,170 58,145 Z" fill="#d8d8e8" stroke="#1a1a2a" stroke-width="1.5"/>
  <path d="M64,148 Q58,170 52,196 Q48,218 44,238 L40,218 Q46,190 54,165 Z" fill="#d0d0e0" stroke="#1a1a2a" stroke-width="1.2"/>
  <!-- Right side -->
  <path d="M188,132 Q194,148 200,172 Q206,198 210,220 L214,200 Q208,170 198,145 Z" fill="#d8d8e8" stroke="#1a1a2a" stroke-width="1.5"/>
  <path d="M192,148 Q198,170 204,196 Q208,218 212,238 L216,218 Q210,190 202,165 Z" fill="#d0d0e0" stroke="#1a1a2a" stroke-width="1.2"/>

  <!-- Side hair cel-shadows -->
  <path d="M68,132 Q62,148 56,172 Q52,192 48,210 L46,198 Q50,175 56,155 Z" fill="#9898b0" opacity="0.5"/>

  <!-- Bangs - flowing tapered pieces over forehead -->
  <path d="M88,92 Q92,112 96,128 L104,122 Q100,106 98,90 Z" fill="#dcdce8" stroke="#1a1a2a" stroke-width="1"/>
  <path d="M98,86 Q102,106 106,120 L114,114 Q110,98 108,84 Z" fill="#e6e6f2" stroke="#1a1a2a" stroke-width="1"/>
  <path d="M150,84 Q152,100 154,114 L162,120 Q160,104 158,86 Z" fill="#dcdce8" stroke="#1a1a2a" stroke-width="1"/>
  <path d="M160,88 Q162,106 164,124 L172,130 Q170,110 168,92 Z" fill="#d4d4e2" stroke="#1a1a2a" stroke-width="1"/>

  <!-- Hair highlight band - follows hair flow direction, large and bold -->
  <path d="M90,76 Q110,66 128,62 Q146,66 166,76 L162,84 Q146,74 128,70 Q110,74 94,84 Z" fill="#ffffff" opacity="0.55"/>
  <!-- Secondary highlight streak -->
  <path d="M96,86 Q112,78 128,75 Q144,78 160,86" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- === EYES === -->

  <!-- RIGHT EYE (normal blue) - JJK style: angular, top-heavy lid -->
  <!-- Eye white -->
  <path d="M90,152 Q100,140 110,139 Q120,140 126,152 Q120,160 110,161 Q100,160 90,152 Z" fill="#eeeef2"/>
  <!-- Upper eyelid - VERY THICK, extends at outer corner (JJK defining feature) -->
  <path d="M86,152 Q96,136 110,135 Q124,136 130,152" fill="none" stroke="#1a1020" stroke-width="4.5"/>
  <!-- Eyelid extension flick at outer corner -->
  <path d="M86,151 L82,147" fill="none" stroke="#1a1020" stroke-width="3" stroke-linecap="square"/>
  <!-- Iris - hard-edged color bands (NOT radial gradient) -->
  <!-- Outer ring -->
  <circle cx="110" cy="152" r="11" fill="#1a2a40" clip-path="url(#eyeL)"/>
  <!-- Mid band -->
  <circle cx="110" cy="152" r="9" fill="#2a4a6a" clip-path="url(#eyeL)"/>
  <!-- Inner band -->
  <circle cx="110" cy="152" r="6.5" fill="#3a6a8a" clip-path="url(#eyeL)"/>
  <!-- Pupil - small, sharp -->
  <circle cx="110" cy="153" r="4" fill="#0a0a18" clip-path="url(#eyeL)"/>
  <!-- Highlight - ONE large, slightly rectangular (JJK style) -->
  <rect x="113" y="144" width="7" height="5" rx="1.5" fill="#ffffff" opacity="0.9" clip-path="url(#eyeL)"/>
  <!-- Small secondary highlight -->
  <circle cx="105" cy="157" r="2" fill="#ffffff" opacity="0.45" clip-path="url(#eyeL)"/>
  <!-- Lower lid shadow (just a subtle shadow, no line) -->
  <path d="M94,156 Q110,162 122,156" fill="#c8a888" opacity="0.15"/>

  <!-- LEFT EYE (Cybernetic cyan) - JJK tech style -->
  <!-- Eye socket dark -->
  <path d="M130,152 Q140,140 150,139 Q160,140 166,152 Q160,160 150,161 Q140,160 130,152 Z" fill="#061218"/>
  <!-- Cyber upper eyelid - thick, angular -->
  <path d="M126,152 Q136,136 150,135 Q164,136 170,152" fill="none" stroke="#006688" stroke-width="4.5"/>
  <!-- Eyelid extension at outer corner -->
  <path d="M170,151 L174,147" fill="none" stroke="#006688" stroke-width="3" stroke-linecap="square"/>
  <!-- Cyber iris - concentric hard bands -->
  <circle cx="150" cy="152" r="11" fill="#003344" clip-path="url(#eyeR)"/>
  <circle cx="150" cy="152" r="9" fill="#005566" clip-path="url(#eyeR)"/>
  <circle cx="150" cy="152" r="6.5" fill="#008899" clip-path="url(#eyeR)"/>
  <!-- Pupil glow -->
  <circle cx="150" cy="153" r="3.5" fill="#00eeff" clip-path="url(#eyeR)" filter="url(#glow)"/>
  <!-- Highlight - rectangular -->
  <rect x="153" y="144" width="7" height="5" rx="1.5" fill="#aaffff" opacity="0.85" clip-path="url(#eyeR)"/>
  <circle cx="145" cy="157" r="2" fill="#66ffff" opacity="0.4" clip-path="url(#eyeR)"/>
  <!-- Circuit ring -->
  <circle cx="150" cy="152" r="13" fill="none" stroke="#00aacc" stroke-width="0.5" opacity="0.3" filter="url(#glow)"/>
  <!-- Scan crosshairs (subtle) -->
  <line x1="140" y1="152" x2="160" y2="152" stroke="#00ffff" stroke-width="0.3" opacity="0.25"/>
  <line x1="150" y1="142" x2="150" y2="162" stroke="#00ffff" stroke-width="0.3" opacity="0.25"/>
  <!-- Circuit traces from eye -->
  <path d="M128,146 L132,146 L134,148" fill="none" stroke="#00bbcc" stroke-width="0.5" opacity="0.4"/>
  <path d="M128,158 L132,158 L134,156" fill="none" stroke="#00bbcc" stroke-width="0.5" opacity="0.4"/>
  <!-- Ambient glow around cyber eye -->
  <circle cx="150" cy="152" r="20" fill="#00ffff" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Eyebrows - thick, angular, close to eyes (JJK style: expressive, bold) -->
  <path d="M88,132 Q100,124 122,128" fill="none" stroke="#b8b8c8" stroke-width="3.5" stroke-linecap="square"/>
  <path d="M134,128 Q156,124 168,132" fill="none" stroke="#b8b8c8" stroke-width="3.5" stroke-linecap="square"/>

  <!-- === NOSE - minimal dot/short arc (JJK: almost invisible) === -->
  <path d="M128,178 L130,180" fill="none" stroke="#c8a080" stroke-width="1.2" stroke-linecap="round"/>

  <!-- === MOUTH - short, sharp arc (JJK style) === -->
  <path d="M121,196 Q128,199 135,196" fill="none" stroke="#b08068" stroke-width="1.3"/>

  <!-- === AMBIENT EFFECTS === -->
  <circle cx="30" cy="90" r="1" fill="#00ffff" opacity="0.2"/>
  <circle cx="222" cy="72" r="0.8" fill="#00ffff" opacity="0.15"/>
  <circle cx="36" cy="320" r="1" fill="#00ffff" opacity="0.15"/>
  <circle cx="218" cy="345" r="0.8" fill="#00ffff" opacity="0.15"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#00e5e5" text-anchor="middle" opacity="0.45">[default]</text>
</svg>
