  <path d="M68,145 C64,164 58,186 52,210 C48,228 44,240 40,248 C44,234 50,210 56,186 C60,168 64,152 68,145 Z" fill="#c8c8dc" stroke="#1a1a2e" stroke-width="1"/>
  <path d="M184,130 C188,148 194,170 200,195 C204,210 208,220 212,226 C208,214 202,192 196,168 C192,150 188,138 184,130 Z" fill="#d4d4e4" stroke="#1a1a2e" stroke-width="1.2"/>
  <path d="M188,145 C192,164 198,186 204,210 C208,228 212,240 216,248 C212,234 206,210 200,186 C196,168 192,152 188,145 Z" fill="#c8c8dc" stroke="#1a1a2e" stroke-width="1"/>
