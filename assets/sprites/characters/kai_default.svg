  <!-- Eye socket -->
  <path d="M134,148 C140,136 148,133 155,134 C162,135 168,140 170,148 C166,156 160,160 155,160 C148,160 140,156 134,148 Z" fill="#061018"/>
  <!-- Cyber upper eyelid — filled path -->
  <path d="M131,148 C136,134 146,129 155,130 C164,131 172,138 175,148 L170,148 C168,140 162,135 155,134 C148,133 140,136 134,148 Z" fill="#004858"/>
  <!-- Eyelid extension -->
  <path d="M175,148 C177,145 178,142 180,140" fill="none" stroke="#004858" stroke-width="2.2"/>
