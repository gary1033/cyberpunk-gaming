  <path d="M100,88 C102,102 104,112 106,122 L114,116 C112,106 110,96 108,84 Z" fill="#e2e2f0" stroke="#1a1a2e" stroke-width="0.8"/>
  <path d="M152,84 C154,96 156,106 158,116 L166,122 C164,110 162,100 160,88 Z" fill="#dadaea" stroke="#1a1a2e" stroke-width="0.8"/>
  <path d="M160,90 C162,102 164,112 166,124 L174,130 C172,116 170,104 168,92 Z" fill="#d2d2e2" stroke="#1a1a2e" stroke-width="0.8"/>

  <!-- Hair highlight — large bold path following hair flow -->
  <path d="M94,72 C110,62 120,58 128,56 C136,58 146,62 162,72 L158,80 C146,70 138,66 128,64 C118,66 110,70 98,80 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M100,82 C112,74 120,70 128,68 C136,70 144,74 156,82" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.25"/>

