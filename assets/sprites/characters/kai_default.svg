<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141430"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="cyberIris" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00bbdd"/>
      <stop offset="100%" stop-color="#005577"/>
    </radialGradient>
    <radialGradient id="normalIris" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5588aa"/>
      <stop offset="50%" stop-color="#2a4a6a"/>
      <stop offset="100%" stop-color="#152540"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>
  <line x1="20" y1="40" x2="20" y2="384" stroke="#00e5e5" stroke-width="0.3" opacity="0.1"/>
  <line x1="236" y1="0" x2="236" y2="384" stroke="#00e5e5" stroke-width="0.3" opacity="0.08"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#00e5e5" stroke-width="1" opacity="0.3"/>

  <!-- Name -->
  <text x="128" y="28" font-family="monospace" font-size="20" fill="#00e5e5" text-anchor="middle" filter="url(#glow)" opacity="0.9">凱</text>

  <!-- === COAT === -->
  <path d="M55,275 Q62,252 85,238 L100,230 Q115,224 128,222 Q141,224 156,230 L171,238 Q194,252 201,275 L210,384 L46,384 Z" fill="#141428" stroke="#1a1a36" stroke-width="0.8"/>
  <!-- Coat shadow (cel-shade) -->
  <path d="M55,275 Q62,252 85,238 L100,230 Q110,226 118,224 L118,384 L46,384 Z" fill="#0e0e1e" opacity="0.5"/>
  <!-- Collar left -->
  <path d="M88,236 L74,260 L105,250 L115,232 Z" fill="#1e1e3a"/>
  <!-- Collar right -->
  <path d="M168,236 L182,260 L151,250 L141,232 Z" fill="#222240"/>
  <!-- Popped collar left -->
  <path d="M76,258 L68,220 L86,218 L96,244 Z" fill="#181832"/>
  <!-- Popped collar right -->
  <path d="M180,258 L188,220 L170,218 L160,244 Z" fill="#1c1c38"/>
  <!-- Coat center line -->
  <line x1="128" y1="236" x2="128" y2="384" stroke="#2a2a4e" stroke-width="0.8"/>
  <!-- Shirt V -->
  <path d="M112,232 L128,250 L144,232" fill="#161630" stroke="#1e1e3a" stroke-width="0.5"/>
  <!-- Neon accent lines on coat -->
  <line x1="70" y1="278" x2="70" y2="384" stroke="#00e5e5" stroke-width="0.8" opacity="0.3" filter="url(#glow)"/>
  <line x1="186" y1="278" x2="186" y2="384" stroke="#00e5e5" stroke-width="0.8" opacity="0.3" filter="url(#glow)"/>

  <!-- === NECK === -->
  <path d="M115,216 Q128,222 141,216 L139,234 Q128,240 117,234 Z" fill="#e8c4a0"/>
  <!-- Neck shadow -->
  <path d="M115,216 Q128,220 141,216 L140,224 Q128,228 116,224 Z" fill="#d4a878" opacity="0.4"/>

  <!-- === HEAD === -->
  <!-- Face base - shounen proportions, V-chin -->
  <path d="M80,130 Q78,105 88,88 Q100,72 128,68 Q156,72 168,88 Q178,105 176,130 L176,155 Q174,175 164,190 Q154,204 142,212 Q136,216 128,218 Q120,216 114,212 Q102,204 92,190 Q82,175 80,155 Z" fill="#f0cba8"/>
  <!-- Face shadow left (cel-shade hard edge) -->
  <path d="M80,130 Q78,105 88,88 Q94,80 104,74 L100,130 L98,160 Q90,175 92,190 Q96,198 108,208 L114,212 Q102,204 92,190 Q82,175 80,155 Z" fill="#deb896" opacity="0.5"/>
  <!-- Jaw shadow -->
  <path d="M92,190 Q102,204 114,212 Q120,216 128,218 L128,208 Q116,202 106,192 Z" fill="#d4a878" opacity="0.3"/>
  <path d="M164,190 Q154,204 142,212 Q136,216 128,218 L128,208 Q140,202 150,192 Z" fill="#d4a878" opacity="0.2"/>

  <!-- Cheek blush -->
  <ellipse cx="96" cy="178" rx="10" ry="3.5" fill="#e8a0a0" opacity="0.12"/>
  <ellipse cx="160" cy="178" rx="10" ry="3.5" fill="#e8a0a0" opacity="0.12"/>

  <!-- === EARS === -->
  <ellipse cx="80" cy="148" rx="5" ry="10" fill="#f0cba8"/>
  <ellipse cx="80" cy="148" rx="3" ry="7" fill="#deb896" opacity="0.3"/>
  <ellipse cx="176" cy="148" rx="5" ry="10" fill="#f0cba8"/>
  <!-- Cyber implant right ear -->
  <rect x="170" y="144" width="4" height="9" rx="1" fill="#1a2a3a" stroke="#00cccc" stroke-width="0.5"/>
  <circle cx="172" cy="146" r="0.8" fill="#00ffff"/>
  <circle cx="172" cy="150" r="0.6" fill="#00ffff" opacity="0.6"/>

  <!-- === HAIR === -->
  <!-- Main hair mass - chunky blocks -->
  <path d="M66,130 Q64,100 80,76 Q96,56 128,52 Q160,56 176,76 Q192,100 190,130 L188,118 Q184,100 172,84 Q156,68 128,64 Q100,68 84,84 Q72,100 68,118 Z" fill="#e8e8f0"/>
  <!-- Hair shadow block (left side) -->
  <path d="M66,130 Q64,100 80,76 Q90,62 108,56 L104,80 Q88,96 78,118 L72,130 Z" fill="#b8b8cc"/>
  <!-- Hair shadow block (right back) -->
  <path d="M190,130 Q192,100 176,76 Q170,66 160,60 L164,82 Q178,98 186,118 Z" fill="#c8c8d8" opacity="0.5"/>

  <!-- Wild spiky top - big chunky spikes -->
  <path d="M96,68 L84,30 L112,62 Z" fill="#e0e0ee" stroke="#d0d0e0" stroke-width="0.5"/>
  <path d="M112,62 L98,18 L128,56 Z" fill="#eeeef6" stroke="#e0e0ee" stroke-width="0.5"/>
  <path d="M128,56 L122,10 L142,54 Z" fill="#f0f0f8" stroke="#e8e8f0" stroke-width="0.5"/>
  <path d="M142,54 L148,16 L158,60 Z" fill="#eeeef6" stroke="#e0e0ee" stroke-width="0.5"/>
  <path d="M158,60 L168,28 L172,68 Z" fill="#e0e0ee" stroke="#d0d0e0" stroke-width="0.5"/>
  <!-- Extra tall center spike -->
  <path d="M120,58 L116,6 L136,54 Z" fill="#f4f4fc" stroke="#eaeaf2" stroke-width="0.4"/>

  <!-- Spike shadows (cel-shade) -->
  <path d="M96,68 L84,30 L100,52 Z" fill="#b8b8cc" opacity="0.4"/>
  <path d="M128,56 L122,10 L128,36 L135,52 Z" fill="#c8c8d8" opacity="0.3"/>

  <!-- Side hair - left chunky strands -->
  <path d="M66,130 L54,116 L64,148 L46,134 L60,168 L42,155 L56,182" fill="none" stroke="#d0d0e0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66,130 L54,116 L64,148 L46,134 L60,168 L42,155 L56,182" fill="none" stroke="#e8e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Side hair - right -->
  <path d="M190,130 L202,116 L192,148 L210,134 L196,168 L214,155 L200,182" fill="none" stroke="#d0d0e0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190,130 L202,116 L192,148 L210,134 L196,168 L214,155 L200,182" fill="none" stroke="#e8e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bangs - thick chunky pieces over forehead -->
  <path d="M86,90 Q90,110 94,125 L102,120 Q98,102 96,88 Z" fill="#e0e0ee"/>
  <path d="M96,84 Q100,104 104,118 L112,112 Q108,96 106,80 Z" fill="#eaeaf4"/>
  <path d="M148,80 Q150,98 152,112 L160,118 Q158,100 156,84 Z" fill="#e0e0ee"/>
  <path d="M158,84 Q160,102 162,120 L170,126 Q168,106 166,88 Z" fill="#d8d8ea"/>

  <!-- Hair shine band (large, distinctive anime highlight) -->
  <path d="M88,78 Q108,68 128,64 Q148,68 168,78 L164,86 Q148,76 128,72 Q108,76 92,86 Z" fill="#ffffff" opacity="0.5"/>
  <!-- Secondary shine -->
  <path d="M94,88 Q112,80 128,77 Q144,80 162,88" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- === EYES === -->

  <!-- RIGHT EYE (normal - dark blue) - Shounen style: angular, medium-large -->
  <!-- Eye white -->
  <path d="M88,148 Q98,134 108,133 Q118,134 124,148 Q118,158 108,159 Q98,158 88,148 Z" fill="#f0f0f5"/>
  <!-- Upper eyelid - THICK (defining anime feature) -->
  <path d="M86,148 Q96,132 108,130 Q120,132 126,148" fill="none" stroke="#2a2a3e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lower eyelid - thin -->
  <path d="M90,150 Q100,159 108,160 Q116,159 122,150" fill="none" stroke="#8a7a6a" stroke-width="0.6"/>
  <!-- Iris (large) -->
  <circle cx="108" cy="148" r="12" fill="url(#normalIris)"/>
  <!-- Iris detail ring -->
  <circle cx="108" cy="148" r="12" fill="none" stroke="#1a2a3a" stroke-width="0.8" opacity="0.5"/>
  <!-- Iris radial lines -->
  <line x1="108" y1="137" x2="108" y2="142" stroke="#3a5a7a" stroke-width="0.5" opacity="0.4"/>
  <line x1="101" y1="140" x2="103" y2="144" stroke="#3a5a7a" stroke-width="0.5" opacity="0.3"/>
  <line x1="115" y1="140" x2="113" y2="144" stroke="#3a5a7a" stroke-width="0.5" opacity="0.3"/>
  <line x1="98" y1="145" x2="101" y2="147" stroke="#3a5a7a" stroke-width="0.4" opacity="0.25"/>
  <line x1="118" y1="145" x2="115" y2="147" stroke="#3a5a7a" stroke-width="0.4" opacity="0.25"/>
  <!-- Pupil -->
  <circle cx="108" cy="149" r="5.5" fill="#0a0a1e"/>
  <!-- Highlights - 3 spots (big, medium, small) -->
  <circle cx="114" cy="142" r="4" fill="#ffffff" opacity="0.92"/>
  <circle cx="103" cy="153" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="112" cy="153" r="1" fill="#ffffff" opacity="0.35"/>

  <!-- LEFT EYE (Cybernetic - cyan) -->
  <!-- Eye socket -->
  <path d="M132,148 Q142,134 152,133 Q162,134 168,148 Q162,158 152,159 Q142,158 132,148 Z" fill="#081820"/>
  <!-- Cyber eye border -->
  <path d="M130,148 Q140,132 152,130 Q164,132 170,148" fill="none" stroke="#00aacc" stroke-width="3" stroke-linecap="round"/>
  <!-- Circuit ring -->
  <circle cx="152" cy="148" r="14" fill="none" stroke="#00aacc" stroke-width="0.6" opacity="0.4" filter="url(#glow)"/>
  <!-- Iris glow -->
  <circle cx="152" cy="148" r="12" fill="url(#cyberIris)" filter="url(#glow)"/>
  <!-- Inner glow ring -->
  <circle cx="152" cy="148" r="7" fill="#00ccdd" opacity="0.5"/>
  <!-- Pupil center -->
  <circle cx="152" cy="149" r="4" fill="#00ffff" filter="url(#glow)"/>
  <!-- Highlights -->
  <circle cx="158" cy="142" r="4" fill="#aaffff" opacity="0.85"/>
  <circle cx="147" cy="153" r="2.5" fill="#88ffff" opacity="0.5"/>
  <circle cx="156" cy="153" r="1" fill="#ffffff" opacity="0.4"/>
  <!-- Scan crosshairs -->
  <line x1="142" y1="148" x2="162" y2="148" stroke="#00ffff" stroke-width="0.4" opacity="0.35"/>
  <line x1="152" y1="138" x2="152" y2="158" stroke="#00ffff" stroke-width="0.4" opacity="0.35"/>
  <!-- Circuit traces from eye -->
  <path d="M130,142 L134,142 L136,144" fill="none" stroke="#00cccc" stroke-width="0.6" opacity="0.5"/>
  <path d="M130,154 L134,154 L136,152" fill="none" stroke="#00cccc" stroke-width="0.6" opacity="0.5"/>
  <circle cx="130" cy="142" r="0.8" fill="#00ffff" opacity="0.5"/>
  <circle cx="130" cy="154" r="0.8" fill="#00ffff" opacity="0.5"/>
  <!-- Ambient glow -->
  <circle cx="152" cy="148" r="22" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.12" filter="url(#glowSoft)"/>

  <!-- Eyebrows - sharp, angular (shounen style) -->
  <path d="M88,128 Q100,121 120,125" fill="none" stroke="#b0b0be" stroke-width="3" stroke-linecap="round"/>
  <path d="M136,125 Q156,121 168,128" fill="none" stroke="#b0b0be" stroke-width="3" stroke-linecap="round"/>

  <!-- === NOSE (minimal - tiny L shape) === -->
  <path d="M127,173 L128,178 L131,176" fill="none" stroke="#d4a878" stroke-width="1" stroke-linecap="round"/>

  <!-- === MOUTH (simple thin line) === -->
  <path d="M119,194 Q128,196 137,194" fill="none" stroke="#c08a70" stroke-width="1.2" stroke-linecap="round"/>

  <!-- === AMBIENT === -->
  <circle cx="28" cy="95" r="1" fill="#00ffff" opacity="0.25"/>
  <circle cx="225" cy="75" r="0.8" fill="#ff00aa" opacity="0.15"/>
  <circle cx="38" cy="310" r="1.2" fill="#00ffff" opacity="0.18"/>
  <circle cx="215" cy="350" r="0.8" fill="#ff00aa" opacity="0.18"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#00e5e5" text-anchor="middle" opacity="0.5">[default]</text>
</svg>