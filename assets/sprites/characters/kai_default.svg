  <path d="M88,140 C84,136 82,140 82,148 C82,156 84,160 88,156" fill="#e4be98" stroke="#2a1a10" stroke-width="1"/>
  <path d="M168,140 C172,136 174,140 174,148 C174,156 172,160 168,156" fill="#e4be98" stroke="#2a1a10" stroke-width="1"/>
