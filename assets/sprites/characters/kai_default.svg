  <!-- Eyebrows — bold, angular, close to eyes -->
  <path d="M90,130 C98,124 108,123 118,126" fill="none" stroke="#c0c0d0" stroke-width="3.2"/>
  <path d="M144,126 C154,123 164,124 172,130" fill="none" stroke="#c0c0d0" stroke-width="3.2"/>

  <!-- Nose — minimal, just a tiny shadow -->
  <path d="M128,176 C129,177 130,178 130,179" fill="none" stroke="#c09e78" stroke-width="1" opacity="0.7"/>

  <!-- Mouth — short, clean arc -->
  <path d="M122,194 C126,197 130,197 134,194" fill="none" stroke="#a87860" stroke-width="1.2"/>

  <!-- ========== AMBIENT ========== -->
  <circle cx="28" cy="88" r="0.8" fill="#00ffee" opacity="0.18"/>
  <circle cx="224" cy="70" r="0.6" fill="#00ffee" opacity="0.12"/>
  <circle cx="34" cy="330" r="0.8" fill="#00ffee" opacity="0.12"/>
  <circle cx="220" cy="350" r="0.6" fill="#00ffee" opacity="0.12"/>

  <!-- Label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#00dde5" text-anchor="middle" opacity="0.4">[default]</text>
