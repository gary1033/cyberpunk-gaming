<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="iris_grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a0703c"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#glow)">阿傑</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle">阿傑</text>

  <!-- Neck - thick muscular -->
  <rect x="100" y="195" width="56" height="30" rx="6" fill="#c8a882"/>
  <!-- Neck shadow -->
  <path d="M100,195 L112,195 L112,225 L100,225 Z" fill="#2a1a0a" opacity="0.25"/>
  <!-- Neck tendons -->
  <line x1="120" y1="198" x2="120" y2="222" stroke="#2a1a0a" stroke-width="1" opacity="0.15"/>
  <line x1="136" y1="198" x2="136" y2="222" stroke="#2a1a0a" stroke-width="1" opacity="0.15"/>

  <!-- Body / Shoulders - wide muscular -->
  <path d="M128,222 L128,384 L30,384 L30,272 Q30,230 78,218 Q108,210 128,222 Z" fill="#1a1a2e"/>
  <path d="M128,222 L128,384 L226,384 L226,272 Q226,230 178,218 Q148,210 128,222 Z" fill="#1a1a2e"/>
  <!-- Shoulder shadow blocks -->
  <path d="M128,222 L128,384 L80,384 L80,260 Q85,235 128,222 Z" fill="#0d0d1a" opacity="0.4"/>
  <!-- Shoulder muscle lines -->
  <path d="M78,218 Q52,224 38,246 Q30,260 30,272" fill="none" stroke="#2a2a4e" stroke-width="2"/>
  <path d="M178,218 Q204,224 218,246 Q226,260 226,272" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Crossed arms -->
  <path d="M34,272 Q44,295 75,315 Q105,328 145,316 Q162,308 172,296" fill="#c8a882"/>
  <path d="M222,272 Q212,295 181,315 Q151,328 111,316 Q94,308 84,296" fill="#c8a882"/>
  <!-- Arm shadow (cel-shaded) -->
  <path d="M34,272 Q44,295 75,315 Q85,320 95,318 Q72,308 54,288 Q44,278 42,272 Z" fill="#2a1a0a" opacity="0.3"/>
  <path d="M222,272 Q212,295 181,315 Q171,320 161,318 Q184,308 202,288 Q212,278 214,272 Z" fill="#2a1a0a" opacity="0.3"/>
  <!-- Arm muscle definition -->
  <path d="M42,278 Q52,292 70,304" fill="none" stroke="#a08060" stroke-width="1.5" opacity="0.3"/>
  <path d="M214,278 Q204,292 186,304" fill="none" stroke="#a08060" stroke-width="1.5" opacity="0.3"/>

  <!-- Circuit tattoos left arm -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M48,280 L58,280 L58,294 L70,294 L70,308 L82,308" fill="none" stroke="#ff8800" stroke-width="2"/>
    <circle cx="48" cy="280" r="3" fill="#ff8800"/>
    <circle cx="70" cy="294" r="3" fill="#ff8800"/>
    <circle cx="82" cy="308" r="3" fill="#ff8800"/>
    <path d="M54,286 L64,286 L64,300" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Circuit tattoos right arm -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M208,280 L198,280 L198,294 L186,294 L186,308 L174,308" fill="none" stroke="#ff8800" stroke-width="2"/>
    <circle cx="208" cy="280" r="3" fill="#ff8800"/>
    <circle cx="186" cy="294" r="3" fill="#ff8800"/>
    <circle cx="174" cy="308" r="3" fill="#ff8800"/>
    <path d="M202,286 L192,286 L192,300" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Shirt V-neck -->
  <path d="M96,222 L128,254 L160,222" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Head - strong jaw, wider chin for stocky build -->
  <path d="M76,88 Q76,42 128,36 Q180,42 180,88 L180,148 Q180,166 166,178 Q152,190 128,192 Q104,190 90,178 Q76,166 76,148 Z" fill="#c8a882"/>
  <!-- Face shadow (cel-shaded hard edge) -->
  <path d="M76,88 L76,148 Q76,166 90,178 Q96,183 104,187 L104,100 Q90,92 76,88 Z" fill="#2a1a0a" opacity="0.2"/>
  <!-- Jaw shadow -->
  <path d="M90,178 Q104,190 128,192 L128,185 Q110,183 98,174 Z" fill="#2a1a0a" opacity="0.15"/>

  <!-- Buzz cut hair -->
  <path d="M82,72 Q82,44 128,38 Q174,44 174,72 Q128,58 82,72 Z" fill="#3a2a1a"/>
  <!-- Hair highlight -->
  <path d="M110,50 Q128,44 146,50 Q128,48 110,50 Z" fill="#6a5a4a" opacity="0.3"/>

  <!-- Ears -->
  <ellipse cx="74" cy="128" rx="8" ry="14" fill="#c8a882"/>
  <ellipse cx="74" cy="128" rx="5" ry="10" fill="#2a1a0a" opacity="0.12"/>
  <ellipse cx="182" cy="128" rx="8" ry="14" fill="#c8a882"/>

  <!-- Left eye - calm watchful -->
  <path d="M92,118 Q108,108 124,118" fill="#f0ece8"/>
  <path d="M92,118 Q108,130 124,118" fill="#f0ece8"/>
  <!-- Iris with radial gradient -->
  <circle cx="108" cy="119" r="10" fill="url(#iris_grad)"/>
  <!-- Pupil -->
  <circle cx="108" cy="119" r="4.5" fill="#0a0a0a"/>
  <!-- Eye highlights - 3 spots -->
  <circle cx="104" cy="115" r="3.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="112" cy="122" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="107" cy="117" r="1" fill="#ffffff" opacity="0.3"/>
  <!-- Thick upper eyelid -->
  <path d="M90,118 Q108,106 126,118" fill="none" stroke="#1a0a00" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Thin lower lid hint -->
  <path d="M94,121 Q108,130 122,121" fill="none" stroke="#1a0a00" stroke-width="0.8" opacity="0.3"/>

  <!-- Right eye - calm watchful -->
  <path d="M132,118 Q148,108 164,118" fill="#f0ece8"/>
  <path d="M132,118 Q148,130 164,118" fill="#f0ece8"/>
  <circle cx="148" cy="119" r="10" fill="url(#iris_grad)"/>
  <circle cx="148" cy="119" r="4.5" fill="#0a0a0a"/>
  <circle cx="144" cy="115" r="3.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="152" cy="122" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="147" cy="117" r="1" fill="#ffffff" opacity="0.3"/>
  <path d="M130,118 Q148,106 166,118" fill="none" stroke="#1a0a00" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M134,121 Q148,130 162,121" fill="none" stroke="#1a0a00" stroke-width="0.8" opacity="0.3"/>

  <!-- Eyebrows - thick, straight, stern (rough personality) -->
  <path d="M88,104 Q108,98 126,104" fill="none" stroke="#1a0a00" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M130,104 Q148,98 168,104" fill="none" stroke="#1a0a00" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nose - slightly defined L-shape for male -->
  <path d="M126,134 L124,142 Q128,146 132,142" fill="none" stroke="#a08060" stroke-width="1.3" opacity="0.5"/>

  <!-- Mouth - neutral firm line, wider for male -->
  <path d="M112,162 Q128,166 144,162" fill="none" stroke="#6a4030" stroke-width="2" stroke-linecap="round"/>

  <!-- Stubble hint -->
  <g opacity="0.08" fill="#3a2a1a">
    <circle cx="114" cy="170" r="0.8"/><circle cx="118" cy="172" r="0.8"/>
    <circle cx="122" cy="171" r="0.8"/><circle cx="126" cy="173" r="0.8"/>
    <circle cx="130" cy="171" r="0.8"/><circle cx="134" cy="172" r="0.8"/>
    <circle cx="138" cy="170" r="0.8"/><circle cx="142" cy="171" r="0.8"/>
  </g>

  <!-- Scar on left cheek -->
  <line x1="86" y1="140" x2="95" y2="150" stroke="#a08060" stroke-width="1.2" opacity="0.4"/>

  <!-- Circuit glow on neck -->
  <g filter="url(#glow)" opacity="0.5">
    <path d="M110,200 L110,210 L122,210" fill="none" stroke="#ff8800" stroke-width="1.2"/>
    <circle cx="122" cy="210" r="2" fill="#ff8800"/>
    <path d="M146,202 L146,208 L138,208" fill="none" stroke="#ff8800" stroke-width="1"/>
    <circle cx="138" cy="208" r="1.5" fill="#ff8800"/>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="310" rx="80" ry="30" fill="#ff8800" opacity="0.03"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="'Courier New', monospace" font-size="11" fill="#ff8800" text-anchor="middle" opacity="0.6">DEFAULT</text>
</svg>