<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gd-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="gd-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="40%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="gd-cloak-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#aa44ff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#7722cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="gd-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cc88ff"/>
      <stop offset="70%" stop-color="#aa44ff"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="gd-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gd-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gd-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#glow-purple)">幽靈</text>

  <!-- Cloak body - large flowing shape -->
  <path d="M50,140 C50,120 70,100 90,95 L100,90 C110,85 120,82 128,80 C136,82 146,85 156,90 L166,95 C186,100 206,120 206,140 L215,240 C218,290 210,340 200,370 L56,370 C46,340 38,290 41,240 Z" fill="url(#gd-cloak)"/>

  <!-- Cloak reflective sheen overlay -->
  <path d="M50,140 C50,120 70,100 90,95 L100,90 C110,85 120,82 128,80 C136,82 146,85 156,90 L166,95 C186,100 206,120 206,140 L215,240 C218,290 210,340 200,370 L56,370 C46,340 38,290 41,240 Z" fill="url(#gd-cloak-sheen)"/>

  <!-- Cloak edge highlights - left -->
  <path d="M50,140 C50,120 70,100 90,95 L100,90" fill="none" stroke="#aa44ff" stroke-width="1" opacity="0.4"/>
  <path d="M41,240 L56,370" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.2"/>

  <!-- Cloak edge highlights - right -->
  <path d="M206,140 C206,120 186,100 166,95 L156,90" fill="none" stroke="#aa44ff" stroke-width="1" opacity="0.4"/>
  <path d="M215,240 L200,370" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.2"/>

  <!-- Hood shape -->
  <path d="M75,145 C75,100 85,70 100,58 C110,50 120,46 128,44 C136,46 146,50 156,58 C171,70 181,100 181,145 C181,160 170,175 155,180 L128,185 L101,180 C86,175 75,160 75,145 Z" fill="#1a1030"/>

  <!-- Hood outer edge -->
  <path d="M75,145 C75,100 85,70 100,58 C110,50 120,46 128,44 C136,46 146,50 156,58 C171,70 181,100 181,145" fill="none" stroke="#aa44ff" stroke-width="1.2" opacity="0.5"/>

  <!-- Hood inner shadow -->
  <path d="M85,140 C85,108 92,82 105,72 C112,66 120,62 128,60 C136,62 144,66 151,72 C164,82 171,108 171,140 C171,152 163,164 152,168 L128,172 L104,168 C93,164 85,152 85,140 Z" fill="#0d0818"/>

  <!-- Deep shadow inside hood -->
  <ellipse cx="128" cy="130" rx="35" ry="30" fill="#080412"/>

  <!-- Glowing eyes - left -->
  <ellipse cx="113" cy="128" rx="8" ry="5" fill="url(#gd-eye-glow)" filter="url(#glow-purple)"/>
  <ellipse cx="113" cy="128" rx="4" ry="2.5" fill="#ffffff"/>

  <!-- Glowing eyes - right -->
  <ellipse cx="143" cy="128" rx="8" ry="5" fill="url(#gd-eye-glow)" filter="url(#glow-purple)"/>
  <ellipse cx="143" cy="128" rx="4" ry="2.5" fill="#ffffff"/>

  <!-- Subtle eye glow ambient -->
  <ellipse cx="128" cy="128" rx="30" ry="20" fill="#aa44ff" opacity="0.06" filter="url(#glow-soft)"/>

  <!-- Cloak fold lines -->
  <path d="M95,200 C100,240 98,280 95,330" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>
  <path d="M128,185 C128,230 130,280 128,340" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.15"/>
  <path d="M161,200 C156,240 158,280 161,330" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>

  <!-- Reflective light patches on cloak -->
  <ellipse cx="80" cy="250" rx="15" ry="30" fill="#aa44ff" opacity="0.04" transform="rotate(-10,80,250)"/>
  <ellipse cx="176" cy="220" rx="12" ry="25" fill="#aa44ff" opacity="0.05" transform="rotate(8,176,220)"/>
  <ellipse cx="140" cy="300" rx="20" ry="15" fill="#7722cc" opacity="0.03"/>

  <!-- Shoulder definition -->
  <path d="M70,165 C75,155 90,148 105,150" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>
  <path d="M186,165 C181,155 166,148 151,150" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Voice distortion lines near mouth area -->
  <line x1="118" y1="142" x2="138" y2="142" stroke="#aa44ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="120" y1="145" x2="136" y2="145" stroke="#aa44ff" stroke-width="0.5" opacity="0.2"/>
  <line x1="122" y1="148" x2="134" y2="148" stroke="#aa44ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Ambient particles -->
  <circle cx="45" cy="200" r="1" fill="#aa44ff" opacity="0.4"/>
  <circle cx="210" cy="180" r="1.5" fill="#aa44ff" opacity="0.3"/>
  <circle cx="60" cy="300" r="1" fill="#7722cc" opacity="0.5"/>
  <circle cx="195" cy="310" r="0.8" fill="#aa44ff" opacity="0.35"/>
  <circle cx="100" cy="350" r="1.2" fill="#7722cc" opacity="0.25"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[default]</text>
</svg>