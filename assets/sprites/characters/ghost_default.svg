<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gd-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gd-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cc88ff"/>
      <stop offset="70%" stop-color="#aa44ff"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gd-glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gd-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gd-cloak-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="50%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="gd-holo-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44ddcc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#44ddcc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8833cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gd-holo-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8833cc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5566ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#44ddcc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gd-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gd-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#glow)">幽靈</text>

  <!-- Cloak body - large angular shounen cloak -->
  <path d="M30,175 L55,130 L80,108 L105,95 L128,88 L151,95 L176,108 L201,130 L226,175 L232,280 C234,320 226,358 218,375 L38,375 C30,358 22,320 24,280 Z" fill="url(#gd-cloak-main)"/>

  <!-- Cel-shaded cloak shadow blocks - angular flat color -->
  <path d="M30,175 L55,130 L80,108 L105,95 L110,120 L70,155 L50,200 L38,280 L38,375 L38,375 C30,358 22,320 24,280 Z" fill="#0d0818" opacity="0.6"/>
  <path d="M226,175 L201,130 L176,108 L151,95 L146,120 L186,155 L206,200 L218,280 L218,375 C226,358 234,320 232,280 Z" fill="#140e28" opacity="0.4"/>

  <!-- Holographic shimmer patches on cloak -->
  <path d="M55,200 L75,180 L90,220 L65,260 Z" fill="url(#gd-holo-1)"/>
  <path d="M175,190 L200,210 L195,260 L170,240 Z" fill="url(#gd-holo-2)"/>
  <path d="M100,280 L130,260 L145,300 L110,320 Z" fill="#44ddcc" opacity="0.04"/>
  <path d="M160,300 L190,280 L195,330 L165,340 Z" fill="#5566ff" opacity="0.04"/>

  <!-- Cloak edge highlights - sharp angular lines -->
  <path d="M30,175 L55,130 L80,108 L105,95" fill="none" stroke="#aa44ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M226,175 L201,130 L176,108 L151,95" fill="none" stroke="#aa44ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Angular fold lines on cloak -->
  <path d="M80,180 L75,240 L85,310 L80,370" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.2"/>
  <path d="M128,160 L128,250 L130,340" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.12"/>
  <path d="M176,180 L181,240 L171,310 L176,370" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.2"/>
  <!-- Cross fold for dynamic angular feel -->
  <path d="M60,250 L95,230 L128,240 L161,230 L196,250" fill="none" stroke="#aa44ff" stroke-width="0.4" opacity="0.1"/>

  <!-- Large angular hood shape -->
  <path d="M58,170 L68,100 L82,65 L100,42 L116,28 L128,22 L140,28 L156,42 L174,65 L188,100 L198,170 L190,200 L162,210 L128,215 L94,210 L66,200 Z" fill="#1a1030"/>

  <!-- Hood cel-shade shadow -->
  <path d="M58,170 L68,100 L82,65 L100,42 L116,28 L128,22 L120,40 L105,60 L88,90 L78,140 L72,190 L66,200 Z" fill="#0d0818" opacity="0.5"/>

  <!-- Hood outer edge glow -->
  <path d="M58,170 L68,100 L82,65 L100,42 L116,28 L128,22 L140,28 L156,42 L174,65 L188,100 L198,170" fill="none" stroke="#aa44ff" stroke-width="1.8" opacity="0.5"/>

  <!-- Hood inner shadow - deep darkness -->
  <path d="M74,166 L82,110 L94,78 L108,58 L120,46 L128,42 L136,46 L148,58 L162,78 L174,110 L182,166 L176,190 L158,198 L128,202 L98,198 L80,190 Z" fill="#0d0818"/>

  <!-- Deep void inside hood -->
  <ellipse cx="128" cy="138" rx="44" ry="40" fill="#050210"/>

  <!-- Glowing eye slits - left - calm purple -->
  <rect x="98" y="134" width="22" height="6" rx="3" fill="url(#gd-eye-glow)" filter="url(#glow)"/>
  <rect x="101" y="135" width="16" height="4" rx="2" fill="#aa44ff" opacity="0.9"/>
  <rect x="104" y="135.5" width="10" height="3" rx="1.5" fill="#cc88ff"/>
  <!-- Highlights -->
  <ellipse cx="106" cy="136" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="114" cy="137.5" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Glowing eye slits - right - calm purple -->
  <rect x="136" y="134" width="22" height="6" rx="3" fill="url(#gd-eye-glow)" filter="url(#glow)"/>
  <rect x="139" y="135" width="16" height="4" rx="2" fill="#aa44ff" opacity="0.9"/>
  <rect x="142" y="135.5" width="10" height="3" rx="1.5" fill="#cc88ff"/>
  <ellipse cx="144" cy="136" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="152" cy="137.5" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Ambient eye glow -->
  <ellipse cx="128" cy="137" rx="40" ry="22" fill="#aa44ff" opacity="0.08" filter="url(#gd-glow-strong)"/>

  <!-- Shoulder definition - angular -->
  <path d="M48,190 L65,172 L90,165 L105,162" fill="none" stroke="#aa44ff" stroke-width="1" opacity="0.35"/>
  <path d="M208,190 L191,172 L166,165 L151,162" fill="none" stroke="#aa44ff" stroke-width="1" opacity="0.35"/>

  <!-- Digital glitch artifacts -->
  <rect x="42" y="220" width="8" height="2" fill="#aa44ff" opacity="0.3"/>
  <rect x="200" y="250" width="12" height="1.5" fill="#44ddcc" opacity="0.2"/>
  <rect x="55" y="300" width="6" height="2" fill="#8833cc" opacity="0.25"/>
  <rect x="190" y="180" width="10" height="1" fill="#aa44ff" opacity="0.2"/>
  <rect x="110" y="355" width="14" height="1.5" fill="#5566ff" opacity="0.15"/>

  <!-- Ambient particles -->
  <circle cx="38" cy="210" r="1.2" fill="#aa44ff" opacity="0.4"/>
  <circle cx="218" cy="195" r="1.5" fill="#aa44ff" opacity="0.3"/>
  <circle cx="52" cy="315" r="1" fill="#7722cc" opacity="0.5"/>
  <circle cx="204" cy="325" r="0.8" fill="#44ddcc" opacity="0.35"/>
  <circle cx="30" cy="270" r="0.6" fill="#aa44ff" opacity="0.3"/>

  <!-- State label -->
  <text x="128" y="370" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[default]</text>
</svg>