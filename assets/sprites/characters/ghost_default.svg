<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gd-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gd-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cc88ff"/>
      <stop offset="70%" stop-color="#aa44ff"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gd-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gd-glow-soft">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gd-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gd-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="40%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gd-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gd-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#gd-glow)">幽靈</text>

  <!-- Cloak body - large flowing anime cloak -->
  <path d="M35,170 C35,148 55,120 82,108 L100,100 C114,94 122,90 128,88 C134,90 142,94 156,100 L174,108 C201,120 221,148 221,170 L228,270 C230,310 222,350 214,375 L42,375 C34,350 26,310 28,270 Z" fill="url(#gd-cloak)"/>
  <!-- Cloak sheen -->
  <path d="M35,170 C35,148 55,120 82,108 L100,100 C114,94 122,90 128,88 C134,90 142,94 156,100 L174,108 C201,120 221,148 221,170 L228,270 C230,310 222,350 214,375 L42,375 C34,350 26,310 28,270 Z" fill="#aa44ff" opacity="0.05"/>

  <!-- Cloak edge highlights -->
  <path d="M35,170 C35,148 55,120 82,108 L100,100" fill="none" stroke="#aa44ff" stroke-width="1.2" opacity="0.4"/>
  <path d="M221,170 C221,148 201,120 174,108 L156,100" fill="none" stroke="#aa44ff" stroke-width="1.2" opacity="0.4"/>
  <path d="M28,270 L42,375" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.2"/>
  <path d="M228,270 L214,375" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.2"/>

  <!-- Large anime hood shape -->
  <path d="M62,165 C62,100 76,60 96,44 C110,32 122,26 128,24 C134,26 146,32 160,44 C180,60 194,100 194,165 C194,184 180,198 162,203 L128,208 L94,203 C76,198 62,184 62,165 Z" fill="#1a1030"/>

  <!-- Hood outer edge glow -->
  <path d="M62,165 C62,100 76,60 96,44 C110,32 122,26 128,24 C134,26 146,32 160,44 C180,60 194,100 194,165" fill="none" stroke="#aa44ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Hood inner shadow -->
  <path d="M76,160 C76,108 86,72 102,60 C112,50 122,46 128,44 C134,46 144,50 154,60 C170,72 180,108 180,160 C180,174 170,186 156,190 L128,194 L100,190 C86,186 76,174 76,160 Z" fill="#0d0818"/>

  <!-- Deep shadow inside hood -->
  <ellipse cx="128" cy="140" rx="42" ry="36" fill="#060310"/>

  <!-- Large anime glowing eyes - left -->
  <ellipse cx="108" cy="138" rx="14" ry="10" fill="url(#gd-eye-glow)" filter="url(#gd-glow)"/>
  <!-- Anime eye shape - large iris -->
  <ellipse cx="108" cy="138" rx="10" ry="8" fill="#aa44ff" opacity="0.8"/>
  <ellipse cx="108" cy="138" rx="6" ry="5" fill="#cc88ff"/>
  <!-- Big highlight 1 -->
  <ellipse cx="104" cy="134" rx="3.5" ry="3" fill="#ffffff" opacity="0.95"/>
  <!-- Highlight 2 -->
  <circle cx="112" cy="140" r="2" fill="#ffffff" opacity="0.7"/>
  <!-- Highlight 3 -->
  <circle cx="106" cy="142" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Large anime glowing eyes - right -->
  <ellipse cx="148" cy="138" rx="14" ry="10" fill="url(#gd-eye-glow)" filter="url(#gd-glow)"/>
  <ellipse cx="148" cy="138" rx="10" ry="8" fill="#aa44ff" opacity="0.8"/>
  <ellipse cx="148" cy="138" rx="6" ry="5" fill="#cc88ff"/>
  <ellipse cx="144" cy="134" rx="3.5" ry="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="152" cy="140" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="146" cy="142" r="1.2" fill="#ffffff" opacity="0.5"/>

  <!-- Ambient eye glow -->
  <ellipse cx="128" cy="138" rx="40" ry="26" fill="#aa44ff" opacity="0.08" filter="url(#gd-glow-soft)"/>

  <!-- Cloak fold lines -->
  <path d="M88,220 C93,260 91,300 88,350" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>
  <path d="M128,208 C128,250 130,300 128,360" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.15"/>
  <path d="M168,220 C163,260 165,300 168,350" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.2"/>

  <!-- Shoulder definition -->
  <path d="M56,185 C62,172 82,162 100,166" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>
  <path d="M200,185 C194,172 174,162 156,166" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Reflective patches -->
  <ellipse cx="74" cy="270" rx="15" ry="30" fill="#aa44ff" opacity="0.04" transform="rotate(-10,74,270)"/>
  <ellipse cx="184" cy="240" rx="12" ry="25" fill="#aa44ff" opacity="0.05" transform="rotate(8,184,240)"/>

  <!-- Ambient particles -->
  <circle cx="42" cy="210" r="1" fill="#aa44ff" opacity="0.4"/>
  <circle cx="214" cy="190" r="1.5" fill="#aa44ff" opacity="0.3"/>
  <circle cx="56" cy="310" r="1" fill="#7722cc" opacity="0.5"/>
  <circle cx="198" cy="320" r="0.8" fill="#aa44ff" opacity="0.35"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[default]</text>
</svg>