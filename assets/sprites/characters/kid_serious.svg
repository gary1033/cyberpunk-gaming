<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="100%" stop-color="#06061a"/>
    </radialGradient>
    <radialGradient id="iris-l" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#77bb55"/>
      <stop offset="40%" stop-color="#449933"/>
      <stop offset="100%" stop-color="#1a5518"/>
    </radialGradient>
    <radialGradient id="iris-r" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#77bb55"/>
      <stop offset="40%" stop-color="#449933"/>
      <stop offset="100%" stop-color="#1a5518"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182028"/>
      <stop offset="50%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="hoodie-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080e14"/>
      <stop offset="100%" stop-color="#060a10"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00bbee"/>
      <stop offset="50%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#005599"/>
    </linearGradient>
    <linearGradient id="hair-shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#77ddee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0099cc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background - darker -->
