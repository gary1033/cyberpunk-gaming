<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="ks-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#081608"/>
      <stop offset="100%" stop-color="#06061a"/>
    </radialGradient>
    <radialGradient id="ks-iris-l" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#44dd66"/>
      <stop offset="40%" stop-color="#1abb33"/>
      <stop offset="100%" stop-color="#085518"/>
    </radialGradient>
    <radialGradient id="ks-iris-r" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#44dd66"/>
      <stop offset="40%" stop-color="#1abb33"/>
      <stop offset="100%" stop-color="#085518"/>
    </radialGradient>
    <linearGradient id="ks-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a281a"/>
      <stop offset="50%" stop-color="#122212"/>
      <stop offset="100%" stop-color="#0a180a"/>
    </linearGradient>
    <linearGradient id="ks-hoodie-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a140a"/>
      <stop offset="100%" stop-color="#061006"/>
    </linearGradient>
    <linearGradient id="ks-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00bbee"/>
      <stop offset="50%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#005599"/>
    </linearGradient>
    <linearGradient id="ks-hair-shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#77ddee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0099cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ks-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <linearGradient id="ks-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44ff88"/>
      <stop offset="50%" stop-color="#00ff44"/>
      <stop offset="100%" stop-color="#44ff88"/>
    </linearGradient>
    <linearGradient id="ks-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff44" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#44ff88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ff44" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background - slightly darker, more serious -->
  <rect width="256" height="384" fill="url(#ks-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#ks-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00ff44" text-anchor="middle" filter="url(#glow)">小鬼</text>

  <!-- Hoodie body - standing straight, squared -->
  <path d="M55,182 C55,168 70,154 88,148 L108,142 C116,139 122,138 128,137 C134,138 140,139 148,142 L168,148 C186,154 201,168 201,182 L207,278 C209,318 205,350 201,372 L55,372 C51,350 47,318 49,278 Z" fill="url(#ks-hoodie)"/>
  <!-- Hoodie shadow -->
  <path d="M55,182 C55,168 70,154 88,148 L108,142 C116,139 122,138 128,137 L128,372 L55,372 C51,350 47,318 49,278 Z" fill="url(#ks-hoodie-shadow)" opacity="0.3"/>
  <!-- Neon patches - subdued -->
  <path d="M68,200 L78,200 L78,240 L68,240 Z" fill="#00ff44" opacity="0.08"/>
  <path d="M178,200 L188,200 L188,240 L178,240 Z" fill="#00ff44" opacity="0.08"/>
  <path d="M58,186 Q60,225 56,268" fill="none" stroke="#00ff44" stroke-width="2" opacity="0.1"/>
  <path d="M198,186 Q196,225 200,268" fill="none" stroke="#00ff44" stroke-width="2" opacity="0.1"/>

  <!-- Hoodie pocket -->
  <path d="M88,262 L168,262 L170,298 C170,308 162,314 128,314 C94,314 86,308 86,298 Z" fill="#0a180a" opacity="0.6"/>
  <path d="M88,262 L168,262" fill="none" stroke="#00ff44" stroke-width="0.5" opacity="0.18"/>

  <!-- Center seam -->
  <path d="M128,166 L128,372" fill="none" stroke="#00ff44" stroke-width="0.3" opacity="0.08"/>

  <!-- Drawstrings -->
  <line x1="120" y1="166" x2="117" y2="204" stroke="#00ff44" stroke-width="0.8" opacity="0.2"/>
  <line x1="136" y1="166" x2="139" y2="204" stroke="#00ff44" stroke-width="0.8" opacity="0.2"/>
  <rect x="115" y="202" width="4" height="6" rx="1" fill="#00ff44" opacity="0.25"/>
  <rect x="137" y="202" width="4" height="6" rx="1" fill="#00ff44" opacity="0.25"/>

  <!-- T-shirt collar -->
  <path d="M112,156 C118,150 124,148 128,147 C132,148 138,150 144,156" fill="#1a1a2a"/>

  <!-- Neck -->
  <path d="M118,132 L118,152 C118,155 122,157 128,157 C134,157 138,155 138,152 L138,132" fill="#f0cba8"/>
  <path d="M118,132 L118,152 C118,155 122,157 128,157 L128,132" fill="#d4ad8a" opacity="0.3"/>

  <!-- Hoodie hood behind neck -->
  <path d="M104,138 C110,145 118,148 128,148 C138,148 146,145 152,138 L156,145 C156,155 146,163 128,164 C110,163 100,155 100,145 Z" fill="#1a281a"/>

  <!-- Head shape -->
  <path d="M94,80 C94,50 108,36 128,34 C148,36 162,50 162,80 L162,114 C162,136 148,148 128,148 C108,148 94,136 94,114 Z" fill="#f0cba8"/>
  <!-- Face shadow -->
  <path d="M94,80 C94,50 108,36 128,34 L128,148 C108,148 94,136 94,114 Z" fill="#d4ad8a" opacity="0.2"/>

  <!-- Hair - electric blue, slightly flatter (serious posture) -->
  <path d="M92,78 C92,46 108,28 128,26 C148,28 164,46 164,78" fill="url(#ks-hair)"/>
  <!-- Spikes - less wild than default -->
  <path d="M106,34 L100,18 L114,30" fill="url(#ks-hair)"/>
  <path d="M120,28 L114,10 L126,24" fill="url(#ks-hair)"/>
  <path d="M136,27 L142,8 L146,24" fill="url(#ks-hair)"/>
  <path d="M150,32 L160,16 L158,30" fill="url(#ks-hair)"/>
  <path d="M92,58 L84,50 L92,68" fill="url(#ks-hair)"/>
  <path d="M164,58 L172,50 L164,68" fill="url(#ks-hair)"/>
  <!-- Hair sides -->
  <path d="M92,76 C92,64 94,52 100,44" fill="none" stroke="#0077aa" stroke-width="4"/>
  <path d="M164,76 C164,64 162,52 156,44" fill="none" stroke="#0077aa" stroke-width="4"/>
  <!-- Hair shine - smaller for serious mood -->
  <path d="M110,30 C116,26 124,24 128,26 C122,30 114,40 110,50 Z" fill="url(#ks-hair-shine)"/>
  <!-- Strand details -->
  <path d="M102,40 Q100,50 102,62" fill="none" stroke="#0099cc" stroke-width="1.8" opacity="0.45"/>
  <path d="M154,38 Q156,48 154,60" fill="none" stroke="#0099cc" stroke-width="1.8" opacity="0.45"/>

  <!-- VR Goggles PULLED DOWN over eyes - serious mode -->
  <path d="M92,84 C92,74 104,68 128,68 C152,68 164,74 164,84 L164,102 C164,108 152,113 128,113 C104,113 92,108 92,102 Z" fill="url(#ks-goggles)"/>
  <!-- Goggle strap -->
  <path d="M88,92 L92,92" fill="none" stroke="#3a3a4a" stroke-width="4.5"/>
  <path d="M164,92 L168,92" fill="none" stroke="#3a3a4a" stroke-width="4.5"/>
  <!-- Active goggle lenses - glowing, covering eyes -->
  <ellipse cx="114" cy="93" rx="14" ry="10" fill="#0a0a18"/>
  <ellipse cx="114" cy="93" rx="11" ry="8" fill="url(#ks-goggle-lens)" opacity="0.45" filter="url(#glow)"/>
  <ellipse cx="142" cy="93" rx="14" ry="10" fill="#0a0a18"/>
  <ellipse cx="142" cy="93" rx="11" ry="8" fill="url(#ks-goggle-lens)" opacity="0.45" filter="url(#glow)"/>
  <!-- Active rims - bright glow -->
  <ellipse cx="114" cy="93" rx="14" ry="10" fill="none" stroke="#00ff44" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="142" cy="93" rx="14" ry="10" fill="none" stroke="#00ff44" stroke-width="1.5" opacity="0.6"/>
  <!-- Goggle bridge -->
  <path d="M128,93 L128,93" fill="none" stroke="#3a3a4a" stroke-width="3"/>
  <!-- Data readout lines inside lenses -->
  <line x1="104" y1="88" x2="124" y2="88" stroke="#00ff44" stroke-width="0.6" opacity="0.3"/>
  <line x1="106" y1="93" x2="120" y2="93" stroke="#00ff44" stroke-width="0.5" opacity="0.25"/>
  <line x1="108" y1="97" x2="118" y2="97" stroke="#00ff44" stroke-width="0.4" opacity="0.2"/>
  <line x1="132" y1="88" x2="152" y2="88" stroke="#00ff44" stroke-width="0.6" opacity="0.3"/>
  <line x1="134" y1="93" x2="148" y2="93" stroke="#00ff44" stroke-width="0.5" opacity="0.25"/>
  <line x1="136" y1="97" x2="146" y2="97" stroke="#00ff44" stroke-width="0.4" opacity="0.2"/>
  <!-- Targeting reticle -->
  <circle cx="114" cy="93" r="4" fill="none" stroke="#00ff44" stroke-width="0.4" opacity="0.2"/>
  <circle cx="142" cy="93" r="4" fill="none" stroke="#00ff44" stroke-width="0.4" opacity="0.2"/>
  <line x1="114" y1="87" x2="114" y2="89" stroke="#00ff44" stroke-width="0.3" opacity="0.2"/>
  <line x1="114" y1="97" x2="114" y2="99" stroke="#00ff44" stroke-width="0.3" opacity="0.2"/>
  <line x1="142" y1="87" x2="142" y2="89" stroke="#00ff44" stroke-width="0.3" opacity="0.2"/>
  <line x1="142" y1="97" x2="142" y2="99" stroke="#00ff44" stroke-width="0.3" opacity="0.2"/>

  <!-- Goggle glow on cheeks -->
  <ellipse cx="114" cy="112" rx="16" ry="8" fill="#00ff44" opacity="0.04" filter="url(#glow-soft)"/>
  <ellipse cx="142" cy="112" rx="16" ry="8" fill="#00ff44" opacity="0.04" filter="url(#glow-soft)"/>

  <!-- Ears - partially covered by strap -->
  <ellipse cx="89" cy="98" rx="5" ry="8" fill="#e0b890"/>
  <ellipse cx="167" cy="98" rx="5" ry="8" fill="#e0b890"/>
  <circle cx="88" cy="94" r="1.5" fill="#00ff44" opacity="0.4"/>

  <!-- Nose -->
  <circle cx="128" cy="118" r="2" fill="#d4ad8a" opacity="0.45"/>

  <!-- Mouth - pressed thin, serious/focused -->
  <path d="M118,126 C123,124 128,124 133,124 C138,126 138,126 138,126" fill="none" stroke="#8a6848" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Firm set of jaw -->
  <path d="M120,127 Q128,128 136,127" fill="none" stroke="#8a6848" stroke-width="0.6" opacity="0.3"/>

  <!-- Freckles -->
  <circle cx="106" cy="116" r="0.8" fill="#d4ad8a" opacity="0.25"/>
  <circle cx="150" cy="116" r="0.8" fill="#d4ad8a" opacity="0.25"/>

  <!-- Shoulders - squared, focused -->
  <path d="M55,182 C60,170 73,160 88,156" fill="none" stroke="#00ff44" stroke-width="0.6" opacity="0.2"/>
  <path d="M201,182 C196,170 183,160 168,156" fill="none" stroke="#00ff44" stroke-width="0.6" opacity="0.2"/>

  <!-- Holographic display - multiple panels (hacking mode) -->
  <rect x="22" y="186" width="32" height="22" rx="2" fill="#00ff44" opacity="0.05" filter="url(#glow-soft)"/>
  <line x1="26" y1="192" x2="48" y2="192" stroke="#00ff44" stroke-width="0.5" opacity="0.15"/>
  <line x1="26" y1="196" x2="44" y2="196" stroke="#00ff44" stroke-width="0.4" opacity="0.12"/>
  <line x1="26" y1="200" x2="46" y2="200" stroke="#00ff44" stroke-width="0.4" opacity="0.12"/>
  <rect x="22" y="186" width="32" height="22" rx="2" fill="none" stroke="#00ff44" stroke-width="0.4" opacity="0.15"/>

  <rect x="202" y="182" width="32" height="22" rx="2" fill="#00ff44" opacity="0.05" filter="url(#glow-soft)"/>
  <line x1="206" y1="188" x2="228" y2="188" stroke="#00ff44" stroke-width="0.5" opacity="0.15"/>
  <line x1="206" y1="192" x2="224" y2="192" stroke="#00ff44" stroke-width="0.4" opacity="0.12"/>
  <line x1="206" y1="196" x2="226" y2="196" stroke="#00ff44" stroke-width="0.4" opacity="0.12"/>
  <rect x="202" y="182" width="32" height="22" rx="2" fill="none" stroke="#00ff44" stroke-width="0.4" opacity="0.15"/>

  <!-- Ambient particles - subdued -->
  <circle cx="38" cy="240" r="0.8" fill="#00ff44" opacity="0.3"/>
  <circle cx="218" cy="250" r="1" fill="#00ff44" opacity="0.25"/>
  <circle cx="52" cy="310" r="0.7" fill="#44ff88" opacity="0.25"/>
  <circle cx="204" cy="300" r="0.8" fill="#00ff44" opacity="0.2"/>

  <!-- Expression label -->
  <text x="128" y="368" font-family="'Courier New', monospace" font-size="10" fill="#00ff44" text-anchor="middle" opacity="0.5">SERIOUS</text>
</svg>