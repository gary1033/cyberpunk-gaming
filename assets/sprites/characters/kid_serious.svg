<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="ks-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c1608"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="ks-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182618"/>
      <stop offset="50%" stop-color="#122012"/>
      <stop offset="100%" stop-color="#0a160a"/>
    </linearGradient>
    <linearGradient id="ks-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#d0b088"/>
    </linearGradient>
    <linearGradient id="ks-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="ks-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="ks-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44cc00"/>
      <stop offset="50%" stop-color="#88ff00"/>
      <stop offset="100%" stop-color="#44cc00"/>
    </linearGradient>
    <filter id="ks-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ks-glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ks-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#44cc00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background - slightly darker, more serious -->
  <rect width="256" height="384" fill="url(#ks-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#ks-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#88ff00" text-anchor="middle" filter="url(#ks-glow)">小鬼</text>

  <!-- Hoodie body - standing straight -->
  <path d="M58,180 C58,168 72,155 88,150 L108,144 C116,141 122,140 128,139 C134,140 140,141 148,144 L168,150 C184,155 198,168 198,180 L204,275 C206,315 202,348 198,370 L58,370 C54,348 50,315 52,275 Z" fill="url(#ks-hoodie)"/>
  <!-- Neon patches - subdued -->
  <path d="M68,200 L78,200 L78,230 L68,230 Z" fill="#88ff00" opacity="0.08"/>
  <path d="M178,200 L188,200 L188,230 L178,230 Z" fill="#88ff00" opacity="0.08"/>
  <path d="M60,185 Q62,220 58,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.1"/>
  <path d="M196,185 Q194,220 198,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.1"/>
  <path d="M80,210 L176,210" fill="none" stroke="#88ff00" stroke-width="1.5" opacity="0.07"/>

  <!-- Hoodie pocket -->
  <path d="M90,260 L166,260 L168,295 C168,305 160,310 128,310 C96,310 88,305 88,295 Z" fill="#0a160a" opacity="0.6"/>
  <path d="M90,260 L166,260" fill="none" stroke="#88ff00" stroke-width="0.5" opacity="0.18"/>

  <!-- Hoodie seam -->
  <path d="M128,165 L128,370" fill="none" stroke="#88ff00" stroke-width="0.3" opacity="0.08"/>

  <!-- Drawstrings -->
  <line x1="120" y1="165" x2="118" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.2"/>
  <line x1="136" y1="165" x2="138" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.2"/>
  <rect x="116" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.25"/>
  <rect x="136" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.25"/>

  <!-- T-shirt collar -->
  <path d="M112,155 C118,150 124,148 128,147 C132,148 138,150 144,155" fill="#1a1a28"/>

  <!-- Neck -->
  <path d="M118,132 L118,150 C118,153 122,155 128,155 C134,155 138,153 138,150 L138,132" fill="url(#ks-skin)"/>

  <!-- Hoodie hood behind neck -->
  <path d="M105,138 C110,145 118,148 128,148 C138,148 146,145 151,138 L155,145 C155,155 145,162 128,163 C111,162 101,155 101,145 Z" fill="#182618"/>

  <!-- Head shape -->
  <path d="M98,82 C98,55 110,42 128,40 C146,42 158,55 158,82 L158,112 C158,132 146,142 128,142 C110,142 98,132 98,112 Z" fill="url(#ks-skin)"/>

  <!-- Hair - messy but flattened by pulled-down goggles -->
  <path d="M96,80 C96,52 110,36 128,34 C146,36 160,52 160,80" fill="url(#ks-hair)"/>
  <!-- Spikes compressed by goggle strap -->
  <path d="M108,40 L106,30 L112,36" fill="url(#ks-hair)"/>
  <path d="M122,37 L120,26 L126,34" fill="url(#ks-hair)"/>
  <path d="M136,36 L138,24 L140,34" fill="url(#ks-hair)"/>
  <path d="M148,39 L152,28 L152,37" fill="url(#ks-hair)"/>
  <path d="M96,78 C96,68 98,58 102,52" fill="none" stroke="#1a1008" stroke-width="3"/>
  <path d="M160,78 C160,68 158,58 154,52" fill="none" stroke="#1a1008" stroke-width="3"/>
  <!-- Brown strand detail -->
  <path d="M106,44 Q104,52 106,62" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.5"/>
  <path d="M150,42 Q152,50 150,60" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.5"/>

  <!-- VR Goggles PULLED DOWN over eyes - serious mode -->
  <path d="M96,82 C96,74 106,68 128,68 C150,68 160,74 160,82 L160,98 C160,104 150,108 128,108 C106,108 96,104 96,98 Z" fill="url(#ks-goggles)"/>
  <!-- Goggle strap going around head -->
  <path d="M92,88 L96,88" fill="none" stroke="#2a2a3a" stroke-width="4"/>
  <path d="M160,88 L164,88" fill="none" stroke="#2a2a3a" stroke-width="4"/>
  <!-- Goggle lenses - glowing active, covering eyes -->
  <ellipse cx="114" cy="90" rx="12" ry="9" fill="#0a0a14"/>
  <ellipse cx="114" cy="90" rx="10" ry="7" fill="url(#ks-goggle-lens)" opacity="0.5" filter="url(#ks-glow)"/>
  <ellipse cx="142" cy="90" rx="12" ry="9" fill="#0a0a14"/>
  <ellipse cx="142" cy="90" rx="10" ry="7" fill="url(#ks-goggle-lens)" opacity="0.5" filter="url(#ks-glow)"/>
  <!-- Active goggle rims - brighter glow -->
  <ellipse cx="114" cy="90" rx="12" ry="9" fill="none" stroke="#88ff00" stroke-width="1.2" opacity="0.6"/>
  <ellipse cx="142" cy="90" rx="12" ry="9" fill="none" stroke="#88ff00" stroke-width="1.2" opacity="0.6"/>
  <!-- Goggle bridge -->
  <path d="M126,90 L130,90" fill="none" stroke="#2a2a3a" stroke-width="3"/>
  <!-- Data readout lines inside lenses -->
  <line x1="106" y1="86" x2="122" y2="86" stroke="#88ff00" stroke-width="0.5" opacity="0.3"/>
  <line x1="108" y1="90" x2="118" y2="90" stroke="#88ff00" stroke-width="0.4" opacity="0.25"/>
  <line x1="134" y1="86" x2="150" y2="86" stroke="#88ff00" stroke-width="0.5" opacity="0.3"/>
  <line x1="136" y1="90" x2="146" y2="90" stroke="#88ff00" stroke-width="0.4" opacity="0.25"/>
  <!-- Tiny data dots -->
  <circle cx="108" cy="93" r="0.5" fill="#88ff00" opacity="0.35"/>
  <circle cx="112" cy="93" r="0.5" fill="#88ff00" opacity="0.25"/>
  <circle cx="138" cy="93" r="0.5" fill="#88ff00" opacity="0.35"/>
  <circle cx="142" cy="93" r="0.5" fill="#88ff00" opacity="0.25"/>

  <!-- Goggle glow on cheeks -->
  <ellipse cx="114" cy="108" rx="14" ry="8" fill="#88ff00" opacity="0.04" filter="url(#ks-glow-soft)"/>
  <ellipse cx="142" cy="108" rx="14" ry="8" fill="#88ff00" opacity="0.04" filter="url(#ks-glow-soft)"/>

  <!-- Ears - partially covered by strap -->
  <ellipse cx="93" cy="95" rx="5" ry="7" fill="#d0b088"/>
  <ellipse cx="163" cy="95" rx="5" ry="7" fill="#d0b088"/>
  <circle cx="92" cy="92" r="1.2" fill="#88ff00" opacity="0.4"/>

  <!-- Nose -->
  <path d="M128,100 L126,112 L128,114 L130,112" fill="none" stroke="#c0a078" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - pressed thin, serious/focused -->
  <path d="M118,122 C122,120 128,120 134,120 C138,122 138,122 138,122" fill="none" stroke="#a08060" stroke-width="1.3"/>
  <!-- Slight tension at corners -->
  <path d="M118,122 Q116,123 115,122" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>
  <path d="M138,122 Q140,123 141,122" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>

  <!-- Freckles -->
  <circle cx="108" cy="110" r="0.8" fill="#c0a078" opacity="0.25"/>
  <circle cx="148" cy="110" r="0.8" fill="#c0a078" opacity="0.25"/>

  <!-- Shoulders - squared, focused -->
  <path d="M58,180 C63,170 75,162 88,158" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.2"/>
  <path d="M198,180 C193,170 181,162 168,158" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.2"/>

  <!-- Neon shoulder patches -->
  <rect x="64" y="175" width="8" height="12" rx="1" fill="#88ff00" opacity="0.06"/>
  <rect x="184" y="175" width="8" height="12" rx="1" fill="#88ff00" opacity="0.06"/>

  <!-- Ambient particles - subdued -->
  <circle cx="40" cy="198" r="0.8" fill="#88ff00" opacity="0.3"/>
  <circle cx="216" cy="178" r="1" fill="#88ff00" opacity="0.25"/>
  <circle cx="55" cy="308" r="0.7" fill="#44cc00" opacity="0.25"/>
  <circle cx="202" cy="298" r="0.8" fill="#88ff00" opacity="0.2"/>
</svg>