<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="zs-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="zs-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0e0e20"/>
    </linearGradient>
    <linearGradient id="zs-lapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222240"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
    <linearGradient id="zs-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#c8c8d8"/>
    </linearGradient>
    <linearGradient id="zs-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c49464"/>
    </linearGradient>
    <linearGradient id="zs-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <linearGradient id="zs-tie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="50%" stop-color="#dd8800"/>
      <stop offset="100%" stop-color="#cc7700"/>
    </linearGradient>
    <filter id="zs-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="zs-glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="zs-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#dd8800" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#zs-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#zs-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ffaa00" text-anchor="middle" filter="url(#zs-glow)">趙明</text>

  <!-- Suit body -->
  <path d="M55,195 C55,180 70,168 85,162 L105,155 C115,152 122,150 128,149 C134,150 141,152 151,155 L171,162 C186,168 201,180 201,195 L208,280 C210,320 206,350 202,370 L54,370 C50,350 46,320 48,280 Z" fill="url(#zs-suit)"/>

  <!-- Suit lapels -->
  <path d="M105,155 L90,175 L95,220 L118,195 L128,180 Z" fill="url(#zs-lapel)"/>
  <path d="M105,155 L90,175 L95,220" fill="none" stroke="#ffaa00" stroke-width="0.6" opacity="0.3"/>
  <path d="M151,155 L166,175 L161,220 L138,195 L128,180 Z" fill="url(#zs-lapel)"/>
  <path d="M151,155 L166,175 L161,220" fill="none" stroke="#ffaa00" stroke-width="0.6" opacity="0.3"/>

  <!-- White shirt -->
  <path d="M118,195 L128,180 L138,195 L135,250 L121,250 Z" fill="url(#zs-shirt)"/>

  <!-- Tie -->
  <path d="M125,182 L128,180 L131,182 L130,240 L128,245 L126,240 Z" fill="url(#zs-tie)"/>

  <!-- Corporate pin -->
  <circle cx="100" cy="185" r="4" fill="#ffcc44" filter="url(#zs-glow)"/>
  <text x="100" y="187" font-family="monospace" font-size="5" fill="#1a1a2e" text-anchor="middle">ZT</text>

  <!-- Neck -->
  <path d="M115,148 L115,165 C115,170 120,175 128,175 C136,175 141,170 141,165 L141,148" fill="url(#zs-skin)"/>
  <path d="M110,158 C115,153 120,150 128,149 C136,150 141,153 146,158" fill="none" stroke="#c8c8d8" stroke-width="2" opacity="0.8"/>

  <!-- Head shape -->
  <path d="M100,95 C100,68 112,50 128,48 C144,50 156,68 156,95 L156,125 C156,145 144,155 128,155 C112,155 100,145 100,125 Z" fill="url(#zs-skin)"/>

  <!-- Hair - neat -->
  <path d="M100,85 C100,60 112,42 128,40 C144,42 156,60 156,85" fill="url(#zs-hair)"/>
  <path d="M98,90 C98,80 100,72 104,68" fill="none" stroke="#0e0e18" stroke-width="3"/>
  <path d="M158,90 C158,80 156,72 152,68" fill="none" stroke="#0e0e18" stroke-width="3"/>
  <path d="M115,50 C120,46 126,44 134,46" fill="none" stroke="#2a2a3a" stroke-width="1.5" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="97" cy="108" rx="5" ry="8" fill="#c49464"/>
  <ellipse cx="97" cy="108" rx="3" ry="5" fill="#b48454" opacity="0.5"/>
  <ellipse cx="159" cy="108" rx="5" ry="8" fill="#c49464"/>
  <ellipse cx="159" cy="108" rx="3" ry="5" fill="#b48454" opacity="0.5"/>

  <!-- Cybernetic ear implant -->
  <path d="M160,104 L165,100 L166,108 L165,116 L160,112" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.6"/>
  <circle cx="165" cy="108" r="1.5" fill="#ffaa00" opacity="0.5"/>

  <!-- Eyebrows - relaxed, open -->
  <path d="M107,92 C110,90 116,89 122,90" fill="none" stroke="#1a1a2a" stroke-width="1.8" opacity="0.75"/>
  <path d="M134,90 C140,89 146,90 149,92" fill="none" stroke="#1a1a2a" stroke-width="1.8" opacity="0.75"/>

  <!-- Eyes - soft warm genuine -->
  <ellipse cx="115" cy="100" rx="8" ry="5.5" fill="#e8e8f0"/>
  <ellipse cx="115" cy="100" rx="4.2" ry="4.2" fill="#2a1a08"/>
  <ellipse cx="115" cy="100" rx="2" ry="2" fill="#0a0a0a"/>
  <circle cx="113" cy="99" r="1" fill="#ffffff" opacity="0.85"/>
  <!-- Soft eye crinkle -->
  <path d="M106,103 C107,105 108,106 110,106" fill="none" stroke="#b48454" stroke-width="0.5" opacity="0.3"/>

  <ellipse cx="141" cy="100" rx="8" ry="5.5" fill="#e8e8f0"/>
  <ellipse cx="141" cy="100" rx="4.2" ry="4.2" fill="#2a1a08"/>
  <ellipse cx="141" cy="100" rx="2" ry="2" fill="#0a0a0a"/>
  <circle cx="139" cy="99" r="1" fill="#ffffff" opacity="0.85"/>
  <!-- Soft eye crinkle -->
  <path d="M150,103 C149,105 148,106 146,106" fill="none" stroke="#b48454" stroke-width="0.5" opacity="0.3"/>

  <!-- Nose -->
  <path d="M128,102 L125,118 L128,120 L131,118" fill="none" stroke="#b48454" stroke-width="1" opacity="0.5"/>

  <!-- Mouth - genuine small warm smile -->
  <path d="M118,130 C122,134 128,136 134,134 C137,132 138,130 138,130" fill="none" stroke="#a07050" stroke-width="1.2"/>
  <path d="M120,130 C124,128 132,128 136,130" fill="none" stroke="#c49464" stroke-width="0.5" opacity="0.4"/>
  <!-- Slight dimples -->
  <circle cx="116" cy="131" r="1" fill="#b48454" opacity="0.15"/>
  <circle cx="140" cy="131" r="1" fill="#b48454" opacity="0.15"/>

  <!-- Jawline -->
  <path d="M100,125 C102,140 112,150 128,155" fill="none" stroke="#b48454" stroke-width="0.6" opacity="0.3"/>
  <path d="M156,125 C154,140 144,150 128,155" fill="none" stroke="#b48454" stroke-width="0.6" opacity="0.3"/>

  <!-- Suit shoulders -->
  <path d="M55,195 C60,185 72,175 85,170" fill="none" stroke="#ffaa00" stroke-width="0.6" opacity="0.25"/>
  <path d="M201,195 C196,185 184,175 171,170" fill="none" stroke="#ffaa00" stroke-width="0.6" opacity="0.25"/>

  <!-- Pocket square -->
  <path d="M165,195 L170,190 L175,195 L172,200 L168,200 Z" fill="#ffaa00" opacity="0.4"/>

  <!-- Suit fabric lines -->
  <path d="M80,220 C85,260 82,310 80,360" fill="none" stroke="#ffaa00" stroke-width="0.4" opacity="0.12"/>
  <path d="M176,220 C171,260 174,310 176,360" fill="none" stroke="#ffaa00" stroke-width="0.4" opacity="0.12"/>

  <!-- Temple cybernetic -->
  <path d="M100,90 L96,95 L95,102" fill="none" stroke="#ffaa00" stroke-width="0.6" opacity="0.3"/>

  <!-- Warm ambient glow -->
  <ellipse cx="128" cy="120" rx="40" ry="30" fill="#ffaa00" opacity="0.03" filter="url(#zs-glow-soft)"/>

  <!-- Ambient particles -->
  <circle cx="40" cy="200" r="1" fill="#ffaa00" opacity="0.35"/>
  <circle cx="215" cy="180" r="1.2" fill="#ffaa00" opacity="0.3"/>
  <circle cx="55" cy="310" r="0.8" fill="#dd8800" opacity="0.3"/>
  <circle cx="200" cy="300" r="1" fill="#ffaa00" opacity="0.25"/>
  <circle cx="30" cy="270" r="0.8" fill="#ffcc44" opacity="0.2"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#ffaa00" text-anchor="middle" opacity="0.5">[sincere]</text>
</svg>