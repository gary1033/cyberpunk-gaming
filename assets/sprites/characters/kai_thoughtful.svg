  <path d="M118,189 Q130,192 140,189" fill="none" stroke="#a87a6a" stroke-width="0.6" opacity="0.35"/>

  <!-- STUBBLE -->
  <circle cx="118" cy="200" r="0.5" fill="#8a8a92" opacity="0.4"/>
  <circle cx="124" cy="202" r="0.5" fill="#8a8a92" opacity="0.35"/>
  <circle cx="130" cy="204" r="0.5" fill="#8a8a92" opacity="0.4"/>
  <circle cx="136" cy="202" r="0.5" fill="#8a8a92" opacity="0.35"/>
  <circle cx="142" cy="200" r="0.5" fill="#8a8a92" opacity="0.4"/>
  <circle cx="121" cy="206" r="0.45" fill="#8a8a92" opacity="0.3"/>
  <circle cx="127" cy="208" r="0.45" fill="#8a8a92" opacity="0.3"/>
  <circle cx="133" cy="208" r="0.45" fill="#8a8a92" opacity="0.3"/>
  <circle cx="139" cy="206" r="0.45" fill="#8a8a92" opacity="0.3"/>
  <circle cx="115" cy="196" r="0.4" fill="#8a8a92" opacity="0.3"/>
  <circle cx="143" cy="196" r="0.4" fill="#8a8a92" opacity="0.3"/>

  <!-- AMBIENT -->
