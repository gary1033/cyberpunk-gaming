  <!-- Fingers curled -->
  <path d="M93,208 Q91,204 93,202 Q95,200 97,202 L97,207" fill="url(#skinGrad)" stroke="#b07a55" stroke-width="0.4"/>
  <path d="M97,207 Q95,202 97,200 Q99,198 101,200 L101,206" fill="url(#skinGrad)" stroke="#b07a55" stroke-width="0.4"/>
  <path d="M101,206 Q99,202 101,200 Q103,198 105,200 L105,206" fill="url(#skinGrad)" stroke="#b07a55" stroke-width="0.4"/>
  <!-- Thumb toward chin -->
  <path d="M105,212 Q107,208 109,206 Q110,205 109,208" fill="url(#skinGrad)" stroke="#b07a55" stroke-width="0.4"/>
