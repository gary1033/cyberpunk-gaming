  <rect x="5" y="5" width="246" height="374" rx="5" fill="none" stroke="#00e5e5" stroke-width="0.3" opacity="0.2"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="20" fill="#00e5e5" text-anchor="middle" filter="url(#neonGlow)" opacity="0.9">凱</text>

  <!-- === COAT / BODY === -->
  <path d="M55,265 Q58,245 80,234 L95,228 Q110,222 128,220 Q146,222 161,228 L176,234 Q198,245 201,265 L208,384 L48,384 Z" fill="url(#coatGrad)" stroke="#1a1a36" stroke-width="0.5"/>
  <path d="M60,260 Q68,248 82,240 L90,245 Q75,255 70,268 Z" fill="url(#coatLight)" opacity="0.4"/>
  <path d="M196,260 Q188,248 174,240 L166,245 Q181,255 186,268 Z" fill="url(#coatLight)" opacity="0.4"/>
  <path d="M88,234 L76,258 L104,252 L114,232 Z" fill="#222240" stroke="#2a2a4e" stroke-width="0.5"/>
  <path d="M168,234 L180,258 L152,252 L142,232 Z" fill="#222240" stroke="#2a2a4e" stroke-width="0.5"/>
  <path d="M78,256 L68,222 L84,218 L94,242 Z" fill="#1c1c36" stroke="#2a2a4e" stroke-width="0.5"/>
  <path d="M178,256 L188,222 L172,218 L162,242 Z" fill="#1c1c36" stroke="#2a2a4e" stroke-width="0.5"/>
