  <path d="M108,232 Q118,238 128,240 Q138,238 148,232 L146,248 Q138,254 128,255 Q118,254 110,248 Z" fill="url(#shirtGrad)"/>
  <line x1="72" y1="272" x2="72" y2="384" stroke="#00e5e5" stroke-width="0.7" opacity="0.25" filter="url(#neonGlow)"/>
  <line x1="184" y1="272" x2="184" y2="384" stroke="#00e5e5" stroke-width="0.7" opacity="0.25" filter="url(#neonGlow)"/>
  <path d="M66,252 Q128,234 190,252" fill="none" stroke="#ff00aa" stroke-width="0.5" opacity="0.2" filter="url(#neonGlow)"/>
  <path d="M176,310 L151,308 L151,330 L176,332 Z" fill="none" stroke="#2a2a4e" stroke-width="0.6" opacity="0.5"/>

  <!-- === HAND NEAR CHIN (right arm raised) === -->
  <!-- Arm from coat -->
  <path d="M92,272 Q86,256 82,242 Q80,232 86,224" fill="url(#coatGrad)" stroke="#1a1a36" stroke-width="0.5"/>
  <!-- Sleeve cuff -->
  <path d="M86,224 Q90,219 98,216 L104,214 Q98,220 93,226" fill="#222240" stroke="#2a2a4e" stroke-width="0.4"/>
