<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141430"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c08a60"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e8e8f0"/>
      <stop offset="70%" stop-color="#d0d0dc"/>
      <stop offset="100%" stop-color="#c0c0d0"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0ea"/>
    </linearGradient>
    <linearGradient id="hairShadow" x1="0.5" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b8c8"/>
      <stop offset="100%" stop-color="#a0a0b4"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c32"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <linearGradient id="coatLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24243e"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#14142a"/>
    </linearGradient>
    <radialGradient id="cyberIrisDim" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00bbcc"/>
      <stop offset="50%" stop-color="#008899"/>
      <stop offset="100%" stop-color="#004455"/>
    </radialGradient>
    <filter id="glowCyanDim" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyanSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>

  <!-- Background circuit pattern -->
  <line x1="18" y1="40" x2="18" y2="384" stroke="#00e5e5" stroke-width="0.3" opacity="0.12"/>
  <line x1="50" y1="0" x2="50" y2="180" stroke="#ff00aa" stroke-width="0.3" opacity="0.08"/>
  <line x1="206" y1="90" x2="206" y2="384" stroke="#00e5e5" stroke-width="0.3" opacity="0.1"/>
  <line x1="238" y1="0" x2="238" y2="280" stroke="#ff00aa" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="330" x2="256" y2="330" stroke="#00e5e5" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="60" x2="80" y2="60" stroke="#00e5e5" stroke-width="0.2" opacity="0.1"/>
  <line x1="180" y1="50" x2="256" y2="50" stroke="#ff00aa" stroke-width="0.2" opacity="0.07"/>

  <!-- Thought indicator - floating data fragments -->
  <text x="40" y="88" font-family="monospace" font-size="6" fill="#00e5e5" opacity="0.18">0x4F</text>
  <text x="198" y="68" font-family="monospace" font-size="5" fill="#00e5e5" opacity="0.14">DATA</text>
  <text x="218" y="108" font-family="monospace" font-size="4" fill="#ff00aa" opacity="0.1">??</text>
  <text x="22" y="145" font-family="monospace" font-size="4" fill="#00e5e5" opacity="0.12">SCAN</text>

  <!-- Border frame -->
