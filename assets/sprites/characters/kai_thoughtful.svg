  <circle cx="95" cy="203" r="0.5" fill="#dab892" opacity="0.4"/>
  <circle cx="99" cy="201" r="0.5" fill="#dab892" opacity="0.4"/>
  <circle cx="103" cy="201" r="0.5" fill="#dab892" opacity="0.4"/>

  <!-- === NECK === -->
  <path d="M112,216 Q120,220 128,221 Q136,220 144,216 L142,234 Q136,238 128,239 Q120,238 114,234 Z" fill="url(#skinGrad)"/>
  <path d="M116,224 Q128,228 140,224" fill="none" stroke="#a07050" stroke-width="0.6" opacity="0.3"/>

  <!-- === HEAD (slightly turned right) === -->
  <ellipse cx="130" cy="162" rx="50" ry="60" fill="url(#skinGrad)"/>
  <path d="M85,178 Q97,208 114,218 Q122,222 130,223 Q138,222 146,218 Q163,208 175,178" fill="url(#skinGrad)" stroke="#b07a55" stroke-width="0.3"/>
  <path d="M87,165 Q92,178 100,185" fill="none" stroke="#b07a55" stroke-width="0.8" opacity="0.2"/>
