  <path d="M94,88 Q110,78 127,74" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  <path d="M137,76 Q157,84 170,98" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>

  <!-- === FACIAL FEATURES (THOUGHTFUL - eyes looking right) === -->

  <!-- Eyebrows - slightly raised on left, contemplative asymmetry -->
  <path d="M96,132 Q108,127 122,132" fill="none" stroke="#909098" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M140,130 Q152,126 164,132" fill="none" stroke="#909098" stroke-width="2.5" stroke-linecap="round"/>

  <!-- RIGHT EYE (looking right - pupil offset) -->
  <ellipse cx="110" cy="150" rx="14" ry="8" fill="#f0f0f0"/>
  <path d="M96,150 Q103,141 110,140 Q117,141 124,150" fill="none" stroke="#7a6a5a" stroke-width="1.2"/>
  <path d="M96,150 Q103,157 110,158 Q117,157 124,150" fill="none" stroke="#8a7a6a" stroke-width="0.8"/>
  <!-- Pupil shifted right -->
  <circle cx="114" cy="150" r="5.5" fill="#3a4e5e"/>
  <circle cx="114" cy="150" r="2.8" fill="#1a1a2a"/>
  <circle cx="116" cy="148" r="1.3" fill="#ffffff" opacity="0.8"/>
  <!-- Pensive hooded upper lid -->
  <path d="M96,149 Q110,143 124,149" fill="url(#skinGrad)" stroke="#8a7a6a" stroke-width="0.3" opacity="0.45"/>
  <path d="M98,137 Q110,132 122,137" fill="none" stroke="#b09070" stroke-width="0.5" opacity="0.35"/>

  <!-- LEFT EYE (Cybernetic - DIMMER glow, looking right) -->
  <ellipse cx="152" cy="150" rx="14" ry="8.5" fill="#0a1a20" stroke="#00aaaa" stroke-width="1.2"/>
  <!-- Dimmer iris - pupil offset right -->
  <circle cx="152" cy="150" r="7" fill="#002a33" stroke="#00aaaa" stroke-width="0.8" filter="url(#glowCyanDim)"/>
  <circle cx="155" cy="150" r="4.5" fill="url(#cyberIrisDim)" opacity="0.75"/>
  <circle cx="155" cy="150" r="2.2" fill="#00bbcc" opacity="0.7"/>
  <!-- Subtle scan lines -->
  <line x1="145" y1="150" x2="159" y2="150" stroke="#00aabb" stroke-width="0.3" opacity="0.4"/>
  <line x1="152" y1="143" x2="152" y2="157" stroke="#00aabb" stroke-width="0.3" opacity="0.4"/>
  <!-- Circuit details - dimmer -->
  <path d="M137,145 L140,145 L142,147" fill="none" stroke="#008888" stroke-width="0.5" opacity="0.5"/>
  <path d="M137,155 L140,155 L142,153" fill="none" stroke="#008888" stroke-width="0.5" opacity="0.5"/>
  <path d="M162,147 L164,145 L169,145" fill="none" stroke="#008888" stroke-width="0.5" opacity="0.5"/>
  <path d="M162,153 L164,155 L169,155" fill="none" stroke="#008888" stroke-width="0.5" opacity="0.5"/>
  <circle cx="137" cy="145" r="0.7" fill="#00aaaa" opacity="0.5"/>
  <circle cx="137" cy="155" r="0.7" fill="#00aaaa" opacity="0.5"/>
  <circle cx="169" cy="145" r="0.7" fill="#00aaaa" opacity="0.5"/>
  <circle cx="169" cy="155" r="0.7" fill="#00aaaa" opacity="0.5"/>
  <!-- Soft outer glow - dimmer -->
  <circle cx="152" cy="150" r="12" fill="none" stroke="#009999" stroke-width="0.4" opacity="0.2" filter="url(#glowCyanSoft)"/>

  <!-- NOSE (slightly offset for head turn) -->
  <path d="M128,157 Q130,170 127,175 Q130,177 133,175 Q135,170 132,157" fill="none" stroke="#b07a55" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M129,160 L129,168" fill="none" stroke="#dab892" stroke-width="0.5" opacity="0.3"/>
  <circle cx="126" cy="175" r="1.2" fill="none" stroke="#a07050" stroke-width="0.5" opacity="0.4"/>
  <circle cx="134" cy="175" r="1.2" fill="none" stroke="#a07050" stroke-width="0.5" opacity="0.4"/>

  <!-- MOUTH - slightly pursed, contemplative, asymmetric -->
