  <path d="M190,142 L198,126 L192,148 L202,138 L194,160 L204,152 L196,172 L200,168" fill="url(#hairShadow)" stroke="#c0c0d0" stroke-width="0.4"/>
  <!-- Forehead strands -->
  <path d="M108,80 Q102,98 98,118 Q96,126 100,122" fill="none" stroke="#f0f0f8" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M118,76 Q114,94 110,112 Q108,120 112,116" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.6" stroke-linecap="round"/>
  <path d="M140,78 Q144,92 147,106" fill="none" stroke="#e8e8f0" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>
