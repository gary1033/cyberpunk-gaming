<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141008"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="50%" stop-color="#4a2a10"/>
      <stop offset="100%" stop-color="#2a1508"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background - darker, muted -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>
  <line x1="20" y1="40" x2="20" y2="384" stroke="#ffaa00" stroke-width="0.3" opacity="0.05"/>
  <line x1="236" y1="0" x2="236" y2="384" stroke="#ffaa00" stroke-width="0.3" opacity="0.04"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ffaa00" stroke-width="1.2" opacity="0.2"/>

  <!-- Name -->
  <text x="128" y="28" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ffaa00" text-anchor="middle" filter="url(#glow)" opacity="0.7">趙明</text>

  <!-- Suit body - slumped shoulders -->
  <path d="M56,280 Q64,258 86,244 L102,236 Q116,230 128,228 Q140,230 154,236 L170,244 Q192,258 200,280 L208,384 L48,384 Z" fill="url(#suitGrad)"/>
  <path d="M56,280 Q64,258 86,244 L102,236 Q112,232 120,230 L120,384 L48,384 Z" fill="#0e0e1e" opacity="0.55"/>
  <!-- Lapels -->
  <path d="M90,242 L76,266 L108,256 L118,238 Z" fill="#222240"/>
  <path d="M166,242 L180,266 L148,256 L138,238 Z" fill="#282848"/>
  <!-- Shirt V - collar loosened -->
  <path d="M114,238 L128,258 L142,238" fill="#d0d0e0" stroke="#b8b8c8" stroke-width="0.5"/>
  <!-- Collar gap -->
  <path d="M118,234 L128,228 L138,234" fill="#d8b898" opacity="0.25"/>
  <!-- Tie loosened -->
  <path d="M124,252 L127,248 L131,252 L130,314 L128,320 L126,314 Z" fill="#1a1a2e" stroke="#ffaa00" stroke-width="0.5" opacity="0.5"/>
  <path d="M122,248 L128,242 L134,248 L131,254 L124,254 Z" fill="#222240"/>
  <!-- Neon accents - dim -->
  <line x1="70" y1="282" x2="70" y2="384" stroke="#ffaa00" stroke-width="0.6" opacity="0.08" filter="url(#glow)"/>
  <line x1="186" y1="282" x2="186" y2="384" stroke="#ffaa00" stroke-width="0.6" opacity="0.08" filter="url(#glow)"/>
  <!-- ZhengTek badge - dim -->
  <rect x="82" y="254" width="12" height="8" rx="1.5" fill="#1a2a3a" stroke="#ffaa00" stroke-width="0.5" opacity="0.5"/>
  <text x="88" y="261" font-family="monospace" font-size="5" fill="#ffaa00" text-anchor="middle" opacity="0.5">ZT</text>
  <!-- Pocket square wilted -->
  <path d="M164,254 L169,249 L174,254 L172,259 L167,258 Z" fill="#ffaa00" opacity="0.08"/>
  <!-- Smart watch - dim -->
  <rect x="50" y="324" width="10" height="14" rx="2" fill="#1a1a2a" stroke="#ffaa00" stroke-width="0.4" opacity="0.3"/>
  <rect x="52" y="327" width="6" height="8" rx="1" fill="#ffaa00" opacity="0.05"/>

  <!-- Neck -->
  <path d="M115,222 Q128,228 141,222 L139,240 Q128,246 117,240 Z" fill="#d8b898"/>
  <path d="M115,222 Q128,226 141,222 L140,230 Q128,234 116,230 Z" fill="#c4a080" opacity="0.4"/>

  <!-- Head - tilted slightly down -->
  <path d="M80,134 Q78,109 88,92 Q100,76 128,72 Q156,76 168,92 Q178,109 176,134 L176,159 Q174,179 164,194 Q154,208 142,216 Q136,220 128,222 Q120,220 114,216 Q102,208 92,194 Q82,179 80,159 Z" fill="#d8b898"/>
  <!-- Face shadow -->
  <path d="M80,134 Q78,109 88,92 Q94,84 104,78 L100,134 L98,164 Q90,179 92,194 Q96,202 108,212 L114,216 Q102,208 92,194 Q82,179 80,159 Z" fill="#c4a080" opacity="0.5"/>
  <!-- Jaw shadow -->
  <path d="M92,194 Q102,208 114,216 Q120,220 128,222 L128,212 Q116,206 106,196 Z" fill="#b89068" opacity="0.3"/>
  <path d="M164,194 Q154,208 142,216 Q136,220 128,222 L128,212 Q140,206 150,196 Z" fill="#b89068" opacity="0.2"/>

  <!-- Under-eye shadows -->
  <path d="M92,156 Q100,160 108,160 Q114,160 118,156" fill="none" stroke="#c4a080" stroke-width="0.7" opacity="0.25"/>
  <path d="M138,156 Q146,160 152,160 Q158,160 164,156" fill="none" stroke="#c4a080" stroke-width="0.7" opacity="0.25"/>

  <!-- Ears -->
  <ellipse cx="80" cy="152" rx="5" ry="10" fill="#d8b898"/>
  <ellipse cx="80" cy="152" rx="3" ry="7" fill="#c4a080" opacity="0.3"/>
  <ellipse cx="176" cy="152" rx="5" ry="10" fill="#d8b898"/>
  <!-- Earpiece - dim -->
  <rect x="170" y="148" width="4" height="9" rx="1" fill="#1a2a3a" stroke="#ffaa00" stroke-width="0.4" opacity="0.5"/>
  <circle cx="172" cy="150" r="0.7" fill="#ffaa00" opacity="0.4"/>
  <circle cx="172" cy="154" r="0.5" fill="#ffaa00" opacity="0.3"/>

  <!-- Hair -->
  <path d="M68,132 Q66,104 80,82 Q96,62 128,58 Q160,62 176,82 Q190,104 188,132 L186,120 Q182,102 170,88 Q156,72 128,68 Q100,72 86,88 Q74,102 70,120 Z" fill="#1a1a2a"/>
  <path d="M68,132 Q66,104 80,82 Q90,68 106,62 L102,86 Q88,100 78,120 L72,132 Z" fill="#0e0e18"/>
  <path d="M188,132 Q190,104 176,82 Q170,72 158,66 L162,88 Q176,102 184,120 Z" fill="#141422" opacity="0.5"/>
  <!-- Side-part -->
  <path d="M108,64 Q118,60 128,62" fill="none" stroke="#2a2a3e" stroke-width="1.5" opacity="0.6"/>
  <!-- Hair shine - dim -->
  <path d="M90,80 Q108,72 128,68 Q148,72 166,80 L162,88 Q148,80 128,76 Q108,80 94,88 Z" fill="#ffffff" opacity="0.1"/>

  <!-- Eyes - downcast, heavy-lidded -->
  <!-- Right eye - looking down -->
  <path d="M90,150 Q100,140 108,139 Q116,140 122,150 Q116,156 108,157 Q100,156 90,150 Z" fill="#f0f0f5"/>
  <!-- Thick upper eyelid - heavier, drooping -->
  <path d="M88,150 Q98,138 108,136 Q118,138 124,150" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Heavy upper eyelid skin fold -->
  <path d="M90,148 Q100,140 108,139 Q116,140 120,148" fill="none" stroke="#c4a080" stroke-width="1.5" opacity="0.4"/>
  <path d="M92,152 Q100,157 108,158 Q116,157 120,152" fill="none" stroke="#8a7a6a" stroke-width="0.6"/>
  <!-- Iris looking down -->
  <circle cx="108" cy="152" r="10" fill="url(#irisGrad)"/>
  <circle cx="108" cy="152" r="10" fill="none" stroke="#2a1508" stroke-width="0.8" opacity="0.5"/>
  <circle cx="108" cy="153" r="4.5" fill="#0a0a0a"/>
  <circle cx="112" cy="148" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="104" cy="155" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="110" cy="155" r="0.7" fill="#ffffff" opacity="0.25"/>

  <!-- Left eye - looking down -->
  <path d="M134,150 Q144,140 152,139 Q160,140 166,150 Q160,156 152,157 Q144,156 134,150 Z" fill="#f0f0f5"/>
  <path d="M132,150 Q142,138 152,136 Q162,138 168,150" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M136,148 Q144,140 152,139 Q160,140 164,148" fill="none" stroke="#c4a080" stroke-width="1.5" opacity="0.4"/>
  <path d="M136,152 Q144,157 152,158 Q160,157 164,152" fill="none" stroke="#8a7a6a" stroke-width="0.6"/>
  <circle cx="152" cy="152" r="10" fill="url(#irisGrad)"/>
  <circle cx="152" cy="152" r="10" fill="none" stroke="#2a1508" stroke-width="0.8" opacity="0.5"/>
  <circle cx="152" cy="153" r="4.5" fill="#0a0a0a"/>
  <circle cx="156" cy="148" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="148" cy="155" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="154" cy="155" r="0.7" fill="#ffffff" opacity="0.25"/>

  <!-- Eyebrows - inner ends raised high (sad arch) -->
  <path d="M90,136 Q100,128 118,132" fill="none" stroke="#1a1a2a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M138,132 Q156,128 166,136" fill="none" stroke="#1a1a2a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M127,177 L128,182 L132,180" fill="none" stroke="#b89068" stroke-width="1" stroke-linecap="round"/>

  <!-- Mouth - downturned, sad -->
  <path d="M118,200 Q128,196 138,200" fill="none" stroke="#c08a70" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Slight downturn emphasis -->
  <path d="M116,200 Q118,202 120,201" fill="none" stroke="#c08a70" stroke-width="0.6" opacity="0.4"/>

  <!-- Ambient particles - sparse, dim -->
  <circle cx="28" cy="95" r="0.8" fill="#ffaa00" opacity="0.1"/>
  <circle cx="225" cy="75" r="0.7" fill="#ffaa00" opacity="0.08"/>
  <circle cx="38" cy="310" r="1" fill="#ffaa00" opacity="0.08"/>
  <circle cx="215" cy="350" r="0.7" fill="#ffaa00" opacity="0.06"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="'Courier New', monospace" font-size="10" fill="#ffaa00" text-anchor="middle" opacity="0.5">[sad]</text>
</svg>