  <path d="M95,63 Q110,54 128,51 Q146,54 161,63 Q155,56 140,51 Q128,48 116,51 Q101,56 95,63 Z" fill="white" opacity="0.12"/>
  <path d="M100,70 Q112,60 128,56 Q144,60 156,70 Q148,62 138,57 Q128,54 118,57 Q108,62 100,70 Z" fill="white" opacity="0.3"/>

