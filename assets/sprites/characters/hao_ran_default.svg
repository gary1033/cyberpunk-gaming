  <path d="M185,290 L190,287" fill="none" stroke="#0a1418" stroke-width="0.6" opacity="0.4"/>

  <!-- Inner shirt neckline - dark t-shirt -->
  <path d="M113,222 Q120,230 128,232 Q136,230 143,222" fill="none" stroke="#222235" stroke-width="1"/>
  <!-- T-shirt visible -->
  <path d="M113,222 Q120,230 128,233 Q136,230 143,222 L143,250 Q136,248 128,246 Q120,248 113,250 Z" fill="#1a1a2e" opacity="0.85"/>

  <!-- Neck -->
  <path d="M118,214 Q117,200 119,188 L137,188 Q139,200 138,214" fill="#f0cba8"/>
  <!-- Neck shadow -->
  <path d="M118,214 Q120,205 119,188 L128,188 L128,214 Z" fill="#c8a070" opacity="0.35"/>

