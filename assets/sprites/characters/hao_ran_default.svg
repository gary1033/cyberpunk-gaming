  <path d="M86,118 Q84,138 86,155 Q90,172 106,186 Q119,196 128,199 Q137,196 150,186 Q166,172 170,155 Q172,138 170,118 Q168,103 160,98 Q145,90 128,88 Q111,90 96,98 Q88,103 86,118 Z" fill="#f0cba8"/>
  <!-- Face shadow cel-shaded -->
  <path d="M86,118 Q84,138 86,155 Q90,172 106,186 Q117,194 128,199 L128,88 Q111,90 96,98 Q88,103 86,118 Z" fill="#c8a070" opacity="0.22"/>
