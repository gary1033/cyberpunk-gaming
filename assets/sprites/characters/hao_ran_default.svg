<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="hr_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="hr_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#c0a47a"/>
    </linearGradient>
    <linearGradient id="hr_shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="hr_overshirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d3d"/>
      <stop offset="100%" stop-color="#0f1a28"/>
    </linearGradient>
    <linearGradient id="hr_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <radialGradient id="hr_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hr_port_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#00ccff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hr_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hr_soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#hr_bg)"/>
  <rect width="256" height="384" fill="url(#hr_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.35"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="18" fill="#00ccff" text-anchor="middle" filter="url(#hr_neon)">浩然</text>

  <!-- Body / open shirt over t-shirt -->
  <path d="M60,220 Q54,240 46,290 L40,384 H216 L210,290 Q204,240 196,220 Q184,200 170,192 L162,188 Q147,180 128,178 Q109,180 94,188 L86,192 Q72,200 60,220 Z" fill="url(#hr_overshirt)" stroke="#00ccff" stroke-width="0.3" opacity="0.9"/>
  <!-- Open shirt lapels -->
  <path d="M108,188 Q112,195 108,215 Q106,230 104,250" fill="none" stroke="#1a3040" stroke-width="2.5" opacity="0.6"/>
  <path d="M148,188 Q144,195 148,215 Q150,230 152,250" fill="none" stroke="#1a3040" stroke-width="2.5" opacity="0.6"/>
  <!-- Shirt fold lines -->
  <path d="M92,200 Q95,240 94,280" fill="none" stroke="#00ccff" stroke-width="0.25" opacity="0.12"/>
  <path d="M164,200 Q161,240 162,280" fill="none" stroke="#00ccff" stroke-width="0.25" opacity="0.12"/>
  <!-- Center seam -->
  <line x1="128" y1="195" x2="128" y2="384" stroke="#00ccff" stroke-width="0.4" opacity="0.1"/>
  <!-- Pockets -->
  <rect x="78" y="260" width="26" height="20" rx="2" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.18"/>
  <rect x="152" y="260" width="26" height="20" rx="2" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.18"/>

  <!-- T-shirt visible underneath -->
  <path d="M108,188 Q116,180 128,178 Q140,180 148,188 L148,240 Q140,238 128,236 Q116,238 108,240 Z" fill="url(#hr_shirt)" opacity="0.85"/>
  <!-- T-shirt collar V -->
  <path d="M114,188 Q120,182 128,180 Q136,182 142,188" fill="none" stroke="#222240" stroke-width="1.2" opacity="0.5"/>

  <!-- Neck -->
  <path d="M118,178 Q118,168 120,160 L128,157 L136,160 Q138,168 138,178" fill="url(#hr_skin)" opacity="0.9"/>
  <!-- Neck shadow -->
  <path d="M120,170 Q128,173 136,170" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.2"/>

  <!-- Head shape -->
  <ellipse cx="128" cy="118" rx="37" ry="43" fill="url(#hr_skin)" opacity="0.95"/>

  <!-- Face contour shadow -->
  <path d="M98,130 Q104,142 114,150 Q122,155 128,157 Q134,155 142,150 Q152,142 158,130" fill="#b89060" opacity="0.2"/>
  <!-- Cheek warmth -->
  <ellipse cx="108" cy="130" rx="8" ry="5" fill="#d4a080" opacity="0.15"/>
  <ellipse cx="148" cy="130" rx="8" ry="5" fill="#d4a080" opacity="0.15"/>

  <!-- Ears -->
  <path d="M91,114 Q86,109 85,117 Q85,126 89,129 Q91,124 91,114 Z" fill="url(#hr_skin)" opacity="0.8"/>
  <path d="M91,118 Q88,116 87,120 Q87,124 89,126" fill="none" stroke="#b89070" stroke-width="0.5" opacity="0.3"/>
  <path d="M165,114 Q170,109 171,117 Q171,126 167,129 Q165,124 165,114 Z" fill="url(#hr_skin)" opacity="0.8"/>
  <path d="M165,118 Q168,116 169,120 Q169,124 167,126" fill="none" stroke="#b89070" stroke-width="0.5" opacity="0.3"/>

  <!-- Neural interface port - right temple -->
  <circle cx="166" cy="106" r="5" fill="#0a1520" stroke="#00ccff" stroke-width="1" opacity="0.7"/>
  <circle cx="166" cy="106" r="3" fill="url(#hr_port_glow)" filter="url(#hr_soft)"/>
  <circle cx="166" cy="106" r="1.5" fill="#00ccff" opacity="0.5"/>
  <!-- Port circuit lines -->
  <path d="M171,106 Q174,106 176,104" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.3"/>
  <path d="M170,109 Q173,110 175,109" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.25"/>
  <path d="M170,103 Q172,102 174,103" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.2"/>

  <!-- Hair - messy dark, layered -->
  <path d="M91,110 Q87,92 91,74 Q95,56 108,46 Q118,38 128,36 Q138,38 148,46 Q161,56 165,74 Q169,92 165,110 Q160,100 152,92 Q142,82 132,78 Q128,76 124,78 Q114,82 104,92 Q96,100 91,110 Z" fill="url(#hr_hair)" opacity="0.95"/>
  <!-- Hair volume layers -->
  <path d="M96,100 Q92,88 96,74 Q100,62 110,54" fill="none" stroke="#16162a" stroke-width="2" opacity="0.5"/>
  <path d="M160,100 Q164,88 160,74 Q156,62 146,54" fill="none" stroke="#16162a" stroke-width="2" opacity="0.5"/>
  <!-- Messy strands over forehead -->
  <path d="M109,80 Q106,90 110,102" fill="none" stroke="#1a1a2a" stroke-width="2.2" opacity="0.75"/>
  <path d="M117,76 Q113,86 117,98" fill="none" stroke="#1a1a2a" stroke-width="1.5" opacity="0.65"/>
  <path d="M124,74 Q122,82 124,94" fill="none" stroke="#16162a" stroke-width="1" opacity="0.5"/>
  <path d="M139,78 Q142,86 139,98" fill="none" stroke="#1a1a2a" stroke-width="1.8" opacity="0.7"/>
  <path d="M148,82 Q151,90 148,100" fill="none" stroke="#16162a" stroke-width="1.2" opacity="0.55"/>
  <path d="M132,76 Q134,84 131,96" fill="none" stroke="#1a1a2a" stroke-width="1.3" opacity="0.6"/>
  <!-- Hair highlight sheen -->
  <path d="M112,50 Q120,46 128,44 Q136,46 144,50" fill="none" stroke="#2a2a44" stroke-width="0.8" opacity="0.4"/>
  <path d="M106,58 Q115,52 128,50 Q141,52 150,58" fill="none" stroke="#2a2a44" stroke-width="0.5" opacity="0.3"/>

  <!-- Eyes - kind, warm, round -->
  <!-- Left eye -->
  <path d="M106,115 Q112,110 120,112 Q123,115 122,120 Q119,124 112,124 Q107,122 106,118 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="114" cy="117" r="4" fill="#1a1a2e"/>
  <circle cx="114" cy="117" r="2.5" fill="#2a3a4a"/>
  <circle cx="114.5" cy="116.5" r="1.8" fill="#00ccff" opacity="0.4"/>
  <circle cx="112" cy="115" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="116" cy="118" r="0.6" fill="#ffffff" opacity="0.5"/>
  <!-- Left lower lid -->
  <path d="M108,121 Q114,123 120,121" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.25"/>
  <!-- Right eye -->
  <path d="M134,112 Q142,110 150,115 Q150,122 144,124 Q137,124 134,120 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="142" cy="117" r="4" fill="#1a1a2e"/>
  <circle cx="142" cy="117" r="2.5" fill="#2a3a4a"/>
  <circle cx="141.5" cy="116.5" r="1.8" fill="#00ccff" opacity="0.4"/>
  <circle cx="140" cy="115" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="144" cy="118" r="0.6" fill="#ffffff" opacity="0.5"/>
  <!-- Right lower lid -->
  <path d="M136,121 Q142,123 148,121" fill="none" stroke="#b09070" stroke-width="0.4" opacity="0.25"/>

  <!-- Eyebrows - natural, gentle arch -->
  <path d="M105,108 Q110,105 118,106 Q121,107 122,108" fill="none" stroke="#1a1a2a" stroke-width="1.6" opacity="0.6"/>
  <path d="M134,108 Q135,107 138,106 Q146,105 151,108" fill="none" stroke="#1a1a2a" stroke-width="1.6" opacity="0.6"/>

  <!-- Nose - small, gentle -->
  <path d="M128,118 Q127,124 126,130 Q125,133 127,135 Q128,136 130,135 Q131,133 130,130 Q129,124 128,118" fill="none" stroke="#b09060" stroke-width="0.7" opacity="0.4"/>
  <!-- Nose bridge highlight -->
  <line x1="128" y1="118" x2="128" y2="126" stroke="#dcc8a0" stroke-width="0.4" opacity="0.15"/>

  <!-- Mouth - gentle, warm smile -->
  <path d="M119,142 Q123,145 128,146 Q133,145 137,142" fill="none" stroke="#8a6050" stroke-width="1.1" opacity="0.65"/>
  <!-- Slight upper lip -->
  <path d="M122,142 Q125,140 128,140 Q131,140 134,142" fill="none" stroke="#a07060" stroke-width="0.5" opacity="0.3"/>

  <!-- Small tech earpiece on left ear -->
  <path d="M85,116 Q82,114 81,118 Q81,122 83,124" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="82" cy="118" r="1.5" fill="#00ccff" opacity="0.25"/>

  <!-- ID badge on shirt -->
  <rect x="148" y="222" width="16" height="22" rx="2" fill="#0d1a28" stroke="#00ccff" stroke-width="0.5" opacity="0.35"/>
  <rect x="150" y="225" width="12" height="7" rx="1" fill="#00ccff" opacity="0.08"/>
  <line x1="150" y1="235" x2="162" y2="235" stroke="#00ccff" stroke-width="0.3" opacity="0.25"/>
  <line x1="150" y1="238" x2="159" y2="238" stroke="#00ccff" stroke-width="0.3" opacity="0.18"/>

  <!-- Ambient cyan particles -->
  <circle cx="28" cy="78" r="1.2" fill="#00ccff" opacity="0.18"/>
  <circle cx="228" cy="92" r="0.8" fill="#00ccff" opacity="0.14"/>
  <circle cx="38" cy="260" r="1" fill="#00ccff" opacity="0.14"/>
  <circle cx="218" cy="244" r="0.7" fill="#00ccff" opacity="0.18"/>
  <circle cx="18" cy="178" r="0.9" fill="#00ccff" opacity="0.1"/>
  <circle cx="238" cy="168" r="1.1" fill="#00ccff" opacity="0.12"/>
  <circle cx="45" cy="340" r="0.6" fill="#00ccff" opacity="0.1"/>
  <circle cx="210" cy="330" r="0.8" fill="#00ccff" opacity="0.12"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
</svg>