<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <radialGradient id="irisGradL" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6b4030"/>
      <stop offset="50%" stop-color="#4a2518"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="irisGradR" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6b4030"/>
      <stop offset="50%" stop-color="#4a2518"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="portGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00cccc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00cccc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>
  <ellipse cx="128" cy="180" rx="100" ry="180" fill="#00cccc" opacity="0.03"/>

  <!-- Border frame -->
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#00cccc" stroke-width="1.5" opacity="0.4"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#00cccc" stroke-width="0.5" opacity="0.2"/>

  <!-- Character name at top -->
  <text x="128" y="28" font-family="monospace" font-size="16" fill="#00cccc" text-anchor="middle" filter="url(#neonGlow)" opacity="0.9">浩然</text>
  <line x1="40" y1="35" x2="216" y2="35" stroke="#00cccc" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner accents -->
  <path d="M10,10 L30,10 M10,10 L10,30" fill="none" stroke="#00cccc" stroke-width="1" opacity="0.5"/>
  <path d="M246,10 L226,10 M246,10 L246,30" fill="none" stroke="#00cccc" stroke-width="1" opacity="0.5"/>
  <path d="M10,374 L30,374 M10,374 L10,354" fill="none" stroke="#00cccc" stroke-width="1" opacity="0.5"/>
  <path d="M246,374 L226,374 M246,374 L246,354" fill="none" stroke="#00cccc" stroke-width="1" opacity="0.5"/>

  <!-- === BODY / WORN TECH UNIFORM === -->
  <path d="M50,310 Q60,255 85,235 Q100,227 115,223 L128,220 L141,223 Q156,227 171,235 Q196,255 206,310 L206,390 L50,390 Z" fill="#1a2a30" stroke="#1e3038" stroke-width="0.5"/>
  <!-- Jacket cel-shadow -->
  <path d="M50,310 Q60,265 85,243 Q95,235 105,230 L128,220 L128,390 L50,390 Z" fill="#0f1e24" opacity="0.5"/>

  <!-- Open jacket lapels -->
  <path d="M115,223 L110,260 L128,285 L128,220 Z" fill="#1e3038" stroke="#00cccc" stroke-width="0.3" opacity="0.8"/>
  <path d="M141,223 L146,260 L128,285 L128,220 Z" fill="#1e3038" stroke="#00cccc" stroke-width="0.3" opacity="0.8"/>

  <!-- Jacket collar -->
