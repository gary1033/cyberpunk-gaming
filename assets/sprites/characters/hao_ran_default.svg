  <path d="M90,167 Q101,180 116,191 Q123,196 128,199 Q119,196 109,188 Q96,177 90,167 Z" fill="#c8a070" opacity="0.28"/>
  <path d="M166,167 Q155,180 140,191 Q133,196 128,199 Q137,196 147,188 Q160,177 166,167 Z" fill="#c8a070" opacity="0.18"/>

  <!-- Dark circles under eyes - subtle haunted look -->
  <path d="M99,143 Q106,145 116,143" fill="none" stroke="#9a7a5a" stroke-width="1" opacity="0.25"/>
  <path d="M140,143 Q150,145 157,143" fill="none" stroke="#9a7a5a" stroke-width="1" opacity="0.25"/>

  <!-- Cheek blush (subtle) -->
  <ellipse cx="100" cy="153" rx="10" ry="4" fill="#d4a080" opacity="0.08"/>
  <ellipse cx="156" cy="153" rx="10" ry="4" fill="#d4a080" opacity="0.08"/>

  <!-- === HAIR (front layer) - dark messy chunky blocks === -->
  <!-- Main hair volume -->
  <path d="M75,122 Q72,98 80,76 Q90,56 110,48 Q125,43 128,43 Q131,43 146,48 Q166,56 176,76 Q184,98 181,122 Q178,108 170,98 Q158,88 145,84 Q128,81 111,84 Q98,88 86,98 Q78,108 75,122 Z" fill="#12101e"/>

