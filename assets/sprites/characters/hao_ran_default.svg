  <path d="M151,228 Q146,216 136,214 L128,220 L141,223 Z" fill="#162428"/>

  <!-- Tech stripe on jacket -->
  <line x1="72" y1="255" x2="72" y2="335" stroke="#00cccc" stroke-width="1" opacity="0.35"/>
  <line x1="184" y1="255" x2="184" y2="335" stroke="#00cccc" stroke-width="1" opacity="0.35"/>
  <!-- Circuit patterns on shoulders -->
  <path d="M78,253 L82,253 L82,260 L88,260" fill="none" stroke="#00cccc" stroke-width="0.5" opacity="0.4"/>
  <circle cx="88" cy="260" r="1.5" fill="#00cccc" opacity="0.4"/>
  <path d="M178,253 L174,253 L174,260 L168,260" fill="none" stroke="#00cccc" stroke-width="0.5" opacity="0.4"/>
  <circle cx="168" cy="260" r="1.5" fill="#00cccc" opacity="0.4"/>
