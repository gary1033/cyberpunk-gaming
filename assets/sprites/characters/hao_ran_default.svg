  <path d="M82,118 Q88,80 106,65 Q114,60 118,68 Q108,85 102,118 Z" fill="#12101e"/>
  <path d="M98,112 Q106,72 124,60 Q130,56 133,63 Q123,78 116,112 Z" fill="#0d0a15"/>
  <path d="M115,108 Q124,70 140,62 Q146,60 148,66 Q140,80 133,108 Z" fill="#12101e"/>
  <path d="M132,114 Q144,78 160,72 Q166,71 165,78 Q156,90 148,116 Z" fill="#0d0a15"/>
  <!-- Extra messy strand falling over right eye - distinctive unkempt look -->
  <path d="M120,106 Q118,82 126,66 Q130,60 132,66 Q128,80 124,106 Z" fill="#15102a" opacity="0.7"/>
  <!-- Stray strand on left -->
  <path d="M88,115 Q92,82 108,68 Q112,64 114,70 Q104,86 100,115 Z" fill="#15102a" opacity="0.55"/>

  <!-- Side hair - shorter than Mei Ling, messy -->
  <path d="M78,118 Q73,150 70,185 Q69,200 71,215" fill="#0d0a15" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M178,118 Q183,150 186,185 Q187,200 185,215" fill="#0d0a15" stroke="#1a0d28" stroke-width="0.5"/>

  <!-- Ears -->
  <path d="M84,128 Q78,128 76,138 Q75,148 80,153" fill="#f0cba8" stroke="#c8a070" stroke-width="0.5"/>
  <path d="M172,128 Q178,128 180,138 Q181,148 176,153" fill="#f0cba8" stroke="#c8a070" stroke-width="0.5"/>

  <!-- === NEURAL INTERFACE HEADBAND === -->
  <path d="M78,108 Q90,96 128,93 Q166,96 178,108" fill="none" stroke="#1a2a30" stroke-width="4" opacity="0.8"/>
  <path d="M78,108 Q90,96 128,93 Q166,96 178,108" fill="none" stroke="#00cccc" stroke-width="1" opacity="0.4"/>
  <!-- Neural interface node on right temple -->
  <circle cx="175" cy="110" r="5" fill="#0a1a1e" stroke="#00cccc" stroke-width="1.2" opacity="0.8"/>
  <circle cx="175" cy="110" r="3" fill="url(#portGlow)" filter="url(#glow)"/>
  <circle cx="175" cy="110" r="1.5" fill="#00cccc" opacity="0.6"/>
  <circle cx="175" cy="110" r="0.7" fill="#88ffff" opacity="0.4"/>
  <!-- Circuit lines from node -->
  <path d="M180,110 Q184,110 187,108" fill="none" stroke="#00cccc" stroke-width="0.5" opacity="0.35"/>
  <path d="M179,113 Q183,114 186,113" fill="none" stroke="#00cccc" stroke-width="0.4" opacity="0.25"/>
  <!-- Left temple node (smaller) -->
  <circle cx="81" cy="110" r="3.5" fill="#0a1a1e" stroke="#00cccc" stroke-width="0.8" opacity="0.6"/>
  <circle cx="81" cy="110" r="2" fill="#00cccc" opacity="0.25"/>

  <!-- === EYES - Shounen anime style, slightly distant/haunted === -->

  <!-- Left eye -->
  <!-- Thick upper eyelid -->
  <path d="M96,131 Q104,124 112,123 Q118,124 124,131" fill="none" stroke="#1a1020" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Eye white shape -->
  <path d="M97,132 Q104,125 111,124 Q118,125 123,132 Q118,137 111,138 Q104,137 97,132 Z" fill="white"/>
  <!-- Iris -->
  <clipPath id="eyeClipL"><path d="M97,132 Q104,125 111,124 Q118,125 123,132 Q118,137 111,138 Q104,137 97,132 Z"/></clipPath>
  <circle cx="111" cy="131" r="12" fill="url(#irisGradL)" clip-path="url(#eyeClipL)"/>
  <!-- Outer ring -->
  <circle cx="111" cy="131" r="11" fill="none" stroke="#2a1510" stroke-width="0.8" clip-path="url(#eyeClipL)"/>
  <!-- Radial detail lines in iris -->
  <line x1="111" y1="121" x2="111" y2="125" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <line x1="117" y1="123" x2="115" y2="126" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <line x1="105" y1="123" x2="107" y2="126" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <!-- Pupil -->
  <circle cx="111" cy="131" r="5" fill="#0a0505" clip-path="url(#eyeClipL)"/>
  <!-- Highlights - slightly dimmed/distant look -->
  <circle cx="107" cy="127" r="3.5" fill="white" opacity="0.7" clip-path="url(#eyeClipL)"/>
  <circle cx="115" cy="134" r="2" fill="white" opacity="0.4" clip-path="url(#eyeClipL)"/>
  <circle cx="109" cy="135" r="0.8" fill="white" opacity="0.2" clip-path="url(#eyeClipL)"/>
  <!-- Thin lower lid -->
  <path d="M99,134 Q111,138 121,134" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.4"/>

  <!-- Right eye -->
  <!-- Thick upper eyelid -->
  <path d="M132,131 Q140,124 147,123 Q154,124 160,131" fill="none" stroke="#1a1020" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Eye white shape -->
  <path d="M133,132 Q140,125 147,124 Q154,125 159,132 Q154,137 147,138 Q140,137 133,132 Z" fill="white"/>
  <!-- Iris -->
  <clipPath id="eyeClipR"><path d="M133,132 Q140,125 147,124 Q154,125 159,132 Q154,137 147,138 Q140,137 133,132 Z"/></clipPath>
  <circle cx="147" cy="131" r="12" fill="url(#irisGradR)" clip-path="url(#eyeClipR)"/>
  <!-- Outer ring -->
  <circle cx="147" cy="131" r="11" fill="none" stroke="#2a1510" stroke-width="0.8" clip-path="url(#eyeClipR)"/>
  <!-- Radial detail lines -->
  <line x1="147" y1="121" x2="147" y2="125" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <line x1="153" y1="123" x2="151" y2="126" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <line x1="141" y1="123" x2="143" y2="126" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <!-- Pupil -->
  <circle cx="147" cy="131" r="5" fill="#0a0505" clip-path="url(#eyeClipR)"/>
  <!-- Highlights - slightly dimmed/distant -->
  <circle cx="143" cy="127" r="3.5" fill="white" opacity="0.7" clip-path="url(#eyeClipR)"/>
  <circle cx="151" cy="134" r="2" fill="white" opacity="0.4" clip-path="url(#eyeClipR)"/>
  <circle cx="145" cy="135" r="0.8" fill="white" opacity="0.2" clip-path="url(#eyeClipR)"/>
  <!-- Thin lower lid -->
  <path d="M135,134 Q147,138 157,134" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.4"/>

  <!-- Eyebrows - slightly flat, weary -->
  <path d="M96,120 Q106,115 120,117" fill="none" stroke="#1a1020" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M136,117 Q150,115 160,120" fill="none" stroke="#1a1020" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Nose - small L-shape like sister -->
  <path d="M127,148 L126,155 Q128,157 130,155" fill="none" stroke="#c8a070" stroke-width="1" opacity="0.6"/>

  <!-- Mouth - neutral, slightly downturned, lost look -->
  <path d="M118,170 Q128,172 138,170" fill="none" stroke="#8a6050" stroke-width="1.2" stroke-linecap="round"/>

  <!-- === TECH EARPIECE (left ear) === -->
  <circle cx="76" cy="142" r="3" fill="none" stroke="#00cccc" stroke-width="0.8" opacity="0.5"/>
  <circle cx="76" cy="142" r="1.5" fill="#00cccc" opacity="0.3"/>
  <path d="M76,145 L76,150" stroke="#00cccc" stroke-width="0.5" opacity="0.4"/>

  <!-- ID badge on jacket -->
  <rect x="150" y="260" width="16" height="22" rx="2" fill="#0d1a1e" stroke="#00cccc" stroke-width="0.5" opacity="0.35"/>
  <rect x="152" y="263" width="12" height="7" rx="1" fill="#00cccc" opacity="0.08"/>
  <line x1="152" y1="273" x2="164" y2="273" stroke="#00cccc" stroke-width="0.3" opacity="0.25"/>
  <line x1="152" y1="276" x2="161" y2="276" stroke="#00cccc" stroke-width="0.3" opacity="0.18"/>

  <!-- === AMBIENT EFFECTS === -->
  <line x1="0" y1="100" x2="256" y2="100" stroke="#00cccc" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#00cccc" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00cccc" stroke-width="0.3" opacity="0.08"/>

  <!-- Ambient particles -->
  <circle cx="25" cy="75" r="1.2" fill="#00cccc" opacity="0.18"/>
  <circle cx="230" cy="90" r="0.8" fill="#00cccc" opacity="0.14"/>
  <circle cx="35" cy="260" r="1" fill="#00cccc" opacity="0.12"/>
  <circle cx="220" cy="245" r="0.7" fill="#00cccc" opacity="0.16"/>
  <circle cx="18" cy="180" r="0.9" fill="#00cccc" opacity="0.1"/>
  <circle cx="240" cy="170" r="1.1" fill="#00cccc" opacity="0.12"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#00cccc" text-anchor="middle" opacity="0.5">[DEFAULT]</text>
</svg>