<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="md_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#04040c"/>
    </linearGradient>
    <linearGradient id="md_mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ccaa"/>
      <stop offset="30%" stop-color="#0088cc"/>
      <stop offset="60%" stop-color="#00bbaa"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="md_robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16162a"/>
      <stop offset="100%" stop-color="#0a0a16"/>
    </linearGradient>
    <linearGradient id="md_robe_shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0c1a"/>
      <stop offset="50%" stop-color="#16162a"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>
    <radialGradient id="md_glow" cx="0.5" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="md_mask_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#md_bg)"/>
  <rect width="256" height="384" fill="url(#md_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.35"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ffaa00" text-anchor="middle" filter="url(#glow)">面具商人</text>

  <!-- Body / dark merchant robe - broad shoulders, imposing -->
  <path d="M58,215 Q50,238 42,275 L38,310 H218 L214,275 Q206,238 198,215 Q186,196 174,186 L166,182 Q150,174 128,170 Q106,174 90,182 L82,186 Q70,196 58,215 Z" fill="url(#md_robe)" stroke="#ffaa00" stroke-width="0.4" opacity="0.95"/>
  <!-- Hard shadow blocks - cel shading on robe -->
  <path d="M58,215 Q50,238 42,275 L38,310 H88 L92,275 Q96,238 100,215 Q92,200 82,186 L90,182 Q106,174 128,170 L108,174 Q88,182 78,196 Q66,206 58,215 Z" fill="#0c0c1a" opacity="0.6"/>
  <path d="M198,215 Q206,238 214,275 L218,310 H168 L164,275 Q160,238 156,215 Q164,200 174,186 L166,182 Q150,174 128,170 L148,174 Q168,182 178,196 Q190,206 198,215 Z" fill="#0c0c1a" opacity="0.6"/>
  <!-- Robe fold lines -->
  <path d="M98,196 Q102,238 100,276 L98,308" fill="none" stroke="#ffaa00" stroke-width="0.3" opacity="0.2"/>
  <path d="M158,196 Q154,238 156,276 L158,308" fill="none" stroke="#ffaa00" stroke-width="0.3" opacity="0.2"/>
  <path d="M128,174 Q127,230 128,280 L128,310" fill="none" stroke="#ffaa00" stroke-width="0.2" opacity="0.15"/>

  <!-- Belt with merchandise -->
  <rect x="72" y="260" width="112" height="6" rx="2" fill="#1a1a30" stroke="#ffaa00" stroke-width="0.5" opacity="0.8"/>
  <!-- Memory chips on belt -->
  <rect x="82" y="255" width="8" height="12" rx="1" fill="#0a1520" stroke="#00ccaa" stroke-width="0.6" opacity="0.7"/>
  <rect x="94" y="256" width="6" height="10" rx="1" fill="#0a1520" stroke="#0088ff" stroke-width="0.5" opacity="0.6"/>
  <!-- Vial on belt -->
  <rect x="158" y="254" width="5" height="13" rx="2" fill="#0a1520" stroke="#dd00ff" stroke-width="0.5" opacity="0.6"/>
  <circle cx="160.5" cy="254" r="3" fill="#0a1520" stroke="#dd00ff" stroke-width="0.4" opacity="0.5"/>
  <!-- Another chip -->
  <rect x="170" y="255" width="7" height="11" rx="1" fill="#0a1520" stroke="#ffaa00" stroke-width="0.5" opacity="0.6"/>

  <!-- Robe collar - high, mysterious -->
  <path d="M90,186 Q96,174 110,166 Q120,162 128,160 Q136,162 146,166 Q160,174 166,186 L160,196 Q148,184 128,178 Q108,184 96,196 Z" fill="#121228" stroke="#ffaa00" stroke-width="0.6" opacity="0.95"/>

  <!-- Hood - anime style with sharp lines -->
  <path d="M74,186 Q68,158 72,126 Q76,98 86,78 Q98,58 116,46 Q126,40 128,38 Q130,40 140,46 Q158,58 170,78 Q180,98 184,126 Q188,158 182,186 Q170,176 154,168 Q142,164 128,160 Q114,164 102,168 Q86,176 74,186 Z" fill="#0e0e26" stroke="#ffaa00" stroke-width="0.4" opacity="0.95"/>
  <!-- Hood inner shadow -->
  <path d="M84,180 Q80,154 84,124 Q88,100 96,84 Q106,68 120,58 Q126,54 128,52 Q130,54 136,58 Q150,68 160,84 Q168,100 172,124 Q176,154 172,180" fill="#080818" opacity="0.75"/>

  <!-- Holographic mask - blue/teal geometric, face-shaped -->
  <path d="M128,82 Q152,86 160,108 Q164,126 160,148 Q154,164 140,172 Q132,176 128,176 Q124,176 116,172 Q102,164 96,148 Q92,126 96,108 Q104,86 128,82 Z" fill="url(#md_mask)" opacity="0.85" filter="url(#md_mask_glow)"/>

  <!-- Geometric patterns on mask - triangles and hexagons -->
  <!-- Hexagon pattern top -->
  <polygon points="128,88 138,94 138,106 128,112 118,106 118,94" fill="none" stroke="#00ffee" stroke-width="0.8" opacity="0.4"/>
  <!-- Triangle patterns -->
  <polygon points="106,110 114,100 122,110" fill="none" stroke="#00ddcc" stroke-width="0.6" opacity="0.35"/>
  <polygon points="134,100 142,110 150,100" fill="none" stroke="#00ddcc" stroke-width="0.6" opacity="0.35"/>
  <!-- Lower hexagon -->
  <polygon points="128,130 136,135 136,145 128,150 120,145 120,135" fill="none" stroke="#0088cc" stroke-width="0.6" opacity="0.3"/>
  <!-- Small triangles -->
  <polygon points="104,130 110,122 116,130" fill="none" stroke="#00bbaa" stroke-width="0.5" opacity="0.25"/>
  <polygon points="140,122 146,130 152,122" fill="none" stroke="#00bbaa" stroke-width="0.5" opacity="0.25"/>

  <!-- Iridescent color patches on mask -->
  <ellipse cx="112" cy="104" rx="8" ry="6" fill="#0088cc" opacity="0.15"/>
  <ellipse cx="144" cy="104" rx="8" ry="6" fill="#00bbaa" opacity="0.15"/>
  <ellipse cx="128" cy="140" rx="10" ry="8" fill="#006699" opacity="0.12"/>
  <ellipse cx="108" cy="136" rx="6" ry="5" fill="#00ccaa" opacity="0.1"/>
  <ellipse cx="148" cy="136" rx="6" ry="5" fill="#0088ff" opacity="0.1"/>

  <!-- Eyes through mask slits - glowing, large anime style -->
  <!-- Left eye slit -->
  <path d="M102,108 Q110,102 122,108 Q110,114 102,108 Z" fill="#040410" opacity="0.9"/>
  <ellipse cx="112" cy="108" rx="7" ry="4" fill="#003838" opacity="0.8"/>
  <ellipse cx="112" cy="108" rx="5" ry="3.5" fill="#00ccaa" opacity="0.75"/>
  <ellipse cx="112" cy="108" rx="3" ry="2.5" fill="#00ffdd" opacity="0.9"/>
  <circle cx="110" cy="106.5" r="1.8" fill="#ffffff" opacity="0.95"/>
  <circle cx="114" cy="109" r="0.9" fill="#ffffff" opacity="0.6"/>
  <!-- Right eye slit -->
  <path d="M134,108 Q142,102 154,108 Q142,114 134,108 Z" fill="#040410" opacity="0.9"/>
  <ellipse cx="144" cy="108" rx="7" ry="4" fill="#003838" opacity="0.8"/>
  <ellipse cx="144" cy="108" rx="5" ry="3.5" fill="#00ccaa" opacity="0.75"/>
  <ellipse cx="144" cy="108" rx="3" ry="2.5" fill="#00ffdd" opacity="0.9"/>
  <circle cx="142" cy="106.5" r="1.8" fill="#ffffff" opacity="0.95"/>
  <circle cx="146" cy="109" r="0.9" fill="#ffffff" opacity="0.6"/>

  <!-- Stall / counter surface -->
  <rect x="18" y="308" width="220" height="6" rx="2" fill="#1a1a2e" stroke="#ffaa00" stroke-width="0.5" opacity="0.8"/>
  <rect x="12" y="312" width="232" height="68" rx="3" fill="#0e0e1e" stroke="#ffaa00" stroke-width="0.4" opacity="0.5"/>

  <!-- Merchandise on stall -->
  <rect x="28" y="318" width="18" height="14" rx="2" fill="#0a0a18" stroke="#00ccaa" stroke-width="0.6" opacity="0.5"/>
  <rect x="52" y="320" width="14" height="12" rx="2" fill="#0a0a18" stroke="#dd00ff" stroke-width="0.5" opacity="0.4"/>
  <rect x="186" y="318" width="16" height="14" rx="2" fill="#0a0a18" stroke="#0088ff" stroke-width="0.6" opacity="0.5"/>

  <!-- Hands resting on stall - relaxed -->
  <path d="M76,280 Q72,290 74,302 Q76,308 82,309 L102,308 Q106,305 106,300 Q105,292 102,284 Q96,276 86,276 Q79,277 76,280 Z" fill="#16162a" stroke="#ffaa00" stroke-width="0.4" opacity="0.7"/>
  <path d="M180,280 Q184,290 182,302 Q180,308 174,309 L154,308 Q150,305 150,300 Q151,292 154,284 Q160,276 170,276 Q177,277 180,280 Z" fill="#16162a" stroke="#ffaa00" stroke-width="0.4" opacity="0.7"/>

  <!-- Floating holographic price tags -->
  <g opacity="0.5" filter="url(#glow)">
    <rect x="30" y="200" width="28" height="12" rx="2" fill="none" stroke="#00ccaa" stroke-width="0.5"/>
    <text x="44" y="209" font-family="monospace" font-size="6" fill="#00ccaa" text-anchor="middle">¥8800</text>
  </g>
  <g opacity="0.4" filter="url(#glow)">
    <rect x="198" y="190" width="30" height="12" rx="2" fill="none" stroke="#ffaa00" stroke-width="0.5"/>
    <text x="213" y="199" font-family="monospace" font-size="6" fill="#ffaa00" text-anchor="middle">¥12000</text>
  </g>

  <!-- Ambient multi-color particles -->
  <circle cx="32" cy="75" r="1.5" fill="#ffaa00" opacity="0.3"/>
  <circle cx="224" cy="90" r="1" fill="#00ccaa" opacity="0.25"/>
  <circle cx="40" cy="245" r="1.2" fill="#0088ff" opacity="0.2"/>
  <circle cx="215" cy="230" r="0.8" fill="#dd00ff" opacity="0.25"/>
  <circle cx="22" cy="170" r="1" fill="#00ccaa" opacity="0.15"/>
  <circle cx="234" cy="155" r="1.3" fill="#ffaa00" opacity="0.2"/>

  <!-- Holographic shimmer on mask -->
  <circle cx="118" cy="90" r="1" fill="#00ffee" opacity="0.5"/>
  <circle cx="142" cy="96" r="0.8" fill="#0088ff" opacity="0.4"/>
  <circle cx="110" cy="148" r="1.1" fill="#00ccaa" opacity="0.35"/>
  <circle cx="148" cy="130" r="0.7" fill="#00ddcc" opacity="0.4"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ffaa00" stroke-width="0.3" opacity="0.06"/>

  <!-- Expression label -->
  <text x="128" y="374" font-family="monospace" font-size="10" fill="#ffaa00" text-anchor="middle" opacity="0.6">DEFAULT</text>
</svg>