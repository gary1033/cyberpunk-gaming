<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="mm_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="mm_mask_holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ddbb"/>
      <stop offset="25%" stop-color="#0088ff"/>
      <stop offset="50%" stop-color="#dd00ff"/>
      <stop offset="75%" stop-color="#00ddbb"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="mm_robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <radialGradient id="mm_glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#00ddbb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ddbb" stop-opacity="0"/>
    </radialGradient>
    <filter id="mm_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mm_holo_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#mm_bg)"/>
  <rect width="256" height="384" fill="url(#mm_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#00ddbb" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#00ddbb" text-anchor="middle" filter="url(#mm_neon)">面具商人</text>

  <!-- Stall / counter surface -->
  <rect x="20" y="295" width="216" height="8" rx="2" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.8"/>
  <rect x="15" y="300" width="226" height="80" rx="3" fill="#111122" stroke="#00ddbb" stroke-width="0.5" opacity="0.5"/>
  <rect x="30" y="308" width="18" height="14" rx="2" fill="#0d0d1a" stroke="#00ddbb" stroke-width="0.5" opacity="0.4"/>
  <rect x="55" y="310" width="14" height="12" rx="2" fill="#0d0d1a" stroke="#dd00ff" stroke-width="0.5" opacity="0.3"/>
  <rect x="185" y="308" width="16" height="14" rx="2" fill="#0d0d1a" stroke="#0088ff" stroke-width="0.5" opacity="0.4"/>

  <!-- Body / dark robe - anime proportions, bigger head -->
  <path d="M68,210 Q62,224 55,264 L52,295 H204 L201,264 Q195,224 188,210 Q178,196 168,188 L162,184 Q148,176 128,172 Q108,176 94,184 L88,188 Q78,196 68,210 Z" fill="url(#mm_robe)" stroke="#00ddbb" stroke-width="0.5" opacity="0.9"/>
  <!-- Robe folds -->
  <path d="M95,196 Q100,230 98,264 L97,292" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.3"/>
  <path d="M161,196 Q156,230 158,264 L159,292" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.3"/>
  <path d="M128,176 Q127,220 128,264 L128,295" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.2"/>

  <!-- Robe collar - high and mysterious -->
  <path d="M94,188 Q98,176 110,170 Q120,166 128,165 Q136,166 146,170 Q158,176 162,188 L157,196 Q147,185 128,180 Q109,185 99,196 Z" fill="#151528" stroke="#00ddbb" stroke-width="0.8" opacity="0.9"/>

  <!-- Hood - anime style with clean lines -->
  <path d="M80,184 Q76,160 78,132 Q80,106 88,88 Q98,68 114,56 Q124,50 128,48 Q132,50 142,56 Q158,68 168,88 Q176,106 178,132 Q180,160 176,184 Q166,176 152,170 Q142,166 128,165 Q114,166 104,170 Q90,176 80,184 Z" fill="#12122a" stroke="#00ddbb" stroke-width="0.5" opacity="0.95"/>
  <!-- Hood shadow inner -->
  <path d="M88,178 Q86,156 88,128 Q90,106 98,90 Q106,76 118,66 Q124,62 128,60 Q132,62 138,66 Q150,76 158,90 Q166,106 168,128 Q170,156 168,178" fill="#0a0a1e" opacity="0.7"/>

  <!-- Holographic mask - anime style, smooth oval -->
  <ellipse cx="128" cy="126" rx="32" ry="42" fill="url(#mm_mask_holo)" opacity="0.85" filter="url(#mm_holo_glow)"/>

  <!-- Mask surface holographic lines -->
  <path d="M106,96 Q116,91 128,89 Q140,91 150,96" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <path d="M104,112 Q114,107 128,105 Q142,107 152,112" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <path d="M102,128 Q114,123 128,121 Q142,123 154,128" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>
  <path d="M104,144 Q114,139 128,137 Q142,139 152,144" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.25"/>

  <!-- Anime eyes on mask - LARGE expressive with big iris and highlights -->
  <!-- Left eye -->
  <ellipse cx="114" cy="112" rx="12" ry="10" fill="#0a1520" opacity="0.9"/>
  <ellipse cx="114" cy="112" rx="11" ry="9" fill="#003333" opacity="0.8"/>
  <ellipse cx="114" cy="113" rx="8" ry="8" fill="#00ddbb" opacity="0.7"/>
  <ellipse cx="114" cy="113" rx="5.5" ry="5.5" fill="#00ffee" opacity="0.8"/>
  <circle cx="110" cy="109" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="117" cy="115" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="112" cy="116" r="1" fill="#ffffff" opacity="0.5"/>
  <!-- Right eye -->
  <ellipse cx="142" cy="112" rx="12" ry="10" fill="#0a1520" opacity="0.9"/>
  <ellipse cx="142" cy="112" rx="11" ry="9" fill="#003333" opacity="0.8"/>
  <ellipse cx="142" cy="113" rx="8" ry="8" fill="#00ddbb" opacity="0.7"/>
  <ellipse cx="142" cy="113" rx="5.5" ry="5.5" fill="#00ffee" opacity="0.8"/>
  <circle cx="138" cy="109" r="3" fill="#ffffff" opacity="0.95"/>
  <circle cx="145" cy="115" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="140" cy="116" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Small simple nose -->
  <path d="M126,130 Q128,133 130,130" fill="none" stroke="#00ddbb" stroke-width="0.6" opacity="0.4"/>

  <!-- Small mouth -->
  <path d="M122,140 Q128,143 134,140" fill="none" stroke="#00ddbb" stroke-width="0.8" opacity="0.5"/>

  <!-- Holographic shimmer particles -->
  <circle cx="115" cy="94" r="1" fill="#dd00ff" opacity="0.6"/>
  <circle cx="140" cy="102" r="0.8" fill="#0088ff" opacity="0.5"/>
  <circle cx="120" cy="148" r="1.2" fill="#00ddbb" opacity="0.4"/>
  <circle cx="145" cy="135" r="0.7" fill="#dd00ff" opacity="0.5"/>
  <circle cx="108" cy="122" r="0.9" fill="#0088ff" opacity="0.4"/>

  <!-- Hands resting on stall -->
  <path d="M80,270 Q78,278 80,288 Q82,294 88,295 L105,295 Q108,293 108,288 Q107,280 105,272 Q100,265 90,265 Q83,266 80,270 Z" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.7"/>
  <path d="M176,270 Q178,278 176,288 Q174,294 168,295 L151,295 Q148,293 148,288 Q149,280 151,272 Q156,265 166,265 Q173,266 176,270 Z" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.7"/>

  <!-- Ambient teal particles -->
  <circle cx="35" cy="80" r="1.5" fill="#00ddbb" opacity="0.3"/>
  <circle cx="220" cy="95" r="1" fill="#00ddbb" opacity="0.25"/>
  <circle cx="45" cy="250" r="1.2" fill="#00ddbb" opacity="0.2"/>
  <circle cx="210" cy="230" r="0.8" fill="#00ddbb" opacity="0.3"/>
  <circle cx="25" cy="180" r="1" fill="#00ddbb" opacity="0.15"/>
  <circle cx="230" cy="160" r="1.3" fill="#00ddbb" opacity="0.2"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
</svg>