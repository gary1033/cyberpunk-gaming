<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="mm_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="mm_mask_holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ddbb"/>
      <stop offset="25%" stop-color="#0088ff"/>
      <stop offset="50%" stop-color="#dd00ff"/>
      <stop offset="75%" stop-color="#00ddbb"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="mm_robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <radialGradient id="mm_glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#00ddbb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ddbb" stop-opacity="0"/>
    </radialGradient>
    <filter id="mm_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mm_holo_glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#mm_bg)"/>
  <rect width="256" height="384" fill="url(#mm_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#00ddbb" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#00ddbb" text-anchor="middle" filter="url(#mm_neon)">面具商人</text>

  <!-- Stall / counter surface -->
  <rect x="20" y="295" width="216" height="8" rx="2" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.8"/>
  <rect x="15" y="300" width="226" height="80" rx="3" fill="#111122" stroke="#00ddbb" stroke-width="0.5" opacity="0.5"/>
  <rect x="30" y="308" width="18" height="14" rx="2" fill="#0d0d1a" stroke="#00ddbb" stroke-width="0.5" opacity="0.4"/>
  <rect x="55" y="310" width="14" height="12" rx="2" fill="#0d0d1a" stroke="#dd00ff" stroke-width="0.5" opacity="0.3"/>
  <rect x="185" y="308" width="16" height="14" rx="2" fill="#0d0d1a" stroke="#0088ff" stroke-width="0.5" opacity="0.4"/>

  <!-- Body / dark robe - anime proportions, bigger head area -->
  <path d="M68,205 Q62,218 55,260 L52,295 H204 L201,260 Q195,218 188,205 Q178,192 168,185 L162,182 Q148,175 128,172 Q108,175 94,182 L88,185 Q78,192 68,205 Z" fill="url(#mm_robe)" stroke="#00ddbb" stroke-width="0.5" opacity="0.9"/>
  <!-- Robe folds -->
  <path d="M95,192 Q100,225 98,260 L97,290" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.3"/>
  <path d="M161,192 Q156,225 158,260 L159,290" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.3"/>
  <path d="M128,176 Q127,215 128,260 L128,295" fill="none" stroke="#00ddbb" stroke-width="0.3" opacity="0.2"/>

  <!-- Robe collar - high and mysterious -->
  <path d="M94,185 Q98,174 110,168 Q120,164 128,163 Q136,164 146,168 Q158,174 162,185 L157,192 Q147,182 128,178 Q109,182 99,192 Z" fill="#151528" stroke="#00ddbb" stroke-width="0.8" opacity="0.9"/>

  <!-- Hood - anime style with clean lines -->
  <path d="M80,180 Q76,158 78,132 Q80,108 88,92 Q98,74 114,64 Q124,58 128,57 Q132,58 142,64 Q158,74 168,92 Q176,108 178,132 Q180,158 176,180 Q166,174 152,168 Q142,164 128,163 Q114,164 104,168 Q90,174 80,180 Z" fill="#12122a" stroke="#00ddbb" stroke-width="0.5" opacity="0.95"/>
  <!-- Hood shadow inner -->
  <path d="M88,175 Q86,153 88,128 Q90,108 98,94 Q106,82 118,74 Q124,70 128,69 Q132,70 138,74 Q150,82 158,94 Q166,108 168,128 Q170,153 168,175" fill="#0a0a1e" opacity="0.7"/>

  <!-- Holographic mask - anime style with smoother shape -->
  <path d="M98,160 Q96,144 98,122 Q100,106 108,96 Q116,88 128,86 Q140,88 148,96 Q156,106 158,122 Q160,144 158,160 Q152,168 142,172 Q134,174 128,174 Q122,174 114,172 Q104,168 98,160 Z" fill="url(#mm_mask_holo)" opacity="0.85" filter="url(#mm_holo_glow)"/>

  <!-- Mask surface holographic lines -->
  <path d="M106,102 Q116,97 128,95 Q140,97 150,102" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <path d="M104,118 Q114,113 128,111 Q142,113 152,118" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <path d="M102,134 Q114,129 128,127 Q142,129 154,134" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>
  <path d="M104,150 Q114,145 128,143 Q142,145 152,150" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.25"/>

  <!-- Anime eyes on mask - LARGE expressive with big iris and highlights -->
  <!-- Left eye -->
  <ellipse cx="114" cy="118" rx="11" ry="9" fill="#0a1520" opacity="0.9"/>
  <ellipse cx="114" cy="118" rx="10" ry="8" fill="#003333" opacity="0.8"/>
  <ellipse cx="114" cy="119" rx="7" ry="7" fill="#00ddbb" opacity="0.7"/>
  <ellipse cx="114" cy="119" rx="5" ry="5" fill="#00ffee" opacity="0.8"/>
  <circle cx="110" cy="115" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="117" cy="121" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="112" cy="122" r="0.8" fill="#ffffff" opacity="0.5"/>
  <!-- Right eye -->
  <ellipse cx="142" cy="118" rx="11" ry="9" fill="#0a1520" opacity="0.9"/>
  <ellipse cx="142" cy="118" rx="10" ry="8" fill="#003333" opacity="0.8"/>
  <ellipse cx="142" cy="119" rx="7" ry="7" fill="#00ddbb" opacity="0.7"/>
  <ellipse cx="142" cy="119" rx="5" ry="5" fill="#00ffee" opacity="0.8"/>
  <circle cx="138" cy="115" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="145" cy="121" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="140" cy="122" r="0.8" fill="#ffffff" opacity="0.5"/>

  <!-- Small simple nose -->
  <path d="M126,132 Q128,135 130,132" fill="none" stroke="#00ddbb" stroke-width="0.6" opacity="0.4"/>

  <!-- Small mouth -->
  <path d="M122,142 Q128,145 134,142" fill="none" stroke="#00ddbb" stroke-width="0.8" opacity="0.5"/>

  <!-- Holographic shimmer particles -->
  <circle cx="115" cy="100" r="1" fill="#dd00ff" opacity="0.6"/>
  <circle cx="140" cy="108" r="0.8" fill="#0088ff" opacity="0.5"/>
  <circle cx="120" cy="145" r="1.2" fill="#00ddbb" opacity="0.4"/>
  <circle cx="145" cy="135" r="0.7" fill="#dd00ff" opacity="0.5"/>
  <circle cx="108" cy="128" r="0.9" fill="#0088ff" opacity="0.4"/>

  <!-- Hands resting on stall -->
  <path d="M80,270 Q78,278 80,288 Q82,294 88,295 L105,295 Q108,293 108,288 Q107,280 105,272 Q100,265 90,265 Q83,266 80,270 Z" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.7"/>
  <path d="M176,270 Q178,278 176,288 Q174,294 168,295 L151,295 Q148,293 148,288 Q149,280 151,272 Q156,265 166,265 Q173,266 176,270 Z" fill="#1a1a2e" stroke="#00ddbb" stroke-width="0.5" opacity="0.7"/>

  <!-- Ambient teal particles -->
  <circle cx="35" cy="80" r="1.5" fill="#00ddbb" opacity="0.3"/>
  <circle cx="220" cy="95" r="1" fill="#00ddbb" opacity="0.25"/>
  <circle cx="45" cy="250" r="1.2" fill="#00ddbb" opacity="0.2"/>
  <circle cx="210" cy="230" r="0.8" fill="#00ddbb" opacity="0.3"/>
  <circle cx="25" cy="180" r="1" fill="#00ddbb" opacity="0.15"/>
  <circle cx="230" cy="160" r="1.3" fill="#00ddbb" opacity="0.2"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#00ddbb" stroke-width="0.3" opacity="0.08"/>
</svg>