  <path d="M128,79 L133,83 L128,87 L123,83 Z" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.12"/>
  <path d="M146,82 L151,86 L146,90 L141,86 Z" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.12"/>

