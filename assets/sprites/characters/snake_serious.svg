  <path d="M68,155 Q66,180 64,210 Q63,230 64,250" fill="none" stroke="#22cc66" stroke-width="2.5" opacity="0.12"/>
  <path d="M188,155 Q190,180 192,210 Q193,230 192,250" fill="none" stroke="#22cc66" stroke-width="2.5" opacity="0.12"/>

  <!-- === NECK - tense === -->
