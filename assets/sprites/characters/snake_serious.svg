  <path d="M84,220 Q64,226 54,246 Q48,260 48,276" fill="none" stroke="#1a2a2e" stroke-width="1"/>
  <path d="M172,220 Q192,226 202,246 Q208,260 208,276" fill="none" stroke="#1a2a2e" stroke-width="1"/>

  <!-- Arms - crossed in front -->
  <path d="M48,276 Q55,295 70,310 Q90,325 112,320" fill="url(#dress_grad)" stroke="#1a1a2e" stroke-width="0.5"/>
  <path d="M208,276 Q201,295 186,310 Q166,325 144,320" fill="url(#dress_grad)" stroke="#1a1a2e" stroke-width="0.5"/>
