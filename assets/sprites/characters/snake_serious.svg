  <path d="M128,80 L128,128" fill="none" stroke="#00ff88" stroke-width="0.6" opacity="0.25"/>
  <path d="M124,128 Q128,134 132,128" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>

  <!-- Snake fangs -->
  <path d="M106,131 L103,139 L108,134" fill="#1a4a3a" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
  <path d="M150,131 L153,139 L148,134" fill="#1a4a3a" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>

  <!-- === MASK EYE HOLES - wider open for serious === -->
  <path d="M99,98 Q110,90 121,98 Q110,106 99,98 Z" fill="#050a08" stroke="#00ff88" stroke-width="1"/>
  <path d="M135,98 Q146,90 157,98 Q146,106 135,98 Z" fill="#050a08" stroke="#00ff88" stroke-width="1"/>

  <!-- === EYES - Serious: more open, direct gaze === -->
  <!-- Left eye -->
  <!-- Thick upper eyelid - wider arc -->
  <path d="M101,96 Q110,89 120,96" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lower eyelid - straight, tense -->
  <path d="M103,101 Q110,103 118,101" fill="none" stroke="#1a1a1a" stroke-width="1.2" opacity="0.7"/>
  <!-- Large iris - fully visible -->
  <circle cx="110" cy="98" r="7" fill="url(#eye_grad)"/>
  <circle cx="110" cy="98" r="6" fill="none" stroke="#aa7711" stroke-width="0.5" opacity="0.4"/>
  <!-- Vertical slit pupil -->
  <ellipse cx="110" cy="98" rx="1.8" ry="5.5" fill="#1a0a00"/>
  <!-- Highlights -->
  <circle cx="107" cy="95" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="113" cy="96" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="109" cy="102" r="0.7" fill="#ffffff" opacity="0.3"/>
  <!-- Eyelash flicks -->
  <path d="M100,95 Q98,92 96,90" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M120,95 Q122,93 123,91" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  <!-- NO half-lid for serious - eyes fully open -->

  <!-- Right eye -->
  <path d="M136,96 Q146,89 156,96" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M138,101 Q146,103 154,101" fill="none" stroke="#1a1a1a" stroke-width="1.2" opacity="0.7"/>
  <circle cx="146" cy="98" r="7" fill="url(#eye_grad)"/>
  <circle cx="146" cy="98" r="6" fill="none" stroke="#aa7711" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="146" cy="98" rx="1.8" ry="5.5" fill="#1a0a00"/>
  <circle cx="143" cy="95" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="149" cy="96" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="145" cy="102" r="0.7" fill="#ffffff" opacity="0.3"/>
  <path d="M136,95 Q134,92 133,90" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round"/>
  <path d="M156,95 Q158,92 160,90" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- === LOWER FACE === -->
  <!-- Nose -->
  <path d="M126,138 Q128,140 130,138" fill="none" stroke="#c49a78" stroke-width="0.8" opacity="0.5"/>

  <!-- Lips - no smile, flat serious line -->
  <path d="M116,147 Q128,145 140,147" fill="none" stroke="#bb8877" stroke-width="2" stroke-linecap="round"/>
  <path d="M118,148 Q128,147 138,148" fill="none" stroke="#996655" stroke-width="0.8"/>

  <!-- Jaw set - stronger chin line -->
  <path d="M112,155 Q128,165 144,155" fill="none" stroke="#c49a78" stroke-width="1" opacity="0.4"/>

  <!-- === EARS === -->
  <ellipse cx="92" cy="105" rx="4" ry="9" fill="url(#skin_base)" stroke="#c49a78" stroke-width="0.5" opacity="0.6"/>
  <ellipse cx="164" cy="105" rx="4" ry="9" fill="url(#skin_base)" stroke="#c49a78" stroke-width="0.5" opacity="0.6"/>
  <!-- Snake fang earrings -->
  <path d="M92,115 L90,122 L94,122 Z" fill="#0a2a1a" stroke="#00ff88" stroke-width="0.8" filter="url(#glow)"/>
  <path d="M164,115 L162,122 L166,122 Z" fill="#0a2a1a" stroke="#00ff88" stroke-width="0.8" filter="url(#glow)"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="98" rx="45" ry="22" fill="#00ff88" opacity="0.02" filter="url(#soft_glow)"/>
  <ellipse cx="128" cy="280" rx="70" ry="30" fill="#00ff88" opacity="0.012"/>

  <!-- Expression label -->
  <text x="128" y="374" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" text-anchor="middle" opacity="0.6">SERIOUS</text>
</svg>