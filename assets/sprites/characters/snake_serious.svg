  <path d="M110,188 Q114,178 120,172 L128,170 L136,172 Q142,178 146,188" fill="#0d0d1a" stroke="#00ff88" stroke-width="0.8" opacity="0.9"/>
  <path d="M112,186 Q118,175 128,172 Q138,175 144,186" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>

