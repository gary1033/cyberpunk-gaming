  <path d="M128,220 L128,384" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
  <path d="M108,255 Q114,250 120,254 Q126,258 132,254 Q138,250 144,254 Q150,258 154,255" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.12"/>

