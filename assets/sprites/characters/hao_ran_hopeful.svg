<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="hh_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="hh_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8bc9a"/>
      <stop offset="100%" stop-color="#c4a880"/>
    </linearGradient>
    <linearGradient id="hh_shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="hh_overshirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d3d"/>
      <stop offset="100%" stop-color="#0f1a28"/>
    </linearGradient>
    <linearGradient id="hh_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <radialGradient id="hh_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hh_port_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#00ccff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hh_warm" cx="0.5" cy="0.4" r="0.4">
      <stop offset="0%" stop-color="#ffddaa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffddaa" stop-opacity="0"/>
    </radialGradient>
    <filter id="hh_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hh_soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#hh_bg)"/>
  <rect width="256" height="384" fill="url(#hh_glow)"/>
  <!-- Warm undertone for hopeful mood -->
  <rect width="256" height="384" fill="url(#hh_warm)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.38"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="18" fill="#00ccff" text-anchor="middle" filter="url(#hh_neon)">浩然</text>

  <!-- Body / open shirt over t-shirt -->
  <path d="M60,218 Q54,238 46,288 L40,384 H216 L210,288 Q204,238 196,218 Q184,198 170,190 L162,186 Q147,178 128,176 Q109,178 94,186 L86,190 Q72,198 60,218 Z" fill="url(#hh_overshirt)" stroke="#00ccff" stroke-width="0.3" opacity="0.9"/>
  <!-- Open shirt lapels -->
  <path d="M108,186 Q112,193 108,213 Q106,228 104,248" fill="none" stroke="#1a3040" stroke-width="2.5" opacity="0.6"/>
  <path d="M148,186 Q144,193 148,213 Q150,228 152,248" fill="none" stroke="#1a3040" stroke-width="2.5" opacity="0.6"/>
  <!-- Shirt fold lines -->
  <path d="M92,198 Q95,238 94,278" fill="none" stroke="#00ccff" stroke-width="0.25" opacity="0.12"/>
  <path d="M164,198 Q161,238 162,278" fill="none" stroke="#00ccff" stroke-width="0.25" opacity="0.12"/>
  <line x1="128" y1="193" x2="128" y2="384" stroke="#00ccff" stroke-width="0.4" opacity="0.1"/>
  <!-- Pockets -->
  <rect x="78" y="258" width="26" height="20" rx="2" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.18"/>
  <rect x="152" y="258" width="26" height="20" rx="2" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.18"/>

  <!-- T-shirt visible underneath -->
  <path d="M108,186 Q116,178 128,176 Q140,178 148,186 L148,238 Q140,236 128,234 Q116,236 108,238 Z" fill="url(#hh_shirt)" opacity="0.85"/>
  <path d="M114,186 Q120,180 128,178 Q136,180 142,186" fill="none" stroke="#222240" stroke-width="1.2" opacity="0.5"/>

  <!-- Neck -->
  <path d="M118,176 Q118,166 120,158 L128,155 L136,158 Q138,166 138,176" fill="url(#hh_skin)" opacity="0.9"/>

  <!-- Head shape - slightly raised -->
  <g transform="rotate(-2,128,116)">
    <ellipse cx="128" cy="116" rx="37" ry="43" fill="url(#hh_skin)" opacity="0.95"/>

    <!-- Face contour shadow -->
    <path d="M98,128 Q104,140 114,148 Q122,153 128,155 Q134,153 142,148 Q152,140 158,128" fill="#b89060" opacity="0.2"/>
    <!-- Cheek warmth - slightly more vibrant -->
    <ellipse cx="108" cy="128" rx="9" ry="5" fill="#d4a080" opacity="0.2"/>
    <ellipse cx="148" cy="128" rx="9" ry="5" fill="#d4a080" opacity="0.2"/>

    <!-- Ears -->
    <path d="M91,112 Q86,107 85,115 Q85,124 89,127 Q91,122 91,112 Z" fill="url(#hh_skin)" opacity="0.8"/>
    <path d="M91,116 Q88,114 87,118 Q87,122 89,124" fill="none" stroke="#b89070" stroke-width="0.5" opacity="0.3"/>
    <path d="M165,112 Q170,107 171,115 Q171,124 167,127 Q165,122 165,112 Z" fill="url(#hh_skin)" opacity="0.8"/>

    <!-- Neural interface port - right temple - normal glow -->
    <circle cx="166" cy="104" r="5" fill="#0a1520" stroke="#00ccff" stroke-width="1" opacity="0.7"/>
    <circle cx="166" cy="104" r="3" fill="url(#hh_port_glow)" filter="url(#hh_soft)"/>
    <circle cx="166" cy="104" r="1.5" fill="#00ccff" opacity="0.45"/>
    <path d="M171,104 Q174,104 176,102" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.3"/>
    <path d="M170,107 Q173,108 175,107" fill="none" stroke="#00ccff" stroke-width="0.4" opacity="0.25"/>

    <!-- Hair - messy dark, layered -->
    <path d="M91,108 Q87,90 91,72 Q95,54 108,44 Q118,36 128,34 Q138,36 148,44 Q161,54 165,72 Q169,90 165,108 Q160,98 152,90 Q142,80 132,76 Q128,74 124,76 Q114,80 104,90 Q96,98 91,108 Z" fill="url(#hh_hair)" opacity="0.95"/>
    <path d="M96,98 Q92,86 96,72 Q100,60 110,52" fill="none" stroke="#16162a" stroke-width="2" opacity="0.5"/>
    <path d="M160,98 Q164,86 160,72 Q156,60 146,52" fill="none" stroke="#16162a" stroke-width="2" opacity="0.5"/>
    <path d="M109,78 Q106,88 110,100" fill="none" stroke="#1a1a2a" stroke-width="2.2" opacity="0.75"/>
    <path d="M117,74 Q113,84 117,96" fill="none" stroke="#1a1a2a" stroke-width="1.5" opacity="0.65"/>
    <path d="M124,72 Q122,80 124,92" fill="none" stroke="#16162a" stroke-width="1" opacity="0.5"/>
    <path d="M139,76 Q142,84 139,96" fill="none" stroke="#1a1a2a" stroke-width="1.8" opacity="0.7"/>
    <path d="M148,80 Q151,88 148,98" fill="none" stroke="#16162a" stroke-width="1.2" opacity="0.55"/>
    <path d="M132,74 Q134,82 131,94" fill="none" stroke="#1a1a2a" stroke-width="1.3" opacity="0.6"/>
    <path d="M112,48 Q120,44 128,42 Q136,44 144,48" fill="none" stroke="#2a2a44" stroke-width="0.8" opacity="0.4"/>

    <!-- Eyes - bright, clearing, hopeful - highlights RETURNING -->
    <!-- Left eye -->
    <path d="M106,113 Q112,108 120,110 Q123,113 122,118 Q119,122 112,122 Q107,120 106,116 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="114" cy="115" r="4" fill="#1a1a2e"/>
    <circle cx="114" cy="115" r="2.5" fill="#2a3a4a"/>
    <circle cx="114.5" cy="114.5" r="1.8" fill="#00ccff" opacity="0.5"/>
    <!-- Bright highlights returning! -->
    <circle cx="112" cy="113" r="1.4" fill="#ffffff" opacity="0.95"/>
    <circle cx="116" cy="116" r="0.7" fill="#ffffff" opacity="0.6"/>
    <circle cx="113" cy="117" r="0.4" fill="#00ccff" opacity="0.3"/>
    <!-- Right eye -->
    <path d="M134,110 Q142,108 150,113 Q150,120 144,122 Q137,122 134,118 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="142" cy="115" r="4" fill="#1a1a2e"/>
    <circle cx="142" cy="115" r="2.5" fill="#2a3a4a"/>
    <circle cx="141.5" cy="114.5" r="1.8" fill="#00ccff" opacity="0.5"/>
    <!-- Bright highlights returning! -->
    <circle cx="140" cy="113" r="1.4" fill="#ffffff" opacity="0.95"/>
    <circle cx="144" cy="116" r="0.7" fill="#ffffff" opacity="0.6"/>
    <circle cx="141" cy="117" r="0.4" fill="#00ccff" opacity="0.3"/>

    <!-- Eyebrows - slightly raised, hopeful -->
    <path d="M105,105 Q111,102 119,103 Q121,104 122,105" fill="none" stroke="#1a1a2a" stroke-width="1.6" opacity="0.6"/>
    <path d="M134,105 Q135,104 138,103 Q146,102 151,105" fill="none" stroke="#1a1a2a" stroke-width="1.6" opacity="0.6"/>

    <!-- Nose -->
    <path d="M128,116 Q127,122 126,128 Q125,131 127,133 Q128,134 130,133 Q131,131 130,128 Q129,122 128,116" fill="none" stroke="#b09060" stroke-width="0.7" opacity="0.4"/>
    <line x1="128" y1="116" x2="128" y2="124" stroke="#dcc8a0" stroke-width="0.4" opacity="0.15"/>

    <!-- Mouth - small warm smile -->
    <path d="M120,139 Q124,142 128,143 Q132,142 136,139" fill="none" stroke="#8a6050" stroke-width="1.2" opacity="0.7"/>
    <!-- Smile curves up warmly -->
    <path d="M122,140 Q125,138 128,138 Q131,138 134,140" fill="none" stroke="#a07060" stroke-width="0.5" opacity="0.35"/>
    <!-- Slight teeth hint -->
    <path d="M123,140 Q126,141 128,141 Q130,141 133,140" fill="#e8e0d0" opacity="0.12"/>
  </g>

  <!-- Small tech earpiece -->
  <path d="M85,114 Q82,112 81,116 Q81,120 83,122" fill="none" stroke="#00ccff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="82" cy="116" r="1.5" fill="#00ccff" opacity="0.25"/>

  <!-- ID badge -->
  <rect x="148" y="220" width="16" height="22" rx="2" fill="#0d1a28" stroke="#00ccff" stroke-width="0.5" opacity="0.35"/>
  <rect x="150" y="223" width="12" height="7" rx="1" fill="#00ccff" opacity="0.08"/>
  <line x1="150" y1="233" x2="162" y2="233" stroke="#00ccff" stroke-width="0.3" opacity="0.25"/>
  <line x1="150" y1="236" x2="159" y2="236" stroke="#00ccff" stroke-width="0.3" opacity="0.18"/>

  <!-- Ambient cyan particles -->
  <circle cx="28" cy="78" r="1.2" fill="#00ccff" opacity="0.2"/>
  <circle cx="228" cy="92" r="0.8" fill="#00ccff" opacity="0.16"/>
  <circle cx="38" cy="260" r="1" fill="#00ccff" opacity="0.16"/>
  <circle cx="218" cy="244" r="0.7" fill="#00ccff" opacity="0.2"/>
  <circle cx="18" cy="178" r="0.9" fill="#00ccff" opacity="0.12"/>
  <circle cx="238" cy="168" r="1.1" fill="#00ccff" opacity="0.14"/>
  <circle cx="45" cy="340" r="0.6" fill="#00ccff" opacity="0.12"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
</svg>