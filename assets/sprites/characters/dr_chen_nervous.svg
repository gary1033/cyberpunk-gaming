<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a0f1a" />
      <stop offset="100%" stop-color="#0a0a1a" />
    </radialGradient>
    <filter id="neon_blue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a882" />
      <stop offset="100%" stop-color="#b09070" />
    </linearGradient>
    <linearGradient id="coat_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8f0" />
      <stop offset="50%" stop-color="#d0d0e0" />
      <stop offset="100%" stop-color="#b8b8c8" />
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2244" />
      <stop offset="100%" stop-color="#0d1530" />
    </linearGradient>
    <linearGradient id="hair_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0d0d1a" />
    </linearGradient>
    <linearGradient id="glass_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2266cc" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle" filter="url(#neon_blue)">Dr.陳</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#4488ff" text-anchor="middle">Dr.陳</text>

  <!-- Neck -->
  <rect x="114" y="160" width="28" height="28" rx="4" fill="url(#skin_grad)"/>

  <!-- Body -->
  <path d="M128,186 Q128,198 128,210 L128,384 L55,384 L55,270 Q55,230 88,218 Q112,206 128,186 Z" fill="url(#shirt_grad)"/>
  <path d="M128,186 Q128,198 128,210 L128,384 L201,384 L201,270 Q201,230 168,218 Q144,206 128,186 Z" fill="url(#shirt_grad)"/>

  <!-- Lab coat -->
  <path d="M88,218 Q68,224 58,244 Q55,255 55,270 L55,384 L85,384 L85,240 Q88,228 95,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M168,218 Q188,224 198,244 Q201,255 201,270 L201,384 L171,384 L171,240 Q168,228 161,222" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>

  <!-- Lab coat lapels -->
  <path d="M100,195 L118,230 L100,240" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M156,195 L138,230 L156,240" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>

  <!-- Shirt collar -->
  <path d="M110,192 L128,215 L146,192" fill="none" stroke="#1a2244" stroke-width="1.5"/>

  <!-- Coat pocket -->
  <rect x="160" y="260" width="22" height="28" rx="2" fill="none" stroke="#b0b0c0" stroke-width="0.8" opacity="0.6"/>

  <!-- Right arm - raised to adjust glasses -->
  <path d="M201,270 Q195,255 185,240 Q175,228 165,218" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <!-- Hand near glasses -->
  <path d="M162,170 Q158,165 160,160 Q165,155 170,158 Q172,162 168,168 Q165,172 162,170 Z" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>
  <!-- Fingers on glasses frame -->
  <path d="M164,162 Q166,155 165,150" fill="none" stroke="url(#skin_grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M160,164 Q160,157 161,152" fill="none" stroke="url(#skin_grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Left arm down -->
  <path d="M55,270 Q54,300 55,330 Q56,355 58,380" fill="url(#coat_grad)" stroke="#b0b0c0" stroke-width="0.5"/>
  <path d="M55,370 Q52,375 54,380 L62,380 Q64,375 60,370" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>

  <!-- Head - turned slightly, looking sideways -->
  <path d="M96,82 Q96,52 130,46 Q164,52 164,82 L164,122 Q164,140 155,150 Q145,162 130,164 Q115,162 105,150 Q96,140 96,122 Z" fill="url(#skin_grad)"/>

  <!-- Hair -->
  <path d="M94,78 Q94,50 130,44 Q166,50 166,78 L166,72 Q166,48 130,42 Q94,48 94,72 Z" fill="url(#hair_grad)"/>
  <path d="M92,72 Q90,60 97,52 Q110,44 122,44" fill="url(#hair_grad)"/>
  <path d="M168,72 Q170,60 163,52 Q150,44 124,44" fill="url(#hair_grad)"/>
  <!-- Slightly disheveled strand -->
  <path d="M105,52 Q102,48 100,52 Q98,56 102,58" fill="url(#hair_grad)" opacity="0.8"/>

  <!-- Glasses - slightly pushed up by hand, tilted -->
  <rect x="98" y="99" rx="3" ry="3" width="26" height="18" fill="url(#glass_grad)" stroke="#4488ff" stroke-width="1.2" opacity="0.8" transform="rotate(-2, 111, 108)"/>
  <rect x="136" y="100" rx="3" ry="3" width="26" height="18" fill="url(#glass_grad)" stroke="#4488ff" stroke-width="1.2" opacity="0.8" transform="rotate(-2, 149, 109)"/>
  <!-- Bridge -->
  <path d="M124,107 Q130,103 136,107" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.8"/>
  <!-- Temples -->
  <line x1="98" y1="105" x2="92" y2="103" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <line x1="162" y1="106" x2="168" y2="104" stroke="#4488ff" stroke-width="1" opacity="0.6"/>

  <!-- Eyes - looking sideways (to the right), nervous -->
  <ellipse cx="111" cy="109" rx="8" ry="5" fill="#1a1a2e"/>
  <ellipse cx="149" cy="109" rx="8" ry="5" fill="#1a1a2e"/>
  <!-- Pupils shifted right -->
  <circle cx="114" cy="109" r="3" fill="#443322"/>
  <circle cx="152" cy="109" r="3" fill="#443322"/>
  <circle cx="115" cy="109" r="1.5" fill="#0a0a1a"/>
  <circle cx="153" cy="109" r="1.5" fill="#0a0a1a"/>
  <circle cx="116" cy="108" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="154" cy="108" r="0.8" fill="#ffffff" opacity="0.6"/>

  <!-- Eyebrows - raised with worry -->
  <path d="M100,95 Q111,91 122,95" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M138,95 Q149,91 160,95" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>

  <!-- Sweat drop -->
  <path d="M170,92 Q172,97 170,102 Q168,97 170,92 Z" fill="#88ccff" opacity="0.5"/>

  <!-- Nose -->
  <path d="M130,112 L127,128 Q130,131 133,128 Z" fill="#a08060" opacity="0.4"/>

  <!-- Mouth - tight, nervous -->
  <path d="M120,143 Q130,141 140,143" fill="none" stroke="#8a6a5a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Slight quiver line -->
  <path d="M124,145 Q130,143 136,145" fill="none" stroke="#8a6a5a" stroke-width="0.5" opacity="0.3"/>

  <!-- Ears -->
  <ellipse cx="94" cy="112" rx="5" ry="9" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>
  <ellipse cx="166" cy="112" rx="5" ry="9" fill="url(#skin_grad)" stroke="#b09070" stroke-width="0.5"/>

  <!-- ID badge -->
  <rect x="68" y="280" width="16" height="22" rx="2" fill="#1a1a2e" stroke="#4488ff" stroke-width="0.5" opacity="0.6"/>
  <rect x="71" y="283" width="10" height="6" rx="1" fill="#4488ff" opacity="0.2"/>

  <!-- Ambient -->
  <ellipse cx="128" cy="300" rx="80" ry="30" fill="#4488ff" opacity="0.02"/>
</svg>