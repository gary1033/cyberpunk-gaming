<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="gr-bg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="gr-iris-l" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#cc88ff"/>
      <stop offset="40%" stop-color="#aa44ff"/>
      <stop offset="75%" stop-color="#7722cc"/>
      <stop offset="100%" stop-color="#5511aa"/>
    </radialGradient>
    <radialGradient id="gr-iris-r" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#cc88ff"/>
      <stop offset="40%" stop-color="#aa44ff"/>
      <stop offset="75%" stop-color="#7722cc"/>
      <stop offset="100%" stop-color="#5511aa"/>
    </radialGradient>
    <linearGradient id="gr-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d0b8"/>
      <stop offset="100%" stop-color="#d4b89a"/>
    </linearGradient>
    <linearGradient id="gr-skin-shadow" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c4a888"/>
      <stop offset="100%" stop-color="#b89878"/>
    </linearGradient>
    <linearGradient id="gr-hair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a2060"/>
      <stop offset="100%" stop-color="#1a0e30"/>
    </linearGradient>
    <linearGradient id="gr-hair-shine" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#6040a0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8060c0" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8060c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6040a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gr-scar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#aa44ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#cc66ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gr-cloak-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1848"/>
      <stop offset="50%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="gr-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aa44ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7722cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#aa44ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gr-holo-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44ddcc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#44ddcc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8833cc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gr-glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#gr-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#gr-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#aa44ff" text-anchor="middle" filter="url(#glow)">幽靈</text>

  <!-- Cloak body -->
  <path d="M40,175 L60,138 L84,118 L108,108 L128,102 L148,108 L172,118 L196,138 L216,175 L222,268 C224,310 218,352 210,375 L46,375 C38,352 32,310 34,268 Z" fill="url(#gr-cloak-main)"/>

  <!-- Cel-shaded cloak shadow blocks -->
  <path d="M40,175 L60,138 L84,118 L108,108 L112,128 L72,158 L52,210 L42,268 L42,375 L46,375 C38,352 32,310 34,268 Z" fill="#0d0818" opacity="0.5"/>
  <path d="M216,175 L196,138 L172,118 L148,108 L144,128 L184,158 L204,210 L214,268 L214,375 L210,375 C218,352 224,310 222,268 Z" fill="#140e28" opacity="0.35"/>

  <!-- Holographic shimmer on cloak -->
  <path d="M58,210 L76,192 L88,230 L66,262 Z" fill="url(#gr-holo-1)"/>
  <path d="M178,218 L198,200 L202,248 L180,260 Z" fill="#5566ff" opacity="0.04"/>

  <!-- Cloak edge highlights -->
  <path d="M40,175 L60,138 L84,118 L108,108" fill="none" stroke="#aa44ff" stroke-width="1.2" opacity="0.4"/>
  <path d="M216,175 L196,138 L172,118 L148,108" fill="none" stroke="#aa44ff" stroke-width="1.2" opacity="0.4"/>

  <!-- Angular fold lines -->
  <path d="M78,195 L75,252 L84,315 L80,365" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.18"/>
  <path d="M128,190 L128,255 L130,340" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.12"/>
  <path d="M178,195 L181,252 L172,315 L176,365" fill="none" stroke="#aa44ff" stroke-width="0.6" opacity="0.18"/>

  <!-- Hood pushed back - bunched at neck/shoulders -->
  <path d="M80,158 C80,140 90,120 105,110 C115,103 124,100 128,98 C132,100 141,103 151,110 C166,120 176,140 176,158 L176,164 C172,170 156,176 128,178 C100,176 84,170 80,164 Z" fill="#1a1030"/>
  <!-- Hood bunched behind neck -->
  <path d="M82,164 C88,180 106,188 128,190 C150,188 168,180 174,164 L178,176 C178,194 158,206 128,208 C98,206 78,194 78,176 Z" fill="#221440"/>
  <path d="M82,164 C88,180 106,188 128,190 C150,188 168,180 174,164" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>
  <!-- Hood angular fold detail -->
  <path d="M85,168 L92,162 L100,170" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.2"/>
  <path d="M171,168 L164,162 L156,170" fill="none" stroke="#aa44ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Hair - dark purple, anime style with sharp defined strands -->
  <path d="M96,100 C96,68 110,48 128,44 C146,48 160,68 160,100 L160,122 C160,132 148,140 128,142 C108,140 96,132 96,122 Z" fill="url(#gr-hair)"/>
  <!-- Anime hair shine band -->
  <path d="M100,80 C108,68 118,58 128,56 C138,58 148,68 156,80 L156,90 C148,78 138,68 128,66 C118,68 108,78 100,90 Z" fill="url(#gr-hair-shine)"/>
  <!-- Sharp hair strand lines -->
  <path d="M102,82 C110,66 120,54 128,52" fill="none" stroke="#5038a0" stroke-width="0.8" opacity="0.4"/>
  <path d="M154,82 C146,66 136,54 128,52" fill="none" stroke="#5038a0" stroke-width="0.8" opacity="0.4"/>
  <!-- Wispy anime bangs - sharp angular -->
  <path d="M106,92 Q112,78 122,80 Q114,86 110,98" fill="#2a1848" opacity="0.7"/>
  <path d="M150,94 Q144,80 134,82 Q142,88 146,100" fill="#2a1848" opacity="0.6"/>
  <!-- Center bang tuft - pointy -->
  <path d="M122,88 Q126,72 130,72 Q134,72 134,88" fill="#2a1848" opacity="0.5"/>
  <!-- Extra spiky strand left -->
  <path d="M98,96 Q96,80 104,72" fill="none" stroke="#2a1848" stroke-width="3" opacity="0.5"/>
  <!-- Extra spiky strand right -->
  <path d="M158,98 Q160,82 152,74" fill="none" stroke="#2a1848" stroke-width="3" opacity="0.5"/>

  <!-- Face - anime V-shaped chin, clean skin -->
  <path d="M106,108 C106,92 116,82 128,80 C140,82 150,92 150,108 L150,130 C150,138 142,148 134,152 L128,156 L122,152 C114,148 106,138 106,130 Z" fill="url(#gr-skin)"/>

  <!-- Face cel-shade shadow - left side -->
  <path d="M106,108 C106,92 116,82 128,80 L128,156 L122,152 C114,148 106,138 106,130 Z" fill="url(#gr-skin-shadow)" opacity="0.35"/>

  <!-- Anime eyebrows - slightly raised, sharp angular -->
  <path d="M110,98 C114,95 120,94 125,95" fill="none" stroke="#1a1030" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M131,95 C136,94 142,95 146,98" fill="none" stroke="#1a1030" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- LEFT EYE - large anime style with full iris detail -->
  <!-- Thick upper eyelid line (shounen style) -->
  <path d="M108,105 C112,102 120,102 124,105" fill="none" stroke="#1a0e30" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Eye white -->
  <ellipse cx="116" cy="109" rx="8.5" ry="7.5" fill="#f0eef5"/>
  <!-- Multi-layer iris - radialGradient base -->
  <ellipse cx="116" cy="110" rx="5.5" ry="6" fill="url(#gr-iris-l)"/>
  <!-- Pupil -->
  <ellipse cx="116" cy="110.5" rx="2.5" ry="3" fill="#1a0e30"/>
  <!-- Highlight spot 1 - large, top-left -->
  <ellipse cx="113" cy="107" rx="2.5" ry="2" fill="#ffffff" opacity="0.95"/>
  <!-- Highlight spot 2 - small, bottom-right -->
  <circle cx="119" cy="112.5" r="1.5" fill="#ffffff" opacity="0.7"/>
  <!-- Highlight spot 3 - tiny accent -->
  <circle cx="114.5" cy="113" r="0.8" fill="#ffffff" opacity="0.5"/>
  <!-- Lower eyelid hint -->
  <path d="M109,113 C113,115 119,115 123,113" fill="none" stroke="#c4a080" stroke-width="0.6" opacity="0.4"/>

  <!-- RIGHT EYE - large anime style with full iris detail -->
  <path d="M132,105 C136,102 144,102 148,105" fill="none" stroke="#1a0e30" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="140" cy="109" rx="8.5" ry="7.5" fill="#f0eef5"/>
  <ellipse cx="140" cy="110" rx="5.5" ry="6" fill="url(#gr-iris-r)"/>
  <ellipse cx="140" cy="110.5" rx="2.5" ry="3" fill="#1a0e30"/>
  <ellipse cx="137" cy="107" rx="2.5" ry="2" fill="#ffffff" opacity="0.95"/>
  <circle cx="143" cy="112.5" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="138.5" cy="113" r="0.8" fill="#ffffff" opacity="0.5"/>
  <path d="M133,113 C137,115 143,115 147,113" fill="none" stroke="#c4a080" stroke-width="0.6" opacity="0.4"/>

  <!-- Small anime nose -->
  <path d="M127,118 L128,122" fill="none" stroke="#c4a080" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="128" cy="122" rx="2" ry="1" fill="#c4a080" opacity="0.3"/>

  <!-- Small mouth - slightly parted -->
  <ellipse cx="128" cy="134" rx="5" ry="2.5" fill="#c49080" opacity="0.25"/>
  <path d="M122,133 C125,131 131,131 134,133" fill="none" stroke="#b07060" stroke-width="1"/>

  <!-- Cybernetic scar on right cheek - glowing -->
  <path d="M144,116 L152,128 L149,140" fill="none" stroke="url(#gr-scar)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="146" cy="120" r="1" fill="#aa44ff" opacity="0.6"/>
  <circle cx="151" cy="127" r="1" fill="#cc66ff" opacity="0.5"/>
  <circle cx="150" cy="136" r="1" fill="#aa44ff" opacity="0.6"/>

  <!-- Neck -->
  <path d="M120,154 L120,174 L136,174 L136,154" fill="url(#gr-skin)" opacity="0.8"/>
  <!-- Neck shadow -->
  <path d="M120,154 L120,174 L128,174 L128,154" fill="url(#gr-skin-shadow)" opacity="0.25"/>

  <!-- Collar/cloak meeting neck -->
  <path d="M100,174 C108,168 118,164 128,164 C138,164 148,168 156,174" fill="none" stroke="#aa44ff" stroke-width="1" opacity="0.3"/>

  <!-- Shoulder definition - angular -->
  <path d="M54,192 L72,178 L92,170 L108,168" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>
  <path d="M202,192 L184,178 L164,170 L148,168" fill="none" stroke="#aa44ff" stroke-width="0.8" opacity="0.3"/>

  <!-- Ambient glow from face reveal -->
  <ellipse cx="128" cy="120" rx="32" ry="26" fill="#aa44ff" opacity="0.05" filter="url(#gr-glow-soft)"/>

  <!-- Digital glitch artifacts -->
  <rect x="44" y="225" width="8" height="2" fill="#aa44ff" opacity="0.25"/>
  <rect x="198" y="255" width="10" height="1.5" fill="#44ddcc" opacity="0.18"/>
  <rect x="56" y="310" width="6" height="1.5" fill="#8833cc" opacity="0.2"/>
  <rect x="188" y="185" width="12" height="1" fill="#aa44ff" opacity="0.15"/>

  <!-- Ambient particles -->
  <circle cx="40" cy="218" r="1" fill="#aa44ff" opacity="0.35"/>
  <circle cx="216" cy="205" r="1.2" fill="#aa44ff" opacity="0.3"/>
  <circle cx="52" cy="325" r="0.8" fill="#7722cc" opacity="0.4"/>
  <circle cx="202" cy="335" r="1" fill="#aa44ff" opacity="0.3"/>
  <circle cx="30" cy="278" r="0.8" fill="#cc66ff" opacity="0.25"/>

  <!-- State label -->
  <text x="128" y="370" font-family="'Courier New', monospace" font-size="10" fill="#aa44ff" text-anchor="middle" opacity="0.5">[revealed]</text>
</svg>