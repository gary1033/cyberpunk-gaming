<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="hd_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="hd_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b090"/>
      <stop offset="100%" stop-color="#b09a74"/>
    </linearGradient>
    <linearGradient id="hd_shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="hd_overshirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d3d"/>
      <stop offset="100%" stop-color="#0f1a28"/>
    </linearGradient>
    <linearGradient id="hd_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <radialGradient id="hd_glow" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hd_port_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#00ccff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hd_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hd_intense">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hd_blur">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#hd_bg)"/>
  <rect width="256" height="384" fill="url(#hd_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#00ccff" stroke-width="1.5" opacity="0.35"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="18" fill="#00ccff" text-anchor="middle" filter="url(#hd_neon)">浩然</text>

  <!-- Body - slightly slouched -->
  <path d="M62,222 Q56,242 48,292 L42,384 H214 L208,292 Q202,242 194,222 Q182,202 168,194 L160,190 Q146,182 128,180 Q110,182 96,190 L88,194 Q74,202 62,222 Z" fill="url(#hd_overshirt)" stroke="#00ccff" stroke-width="0.3" opacity="0.85"/>
  <!-- Open shirt lapels - slightly rumpled -->
  <path d="M110,190 Q114,198 110,218 Q108,234 106,254" fill="none" stroke="#1a3040" stroke-width="2.5" opacity="0.55"/>
  <path d="M146,190 Q142,198 146,218 Q148,234 150,254" fill="none" stroke="#1a3040" stroke-width="2.5" opacity="0.55"/>
  <line x1="128" y1="197" x2="128" y2="384" stroke="#00ccff" stroke-width="0.35" opacity="0.08"/>

  <!-- T-shirt visible underneath -->
  <path d="M110,190 Q118,183 128,180 Q138,183 146,190 L146,242 Q138,240 128,238 Q118,240 110,242 Z" fill="url(#hd_shirt)" opacity="0.8"/>

  <!-- Neck - slightly angled -->
  <path d="M118,180 Q118,170 120,162 L128,159 L136,162 Q138,170 138,180" fill="url(#hd_skin)" opacity="0.85"/>

  <!-- Head shape - slightly drooped/tilted -->
  <g transform="rotate(3,128,120)">
    <ellipse cx="128" cy="120" rx="37" ry="43" fill="url(#hd_skin)" opacity="0.9"/>

    <!-- Face shadow - paler -->
    <path d="M98,132 Q104,144 114,152 Q122,156 128,158 Q134,156 142,152 Q152,144 158,132" fill="#a08858" opacity="0.2"/>

    <!-- Ears -->
    <path d="M91,116 Q86,111 85,119 Q85,128 89,131 Q91,126 91,116 Z" fill="url(#hd_skin)" opacity="0.75"/>
    <path d="M165,116 Q170,111 171,119 Q171,128 167,131 Q165,126 165,116 Z" fill="url(#hd_skin)" opacity="0.75"/>

    <!-- Neural interface port - right temple - GLOWING BRIGHTER -->
    <circle cx="166" cy="108" r="6" fill="#00ccff" opacity="0.15" filter="url(#hd_intense)"/>
    <circle cx="166" cy="108" r="5" fill="#0a1520" stroke="#00ccff" stroke-width="1.2" opacity="0.85"/>
    <circle cx="166" cy="108" r="3.5" fill="url(#hd_port_glow)" filter="url(#hd_neon)"/>
    <circle cx="166" cy="108" r="2" fill="#00ccff" opacity="0.8"/>
    <circle cx="166" cy="108" r="1" fill="#ffffff" opacity="0.5"/>
    <!-- Port circuit lines - active/pulsing -->
    <path d="M171,108 Q175,108 178,106" fill="none" stroke="#00ccff" stroke-width="0.7" opacity="0.5"/>
    <path d="M170,111 Q174,112 177,111" fill="none" stroke="#00ccff" stroke-width="0.6" opacity="0.4"/>
    <path d="M170,105 Q173,104 176,105" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.35"/>
    <path d="M172,108 Q176,108 180,110" fill="none" stroke="#00ccff" stroke-width="0.3" opacity="0.2"/>

    <!-- Hair - messy, more disheveled -->
    <path d="M91,112 Q87,94 91,76 Q95,58 108,48 Q118,40 128,38 Q138,40 148,48 Q161,58 165,76 Q169,94 165,112 Q160,102 152,94 Q142,84 132,80 Q128,78 124,80 Q114,84 104,94 Q96,102 91,112 Z" fill="url(#hd_hair)" opacity="0.95"/>
    <!-- More disheveled strands -->
    <path d="M107,82 Q103,92 107,104" fill="none" stroke="#1a1a2a" stroke-width="2.2" opacity="0.75"/>
    <path d="M115,78 Q111,88 115,100" fill="none" stroke="#1a1a2a" stroke-width="1.6" opacity="0.65"/>
    <path d="M123,76 Q120,84 123,96" fill="none" stroke="#16162a" stroke-width="1.2" opacity="0.55"/>
    <path d="M141,80 Q145,88 141,100" fill="none" stroke="#1a1a2a" stroke-width="2" opacity="0.72"/>
    <path d="M150,84 Q154,92 150,104" fill="none" stroke="#16162a" stroke-width="1.3" opacity="0.55"/>
    <path d="M133,78 Q136,86 133,98" fill="none" stroke="#1a1a2a" stroke-width="1.1" opacity="0.6"/>
    <!-- Extra messy strand falling forward -->
    <path d="M100,96 Q96,86 99,76" fill="none" stroke="#1a1a2a" stroke-width="1.8" opacity="0.55"/>
    <path d="M118,74 Q114,82 116,94" fill="none" stroke="#16162a" stroke-width="1" opacity="0.45"/>

    <!-- Eyes - glazed, unfocused, dilated pupils, NO highlights -->
    <!-- Left eye - half-lidded, vacant -->
    <path d="M107,117 Q113,114 120,115 Q122,117 122,121 Q119,124 112,124 Q108,122 107,119 Z" fill="#ffffff" opacity="0.7" filter="url(#hd_blur)"/>
    <circle cx="114" cy="118" r="4.5" fill="#1a1a2e" opacity="0.85"/>
    <circle cx="114" cy="118" r="3" fill="#2a3a4a" opacity="0.6"/>
    <circle cx="114" cy="118" r="2" fill="#00ccff" opacity="0.25"/>
    <!-- NO reflection highlights - eyes are dead/glazed -->
    <!-- Heavy eyelid -->
    <path d="M107,115 Q113,112 121,114" fill="#b89a74" opacity="0.45"/>
    <!-- Right eye -->
    <path d="M134,115 Q142,114 149,117 Q149,122 144,124 Q137,124 135,121 Q134,118 134,115 Z" fill="#ffffff" opacity="0.7" filter="url(#hd_blur)"/>
    <circle cx="142" cy="118" r="4.5" fill="#1a1a2e" opacity="0.85"/>
    <circle cx="142" cy="118" r="3" fill="#2a3a4a" opacity="0.6"/>
    <circle cx="142" cy="118" r="2" fill="#00ccff" opacity="0.25"/>
    <!-- Heavy eyelid -->
    <path d="M134,114 Q142,112 149,115" fill="#b89a74" opacity="0.45"/>

    <!-- Eyebrows - slack, neutral/drooping -->
    <path d="M106,111 Q113,109 121,111" fill="none" stroke="#1a1a2a" stroke-width="1.4" opacity="0.5"/>
    <path d="M135,111 Q143,109 150,111" fill="none" stroke="#1a1a2a" stroke-width="1.4" opacity="0.5"/>

    <!-- Nose -->
    <path d="M128,120 Q127,126 126,132 Q125,135 127,137 Q128,138 130,137 Q131,135 130,132 Q129,126 128,120" fill="none" stroke="#a08858" stroke-width="0.7" opacity="0.38"/>

    <!-- Mouth - slack jaw, slightly open -->
    <path d="M120,145 Q124,146 128,146 Q132,146 136,145" fill="none" stroke="#8a6050" stroke-width="0.9" opacity="0.5"/>
    <!-- Open mouth gap -->
    <path d="M122,145 Q126,148 128,148 Q130,148 134,145" fill="#5a3030" opacity="0.2"/>
    <!-- Lower lip -->
    <path d="M123,148 Q126,149 128,149 Q130,149 133,148" fill="none" stroke="#8a6050" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- Digital noise/interference around head -->
  <rect x="174" y="108" width="4" height="1" fill="#00ccff" opacity="0.22"/>
  <rect x="178" y="112" width="6" height="1" fill="#00ccff" opacity="0.16"/>
  <rect x="176" y="116" width="3" height="1" fill="#00ccff" opacity="0.18"/>
  <rect x="76" y="106" width="5" height="1" fill="#00ccff" opacity="0.14"/>
  <rect x="73" y="110" width="3" height="1" fill="#00ccff" opacity="0.12"/>
  <rect x="180" y="104" width="2" height="1" fill="#00ccff" opacity="0.12"/>
  <rect x="72" y="114" width="4" height="1" fill="#00ccff" opacity="0.1"/>

  <!-- Ambient particles -->
  <circle cx="28" cy="78" r="1.2" fill="#00ccff" opacity="0.16"/>
  <circle cx="228" cy="92" r="0.8" fill="#00ccff" opacity="0.12"/>
  <circle cx="38" cy="260" r="1" fill="#00ccff" opacity="0.12"/>
  <circle cx="218" cy="244" r="0.7" fill="#00ccff" opacity="0.16"/>
  <circle cx="18" cy="178" r="0.9" fill="#00ccff" opacity="0.08"/>

  <!-- Scanlines -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#00ccff" stroke-width="0.3" opacity="0.05"/>
</svg>