<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <!-- Eye iris gradient (top-dark to bottom-bright, jewel-like) -->
    <linearGradient id="irisBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3868"/>
      <stop offset="40%" stop-color="#3070b0"/>
      <stop offset="100%" stop-color="#58b0e8"/>
    </linearGradient>
    <linearGradient id="irisCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004050"/>
      <stop offset="40%" stop-color="#00a0b8"/>
      <stop offset="100%" stop-color="#50ffe0"/>
    </linearGradient>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ffee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeL">
      <ellipse cx="104" cy="196" rx="22" ry="17"/>
    </clipPath>
    <clipPath id="eyeR">
      <ellipse cx="160" cy="196" rx="22" ry="17"/>
    </clipPath>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="256" height="384" fill="#0a0a18"/>
  <ellipse cx="128" cy="200" rx="120" ry="160" fill="#0e0e22" opacity="0.6"/>
  <rect x="4" y="4" width="248" height="376" rx="4" fill="none" stroke="#00dde5" stroke-width="0.6" opacity="0.18"/>
  <!-- Scanline effect -->
  <line x1="0" y1="100" x2="256" y2="100" stroke="#00dde5" stroke-width="0.2" opacity="0.05"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#00dde5" stroke-width="0.2" opacity="0.05"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#00dde5" stroke-width="0.2" opacity="0.05"/>
  <!-- Name label -->
  <text x="128" y="22" font-family="monospace" font-size="13" fill="#00dde5" text-anchor="middle" filter="url(#glow)" opacity="0.7">凱·川崎</text>

  <!-- ===== CHIBI BODY (small, stubby) ===== -->
  <path d="M96,310 C96,295 105,285 128,285 C151,285 160,295 160,310 L162,384 L94,384 Z" fill="#101028"/>
  <path d="M96,310 C96,295 105,285 128,285 L128,384 L94,384 Z" fill="#080816" opacity="0.5"/>
  <!-- Coat lapels -->
  <path d="M104,288 L96,302 L118,296 Z" fill="#181838"/>
  <path d="M152,288 L160,302 L138,296 Z" fill="#1c1c3c"/>
  <!-- Popped collar -->
  <path d="M96,300 L92,280 L102,278 L108,294 Z" fill="#141430" stroke="#0a0a18" stroke-width="0.8"/>
  <path d="M160,300 L164,280 L154,278 L148,294 Z" fill="#181836" stroke="#0a0a18" stroke-width="0.8"/>
  <!-- Shirt V-neck -->
  <path d="M120,290 L128,302 L136,290" fill="#0c0c20"/>
  <!-- Coat center line -->
  <line x1="128" y1="300" x2="128" y2="384" stroke="#1a1a30" stroke-width="0.6"/>
  <!-- Neon accent stitching -->
  <line x1="98" y1="310" x2="98" y2="384" stroke="#00dde5" stroke-width="0.6" opacity="0.25" filter="url(#glow)"/>
  <line x1="158" y1="310" x2="158" y2="384" stroke="#00dde5" stroke-width="0.6" opacity="0.25" filter="url(#glow)"/>
  <!-- Coat outline -->
  <path d="M96,310 C96,295 105,285 128,285 C151,285 160,295 160,310" fill="none" stroke="#08081a" stroke-width="1.2"/>

  <!-- Stubby arms -->
  <path d="M96,300 C86,305 80,315 82,325 C84,330 88,332 92,328 L96,318 Z" fill="#101028" stroke="#08081a" stroke-width="0.8"/>
  <path d="M160,300 C170,305 176,315 174,325 C172,330 168,332 164,328 L160,318 Z" fill="#101028" stroke="#08081a" stroke-width="0.8"/>
  <!-- Arm accent lines -->
  <path d="M86,310 C84,316 83,322 83,326" stroke="#00dde5" stroke-width="0.4" opacity="0.2" fill="none"/>
  <path d="M170,310 C172,316 173,322 173,326" stroke="#00dde5" stroke-width="0.4" opacity="0.2" fill="none"/>
  <!-- Tiny hands (clenched for serious mood) -->
  <ellipse cx="87" cy="328" rx="6" ry="5.5" fill="#e4be98" stroke="#3a2818" stroke-width="0.8"/>
  <ellipse cx="169" cy="328" rx="6" ry="5.5" fill="#e4be98" stroke="#3a2818" stroke-width="0.8"/>

  <!-- ===== NECK ===== -->
  <rect x="120" y="276" width="16" height="12" rx="3" fill="#e4be98"/>
  <rect x="120" y="276" width="16" height="6" rx="2" fill="#c09878" opacity="0.35"/>

  <!-- ===== CHIBI HEAD ===== -->
  <path d="M56,175 C56,112 84,60 128,60 C172,60 200,112 200,175 C200,220 190,250 172,264 C158,274 142,278 128,278 C114,278 98,274 84,264 C66,250 56,220 56,175 Z" fill="#e4be98"/>
  <path d="M56,175 C56,112 84,60 128,60 C172,60 200,112 200,175 C200,220 190,250 172,264 C158,274 142,278 128,278 C114,278 98,274 84,264 C66,250 56,220 56,175 Z" fill="none" stroke="#3a2818" stroke-width="1.8"/>
  <!-- Face shadow left -->
  <path d="M56,175 C56,112 84,60 110,60 L108,175 L104,220 C92,240 84,252 84,264 C74,254 60,228 56,200 Z" fill="#c8a07a" opacity="0.28"/>
  <!-- Jaw shadow -->
  <path d="M84,264 C98,274 114,278 128,278 C142,278 158,274 172,264 L168,270 C156,278 142,282 128,282 C114,282 100,278 88,270 Z" fill="#b89068" opacity="0.2"/>
  <!-- Cheek blush (reduced for serious) -->
  <ellipse cx="82" cy="220" rx="12" ry="6" fill="#ff8888" opacity="0.1"/>
  <ellipse cx="174" cy="220" rx="12" ry="6" fill="#ff8888" opacity="0.1"/>
  <!-- Scar across right temple -->
  <path d="M170,140 L185,148 L192,145" fill="none" stroke="#d0a888" stroke-width="1" opacity="0.4"/>
  <path d="M172,141 L186,149" fill="none" stroke="#f0d0b0" stroke-width="0.5" opacity="0.3"/>

  <!-- ===== EARS ===== -->
  <ellipse cx="56" cy="190" rx="8" ry="12" fill="#e4be98" stroke="#3a2818" stroke-width="1"/>
  <ellipse cx="56" cy="190" rx="5" ry="8" fill="#d4a880" opacity="0.3"/>
  <ellipse cx="200" cy="190" rx="8" ry="12" fill="#e4be98" stroke="#3a2818" stroke-width="1"/>
  <!-- Cyber implant on right ear -->
  <rect x="204" y="184" width="6" height="14" rx="2" fill="#0a1828" stroke="#00cccc" stroke-width="0.6"/>
  <circle cx="207" cy="187" r="1.2" fill="#00ffee" filter="url(#glow)"/>
  <circle cx="207" cy="191" r="0.8" fill="#00ffee" opacity="0.6"/>
  <circle cx="207" cy="195" r="0.6" fill="#00ffee" opacity="0.3"/>

  <!-- ===== HAIR (back layer) ===== -->
  <path d="M46,170 C44,118 68,50 128,46 C188,50 212,118 210,170 L208,155 C206,112 186,60 128,56 C70,60 50,112 48,155 Z" fill="#d0d0e4"/>
  <path d="M46,170 C44,118 68,50 108,46 L100,100 C76,120 56,148 48,165 Z" fill="#9090aa" opacity="0.5"/>

  <!-- Side hair -->
  <path d="M48,168 C42,195 36,225 32,248 C30,258 28,265 26,270 L28,266 C32,250 38,222 44,194 C46,182 48,174 48,168 Z" fill="#c8c8dc" stroke="#1a1a2c" stroke-width="0.8"/>
  <path d="M44,185 C38,212 32,240 28,262 L30,258 C34,240 40,212 46,188 Z" fill="#babace" stroke="#1a1a2c" stroke-width="0.6"/>
  <path d="M208,168 C214,195 220,225 224,248 C226,258 228,265 230,270 L228,266 C224,250 218,222 212,194 C210,182 208,174 208,168 Z" fill="#c8c8dc" stroke="#1a1a2c" stroke-width="0.8"/>
  <path d="M212,185 C218,212 224,240 228,262 L226,258 C222,240 216,212 210,188 Z" fill="#babace" stroke="#1a1a2c" stroke-width="0.6"/>

  <!-- ===== EYES (SERIOUS: narrowed, intense) ===== -->

  <!-- == LEFT EYE (natural steel blue - narrowed) == -->
  <!-- Eye white (narrower for serious) -->
  <ellipse cx="104" cy="196" rx="22" ry="17" fill="#eaecf0"/>
  <!-- Iris -->
  <circle cx="104" cy="198" r="17" fill="url(#irisBlue)" clip-path="url(#eyeL)"/>
  <!-- Limbal ring -->
  <circle cx="104" cy="198" r="16.5" fill="none" stroke="#0c1830" stroke-width="1.2" clip-path="url(#eyeL)"/>
  <!-- Inner iris detail -->
  <circle cx="104" cy="198" r="12" fill="none" stroke="#4088c0" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeL)"/>
  <!-- Heavy eyelid shadow (serious = more shadow) -->
  <path d="M84,190 C90,182 97,180 104,180 C111,180 118,182 124,190 L124,198 C118,190 111,188 104,188 C97,188 90,190 84,198 Z" fill="#081020" opacity="0.55" clip-path="url(#eyeL)"/>
  <!-- Reflected light -->
  <path d="M92,208 C96,211 100,212 104,212 C108,212 112,211 116,208 L116,206 C112,209 108,210 104,210 C100,210 96,209 92,206 Z" fill="#80c8f0" opacity="0.3" clip-path="url(#eyeL)"/>
  <!-- Pupil (slightly smaller = focused) -->
  <circle cx="104" cy="197" r="5.5" fill="#060810" clip-path="url(#eyeL)"/>
  <!-- Main highlight -->
  <ellipse cx="112" cy="190" rx="6" ry="5" fill="#ffffff" opacity="0.9" clip-path="url(#eyeL)"/>
  <!-- Secondary highlight -->
  <circle cx="96" cy="205" r="3.5" fill="#ffffff" opacity="0.5" clip-path="url(#eyeL)"/>
  <!-- Sparkle dots -->
  <circle cx="114" cy="200" r="1.2" fill="#ffffff" opacity="0.6" clip-path="url(#eyeL)"/>
  <circle cx="96" cy="193" r="0.8" fill="#ffffff" opacity="0.35" clip-path="url(#eyeL)"/>
  <!-- Upper eyelid (lower position = narrowed look) -->
  <path d="M80,196 C84,180 94,174 104,175 C114,176 124,182 128,196 L124,196 C121,184 113,180 104,179 C95,180 87,184 84,196 Z" fill="#1a1020"/>
  <!-- Lower eyelid raised slightly for narrowed effect -->
  <path d="M82,200 C88,210 96,214 104,214 C112,214 120,210 126,200 L124,202 C119,209 112,212 104,212 C96,212 89,209 84,202 Z" fill="#1a1020" opacity="0.3"/>
  <!-- Eyelashes -->
  <path d="M80,194 C78,190 76,187 75,185" fill="none" stroke="#1a1020" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M81,191 C79,189 78,187 77,185" fill="none" stroke="#1a1020" stroke-width="0.7"/>

  <!-- == RIGHT EYE (cybernetic cyan - narrowed, intense) == -->
  <ellipse cx="160" cy="196" rx="22" ry="17" fill="#081018"/>
  <!-- Iris -->
  <circle cx="160" cy="198" r="17" fill="url(#irisCyan)" clip-path="url(#eyeR)"/>
  <!-- Limbal ring -->
  <circle cx="160" cy="198" r="16.5" fill="none" stroke="#002030" stroke-width="1.2" clip-path="url(#eyeR)"/>
  <!-- Circuit ring pattern (more visible when serious/focused) -->
  <circle cx="160" cy="198" r="14" fill="none" stroke="#00bbcc" stroke-width="0.5" opacity="0.4" clip-path="url(#eyeR)"/>
  <circle cx="160" cy="198" r="10" fill="none" stroke="#00ddee" stroke-width="0.4" opacity="0.35" clip-path="url(#eyeR)"/>
  <!-- Circuit tick marks (more prominent) -->
  <line x1="160" y1="182" x2="160" y2="186" stroke="#00ccdd" stroke-width="0.5" opacity="0.4" clip-path="url(#eyeR)"/>
  <line x1="174" y1="198" x2="170" y2="198" stroke="#00ccdd" stroke-width="0.5" opacity="0.4" clip-path="url(#eyeR)"/>
  <line x1="146" y1="198" x2="150" y2="198" stroke="#00ccdd" stroke-width="0.5" opacity="0.4" clip-path="url(#eyeR)"/>
  <line x1="170" y1="188" x2="167" y2="191" stroke="#00ccdd" stroke-width="0.4" opacity="0.3" clip-path="url(#eyeR)"/>
  <line x1="150" y1="208" x2="153" y2="205" stroke="#00ccdd" stroke-width="0.4" opacity="0.3" clip-path="url(#eyeR)"/>
  <!-- Heavy eyelid shadow -->
  <path d="M140,190 C146,182 153,180 160,180 C167,180 174,182 180,190 L180,198 C174,190 167,188 160,188 C153,188 146,190 140,198 Z" fill="#001818" opacity="0.5" clip-path="url(#eyeR)"/>
  <!-- Reflected light -->
  <path d="M148,208 C152,211 156,212 160,212 C164,212 168,211 172,208 L172,206 C168,209 164,210 160,210 C156,210 152,209 148,206 Z" fill="#50ffe0" opacity="0.25" clip-path="url(#eyeR)"/>
  <!-- Pupil (focused, intense glow) -->
  <circle cx="160" cy="197" r="5" fill="#20ffee" clip-path="url(#eyeR)" filter="url(#glow)"/>
  <circle cx="160" cy="197" r="3" fill="#80ffff" clip-path="url(#eyeR)" opacity="0.6"/>
  <!-- Main highlight -->
  <ellipse cx="168" cy="190" rx="6" ry="5" fill="#ccffff" opacity="0.85" clip-path="url(#eyeR)"/>
  <!-- Secondary highlight -->
  <circle cx="152" cy="205" r="3.5" fill="#88ffee" opacity="0.4" clip-path="url(#eyeR)"/>
  <!-- Sparkle dots -->
  <circle cx="170" cy="200" r="1.2" fill="#ffffff" opacity="0.5" clip-path="url(#eyeR)"/>
  <circle cx="152" cy="193" r="0.8" fill="#aaffff" opacity="0.3" clip-path="url(#eyeR)"/>
  <!-- Upper eyelid (lowered for narrowed look) -->
  <path d="M136,196 C140,180 150,174 160,175 C170,176 180,182 184,196 L180,196 C177,184 169,180 160,179 C151,180 143,184 140,196 Z" fill="#004050"/>
  <!-- Lower eyelid raised -->
  <path d="M138,200 C144,210 152,214 160,214 C168,214 176,210 182,200 L180,202 C175,209 168,212 160,212 C152,212 145,209 140,202 Z" fill="#003040" opacity="0.3"/>
  <!-- Eyelashes -->
  <path d="M184,194 C186,190 188,187 189,185" fill="none" stroke="#004050" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M183,191 C185,189 186,187 187,185" fill="none" stroke="#004050" stroke-width="0.7"/>
  <!-- Ambient glow (stronger when serious/focused) -->
  <circle cx="160" cy="196" r="28" fill="url(#cyberGlow)" filter="url(#glowSoft)"/>

  <!-- Eyebrows (SERIOUS: angled sharply down toward center) -->
  <path d="M86,172 C92,162 100,158 112,164" fill="none" stroke="#b0b0c4" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M152,164 C164,158 172,162 178,172" fill="none" stroke="#b0b0c4" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Brow furrow lines -->
  <line x1="126" y1="164" x2="128" y2="170" stroke="#c09878" stroke-width="0.8" opacity="0.3"/>
  <line x1="130" y1="164" x2="128" y2="170" stroke="#c09878" stroke-width="0.8" opacity="0.3"/>

  <!-- Nose -->
  <circle cx="132" cy="228" r="1.5" fill="#d0a080" opacity="0.5"/>

  <!-- Mouth (SERIOUS: tight, thin, straight line) -->
  <path d="M118,244 L138,244" fill="none" stroke="#c08868" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Slight downturn at corners -->
  <path d="M118,244 C117,245 116,246 116,247" fill="none" stroke="#b07858" stroke-width="0.8" opacity="0.4"/>
  <path d="M138,244 C139,245 140,246 140,247" fill="none" stroke="#b07858" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== HAIR (front layers) ===== -->
  <path d="M42,168 C40,116 64,44 128,40 C192,44 216,116 214,168 C212,140 200,100 180,76 C164,58 146,50 128,48 C110,50 92,58 76,76 C56,100 44,140 42,168 Z" fill="#d4d4e8"/>
  <path d="M42,168 C40,116 64,44 108,40 L100,80 C76,100 56,132 46,160 Z" fill="#8c8ca8" opacity="0.5"/>
  <!-- Blue tint -->
  <path d="M100,60 C112,52 120,48 128,46 C136,48 144,52 156,60 L152,68 C142,60 136,56 128,54 C120,56 114,60 104,68 Z" fill="#c0d0f0" opacity="0.3"/>

  <!-- Spikes -->
  <path d="M98,58 C94,44 90,30 86,14 C92,30 100,44 112,54 Z" fill="#e0e0f0" stroke="#1a1a2c" stroke-width="1.2"/>
  <path d="M112,48 C108,32 104,18 98,2 C106,20 116,36 128,46 Z" fill="#e8e8f4" stroke="#1a1a2c" stroke-width="1.2"/>
  <path d="M126,42 C124,26 120,12 116,0 C122,16 132,32 142,42 Z" fill="#eff0f8" stroke="#1a1a2c" stroke-width="1.4"/>
  <path d="M142,44 C144,28 148,14 152,0 C148,18 144,34 136,44 Z" fill="#e8e8f4" stroke="#1a1a2c" stroke-width="1.2"/>
  <path d="M158,54 C162,40 166,26 170,12 C166,28 158,42 148,52 Z" fill="#e0e0f0" stroke="#1a1a2c" stroke-width="1.2"/>

  <!-- Spike shadows -->
  <path d="M98,58 C94,44 90,30 86,14 C90,26 94,38 100,48 Z" fill="#8c8ca8" opacity="0.45"/>
  <path d="M126,42 C124,26 120,12 116,0 C120,12 124,24 128,34 Z" fill="#9494b0" opacity="0.35"/>

  <!-- Bangs -->
  <path d="M66,118 C70,140 74,155 78,168 L88,162 C84,150 80,136 76,114 Z" fill="#d8d8ec" stroke="#1a1a2c" stroke-width="0.7"/>
  <path d="M78,104 C82,124 86,140 90,156 L100,150 C96,136 92,120 88,100 Z" fill="#e0e0f0" stroke="#1a1a2c" stroke-width="0.7"/>
  <path d="M166,100 C170,118 174,134 178,150 L188,156 C184,138 180,120 176,102 Z" fill="#d8d8ec" stroke="#1a1a2c" stroke-width="0.7"/>
  <path d="M178,110 C182,130 186,146 190,162 L200,168 C196,150 192,132 188,112 Z" fill="#d0d0e4" stroke="#1a1a2c" stroke-width="0.7"/>

  <!-- Hair highlight band -->
  <path d="M88,58 C104,48 116,44 128,42 C140,44 152,48 168,58 L164,66 C152,56 140,52 128,50 C116,52 104,56 92,66 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M58,140 C68,134 80,130 90,130" fill="none" stroke="#a8c0e0" stroke-width="1" opacity="0.2"/>
  <path d="M198,140 C188,134 176,130 166,130" fill="none" stroke="#a8c0e0" stroke-width="1" opacity="0.15"/>

  <!-- Hair outline -->
  <path d="M42,168 C40,116 64,44 128,40 C192,44 216,116 214,168" fill="none" stroke="#1a1a2c" stroke-width="1.8"/>

  <!-- ===== AMBIENT PARTICLES ===== -->
  <circle cx="24" cy="80" r="0.8" fill="#00ffee" opacity="0.15"/>
  <circle cx="232" cy="65" r="0.6" fill="#00ffee" opacity="0.1"/>
  <circle cx="18" cy="340" r="0.7" fill="#00ffee" opacity="0.1"/>
  <circle cx="238" cy="355" r="0.5" fill="#00ffee" opacity="0.08"/>
  <circle cx="40" cy="360" r="0.4" fill="#00ffee" opacity="0.06"/>
  <circle cx="216" cy="42" r="0.5" fill="#00ffee" opacity="0.08"/>

  <!-- Mood label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#00dde5" text-anchor="middle" opacity="0.3">[serious]</text>
</svg>