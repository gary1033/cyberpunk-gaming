<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="neon_orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4956e"/>
      <stop offset="100%" stop-color="#a47a58"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#neon_orange)">阿傑</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle">阿傑</text>

  <!-- Neck - slightly turned -->
  <rect x="104" y="195" width="52" height="30" rx="6" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1"/>

  <!-- Body / Shoulders -->
  <path d="M130,222 L130,384 L34,384 L34,272 Q34,230 80,218 Q110,210 130,222 Z" fill="url(#shirt_grad)"/>
  <path d="M130,222 L130,384 L222,384 L222,272 Q222,230 178,218 Q150,210 130,222 Z" fill="url(#shirt_grad)"/>
  <path d="M80,218 Q54,224 40,246 Q34,260 34,272" fill="none" stroke="#2a2a4e" stroke-width="2"/>
  <path d="M178,218 Q202,224 216,246 Q222,260 222,272" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Left arm hanging -->
  <path d="M34,272 Q38,300 44,340 Q48,365 52,384" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1"/>
  <!-- Right arm - hand on back of neck -->
  <path d="M222,272 Q214,260 200,248 Q184,236 170,224" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1"/>
  <ellipse cx="164" cy="206" rx="14" ry="11" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="0.8"/>

  <!-- Circuit tattoos left arm - dimmer when nervous -->
  <g filter="url(#neon_orange)" opacity="0.5">
    <path d="M40,280 L50,280 L50,296 L60,296" fill="none" stroke="#ff8800" stroke-width="1.5"/>
    <circle cx="40" cy="280" r="2.5" fill="#ff8800"/>
    <circle cx="60" cy="296" r="2.5" fill="#ff8800"/>
  </g>

  <!-- Shirt V-neck -->
  <path d="M98,222 L130,254 L162,222" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Head - turned slightly right -->
  <path d="M82,90 Q82,42 131,36 Q180,42 180,90 L180,150 Q180,168 166,180 Q152,192 131,194 Q110,192 96,180 Q82,168 82,150 Z" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="2"/>

  <!-- Bald/buzzcut -->
  <path d="M88,72 Q131,40 174,72" fill="#5a4030" opacity="0.25"/>
  <ellipse cx="131" cy="56" rx="34" ry="12" fill="#b08860" opacity="0.1"/>

  <!-- Ears -->
  <ellipse cx="80" cy="130" rx="8" ry="14" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1.5"/>
  <ellipse cx="182" cy="130" rx="8" ry="14" fill="url(#skin_grad)" stroke="#8a6040" stroke-width="1.5"/>

  <!-- Eyes - looking away to the right -->
  <!-- Left eye -->
  <path d="M96,120 Q112,108 128,120" fill="#1a1a2e"/>
  <path d="M96,120 Q112,132 128,120" fill="#1a1a2e"/>
  <circle cx="116" cy="120" r="9" fill="#8b5a2b"/>
  <circle cx="116" cy="120" r="5.5" fill="#0a0a1a"/>
  <circle cx="113" cy="116" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="119" cy="122" r="1.8" fill="#ffffff" opacity="0.55"/>
  <circle cx="115" cy="118" r="1.2" fill="#ffffff" opacity="0.3"/>
  <path d="M94,120 Q112,106 130,120" fill="none" stroke="#2a1a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Right eye -->
  <path d="M138,120 Q154,108 170,120" fill="#1a1a2e"/>
  <path d="M138,120 Q154,132 170,120" fill="#1a1a2e"/>
  <circle cx="158" cy="120" r="9" fill="#8b5a2b"/>
  <circle cx="158" cy="120" r="5.5" fill="#0a0a1a"/>
  <circle cx="155" cy="116" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="161" cy="122" r="1.8" fill="#ffffff" opacity="0.55"/>
  <circle cx="157" cy="118" r="1.2" fill="#ffffff" opacity="0.3"/>
  <path d="M136,120 Q154,106 172,120" fill="none" stroke="#2a1a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyebrows - worried, inner corners raised -->
  <path d="M94,106 Q112,100 128,110" fill="none" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M138,110 Q154,100 172,106" fill="none" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Anime sweat drop -->
  <path d="M184,96 Q187,108 184,120 Q181,108 184,96 Z" fill="#88ccff" opacity="0.6"/>

  <!-- Nose -->
  <path d="M129,140 Q131,146 133,140" fill="none" stroke="#8a6040" stroke-width="1.2" opacity="0.45"/>

  <!-- Mouth - tight uncomfortable -->
  <path d="M118,162 Q131,158 144,162" fill="none" stroke="#6a4030" stroke-width="2" stroke-linecap="round"/>

  <!-- Scar -->
  <line x1="92" y1="142" x2="101" y2="152" stroke="#b08860" stroke-width="1.2" opacity="0.45"/>

  <!-- Circuit glow on neck - dim -->
  <g filter="url(#neon_orange)" opacity="0.3">
    <path d="M112,200 L112,210 L124,210" fill="none" stroke="#ff8800" stroke-width="1"/>
    <circle cx="124" cy="210" r="1.5" fill="#ff8800"/>
  </g>

  <ellipse cx="128" cy="310" rx="80" ry="30" fill="#ff8800" opacity="0.02"/>
</svg>