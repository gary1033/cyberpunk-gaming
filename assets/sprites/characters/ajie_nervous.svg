<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="neon_orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6a4a"/>
      <stop offset="100%" stop-color="#6b5040"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#neon_orange)">阿傑</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle">阿傑</text>

  <!-- Neck - slightly turned -->
  <rect x="108" y="185" width="44" height="30" rx="4" fill="url(#skin_grad)"/>

  <!-- Body / Shoulders -->
  <path d="M130,212 L130,384 L38,384 L38,265 Q38,225 80,215 Q110,207 130,212 Z" fill="url(#shirt_grad)"/>
  <path d="M130,212 L130,384 L218,384 L218,265 Q218,225 178,215 Q150,207 130,212 Z" fill="url(#shirt_grad)"/>

  <!-- Shoulders -->
  <path d="M80,215 Q58,220 44,240 Q38,252 38,265" fill="none" stroke="#2a2a4e" stroke-width="2"/>
  <path d="M178,215 Q198,220 212,240 Q218,252 218,265" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Left arm down -->
  <path d="M38,265 Q42,295 48,330 Q52,355 56,380" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="1"/>
  <!-- Right arm - hand on back of neck -->
  <path d="M218,265 Q210,260 198,250 Q182,238 170,220" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="1"/>
  <ellipse cx="162" cy="200" rx="14" ry="10" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>

  <!-- Circuit tattoos left arm - dim -->
  <g filter="url(#neon_orange)" opacity="0.5">
    <path d="M44,275 L52,275 L52,290 L60,290" fill="none" stroke="#ff8800" stroke-width="1.5"/>
    <circle cx="44" cy="275" r="2" fill="#ff8800"/>
    <circle cx="60" cy="290" r="2" fill="#ff8800"/>
  </g>

  <!-- Shirt V-neck -->
  <path d="M100,215 L130,245 L160,215" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Head - turned slightly right -->
  <path d="M85,95 Q85,48 131,42 Q177,48 177,95 L177,145 Q177,162 165,174 Q153,186 131,188 Q109,186 97,174 Q85,162 85,145 Z" fill="url(#skin_grad)" stroke="#5a4030" stroke-width="1.5"/>

  <!-- Bald/buzzcut -->
  <path d="M91,75 Q131,48 171,75" fill="#3a2a1a" opacity="0.3"/>
  <ellipse cx="131" cy="62" rx="30" ry="10" fill="#9a7a5a" opacity="0.12"/>

  <!-- Ears -->
  <ellipse cx="83" cy="125" rx="7" ry="12" fill="url(#skin_grad)" stroke="#5a4030" stroke-width="1"/>
  <ellipse cx="179" cy="125" rx="7" ry="12" fill="url(#skin_grad)" stroke="#5a4030" stroke-width="1"/>

  <!-- Eyes - looking away to the right -->
  <!-- Left eye -->
  <path d="M98,118 Q111,108 124,118" fill="#1a1a2e"/>
  <path d="M98,118 Q111,128 124,118" fill="#1a1a2e"/>
  <circle cx="115" cy="118" r="8" fill="#6b4422"/>
  <circle cx="115" cy="118" r="5" fill="#0a0a1a"/>
  <circle cx="113" cy="115" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="118" cy="120" r="1.5" fill="#ffffff" opacity="0.5"/>
  <path d="M96,118 Q111,106 126,118" fill="none" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right eye -->
  <path d="M138,118 Q151,108 164,118" fill="#1a1a2e"/>
  <path d="M138,118 Q151,128 164,118" fill="#1a1a2e"/>
  <circle cx="155" cy="118" r="8" fill="#6b4422"/>
  <circle cx="155" cy="118" r="5" fill="#0a0a1a"/>
  <circle cx="153" cy="115" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="158" cy="120" r="1.5" fill="#ffffff" opacity="0.5"/>
  <path d="M136,118 Q151,106 166,118" fill="none" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyebrows - worried, raised inner corners -->
  <path d="M96,105 Q111,101 124,108" fill="none" stroke="#2a1a0a" stroke-width="3" stroke-linecap="round"/>
  <path d="M138,108 Q151,101 166,105" fill="none" stroke="#2a1a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Anime sweat drop -->
  <path d="M178,95 Q181,104 178,113 Q175,104 178,95 Z" fill="#88ccff" opacity="0.6"/>

  <!-- Nose -->
  <path d="M129,132 Q131,138 133,132" fill="none" stroke="#5a4030" stroke-width="1.2" opacity="0.5"/>

  <!-- Mouth - tight, uncomfortable -->
  <path d="M118,155 Q131,152 144,155" fill="none" stroke="#5a3a2a" stroke-width="2" stroke-linecap="round"/>

  <!-- Scar -->
  <line x1="95" y1="138" x2="103" y2="146" stroke="#9a7a5a" stroke-width="1" opacity="0.5"/>

  <!-- Circuit glow on neck - dim -->
  <path d="M115,192 L115,202 L125,202" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.25" filter="url(#neon_orange)"/>
  <circle cx="125" cy="202" r="1.5" fill="#ff8800" opacity="0.3"/>

  <ellipse cx="128" cy="300" rx="80" ry="30" fill="#ff8800" opacity="0.02"/>
</svg>