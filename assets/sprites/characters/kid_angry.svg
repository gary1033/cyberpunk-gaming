<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="ka-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1a08"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="ka-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="50%" stop-color="#222232"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="ka-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a0"/>
      <stop offset="100%" stop-color="#d0b890"/>
    </linearGradient>
    <linearGradient id="ka-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="100%" stop-color="#121220"/>
    </linearGradient>
    <linearGradient id="ka-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#444460"/>
      <stop offset="100%" stop-color="#333348"/>
    </linearGradient>
    <linearGradient id="ka-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#66cc00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="ka-glow-green">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ka-glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ka-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#66cc00" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#ka-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#ka-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#88ff00" text-anchor="middle" filter="url(#ka-glow-green)">小鬼</text>

  <!-- Oversized hoodie body - tensed posture -->
  <path d="M58,190 C58,175 72,162 88,156 L108,148 C118,144 124,142 128,141 C132,142 138,144 148,148 L168,156 C184,162 198,175 198,190 L204,280 C206,320 202,350 198,370 L58,370 C54,350 50,320 52,280 Z" fill="url(#ka-hoodie)"/>

  <!-- Hoodie pocket -->
  <path d="M92,260 L164,260 L164,300 C164,305 160,310 155,310 L101,310 C96,310 92,305 92,300 Z" fill="#1e1e2e" opacity="0.5"/>
  <path d="M92,260 L164,260" fill="none" stroke="#88ff00" stroke-width="0.5" opacity="0.25"/>

  <!-- Neon patches -->
  <rect x="72" y="210" width="22" height="16" rx="2" fill="#88ff00" opacity="0.15"/>
  <path d="M76,214 L80,218 L84,214 L88,218 L90,216" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.5"/>
  <rect x="162" y="225" width="18" height="14" rx="2" fill="#ff4488" opacity="0.12"/>
  <text x="171" y="235" font-family="monospace" font-size="6" fill="#ff4488" text-anchor="middle" opacity="0.6">HCK</text>

  <!-- Hoodie hood down -->
  <path d="M88,155 C95,165 110,172 128,174 C146,172 161,165 168,155 L172,163 C172,178 155,188 128,190 C101,188 84,178 84,163 Z" fill="#2e2e40"/>

  <!-- Clenched fists at sides - arms tensed -->
  <!-- Left fist -->
  <path d="M68,190 C65,210 62,235 60,260" fill="none" stroke="#2a2a3a" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="58" cy="264" rx="8" ry="10" fill="url(#ka-skin)"/>
  <path d="M52,260 C54,256 58,254 62,256" fill="none" stroke="#c0a880" stroke-width="1.2" opacity="0.5"/>
  <path d="M52,264 C54,262 58,261 62,262" fill="none" stroke="#c0a880" stroke-width="1" opacity="0.4"/>

  <!-- Right fist -->
  <path d="M188,190 C191,210 194,235 196,260" fill="none" stroke="#2a2a3a" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="198" cy="264" rx="8" ry="10" fill="url(#ka-skin)"/>
  <path d="M194,260 C196,256 200,254 204,256" fill="none" stroke="#c0a880" stroke-width="1.2" opacity="0.5"/>
  <path d="M194,264 C196,262 200,261 204,262" fill="none" stroke="#c0a880" stroke-width="1" opacity="0.4"/>

  <!-- Neck -->
  <path d="M120,138 L120,152 C120,156 123,160 128,160 C133,160 136,156 136,152 L136,138" fill="url(#ka-skin)"/>

  <!-- Head shape -->
  <path d="M104,88 C104,65 114,50 128,48 C142,50 152,65 152,88 L152,115 C152,132 142,142 128,142 C114,142 104,132 104,115 Z" fill="url(#ka-skin)"/>

  <!-- Hair - spiky bristling with anger -->
  <path d="M102,82 C102,58 114,44 128,42 C142,44 154,58 154,82" fill="url(#ka-hair)"/>
  <path d="M106,58 L98,36 L112,52" fill="url(#ka-hair)"/>
  <path d="M116,50 L110,28 L120,44" fill="url(#ka-hair)"/>
  <path d="M128,46 L126,24 L132,46" fill="url(#ka-hair)"/>
  <path d="M140,50 L146,28 L136,44" fill="url(#ka-hair)"/>
  <path d="M150,58 L158,36 L144,52" fill="url(#ka-hair)"/>
  <path d="M112,54 L106,32 L116,48" fill="url(#ka-hair)"/>
  <path d="M144,54 L150,32 L140,48" fill="url(#ka-hair)"/>

  <!-- VR Goggles on forehead - pushed up askew -->
  <path d="M105,70 L151,72 L153,68 L155,72 L156,82 L102,80 L101,70 L103,66 Z" fill="url(#ka-goggles)"/>
  <ellipse cx="118" cy="76" rx="10" ry="5" fill="url(#ka-goggle-lens)" stroke="#88ff00" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="138" cy="77" rx="10" ry="5" fill="url(#ka-goggle-lens)" stroke="#88ff00" stroke-width="0.8" opacity="0.6"/>
  <path d="M128,76 L128,77" fill="none" stroke="#555568" stroke-width="3"/>
  <path d="M101,76 L97,77" fill="none" stroke="#444460" stroke-width="2"/>
  <path d="M155,77 L159,78" fill="none" stroke="#444460" stroke-width="2"/>

  <!-- Ears - red from anger -->
  <ellipse cx="101" cy="100" rx="4" ry="6" fill="#d0b890"/>
  <ellipse cx="101" cy="100" rx="3" ry="5" fill="#dd6644" opacity="0.15"/>
  <ellipse cx="155" cy="100" rx="4" ry="6" fill="#d0b890"/>
  <ellipse cx="155" cy="100" rx="3" ry="5" fill="#dd6644" opacity="0.15"/>

  <!-- Eyebrows - deeply furrowed V shape angry -->
  <path d="M108,89 C112,85 118,84 123,86" fill="none" stroke="#1a1a2a" stroke-width="2.2" opacity="0.9"/>
  <path d="M133,86 C138,84 144,85 148,89" fill="none" stroke="#1a1a2a" stroke-width="2.2" opacity="0.9"/>

  <!-- Eyes - narrowed fierce -->
  <ellipse cx="116" cy="96" rx="8" ry="4.5" fill="#e8e8f0"/>
  <ellipse cx="116" cy="96" rx="4.5" ry="3.5" fill="#1a2a0a"/>
  <ellipse cx="116" cy="96" rx="2.5" ry="2.5" fill="#0a0a0a"/>
  <circle cx="114" cy="95" r="1" fill="#ffffff" opacity="0.8"/>

  <ellipse cx="140" cy="96" rx="8" ry="4.5" fill="#e8e8f0"/>
  <ellipse cx="140" cy="96" rx="4.5" ry="3.5" fill="#1a2a0a"/>
  <ellipse cx="140" cy="96" rx="2.5" ry="2.5" fill="#0a0a0a"/>
  <circle cx="138" cy="95" r="1" fill="#ffffff" opacity="0.8"/>

  <!-- Small nose - wrinkled -->
  <path d="M128,100 L126,110 L128,112 L130,110" fill="none" stroke="#c0a880" stroke-width="0.8" opacity="0.5"/>
  <path d="M124,107 C126,106 130,106 132,107" fill="none" stroke="#c0a880" stroke-width="0.5" opacity="0.3"/>

  <!-- Puffed cheeks -->
  <ellipse cx="108" cy="114" rx="8" ry="6" fill="#e8c8a4" opacity="0.4"/>
  <ellipse cx="148" cy="114" rx="8" ry="6" fill="#e8c8a4" opacity="0.4"/>
  <!-- Cheek flush -->
  <ellipse cx="108" cy="114" rx="7" ry="4" fill="#ee6644" opacity="0.12"/>
  <ellipse cx="148" cy="114" rx="7" ry="4" fill="#ee6644" opacity="0.12"/>

  <!-- Mouth - small angry pout -->
  <path d="M120,124 C124,122 128,121 132,122 C135,124 136,126 136,126" fill="none" stroke="#a08060" stroke-width="1.3"/>
  <path d="M122,124 C125,122 131,122 134,124" fill="none" stroke="#8a6848" stroke-width="0.7" opacity="0.5"/>

  <!-- Hoodie strings - swinging -->
  <path d="M118,160 L114,198 L112,196" fill="none" stroke="#88ff00" stroke-width="1" opacity="0.3"/>
  <path d="M138,160 L142,198 L144,196" fill="none" stroke="#88ff00" stroke-width="1" opacity="0.3"/>
  <circle cx="112" cy="196" r="2" fill="#88ff00" opacity="0.3"/>
  <circle cx="144" cy="196" r="2" fill="#88ff00" opacity="0.3"/>

  <!-- Hoodie wrinkle lines -->
  <path d="M82,220 C86,250 84,300 82,350" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.1"/>
  <path d="M174,220 C170,250 172,300 174,350" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.1"/>

  <!-- Anger marks -->
  <path d="M96,78 L100,82 M100,78 L96,82" fill="none" stroke="#ff4444" stroke-width="1.2" opacity="0.4"/>
  <path d="M156,80 L160,84 M160,80 L156,84" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.3"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="110" rx="35" ry="25" fill="#88ff00" opacity="0.028" filter="url(#ka-glow-soft)"/>

  <!-- Ambient particles -->
  <circle cx="38" cy="200" r="1" fill="#88ff00" opacity="0.38"/>
  <circle cx="218" cy="180" r="1.2" fill="#88ff00" opacity="0.33"/>
  <circle cx="52" cy="310" r="0.8" fill="#66cc00" opacity="0.28"/>
  <circle cx="205" cy="300" r="1" fill="#88ff00" opacity="0.25"/>
  <circle cx="30" cy="265" r="0.8" fill="#aaff44" opacity="0.2"/>

  <!-- State label -->
  <text x="128" y="375" font-family="'Courier New', monospace" font-size="10" fill="#88ff00" text-anchor="middle" opacity="0.5">[angry]</text>
</svg>