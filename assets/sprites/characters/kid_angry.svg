  <line x1="84" y1="106" x2="76" y2="110" stroke="#00ccff" stroke-width="0.8" opacity="0.15"/>
  <line x1="172" y1="106" x2="180" y2="110" stroke="#00ccff" stroke-width="0.8" opacity="0.15"/>

