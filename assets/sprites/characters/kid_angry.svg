<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="ka-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1a08"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="ka-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="50%" stop-color="#142214"/>
      <stop offset="100%" stop-color="#0c180c"/>
    </linearGradient>
    <linearGradient id="ka-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#d0b088"/>
    </linearGradient>
    <linearGradient id="ka-skin-flush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4b890"/>
      <stop offset="100%" stop-color="#d4a880"/>
    </linearGradient>
    <linearGradient id="ka-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="ka-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="ka-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44cc00"/>
      <stop offset="50%" stop-color="#88ff00"/>
      <stop offset="100%" stop-color="#44cc00"/>
    </linearGradient>
    <filter id="ka-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ka-glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ka-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#44cc00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#ka-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#ka-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#88ff00" text-anchor="middle" filter="url(#ka-glow)">小鬼</text>

  <!-- Hoodie body -->
  <path d="M58,180 C58,168 72,155 88,150 L108,144 C116,141 122,140 128,139 C134,140 140,141 148,144 L168,150 C184,155 198,168 198,180 L204,275 C206,315 202,348 198,370 L58,370 C54,348 50,315 52,275 Z" fill="url(#ka-hoodie)"/>
  <!-- Neon patches -->
  <path d="M68,200 L78,200 L78,230 L68,230 Z" fill="#88ff00" opacity="0.12"/>
  <path d="M178,200 L188,200 L188,230 L178,230 Z" fill="#88ff00" opacity="0.12"/>
  <path d="M60,185 Q62,220 58,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.15"/>
  <path d="M196,185 Q194,220 198,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.15"/>

  <!-- Hoodie pocket -->
  <path d="M90,260 L166,260 L168,295 C168,305 160,310 128,310 C96,310 88,305 88,295 Z" fill="#0c180c" opacity="0.6"/>
  <path d="M90,260 L166,260" fill="none" stroke="#88ff00" stroke-width="0.5" opacity="0.2"/>

  <!-- Hoodie seam -->
  <path d="M128,165 L128,370" fill="none" stroke="#88ff00" stroke-width="0.3" opacity="0.1"/>
  <path d="M85,200 C90,240 88,290 86,340" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.1"/>
  <path d="M171,200 C166,240 168,290 170,340" fill="none" stroke="#88ff00" stroke-width="0.4" opacity="0.1"/>

  <!-- Drawstrings -->
  <line x1="120" y1="165" x2="118" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.25"/>
  <line x1="136" y1="165" x2="138" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.25"/>
  <rect x="116" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.3"/>
  <rect x="136" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.3"/>

  <!-- T-shirt collar -->
  <path d="M112,155 C118,150 124,148 128,147 C132,148 138,150 144,155" fill="#1a1a28"/>

  <!-- Neck -->
  <path d="M118,132 L118,150 C118,153 122,155 128,155 C134,155 138,153 138,150 L138,132" fill="url(#ka-skin)"/>

  <!-- Hoodie hood behind neck -->
  <path d="M105,138 C110,145 118,148 128,148 C138,148 146,145 151,138 L155,145 C155,155 145,162 128,163 C111,162 101,155 101,145 Z" fill="#1a2a1a"/>

  <!-- Head shape - slightly flushed from anger -->
  <path d="M98,82 C98,55 110,42 128,40 C146,42 158,55 158,82 L158,112 C158,132 146,142 128,142 C110,142 98,132 98,112 Z" fill="url(#ka-skin-flush)"/>

  <!-- Puffed cheeks -->
  <ellipse cx="104" cy="112" rx="9" ry="7" fill="#e0a880" opacity="0.45"/>
  <ellipse cx="152" cy="112" rx="9" ry="7" fill="#e0a880" opacity="0.45"/>

  <!-- Hair - messy spikes -->
  <path d="M96,80 C96,52 110,36 128,34 C146,36 160,52 160,80" fill="url(#ka-hair)"/>
  <path d="M108,40 L104,28 L112,36" fill="url(#ka-hair)"/>
  <path d="M122,36 L118,22 L126,32" fill="url(#ka-hair)"/>
  <path d="M136,35 L140,20 L142,32" fill="url(#ka-hair)"/>
  <path d="M148,38 L154,26 L152,36" fill="url(#ka-hair)"/>
  <path d="M96,78 C96,68 98,58 102,52" fill="none" stroke="#1a1008" stroke-width="3"/>
  <path d="M160,78 C160,68 158,58 154,52" fill="none" stroke="#1a1008" stroke-width="3"/>
  <!-- Brown strand detail -->
  <path d="M106,44 Q104,52 106,62" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.5"/>
  <path d="M150,42 Q152,50 150,60" fill="none" stroke="#2a1a10" stroke-width="1.5" opacity="0.5"/>
  <!-- Green highlights -->
  <path d="M112,38 L108,26" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.3"/>
  <path d="M140,34 L144,22" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.3"/>

  <!-- VR Goggles on forehead - pushed up CROOKED (tilted) -->
  <g transform="rotate(-5,128,70)">
    <path d="M100,66 C100,58 108,52 128,52 C148,52 156,58 156,66 L156,76 C156,80 148,84 128,84 C108,84 100,80 100,76 Z" fill="url(#ka-goggles)"/>
    <!-- Strap -->
    <path d="M96,70 L100,70" fill="none" stroke="#2a2a3a" stroke-width="3"/>
    <path d="M156,70 L160,70" fill="none" stroke="#2a2a3a" stroke-width="3"/>
    <!-- Lenses -->
    <ellipse cx="116" cy="70" rx="10" ry="7" fill="#0a0a14"/>
    <ellipse cx="116" cy="70" rx="8" ry="5.5" fill="url(#ka-goggle-lens)" opacity="0.3"/>
    <ellipse cx="140" cy="70" rx="10" ry="7" fill="#0a0a14"/>
    <ellipse cx="140" cy="70" rx="8" ry="5.5" fill="url(#ka-goggle-lens)" opacity="0.3"/>
    <ellipse cx="116" cy="70" rx="10" ry="7" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="140" cy="70" rx="10" ry="7" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.4"/>
    <path d="M126,70 L130,70" fill="none" stroke="#2a2a3a" stroke-width="2"/>
  </g>

  <!-- Ears -->
  <ellipse cx="95" cy="95" rx="5" ry="7" fill="#d4a880"/>
  <ellipse cx="161" cy="95" rx="5" ry="7" fill="#d4a880"/>
  <circle cx="94" cy="92" r="1.2" fill="#88ff00" opacity="0.5"/>

  <!-- Eyebrows - deeply furrowed, angry V shape -->
  <path d="M105,90 C108,86 114,84 120,86" fill="none" stroke="#2a1a10" stroke-width="2.2" opacity="0.85"/>
  <path d="M136,86 C142,84 148,86 151,90" fill="none" stroke="#2a1a10" stroke-width="2.2" opacity="0.85"/>

  <!-- Angry vein mark on forehead -->
  <path d="M145,82 L148,78 L150,82 L147,80" fill="none" stroke="#dd6644" stroke-width="1" opacity="0.45"/>

  <!-- Eyes - narrowed, angry -->
  <ellipse cx="113" cy="96" rx="9" ry="5" fill="#e8e8f0"/>
  <ellipse cx="113" cy="96" rx="5" ry="4" fill="#1a3a08"/>
  <ellipse cx="113" cy="96" rx="2.5" ry="2.5" fill="#0a0a0a"/>
  <circle cx="111" cy="95" r="1.2" fill="#ffffff" opacity="0.8"/>
  <!-- Angry narrowing - heavy upper lid -->
  <path d="M104,92 C107,90 113,89 122,92" fill="#e0a880" opacity="0.5"/>

  <ellipse cx="143" cy="96" rx="9" ry="5" fill="#e8e8f0"/>
  <ellipse cx="143" cy="96" rx="5" ry="4" fill="#1a3a08"/>
  <ellipse cx="143" cy="96" rx="2.5" ry="2.5" fill="#0a0a0a"/>
  <circle cx="141" cy="95" r="1.2" fill="#ffffff" opacity="0.8"/>
  <path d="M134,92 C143,89 149,90 152,92" fill="#e0a880" opacity="0.5"/>

  <!-- Nose - flared nostrils -->
  <path d="M128,98 L126,110 L128,112 L130,110" fill="none" stroke="#c0a078" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="124" cy="112" rx="2" ry="1.5" fill="#c0a078" opacity="0.3"/>
  <ellipse cx="132" cy="112" rx="2" ry="1.5" fill="#c0a078" opacity="0.3"/>

  <!-- Mouth - angry pout with puffed cheeks -->
  <path d="M118,122 C122,120 128,119 134,120 C138,122 138,124 138,124" fill="none" stroke="#a07050" stroke-width="1.5"/>
  <!-- Lower lip pout -->
  <path d="M120,124 C124,127 132,127 136,124" fill="none" stroke="#a07050" stroke-width="1" opacity="0.6"/>

  <!-- Freckles -->
  <circle cx="108" cy="106" r="0.8" fill="#c0a078" opacity="0.25"/>
  <circle cx="148" cy="106" r="0.8" fill="#c0a078" opacity="0.25"/>

  <!-- Shoulders - tensed up -->
  <path d="M58,180 C63,168 75,160 88,156" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.22"/>
  <path d="M198,180 C193,168 181,160 168,156" fill="none" stroke="#88ff00" stroke-width="0.6" opacity="0.22"/>

  <!-- Frustration energy lines around head -->
  <line x1="84" y1="78" x2="78" y2="74" stroke="#88ff00" stroke-width="1" opacity="0.25"/>
  <line x1="172" y1="78" x2="178" y2="74" stroke="#88ff00" stroke-width="1" opacity="0.25"/>
  <line x1="82" y1="90" x2="76" y2="90" stroke="#88ff00" stroke-width="0.8" opacity="0.2"/>
  <line x1="174" y1="90" x2="180" y2="90" stroke="#88ff00" stroke-width="0.8" opacity="0.2"/>

  <!-- Ambient particles -->
  <circle cx="38" cy="195" r="1" fill="#88ff00" opacity="0.35"/>
  <circle cx="218" cy="178" r="1.2" fill="#88ff00" opacity="0.3"/>
  <circle cx="52" cy="305" r="0.8" fill="#44cc00" opacity="0.25"/>
  <circle cx="204" cy="298" r="1" fill="#88ff00" opacity="0.2"/>
  <circle cx="30" cy="260" r="0.8" fill="#88ff00" opacity="0.2"/>
</svg>