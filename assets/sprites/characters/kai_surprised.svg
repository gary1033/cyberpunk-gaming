  <path d="M184,188 C186,186 188,183 189,180" fill="none" stroke="#004050" stroke-width="0.8"/>
  <path d="M183,185 C184,183 185,181 186,179" fill="none" stroke="#004050" stroke-width="0.6"/>
  <!-- Ambient glow (flaring in surprise) -->
  <circle cx="160" cy="196" r="30" fill="url(#cyberGlow)" filter="url(#glowSoft)"/>

