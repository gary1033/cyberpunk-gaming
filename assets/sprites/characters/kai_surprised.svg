  <path d="M84,160 C92,152 100,150 112,154" fill="none" stroke="#b0b0c4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M152,154 C164,150 172,152 180,160" fill="none" stroke="#b0b0c4" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Nose -->
  <circle cx="132" cy="228" r="1.5" fill="#d0a080" opacity="0.5"/>

  <!-- Mouth (SURPRISED: O-shaped, open) -->
