<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141430"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c08a60"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e8e8f0"/>
      <stop offset="70%" stop-color="#d0d0dc"/>
      <stop offset="100%" stop-color="#c0c0d0"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0ea"/>
    </linearGradient>
    <linearGradient id="hairShadow" x1="0.5" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b8c8"/>
      <stop offset="100%" stop-color="#a0a0b4"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c32"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <linearGradient id="coatLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#24243e"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#14142a"/>
    </linearGradient>
    <radialGradient id="cyberIris" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#88ffff"/>
      <stop offset="50%" stop-color="#00ddee"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </radialGradient>
    <radialGradient id="flareGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aaffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00ffff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#00aacc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyanFlare" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyanSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

