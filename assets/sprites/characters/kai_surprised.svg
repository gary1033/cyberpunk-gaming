  <path d="M79,196 C82,174 93,168 104,169 C115,170 126,176 129,196 L126,196 C123,178 114,174 104,173 C94,174 85,178 82,196 Z" fill="#1a1020"/>
  <!-- Eyelashes (more visible when eyes wide) -->
