  <path d="M132,156 L135,156 L137,154" fill="none" stroke="#00cccc" stroke-width="0.8" opacity="0.9"/>
  <path d="M159,146 L161,144 L166,144" fill="none" stroke="#00cccc" stroke-width="0.8" opacity="0.9"/>
  <path d="M159,154 L161,156 L166,156" fill="none" stroke="#00cccc" stroke-width="0.8" opacity="0.9"/>
  <circle cx="132" cy="144" r="1" fill="#00ffff" opacity="0.9"/>
  <circle cx="132" cy="156" r="1" fill="#00ffff" opacity="0.9"/>
  <circle cx="166" cy="144" r="1" fill="#00ffff" opacity="0.9"/>
  <circle cx="166" cy="156" r="1" fill="#00ffff" opacity="0.9"/>
  <!-- Lens flare streaks -->
