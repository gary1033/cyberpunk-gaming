  <path d="M98,58 C94,42 89,28 84,10 C91,28 100,44 112,54 Z" fill="#e0e0f0" stroke="#1a1a2c" stroke-width="1.2"/>
  <path d="M112,48 C107,30 102,16 96,0 C105,18 116,36 128,46 Z" fill="#e8e8f4" stroke="#1a1a2c" stroke-width="1.2"/>
  <path d="M126,42 C123,24 118,10 114,0 C121,14 132,32 142,42 Z" fill="#eff0f8" stroke="#1a1a2c" stroke-width="1.4"/>
  <path d="M142,44 C145,26 149,12 154,0 C149,16 144,34 136,44 Z" fill="#e8e8f4" stroke="#1a1a2c" stroke-width="1.2"/>
  <path d="M158,54 C163,38 168,24 174,8 C168,26 158,42 148,52 Z" fill="#e0e0f0" stroke="#1a1a2c" stroke-width="1.2"/>

  <!-- Spike shadows -->
  <path d="M98,58 C94,42 89,28 84,10 C89,24 94,38 100,48 Z" fill="#8c8ca8" opacity="0.45"/>
  <path d="M126,42 C123,24 118,10 114,0 C119,10 124,22 128,34 Z" fill="#9494b0" opacity="0.35"/>

  <!-- Bangs -->
  <path d="M66,118 C70,140 74,155 78,168 L88,162 C84,150 80,136 76,114 Z" fill="#d8d8ec" stroke="#1a1a2c" stroke-width="0.7"/>
  <path d="M78,104 C82,124 86,140 90,156 L100,150 C96,136 92,120 88,100 Z" fill="#e0e0f0" stroke="#1a1a2c" stroke-width="0.7"/>
  <path d="M166,100 C170,118 174,134 178,150 L188,156 C184,138 180,120 176,102 Z" fill="#d8d8ec" stroke="#1a1a2c" stroke-width="0.7"/>
  <path d="M178,110 C182,130 186,146 190,162 L200,168 C196,150 192,132 188,112 Z" fill="#d0d0e4" stroke="#1a1a2c" stroke-width="0.7"/>

  <!-- Hair highlight band -->
  <path d="M88,58 C104,48 116,44 128,42 C140,44 152,48 168,58 L164,66 C152,56 140,52 128,50 C116,52 104,56 92,66 Z" fill="#ffffff" opacity="0.45"/>
  <path d="M58,140 C68,134 80,130 90,130" fill="none" stroke="#a8c0e0" stroke-width="1" opacity="0.2"/>
  <path d="M198,140 C188,134 176,130 166,130" fill="none" stroke="#a8c0e0" stroke-width="1" opacity="0.15"/>

  <!-- Hair outline -->
  <path d="M42,168 C40,116 64,44 128,40 C192,44 216,116 214,168" fill="none" stroke="#1a1a2c" stroke-width="1.8"/>

  <!-- ===== AMBIENT PARTICLES ===== -->
  <circle cx="24" cy="80" r="0.8" fill="#00ffee" opacity="0.15"/>
  <circle cx="232" cy="65" r="0.6" fill="#00ffee" opacity="0.1"/>
  <circle cx="18" cy="340" r="0.7" fill="#00ffee" opacity="0.1"/>
  <circle cx="238" cy="355" r="0.5" fill="#00ffee" opacity="0.08"/>
  <circle cx="40" cy="360" r="0.4" fill="#00ffee" opacity="0.06"/>
  <circle cx="216" cy="42" r="0.5" fill="#00ffee" opacity="0.08"/>

  <!-- Mood label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#00dde5" text-anchor="middle" opacity="0.3">[surprised]</text>
</svg>