  <circle cx="104" cy="195" r="16.5" fill="none" stroke="#0c1830" stroke-width="1.2" clip-path="url(#eyeL)"/>
  <!-- Inner iris detail -->
  <circle cx="104" cy="195" r="12" fill="none" stroke="#4088c0" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeL)"/>
