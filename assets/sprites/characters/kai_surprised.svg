  <path d="M96,300 C84,302 76,310 78,322 C80,328 84,330 88,326 L94,314 Z" fill="#101028" stroke="#08081a" stroke-width="0.8"/>
  <path d="M160,300 C172,302 180,310 178,322 C176,328 172,330 168,326 L162,314 Z" fill="#101028" stroke="#08081a" stroke-width="0.8"/>
  <!-- Arm accent lines -->
