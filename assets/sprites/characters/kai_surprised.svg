  <path d="M84,264 C98,274 114,278 128,278 C142,278 158,274 172,264 L168,270 C156,278 142,282 128,282 C114,282 100,278 88,270 Z" fill="#b89068" opacity="0.2"/>
  <!-- Cheek blush (stronger for surprise/emotion) -->
  <ellipse cx="82" cy="222" rx="15" ry="9" fill="#ff8888" opacity="0.25"/>
  <ellipse cx="174" cy="222" rx="15" ry="9" fill="#ff8888" opacity="0.25"/>
