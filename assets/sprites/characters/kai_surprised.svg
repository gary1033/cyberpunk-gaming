  <line x1="141" y1="143" x2="155" y2="157" stroke="#00ffff" stroke-width="0.4" opacity="0.5"/>
  <line x1="155" y1="143" x2="141" y2="157" stroke="#00ffff" stroke-width="0.4" opacity="0.5"/>
