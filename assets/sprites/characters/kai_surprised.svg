  <circle cx="148" cy="150" r="6" fill="#00ddee" opacity="0.85"/>
  <circle cx="148" cy="150" r="3" fill="#aaffff" filter="url(#glowCyan)"/>
  <!-- Scan crosshairs - intense -->
