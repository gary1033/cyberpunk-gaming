  <circle cx="94" cy="189" r="1.2" fill="#ffffff" opacity="0.5" clip-path="url(#eyeL)"/>
  <circle cx="108" cy="204" r="1" fill="#80c8ff" opacity="0.4" clip-path="url(#eyeL)"/>
  <circle cx="100" cy="186" r="0.8" fill="#ffffff" opacity="0.35" clip-path="url(#eyeL)"/>
