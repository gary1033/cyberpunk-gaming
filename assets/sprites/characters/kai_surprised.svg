  <path d="M126,157 Q128,170 125,175 Q127,177 131,175 Q133,170 130,157" fill="none" stroke="#b07a55" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M127,160 L127,168" fill="none" stroke="#dab892" stroke-width="0.5" opacity="0.3"/>
