  <circle cx="134" cy="204" r="0.5" fill="#8a8a92" opacity="0.35"/>
  <circle cx="140" cy="202" r="0.5" fill="#8a8a92" opacity="0.4"/>
  <circle cx="119" cy="208" r="0.45" fill="#8a8a92" opacity="0.3"/>
  <circle cx="125" cy="210" r="0.45" fill="#8a8a92" opacity="0.3"/>
  <circle cx="131" cy="210" r="0.45" fill="#8a8a92" opacity="0.3"/>
