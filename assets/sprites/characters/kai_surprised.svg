  <circle cx="104" cy="194" r="5" fill="#060810" clip-path="url(#eyeL)"/>
  <!-- Main highlight (extra big for sparkly surprise) -->
  <ellipse cx="113" cy="186" rx="8" ry="7" fill="#ffffff" opacity="0.95" clip-path="url(#eyeL)"/>
  <!-- Secondary highlight -->
  <circle cx="96" cy="206" r="5" fill="#ffffff" opacity="0.6" clip-path="url(#eyeL)"/>
