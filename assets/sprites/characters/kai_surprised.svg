  <circle cx="150" cy="189" r="1.2" fill="#aaffff" opacity="0.45" clip-path="url(#eyeR)"/>
  <circle cx="164" cy="204" r="1" fill="#00ffee" opacity="0.45" clip-path="url(#eyeR)"/>
  <circle cx="156" cy="186" r="0.8" fill="#ffffff" opacity="0.35" clip-path="url(#eyeR)"/>
