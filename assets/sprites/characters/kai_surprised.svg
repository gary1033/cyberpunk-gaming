  <ellipse cx="79" cy="158" rx="3" ry="7" fill="none" stroke="#a07050" stroke-width="0.4" opacity="0.5"/>
  <ellipse cx="178" cy="158" rx="6" ry="12" fill="#c08a60" stroke="#a07050" stroke-width="0.5"/>
