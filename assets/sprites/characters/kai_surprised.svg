  <ellipse cx="128" cy="162" rx="50" ry="60" fill="url(#skinGrad)"/>
  <path d="M83,178 Q95,208 112,218 Q120,222 128,223 Q136,222 144,218 Q161,208 173,178" fill="url(#skinGrad)" stroke="#b07a55" stroke-width="0.3"/>
  <path d="M85,165 Q90,178 98,185" fill="none" stroke="#b07a55" stroke-width="0.8" opacity="0.2"/>
