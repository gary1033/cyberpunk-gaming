  <circle cx="160" cy="195" r="14" fill="none" stroke="#00bbcc" stroke-width="0.6" opacity="0.5" clip-path="url(#eyeR)"/>
  <circle cx="160" cy="195" r="10" fill="none" stroke="#00ddee" stroke-width="0.4" opacity="0.4" clip-path="url(#eyeR)"/>
  <!-- Circuit tick marks (brighter in surprise) -->
  <line x1="160" y1="179" x2="160" y2="183" stroke="#00ccdd" stroke-width="0.5" opacity="0.5" clip-path="url(#eyeR)"/>
  <line x1="174" y1="195" x2="170" y2="195" stroke="#00ccdd" stroke-width="0.5" opacity="0.5" clip-path="url(#eyeR)"/>
  <line x1="146" y1="195" x2="150" y2="195" stroke="#00ccdd" stroke-width="0.5" opacity="0.5" clip-path="url(#eyeR)"/>
