  <path d="M80,188 C78,186 76,183 75,180" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M81,185 C80,183 79,181 78,179" fill="none" stroke="#1a1020" stroke-width="0.6"/>

  <!-- == RIGHT EYE (cybernetic cyan - wide open, flaring) == -->
