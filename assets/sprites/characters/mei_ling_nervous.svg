  <path d="M75,128 Q72,98 80,78 Q90,58 110,50 Q125,46 128,46 Q131,46 146,50 Q166,58 176,78 Q184,98 181,128 Q178,113 170,103 Q160,93 145,88 Q128,85 111,88 Q96,93 86,103 Q78,113 75,128 Z" fill="url(#hairGrad)"/>

  <path d="M100,60 Q115,53 128,51 Q141,53 156,60" fill="none" stroke="#2a1838" stroke-width="2" opacity="0.4"/>

