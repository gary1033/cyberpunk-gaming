  <path d="M80,123 Q75,158 70,208 Q68,238 70,263" fill="url(#hairGrad)" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M176,123 Q181,158 186,208 Q188,238 186,263" fill="url(#hairGrad)" stroke="#1a0d28" stroke-width="0.5"/>
