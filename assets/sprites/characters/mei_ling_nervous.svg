<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d5b8"/>
      <stop offset="100%" stop-color="#e8c4a0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="40%" stop-color="#0d0a15"/>
      <stop offset="70%" stop-color="#1a0d28"/>
      <stop offset="100%" stop-color="#0d0a15"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
    <linearGradient id="lipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c47070"/>
      <stop offset="100%" stop-color="#a85555"/>
    </linearGradient>
    <linearGradient id="sweatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0d8f0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a0c0e0" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="earringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#5a3528"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>

  <!-- Ambient neon light from sides -->
  <ellipse cx="0" cy="200" rx="80" ry="200" fill="#ff0066" opacity="0.03"/>
  <ellipse cx="256" cy="180" rx="60" ry="180" fill="#6600ff" opacity="0.03"/>

  <!-- Border frame -->
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff0066" stroke-width="1.5" opacity="0.4"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.2"/>

  <!-- Character name at top -->
  <text x="128" y="28" font-family="monospace" font-size="16" fill="#ff0066" text-anchor="middle" filter="url(#neonGlow)" opacity="0.9">美玲</text>
  <line x1="40" y1="35" x2="216" y2="35" stroke="#ff0066" stroke-width="0.5" opacity="0.3"/>

  <!-- === BODY / JACKET - tense posture, shoulders slightly raised === -->
  <path d="M52,316 Q62,256 87,236 Q102,228 116,225 L128,222 L140,225 Q154,228 169,236 Q194,256 204,316 L204,390 L52,390 Z" fill="url(#jacketGrad)" stroke="#2a2a4e" stroke-width="0.5"/>

  <!-- Jacket lapels -->
  <path d="M116,225 L109,267 L128,297 L128,222 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>
  <path d="M140,225 L147,267 L128,297 L128,222 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>

  <!-- Jacket collar -->
  <path d="M106,229 Q111,217 121,215 L128,222 L116,225 Z" fill="#1e1e35"/>
  <path d="M150,229 Q145,217 135,215 L128,222 L140,225 Z" fill="#1e1e35"/>

  <!-- Tech stripes -->
  <line x1="73" y1="256" x2="73" y2="340" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <line x1="183" y1="256" x2="183" y2="340" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <!-- Circuit patterns -->
  <path d="M79,254 L83,254 L83,261 L89,261" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="89" cy="261" r="1" fill="#ff0066" opacity="0.5"/>
  <path d="M177,254 L173,254 L173,261 L167,261" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="167" cy="261" r="1" fill="#ff0066" opacity="0.5"/>
  <path d="M66,271 L71,271 L71,276 L76,276 L76,284" fill="none" stroke="#ff0066" stroke-width="0.4" opacity="0.3"/>
  <rect x="74" y="284" width="4" height="2" fill="#ff0066" opacity="0.3"/>
  <path d="M190,271 L185,271 L185,276 L180,276 L180,284" fill="none" stroke="#ff0066" stroke-width="0.4" opacity="0.3"/>
  <rect x="178" y="284" width="4" height="2" fill="#ff0066" opacity="0.3"/>

  <!-- Jacket seam lines -->
  <path d="M91,241 Q101,276 106,340" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.6"/>
  <path d="M165,241 Q155,276 150,340" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.6"/>

  <!-- Inner shirt neckline -->
  <path d="M114,223 Q121,232 128,235 Q135,232 142,223" fill="none" stroke="#333355" stroke-width="1"/>

  <!-- Neck - tense -->
  <path d="M119,215 Q118,202 120,189 L136,189 Q138,202 137,215" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.3"/>
  <!-- Neck tendon lines showing tension -->
  <path d="M122,205 Q124,210 123,215" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.25"/>
  <path d="M134,205 Q132,210 133,215" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.25"/>

  <!-- === HAIR (back layer) === -->
  <path d="M75,128 Q65,178 55,258 Q50,298 52,348 Q53,363 58,363 Q65,338 68,278 Q72,218 80,168 Z" fill="url(#hairGrad)"/>
  <path d="M181,128 Q191,178 201,258 Q206,298 204,348 Q203,363 198,363 Q191,338 188,278 Q184,218 176,168 Z" fill="url(#hairGrad)"/>
  <path d="M70,138 Q60,188 52,248 Q48,288 48,338 Q47,353 52,356 Q56,338 58,288 Q62,228 72,168 Z" fill="#0d0a15" opacity="0.6"/>
  <path d="M186,138 Q196,188 204,248 Q208,288 208,338 Q209,353 204,356 Q200,338 198,288 Q194,228 184,168 Z" fill="#0d0a15" opacity="0.6"/>

