  <path d="M98,120 Q108,116 120,118" fill="none" stroke="#1a1020" stroke-width="2" stroke-linecap="round"/>
  <path d="M136,117 Q148,115 158,120" fill="none" stroke="#1a1020" stroke-width="2" stroke-linecap="round"/>
  <!-- Brow thickness -->
  <path d="M100,119 Q108,115.5 118,117.5" fill="none" stroke="#1a1020" stroke-width="0.8" opacity="0.3"/>
  <path d="M138,116.5 Q148,114.5 156,119" fill="none" stroke="#1a1020" stroke-width="0.8" opacity="0.3"/>

  <!-- Eyes - looking to the RIGHT side, showing nervousness -->
  <!-- Left eye -->
  <path d="M100,131 Q110,125 122,131 Q110,137 100,131 Z" fill="white" stroke="#2a2035" stroke-width="0.5"/>
  <!-- Iris/pupil shifted right -->
  <ellipse cx="115" cy="131" rx="5.5" ry="5" fill="url(#irisGrad)"/>
  <circle cx="115" cy="131" r="3" fill="#1a0a0a"/>
  <circle cx="113.5" cy="129" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="117" cy="132" r="0.6" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease -->
  <path d="M101,127 Q110,121 121,127" fill="none" stroke="#c4a090" stroke-width="0.5" opacity="0.4"/>
  <!-- Eyelashes -->
  <path d="M100,131 Q98,128 96,127" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M122,131 Q124,128 125,126" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M102,129 Q100,127 99,126" fill="none" stroke="#1a1020" stroke-width="0.5"/>
  <!-- Upper eyelid -->
  <path d="M100,131 Q110,124 122,131" fill="none" stroke="#1a1020" stroke-width="1.2"/>
  <!-- Lower lash -->
  <path d="M102,133 Q110,136 120,133" fill="none" stroke="#2a2035" stroke-width="0.3" opacity="0.4"/>
  <!-- Under-eye stress -->
  <path d="M102,135 Q107,137 112,135" fill="none" stroke="#c0a090" stroke-width="0.4" opacity="0.25"/>

  <!-- Right eye -->
  <path d="M134,131 Q146,125 156,131 Q146,137 134,131 Z" fill="white" stroke="#2a2035" stroke-width="0.5"/>
  <!-- Iris/pupil shifted right -->
  <ellipse cx="149" cy="131" rx="5.5" ry="5" fill="url(#irisGrad)"/>
  <circle cx="149" cy="131" r="3" fill="#1a0a0a"/>
  <circle cx="147.5" cy="129" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="151" cy="132" r="0.6" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease -->
  <path d="M135,127 Q146,121 155,127" fill="none" stroke="#c4a090" stroke-width="0.5" opacity="0.4"/>
  <!-- Eyelashes -->
  <path d="M134,131 Q132,128 131,127" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M156,131 Q158,128 160,127" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M154,129 Q156,127 157,126" fill="none" stroke="#1a1020" stroke-width="0.5"/>
  <!-- Upper eyelid -->
  <path d="M134,131 Q146,124 156,131" fill="none" stroke="#1a1020" stroke-width="1.2"/>
  <!-- Lower lash -->
  <path d="M136,133 Q146,136 154,133" fill="none" stroke="#2a2035" stroke-width="0.3" opacity="0.4"/>
  <!-- Under-eye stress -->
  <path d="M144,135 Q149,137 154,135" fill="none" stroke="#c0a090" stroke-width="0.4" opacity="0.25"/>

  <!-- === SWEAT DROP near left temple === -->
  <path d="M88,117 Q86,121 87,128 Q88,132 90,128 Q91,124 89,117 Z" fill="url(#sweatGrad)" stroke="#a0c0e0" stroke-width="0.3" opacity="0.6"/>
  <!-- Sweat drop highlight -->
  <ellipse cx="88" cy="121" rx="0.8" ry="1.5" fill="white" opacity="0.4"/>

  <!-- Nose -->
  <path d="M126,140 Q128,148 125,153" fill="none" stroke="#d4a878" stroke-width="1" opacity="0.6"/>
  <path d="M123,154 Q128,156 133,154" fill="none" stroke="#d4a878" stroke-width="0.8" opacity="0.5"/>
  <line x1="127" y1="136" x2="127" y2="146" stroke="#f5dcc5" stroke-width="0.8" opacity="0.2"/>

  <!-- Lips - slightly parted, tense -->
  <path d="M117,168 Q122,166 128,167 Q134,166 139,168" fill="none" stroke="#c47070" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M117,168 Q128,172 139,168" fill="url(#lipGrad)" opacity="0.25"/>
  <!-- Upper lip -->
  <path d="M122,167 Q125,165.5 128,166.5 Q131,165.5 134,167" fill="#c47070" opacity="0.35"/>
  <!-- Slight gap between lips showing tension -->
  <path d="M122,169 Q128,170 134,169" fill="#1a0a0a" opacity="0.2"/>
  <!-- Lower lip -->
  <path d="M120,170 Q128,172 136,170" fill="none" stroke="#b06060" stroke-width="0.6" opacity="0.3"/>

  <!-- Blush - slightly more from nervousness -->
  <ellipse cx="100" cy="146" rx="10" ry="5" fill="#ff6688" opacity="0.09"/>
  <ellipse cx="156" cy="146" rx="10" ry="5" fill="#ff6688" opacity="0.09"/>

  <!-- Ears -->
  <path d="M84,128 Q78,128 76,138 Q75,148 80,153" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.5"/>
  <path d="M79,133 Q77,138 78,146" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.4"/>
  <path d="M172,128 Q178,128 180,138 Q181,148 176,153" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.5"/>
  <path d="M177,133 Q179,138 178,146" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.4"/>

  <!-- === TECH EARRING - flickering slightly for nervousness === -->
  <circle cx="180" cy="148" r="4" fill="none" stroke="#ff0066" stroke-width="1" filter="url(#neonGlow)" opacity="0.7"/>
  <circle cx="180" cy="148" r="2" fill="#ff0066" opacity="0.5"/>
  <circle cx="180" cy="148" r="8" fill="url(#earringGlow)" opacity="0.35"/>
  <line x1="180" y1="152" x2="180" y2="160" stroke="#ff0066" stroke-width="0.8" opacity="0.6"/>
  <path d="M177,160 L180,166 L183,160 Z" fill="#ff0066" opacity="0.4" filter="url(#neonGlow)"/>
  <circle cx="180" cy="148" r="1" fill="#ff99bb" opacity="0.7"/>

  <!-- === AMBIENT EFFECTS === -->
  <line x1="0" y1="100" x2="256" y2="100" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>

  <!-- Glitch effect lines near face - showing internal unease -->
  <line x1="82" y1="140" x2="78" y2="140" stroke="#ff0066" stroke-width="0.5" opacity="0.3"/>
  <line x1="174" y1="145" x2="178" y2="145" stroke="#ff0066" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner accents -->
  <path d="M10,10 L30,10 M10,10 L10,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,10 L226,10 M246,10 L246,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M10,374 L30,374 M10,374 L10,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,374 L226,374 M246,374 L246,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#ff0066" text-anchor="middle" opacity="0.5">[NERVOUS]</text>
</svg>