  <path d="M88,108 Q92,83 108,70 Q115,66 120,73 Q110,88 105,108 Z" fill="#0d0a15"/>
  <path d="M105,103 Q110,76 125,63 Q130,61 133,68 Q125,80 120,103 Z" fill="#12101e"/>
  <path d="M120,100 Q128,73 140,66 Q145,65 146,70 Q140,83 135,103 Z" fill="#0d0a15"/>
  <path d="M138,106 Q148,80 160,76 Q165,76 164,82 Q155,93 148,110 Z" fill="#12101e"/>
