  <path d="M60,198 Q58,248 55,298" fill="none" stroke="#6b2fa0" stroke-width="1.5" opacity="0.3"/>
  <path d="M196,198 Q198,248 201,298" fill="none" stroke="#6b2fa0" stroke-width="1.5" opacity="0.3"/>
  <path d="M55,228 Q54,268 53,318" fill="none" stroke="#5a1f90" stroke-width="1" opacity="0.2"/>

  <!-- === HEAD === -->
  <ellipse cx="128" cy="143" rx="42" ry="52" fill="url(#skinGrad)"/>
  <path d="M86,143 Q88,173 105,190 Q118,198 128,200 Q138,198 151,190 Q168,173 170,143" fill="url(#skinGrad)"/>
  <ellipse cx="128" cy="193" rx="8" ry="3" fill="#f5dcc5" opacity="0.3"/>
  <path d="M90,153 Q95,168 105,178" fill="none" stroke="#d4a878" stroke-width="0.8" opacity="0.15"/>
  <path d="M166,153 Q161,168 151,178" fill="none" stroke="#d4a878" stroke-width="0.8" opacity="0.15"/>

