  <path d="M130,102 Q136,78 148,70 Q152,69 152,74 Q146,86 140,106 Z" fill="#15102a" opacity="0.7"/>

  <!-- Purple highlights -->
  <path d="M95,88 Q100,108 102,128" fill="none" stroke="#6b2fa0" stroke-width="1.2" opacity="0.4"/>
  <path d="M155,86 Q158,106 160,126" fill="none" stroke="#6b2fa0" stroke-width="1.2" opacity="0.4"/>
  <path d="M112,73 Q115,93 116,113" fill="none" stroke="#5a1f90" stroke-width="0.8" opacity="0.3"/>
  <path d="M140,71 Q142,91 143,111" fill="none" stroke="#5a1f90" stroke-width="0.8" opacity="0.3"/>
  <path d="M103,80 Q106,98 107,118" fill="none" stroke="#7b3fb0" stroke-width="0.6" opacity="0.25"/>

