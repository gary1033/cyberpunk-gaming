  <path d="M96,68 L100,68" fill="none" stroke="#2a2a3a" stroke-width="3"/>
  <path d="M156,68 L160,68" fill="none" stroke="#2a2a3a" stroke-width="3"/>
  <ellipse cx="116" cy="68" rx="10" ry="7" fill="#0a0a14"/>
  <ellipse cx="116" cy="68" rx="8" ry="5.5" fill="url(#ke-goggle-lens)" opacity="0.35"/>
  <ellipse cx="140" cy="68" rx="10" ry="7" fill="#0a0a14"/>
