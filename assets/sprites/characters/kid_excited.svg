  <circle cx="145" cy="93" r="0.6" fill="#88ff00" opacity="0.5"/>

  <!-- Nose -->
  <path d="M128,94 L126,106 L128,108 L130,106" fill="none" stroke="#c0a078" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - huge excited grin -->
  <path d="M112,118 C118,128 128,130 138,128 C144,122 144,118 144,118" fill="none" stroke="#a08060" stroke-width="1.4"/>
