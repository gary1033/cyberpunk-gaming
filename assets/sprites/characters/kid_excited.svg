  <line x1="184" y1="192" x2="212" y2="192" stroke="#00ff44" stroke-width="0.6" opacity="0.25"/>
  <line x1="184" y1="196" x2="204" y2="196" stroke="#00ff44" stroke-width="0.5" opacity="0.18"/>
  <line x1="184" y1="200" x2="208" y2="200" stroke="#00ff44" stroke-width="0.5" opacity="0.18"/>
  <rect x="180" y="186" width="38" height="26" rx="2" fill="none" stroke="#00ff44" stroke-width="0.5" opacity="0.25"/>

  <!-- Ambient particles - more energetic -->
