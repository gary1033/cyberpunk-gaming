  <line x1="136" y1="165" x2="138" y2="200" stroke="#88ff00" stroke-width="0.8" opacity="0.25"/>
  <rect x="116" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.3"/>
  <rect x="136" y="198" width="4" height="6" rx="1" fill="#88ff00" opacity="0.3"/>

  <!-- T-shirt collar -->
  <path d="M112,155 C118,150 124,148 128,147 C132,148 138,150 144,155" fill="#1a1a28"/>

