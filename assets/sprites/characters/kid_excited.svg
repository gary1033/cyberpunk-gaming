<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="ke-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1a08"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="ke-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="50%" stop-color="#142214"/>
      <stop offset="100%" stop-color="#0c180c"/>
    </linearGradient>
    <linearGradient id="ke-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c098"/>
      <stop offset="100%" stop-color="#d0b088"/>
    </linearGradient>
    <linearGradient id="ke-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="ke-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="ke-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44cc00"/>
      <stop offset="50%" stop-color="#88ff00"/>
      <stop offset="100%" stop-color="#44cc00"/>
    </linearGradient>
    <filter id="ke-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ke-glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ke-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88ff00" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#44cc00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="ke-sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#88ff00"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background - brighter energy -->
  <rect width="256" height="384" fill="url(#ke-bg)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#ke-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#88ff00" text-anchor="middle" filter="url(#ke-glow)">小鬼</text>

  <!-- Hoodie body - leaning forward eagerly -->
  <path d="M58,180 C58,168 72,155 88,150 L108,144 C116,141 122,140 128,139 C134,140 140,141 148,144 L168,150 C184,155 198,168 198,180 L204,275 C206,315 202,348 198,370 L58,370 C54,348 50,315 52,275 Z" fill="url(#ke-hoodie)"/>
  <!-- Neon patches -->
  <path d="M68,200 L78,200 L78,230 L68,230 Z" fill="#88ff00" opacity="0.12"/>
  <path d="M178,200 L188,200 L188,230 L178,230 Z" fill="#88ff00" opacity="0.12"/>
  <path d="M60,185 Q62,220 58,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.15"/>
  <path d="M196,185 Q194,220 198,260" fill="none" stroke="#88ff00" stroke-width="2" opacity="0.15"/>
  <path d="M80,210 L176,210" fill="none" stroke="#88ff00" stroke-width="1.5" opacity="0.1"/>

