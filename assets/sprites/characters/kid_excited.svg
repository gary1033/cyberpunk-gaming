  <path d="M144,118 C142,116 140,118" fill="none" stroke="#c0a078" stroke-width="0.5" opacity="0.3"/>

  <!-- Freckles -->
  <circle cx="106" cy="102" r="0.8" fill="#c0a078" opacity="0.3"/>
  <circle cx="110" cy="104" r="0.6" fill="#c0a078" opacity="0.25"/>
  <circle cx="146" cy="102" r="0.8" fill="#c0a078" opacity="0.3"/>
  <circle cx="150" cy="104" r="0.6" fill="#c0a078" opacity="0.25"/>

  <!-- Excitement sparkles around character -->
  <circle cx="80" cy="70" r="2" fill="url(#ke-sparkle)" filter="url(#ke-glow)" opacity="0.5"/>
  <circle cx="176" cy="65" r="1.5" fill="url(#ke-sparkle)" filter="url(#ke-glow)" opacity="0.4"/>
  <circle cx="170" cy="90" r="1" fill="url(#ke-sparkle)" opacity="0.35"/>
  <circle cx="88" cy="85" r="1.2" fill="url(#ke-sparkle)" opacity="0.3"/>
  <!-- Extra energy sparks -->
  <path d="M74,82 L72,78 L76,80 L78,76 L78,80 L82,78 L78,82" fill="#88ff00" opacity="0.25"/>
  <path d="M178,78 L176,74 L180,76 L182,72 L182,76 L186,74 L182,78" fill="#88ff00" opacity="0.25"/>

  <!-- Ambient particles - more energetic -->
