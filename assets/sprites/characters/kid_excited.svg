<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="100%" stop-color="#06061a"/>
    </radialGradient>
    <radialGradient id="iris-l" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#99dd77"/>
      <stop offset="40%" stop-color="#66bb55"/>
      <stop offset="100%" stop-color="#2a7722"/>
    </radialGradient>
    <radialGradient id="iris-r" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#99dd77"/>
      <stop offset="40%" stop-color="#66bb55"/>
      <stop offset="100%" stop-color="#2a7722"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2028"/>
      <stop offset="50%" stop-color="#121a22"/>
      <stop offset="100%" stop-color="#0a1218"/>
    </linearGradient>
    <linearGradient id="hoodie-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#060c12"/>
