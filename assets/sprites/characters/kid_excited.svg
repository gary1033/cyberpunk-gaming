<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="ke-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a1a08"/>
      <stop offset="100%" stop-color="#06061a"/>
    </radialGradient>
    <radialGradient id="ke-iris-l" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#88ffaa"/>
      <stop offset="40%" stop-color="#33ee55"/>
      <stop offset="100%" stop-color="#0a7722"/>
    </radialGradient>
    <radialGradient id="ke-iris-r" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#88ffaa"/>
      <stop offset="40%" stop-color="#33ee55"/>
      <stop offset="100%" stop-color="#0a7722"/>
    </radialGradient>
    <linearGradient id="ke-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2e1e"/>
      <stop offset="50%" stop-color="#142614"/>
      <stop offset="100%" stop-color="#0c1a0c"/>
    </linearGradient>
    <linearGradient id="ke-hoodie-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c180c"/>
      <stop offset="100%" stop-color="#081208"/>
    </linearGradient>
    <linearGradient id="ke-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ccff"/>
      <stop offset="50%" stop-color="#0099dd"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </linearGradient>
    <linearGradient id="ke-hair-shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#88eeff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ke-goggles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <linearGradient id="ke-goggle-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44ff88"/>
      <stop offset="50%" stop-color="#00ff44"/>
      <stop offset="100%" stop-color="#44ff88"/>
    </linearGradient>
    <linearGradient id="ke-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff44" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#44ff88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff44" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="ke-sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00ff44"/>
      <stop offset="100%" stop-color="#00ff44" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

