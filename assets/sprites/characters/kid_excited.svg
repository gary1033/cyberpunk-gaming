  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="url(#ke-border)" stroke-width="1.5"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00ff44" text-anchor="middle" filter="url(#glow)">小鬼</text>

