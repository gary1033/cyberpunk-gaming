  <!-- Hoodie seam -->
  <path d="M128,165 L128,370" fill="none" stroke="#88ff00" stroke-width="0.3" opacity="0.1"/>

  <!-- Fists up - excited! -->
  <!-- Left fist -->
  <path d="M70,170 Q64,160 60,155 Q56,152 54,156 Q52,162 56,170 L62,178" fill="url(#ke-skin)" opacity="0.85"/>
  <path d="M56,156 Q54,154 56,152 Q58,150 60,152" fill="url(#ke-skin)" opacity="0.8"/>
  <!-- Right fist -->
  <path d="M186,170 Q192,160 196,155 Q200,152 202,156 Q204,162 200,170 L194,178" fill="url(#ke-skin)" opacity="0.85"/>
  <path d="M200,156 Q202,154 200,152 Q198,150 196,152" fill="url(#ke-skin)" opacity="0.8"/>

