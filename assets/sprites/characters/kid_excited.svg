  <ellipse cx="116" cy="68" rx="10" ry="7" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="140" cy="68" rx="10" ry="7" fill="none" stroke="#88ff00" stroke-width="0.8" opacity="0.5"/>
  <path d="M126,68 L130,68" fill="none" stroke="#2a2a3a" stroke-width="2"/>

