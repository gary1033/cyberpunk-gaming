<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="irisGradL" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6b4030"/>
      <stop offset="50%" stop-color="#4a2518"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="irisGradR" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#6b4030"/>
      <stop offset="50%" stop-color="#4a2518"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="earringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fearAura" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>
  <rect width="256" height="384" fill="url(#fearAura)"/>
  <ellipse cx="0" cy="200" rx="80" ry="200" fill="#ff0033" opacity="0.04"/>
  <ellipse cx="256" cy="180" rx="60" ry="180" fill="#6600ff" opacity="0.04"/>

  <!-- Border frame - slightly glitching -->
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff0066" stroke-width="1.5" opacity="0.5"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.2"/>
  <!-- Glitch offset on frame -->
  <rect x="5" y="150" width="246" height="3" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.15"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="16" fill="#ff0066" text-anchor="middle" filter="url(#neonGlow)" opacity="0.9">美玲</text>
  <line x1="40" y1="35" x2="216" y2="35" stroke="#ff0066" stroke-width="0.5" opacity="0.3"/>

  <!-- === BODY / JACKET - defensive posture === -->
  <path d="M54,316 Q64,258 87,239 Q100,232 115,228 L128,225 L141,228 Q156,232 169,239 Q192,258 202,316 L202,390 L54,390 Z" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="0.5"/>
  <!-- Jacket cel-shadow -->
  <path d="M54,316 Q64,268 87,247 Q97,239 107,234 L128,225 L128,390 L54,390 Z" fill="#12122a" opacity="0.5"/>

  <!-- Jacket lapels -->
  <path d="M115,228 L108,268 L128,298 L128,225 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>
  <path d="M141,228 L148,268 L128,298 L128,225 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>

  <!-- Jacket collar -->
  <path d="M106,232 Q110,220 120,218 L128,225 L115,228 Z" fill="#1e1e35"/>
  <path d="M150,232 Q146,220 136,218 L128,225 L141,228 Z" fill="#1e1e35"/>

  <!-- Tech stripes -->
  <line x1="74" y1="258" x2="74" y2="338" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <line x1="182" y1="258" x2="182" y2="338" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <!-- Circuit patterns -->
  <path d="M80,256 L84,256 L84,263 L90,263" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="90" cy="263" r="1.5" fill="#ff0066" opacity="0.5"/>
  <path d="M176,256 L172,256 L172,263 L166,263" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="166" cy="263" r="1.5" fill="#ff0066" opacity="0.5"/>
  <path d="M67,271 L72,271 L72,276 L77,276 L77,284" fill="none" stroke="#ff0066" stroke-width="0.4" opacity="0.3"/>
  <rect x="75" y="284" width="4" height="2" fill="#ff0066" opacity="0.3"/>

  <!-- Hand raised near mouth - frightened gesture -->
  <path d="M156,232 Q168,222 174,208 Q177,198 175,190" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="0.5"/>
  <!-- Hand shape -->
  <path d="M168,194 Q165,187 163,182 Q162,178 165,176 Q168,175 170,178 L172,182 Q173,178 175,175 Q177,173 179,175 Q181,177 180,182 L179,186 Q181,182 183,180 Q185,179 187,181 Q188,183 186,188 L183,194 Q185,192 187,191 Q189,190 190,193 Q190,196 187,200 Q182,208 176,212 Q170,216 165,214 Q162,212 163,207 Q164,202 168,194 Z" fill="#f0d5b8"/>
  <!-- Hand cel-shadow -->
  <path d="M168,194 Q165,187 163,182 Q162,178 165,176 Q166,175 168,177 L168,194 Z" fill="#d4a878" opacity="0.4"/>
  <path d="M172,182 Q173,178 175,175 Q176,174 177,175 L177,182 Z" fill="#d4a878" opacity="0.3"/>

  <!-- Inner shirt neckline -->
  <path d="M113,226 Q120,235 128,238 Q136,235 143,226" fill="none" stroke="#333355" stroke-width="1"/>

  <!-- Neck - very tense -->
  <path d="M118,218 Q118,200 120,192 L136,192 Q138,200 138,218" fill="#f0d5b8"/>
  <!-- Neck shadow -->
  <path d="M118,218 Q120,208 120,192 L128,192 L128,218 Z" fill="#d4a878" opacity="0.45"/>
  <!-- Neck tendon lines -->
  <line x1="121" y1="196" x2="120" y2="214" stroke="#d4a878" stroke-width="0.5" opacity="0.35"/>
  <line x1="135" y1="196" x2="136" y2="214" stroke="#d4a878" stroke-width="0.5" opacity="0.35"/>

  <!-- === HAIR (back layer) === -->
  <path d="M72,130 Q60,180 50,260 Q46,310 50,360 Q52,370 60,365 Q66,340 70,280 Q74,220 78,170 Z" fill="#0d0a15"/>
  <path d="M184,130 Q196,180 206,260 Q210,310 206,360 Q204,370 196,365 Q190,340 186,280 Q182,220 178,170 Z" fill="#0d0a15"/>
  <path d="M66,150 Q56,200 48,270 Q44,320 46,365 Q46,370 50,368 Q52,340 54,280 Q58,220 66,170 Z" fill="#0d0a15" opacity="0.7"/>
  <path d="M190,150 Q200,200 208,270 Q212,320 210,365 Q210,370 206,368 Q204,340 202,280 Q198,220 190,170 Z" fill="#0d0a15" opacity="0.7"/>

  <!-- Purple highlights in back hair -->
  <path d="M57,200 Q54,240 52,290 Q51,310 52,330" fill="none" stroke="#6b2fa0" stroke-width="3" opacity="0.35"/>
  <path d="M199,200 Q202,240 204,290 Q205,310 204,330" fill="none" stroke="#6b2fa0" stroke-width="3" opacity="0.35"/>

  <!-- === HEAD === -->
  <path d="M86,120 Q84,140 86,158 Q90,175 105,190 Q118,200 128,203 Q138,200 151,190 Q166,175 170,158 Q172,140 170,120 Q168,105 160,100 Q145,92 128,90 Q111,92 96,100 Q88,105 86,120 Z" fill="#f0d5b8"/>
  <!-- Face shadow -->
  <path d="M86,120 Q84,140 86,158 Q90,175 105,190 Q115,198 128,203 L128,90 Q111,92 96,100 Q88,105 86,120 Z" fill="#d4a878" opacity="0.28"/>
