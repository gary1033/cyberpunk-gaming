<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecd0b2"/>
      <stop offset="100%" stop-color="#e0bf9a"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="40%" stop-color="#0d0a15"/>
      <stop offset="70%" stop-color="#1a0d28"/>
      <stop offset="100%" stop-color="#0d0a15"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
    <radialGradient id="earringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#5a3528"/>
      <stop offset="100%" stop-color="#2a1510"/>
    </radialGradient>
    <radialGradient id="fearAura" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="trembleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>

  <!-- Fear aura -->
  <rect width="256" height="384" fill="url(#fearAura)"/>

  <!-- Ambient neon light - more intense, unsettling -->
  <ellipse cx="0" cy="200" rx="80" ry="200" fill="#ff0033" opacity="0.04"/>
  <ellipse cx="256" cy="180" rx="60" ry="180" fill="#6600ff" opacity="0.04"/>

  <!-- Border frame - slightly glitching -->
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff0066" stroke-width="1.5" opacity="0.5"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.2"/>
  <!-- Glitch offset on frame -->
  <rect x="5" y="150" width="246" height="3" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.15"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="16" fill="#ff0066" text-anchor="middle" filter="url(#neonGlow)" opacity="0.9">美玲</text>
  <line x1="40" y1="35" x2="216" y2="35" stroke="#ff0066" stroke-width="0.5" opacity="0.3"/>

  <!-- === BODY / JACKET - hunched, pulled back defensive posture === -->
  <path d="M54,316 Q64,258 87,239 Q100,232 115,228 L128,225 L141,228 Q156,232 169,239 Q192,258 202,316 L202,390 L54,390 Z" fill="url(#jacketGrad)" stroke="#2a2a4e" stroke-width="0.5"/>

  <!-- Jacket lapels -->
  <path d="M115,228 L108,268 L128,298 L128,225 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>
  <path d="M141,228 L148,268 L128,298 L128,225 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>

  <!-- Jacket collar -->
  <path d="M106,232 Q110,220 120,218 L128,225 L115,228 Z" fill="#1e1e35"/>
  <path d="M150,232 Q146,220 136,218 L128,225 L141,228 Z" fill="#1e1e35"/>

  <!-- Tech stripes -->
  <line x1="74" y1="258" x2="74" y2="338" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <line x1="182" y1="258" x2="182" y2="338" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <!-- Circuit patterns -->
  <path d="M80,256 L84,256 L84,263 L90,263" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="90" cy="263" r="1" fill="#ff0066" opacity="0.5"/>
  <path d="M176,256 L172,256 L172,263 L166,263" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="166" cy="263" r="1" fill="#ff0066" opacity="0.5"/>
  <path d="M67,271 L72,271 L72,276 L77,276 L77,284" fill="none" stroke="#ff0066" stroke-width="0.4" opacity="0.3"/>
  <rect x="75" y="284" width="4" height="2" fill="#ff0066" opacity="0.3"/>

  <!-- Jacket seam lines -->
  <path d="M91,244 Q101,279 106,340" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.6"/>
  <path d="M165,244 Q155,279 150,340" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.6"/>

  <!-- === HAND raised near mouth - frightened gesture === -->
  <!-- Forearm/sleeve coming up from right side -->
  <path d="M156,232 Q168,222 174,208 Q177,198 175,190" fill="url(#jacketGrad)" stroke="#2a2a4e" stroke-width="0.5"/>
  <!-- Hand shape - fingers spread near mouth -->
  <path d="M168,194 Q165,187 163,182 Q162,178 165,176 Q168,175 170,178 L172,182 Q173,178 175,175 Q177,173 179,175 Q181,177 180,182 L179,186 Q181,182 183,180 Q185,179 187,181 Q188,183 186,188 L183,194 Q185,192 187,191 Q189,190 190,193 Q190,196 187,200 Q182,208 176,212 Q170,216 165,214 Q162,212 163,207 Q164,202 168,194 Z" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.3"/>
  <!-- Fingernails -->
  <path d="M164,177 Q165,174 167,175" fill="none" stroke="#ddb8a0" stroke-width="0.3" opacity="0.5"/>
  <path d="M176,176 Q177,173 179,174" fill="none" stroke="#ddb8a0" stroke-width="0.3" opacity="0.5"/>
  <path d="M184,180 Q185,178 186,180" fill="none" stroke="#ddb8a0" stroke-width="0.3" opacity="0.5"/>
  <!-- Finger joint creases -->
  <path d="M170,180 L171,179" fill="none" stroke="#d4a878" stroke-width="0.3" opacity="0.3"/>
  <path d="M179,184 L180,183" fill="none" stroke="#d4a878" stroke-width="0.3" opacity="0.3"/>

  <!-- Inner shirt neckline -->
  <path d="M113,226 Q120,235 128,238 Q136,235 143,226" fill="none" stroke="#333355" stroke-width="1"/>

  <!-- Neck - very tense, tendons visible -->
  <path d="M118,218 Q118,200 120,192 L136,192 Q138,200 138,218" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.3"/>
  <line x1="121" y1="196" x2="120" y2="214" stroke="#d4a878" stroke-width="0.4" opacity="0.35"/>
  <line x1="135" y1="196" x2="136" y2="214" stroke="#d4a878" stroke-width="0.4" opacity="0.35"/>
  <path d="M124,200 Q128,204 132,200" fill="none" stroke="#d4a878" stroke-width="0.3" opacity="0.2"/>

  <!-- === HAIR (back layer) === -->
  <path d="M75,130 Q65,180 55,260 Q50,300 52,350 Q53,363 58,363 Q65,340 68,280 Q72,220 80,170 Z" fill="url(#hairGrad)"/>
  <path d="M181,130 Q191,180 201,260 Q206,300 204,350 Q203,363 198,363 Q191,340 188,280 Q184,220 176,170 Z" fill="url(#hairGrad)"/>
  <path d="M70,140 Q60,190 52,250 Q48,290 48,340 Q47,355 52,358 Q56,340 58,290 Q62,230 72,170 Z" fill="#0d0a15" opacity="0.6"/>
  <path d="M186,140 Q196,190 204,250 Q208,290 208,340 Q209,355 204,358 Q200,340 198,290 Q194,230 184,170 Z" fill="#0d0a15" opacity="0.6"/>

  <!-- Purple highlights in back hair -->
  <path d="M60,200 Q58,250 55,300" fill="none" stroke="#6b2fa0" stroke-width="1.5" opacity="0.3"/>
  <path d="M196,200 Q198,250 201,300" fill="none" stroke="#6b2fa0" stroke-width="1.5" opacity="0.3"/>
  <path d="M55,230 Q54,270 53,320" fill="none" stroke="#5a1f90" stroke-width="1" opacity="0.2"/>

  <!-- === HEAD === -->
  <ellipse cx="128" cy="145" rx="42" ry="52" fill="url(#skinGrad)"/>
  <path d="M86,145 Q88,175 105,192 Q118,200 128,202 Q138,200 151,192 Q168,175 170,145" fill="url(#skinGrad)"/>
  <!-- Pallor from fear - slightly paler around mouth/face -->
  <ellipse cx="128" cy="165" rx="18" ry="8" fill="#f5e0cc" opacity="0.15"/>
  <ellipse cx="128" cy="195" rx="8" ry="3" fill="#f5dcc5" opacity="0.2"/>
  <!-- Cheek contour -->
  <path d="M90,155 Q95,170 105,180" fill="none" stroke="#d4a878" stroke-width="0.8" opacity="0.15"/>
  <path d="M166,155 Q161,170 151,180" fill="none" stroke="#d4a878" stroke-width="0.8" opacity="0.15"/>

  <!-- === HAIR (front layer) === -->
  <path d="M75,130 Q72,100 80,80 Q90,60 110,52 Q125,48 128,48 Q131,48 146,52 Q166,60 176,80 Q184,100 181,130 Q178,115 170,105 Q160,95 145,90 Q128,87 111,90 Q96,95 86,105 Q78,115 75,130 Z" fill="url(#hairGrad)"/>

  <path d="M100,62 Q115,55 128,53 Q141,55 156,62" fill="none" stroke="#2a1838" stroke-width="2" opacity="0.4"/>

  <!-- Hair bangs - slightly disheveled from recoiling -->
  <path d="M86,112 Q91,84 108,71 Q115,67 120,74 Q109,89 104,112 Z" fill="#0d0a15"/>
  <path d="M103,107 Q109,77 125,64 Q130,62 133,69 Q124,81 119,107 Z" fill="#12101e"/>
  <path d="M119,103 Q127,74 140,67 Q145,66 146,71 Q139,84 134,106 Z" fill="#0d0a15"/>
  <path d="M136,110 Q147,83 161,77 Q166,77 165,83 Q156,94 149,113 Z" fill="#12101e"/>
  <path d="M93,110 Q99,88 112,75 Q116,72 118,77 Q111,91 106,110 Z" fill="#15102a" opacity="0.7"/>
  <path d="M128,105 Q135,79 148,71 Q152,70 152,75 Q145,87 139,108 Z" fill="#15102a" opacity="0.7"/>

  <!-- Purple highlights -->
  <path d="M95,90 Q100,110 102,130" fill="none" stroke="#6b2fa0" stroke-width="1.2" opacity="0.4"/>
  <path d="M155,88 Q158,108 160,128" fill="none" stroke="#6b2fa0" stroke-width="1.2" opacity="0.4"/>
  <path d="M112,73 Q115,93 116,113" fill="none" stroke="#5a1f90" stroke-width="0.8" opacity="0.3"/>
  <path d="M140,71 Q142,91 143,111" fill="none" stroke="#5a1f90" stroke-width="0.8" opacity="0.3"/>
  <path d="M103,82 Q106,100 107,120" fill="none" stroke="#7b3fb0" stroke-width="0.6" opacity="0.25"/>

  <!-- Side hair strands -->
  <path d="M80,125 Q75,160 70,210 Q68,240 70,263" fill="url(#hairGrad)" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M176,125 Q181,160 186,210 Q188,240 186,263" fill="url(#hairGrad)" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M83,130 Q80,165 77,210 Q76,235 77,255" fill="#12101e" opacity="0.5"/>
  <path d="M173,130 Q176,165 179,210 Q180,235 179,255" fill="#12101e" opacity="0.5"/>

  <!-- === FACIAL FEATURES - FRIGHTENED === -->

  <!-- Eyebrows - raised high, arched in fear -->
  <path d="M97,115 Q105,111 114,113 Q118,114 121,116" fill="none" stroke="#1a1020" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M135,116 Q138,114 142,113 Q151,111 159,115" fill="none" stroke="#1a1020" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Brow thickness -->
  <path d="M99,114 Q106,110.5 113,112.5" fill="none" stroke="#1a1020" stroke-width="1" opacity="0.3"/>
  <path d="M143,112.5 Q150,110.5 157,114" fill="none" stroke="#1a1020" stroke-width="1" opacity="0.3"/>

  <!-- Forehead creases from raised brows -->
  <path d="M106,105 Q111,102 116,105" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.4"/>
  <path d="M140,105 Q145,102 150,105" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.4"/>
  <path d="M118,101 Q123,99 128,101" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>
  <path d="M112,108 Q117,106 122,108" fill="none" stroke="#d4a878" stroke-width="0.3" opacity="0.2"/>

  <!-- Eyes - WIDE OPEN in fear, showing whites all around -->
  <!-- Left eye - extra wide -->
  <path d="M97,131 Q110,120 125,131 Q110,142 97,131 Z" fill="white" stroke="#2a2035" stroke-width="0.5"/>
  <ellipse cx="111" cy="130" rx="5.5" ry="5.5" fill="url(#irisGrad)"/>
  <circle cx="111" cy="130" r="3.5" fill="#1a0a0a"/>
  <!-- Contracted pupil (fear response) -->
  <circle cx="111" cy="130" r="2" fill="#000000"/>
  <circle cx="109" cy="128" r="1.4" fill="white" opacity="0.95"/>
  <!-- Second catchlight for intensity -->
  <circle cx="113" cy="132" r="0.6" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease very visible -->
  <path d="M98,126 Q110,118 124,126" fill="none" stroke="#c4a090" stroke-width="0.6" opacity="0.5"/>
  <!-- Eyelashes -->
  <path d="M97,131 Q95,127 93,126" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M125,131 Q127,127 128,125" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M99,128 Q97,126 96,125" fill="none" stroke="#1a1020" stroke-width="0.5"/>
  <!-- Upper eyelid line -->
  <path d="M97,131 Q110,120 125,131" fill="none" stroke="#1a1020" stroke-width="1.5"/>
  <!-- Lower lid - tense -->
  <path d="M99,134 Q110,138 123,134" fill="none" stroke="#2a2035" stroke-width="0.4" opacity="0.4"/>

  <!-- Right eye - extra wide -->
  <path d="M131,131 Q146,120 159,131 Q146,142 131,131 Z" fill="white" stroke="#2a2035" stroke-width="0.5"/>
  <ellipse cx="145" cy="130" rx="5.5" ry="5.5" fill="url(#irisGrad)"/>
  <circle cx="145" cy="130" r="3.5" fill="#1a0a0a"/>
  <!-- Contracted pupil -->
  <circle cx="145" cy="130" r="2" fill="#000000"/>
  <circle cx="143" cy="128" r="1.4" fill="white" opacity="0.95"/>
  <circle cx="147" cy="132" r="0.6" fill="white" opacity="0.5"/>
  <!-- Upper eyelid crease -->
  <path d="M132,126 Q146,118 158,126" fill="none" stroke="#c4a090" stroke-width="0.6" opacity="0.5"/>
  <!-- Eyelashes -->
  <path d="M131,131 Q129,127 128,126" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M159,131 Q161,127 163,126" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <path d="M157,128 Q159,126 160,125" fill="none" stroke="#1a1020" stroke-width="0.5"/>
  <!-- Upper eyelid line -->
  <path d="M131,131 Q146,120 159,131" fill="none" stroke="#1a1020" stroke-width="1.5"/>
  <!-- Lower lid -->
  <path d="M133,134 Q146,138 157,134" fill="none" stroke="#2a2035" stroke-width="0.4" opacity="0.4"/>

  <!-- Nose - flared slightly from rapid breathing -->
  <path d="M126,142 Q128,150 125,155" fill="none" stroke="#d4a878" stroke-width="1" opacity="0.6"/>
  <path d="M121,157 Q128,159 135,157" fill="none" stroke="#d4a878" stroke-width="0.9" opacity="0.5"/>
  <line x1="127" y1="138" x2="127" y2="148" stroke="#f5dcc5" stroke-width="0.8" opacity="0.2"/>

  <!-- Mouth - open in gasp, frightened -->
  <path d="M116,168 Q122,165 128,165 Q134,165 140,168" fill="none" stroke="#c47070" stroke-width="1.2"/>
  <ellipse cx="128" cy="174" rx="10" ry="7" fill="#2a0a0a" stroke="#b06060" stroke-width="0.8"/>
  <!-- Teeth hint at top of mouth -->
  <path d="M120,170 L136,170" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <!-- Upper lip -->
  <path d="M120,167 Q124,164 128,165 Q132,164 136,167" fill="#c47070" opacity="0.3"/>
  <!-- Inner mouth shadow -->
  <ellipse cx="128" cy="176" rx="7" ry="4" fill="#150505" opacity="0.5"/>

  <!-- Blush fading from fear (paler) -->
  <ellipse cx="100" cy="148" rx="10" ry="5" fill="#ff6688" opacity="0.04"/>
  <ellipse cx="156" cy="148" rx="10" ry="5" fill="#ff6688" opacity="0.04"/>

  <!-- Ears -->
  <path d="M84,130 Q78,130 76,140 Q75,150 80,155" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.5"/>
  <path d="M79,135 Q77,140 78,148" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.4"/>
  <path d="M172,130 Q178,130 180,140 Q181,150 176,155" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.5"/>
  <path d="M177,135 Q179,140 178,148" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.4"/>

  <!-- === TECH EARRING - rapid pulse effect === -->
  <circle cx="180" cy="150" r="4" fill="none" stroke="#ff0066" stroke-width="1.2" filter="url(#neonGlow)" opacity="0.9"/>
  <circle cx="180" cy="150" r="2" fill="#ff0066" opacity="0.8"/>
  <circle cx="180" cy="150" r="10" fill="url(#earringGlow)" opacity="0.5"/>
  <line x1="180" y1="154" x2="180" y2="162" stroke="#ff0066" stroke-width="0.8" opacity="0.8"/>
  <path d="M177,162 L180,168 L183,162 Z" fill="#ff0066" opacity="0.6" filter="url(#neonGlow)"/>
  <circle cx="180" cy="150" r="1.2" fill="#ff99bb" opacity="0.9"/>

  <!-- === AMBIENT EFFECTS === -->
  <line x1="0" y1="100" x2="256" y2="100" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>

  <!-- Distress glitch lines -->
  <line x1="20" y1="138" x2="35" y2="138" stroke="#ff0044" stroke-width="0.8" opacity="0.2"/>
  <line x1="222" y1="142" x2="240" y2="142" stroke="#ff0044" stroke-width="0.6" opacity="0.2"/>
  <line x1="15" y1="170" x2="28" y2="170" stroke="#ff0044" stroke-width="0.5" opacity="0.15"/>
  <line x1="230" y1="125" x2="242" y2="125" stroke="#ff0044" stroke-width="0.5" opacity="0.15"/>
  <line x1="10" y1="155" x2="22" y2="155" stroke="#ff0044" stroke-width="0.4" opacity="0.12"/>

  <!-- Corner accents -->
  <path d="M10,10 L30,10 M10,10 L10,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,10 L226,10 M246,10 L246,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M10,374 L30,374 M10,374 L10,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,374 L226,374 M246,374 L246,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#ff0066" text-anchor="middle" opacity="0.5">[FRIGHTENED]</text>
</svg>