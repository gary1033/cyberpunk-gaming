  <ellipse cx="156" cy="155" rx="12" ry="4" fill="#ff6688" opacity="0.06"/>

  <!-- === HAIR (front layer) === -->
  <path d="M75,125 Q72,100 80,78 Q90,58 110,50 Q125,45 128,45 Q131,45 146,50 Q166,58 176,78 Q184,100 181,125 Q178,110 170,100 Q158,90 145,86 Q128,83 111,86 Q98,90 86,100 Q78,110 75,125 Z" fill="#0d0a15"/>

  <!-- Hair shine band -->
  <path d="M100,72 Q112,62 128,58 Q144,62 156,72 Q148,64 138,59 Q128,56 118,59 Q108,64 100,72 Z" fill="white" opacity="0.4"/>

