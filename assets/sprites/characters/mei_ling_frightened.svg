  <path d="M84,117 Q89,82 108,67 Q116,62 122,71 Q111,87 104,117 Z" fill="#0d0a15"/>
  <path d="M100,112 Q107,74 126,61 Q132,57 136,65 Q125,79 118,112 Z" fill="#12101e"/>
  <path d="M116,109 Q125,72 142,63 Q148,61 150,67 Q141,81 134,109 Z" fill="#0d0a15"/>
  <path d="M133,114 Q145,81 163,74 Q169,73 168,80 Q159,93 151,116 Z" fill="#12101e"/>
  <path d="M91,114 Q97,85 113,72 Q118,68 120,74 Q112,89 106,114 Z" fill="#15102a" opacity="0.6"/>
  <path d="M126,108 Q134,77 150,68 Q155,66 155,72 Q147,86 140,110 Z" fill="#15102a" opacity="0.6"/>

  <!-- Purple highlights -->
  <path d="M92,88 Q96,108 98,130" fill="none" stroke="#6b2fa0" stroke-width="2.5" opacity="0.4"/>
  <path d="M157,86 Q160,106 162,128" fill="none" stroke="#6b2fa0" stroke-width="2.5" opacity="0.4"/>
  <path d="M110,72 Q113,92 114,112" fill="none" stroke="#5a1f90" stroke-width="1.8" opacity="0.35"/>
  <path d="M142,70 Q144,90 145,110" fill="none" stroke="#5a1f90" stroke-width="1.8" opacity="0.35"/>

  <!-- Side hair strands -->
  <path d="M78,120 Q72,160 66,215 Q64,245 66,275" fill="#0d0a15" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M178,120 Q184,160 190,215 Q192,245 190,275" fill="#0d0a15" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M82,125 Q78,165 74,215 Q73,240 74,265" fill="#12101e" opacity="0.5"/>
  <path d="M174,125 Q178,165 182,215 Q183,240 182,265" fill="#12101e" opacity="0.5"/>

  <!-- === EYES - FRIGHTENED: very wide, brows high, bigger iris area === -->

  <!-- Left eye - extra wide open -->
  <!-- Thick upper eyelid - very high arc -->
  <path d="M94,131 Q103,121 111,120 Q119,121 126,131" fill="none" stroke="#1a1020" stroke-width="4" stroke-linecap="round"/>
  <!-- Eye white - much wider -->
  <path d="M95,132 Q103,122 111,121 Q119,122 125,132 Q119,141 111,142 Q103,141 95,132 Z" fill="white"/>
  <!-- Iris - slightly larger area visible -->
  <clipPath id="eyeClipL"><path d="M95,132 Q103,122 111,121 Q119,122 125,132 Q119,141 111,142 Q103,141 95,132 Z"/></clipPath>
  <circle cx="111" cy="131" r="13" fill="url(#irisGradL)" clip-path="url(#eyeClipL)"/>
  <circle cx="111" cy="131" r="12" fill="none" stroke="#2a1510" stroke-width="0.8" clip-path="url(#eyeClipL)"/>
  <!-- Radial lines -->
  <line x1="111" y1="120" x2="111" y2="124" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <line x1="118" y1="122" x2="116" y2="125" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <line x1="104" y1="122" x2="106" y2="125" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <line x1="122" y1="128" x2="119" y2="129" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <line x1="100" y1="128" x2="103" y2="129" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <!-- Pupil - contracted (fear response) -->
  <circle cx="111" cy="131" r="5.5" fill="#0a0505" clip-path="url(#eyeClipL)"/>
  <circle cx="111" cy="131" r="3" fill="#000000" clip-path="url(#eyeClipL)"/>
  <!-- Highlights - intense -->
  <circle cx="107" cy="127" r="4.5" fill="white" opacity="0.95" clip-path="url(#eyeClipL)"/>
  <circle cx="115" cy="135" r="2.5" fill="white" opacity="0.55" clip-path="url(#eyeClipL)"/>
  <circle cx="109" cy="136" r="1" fill="white" opacity="0.3" clip-path="url(#eyeClipL)"/>
  <!-- Eyelash flicks -->
  <path d="M94,132 Q91,127 89,125" fill="none" stroke="#1a1020" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M95,129 Q93,127 91,126" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <!-- Lower lid - tense -->
  <path d="M97,135 Q111,141 123,135" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.5"/>

  <!-- Right eye - extra wide open -->
  <path d="M130,131 Q139,121 147,120 Q155,121 162,131" fill="none" stroke="#1a1020" stroke-width="4" stroke-linecap="round"/>
  <path d="M131,132 Q139,122 147,121 Q155,122 161,132 Q155,141 147,142 Q139,141 131,132 Z" fill="white"/>
  <clipPath id="eyeClipR"><path d="M131,132 Q139,122 147,121 Q155,122 161,132 Q155,141 147,142 Q139,141 131,132 Z"/></clipPath>
  <circle cx="147" cy="131" r="13" fill="url(#irisGradR)" clip-path="url(#eyeClipR)"/>
  <circle cx="147" cy="131" r="12" fill="none" stroke="#2a1510" stroke-width="0.8" clip-path="url(#eyeClipR)"/>
  <line x1="147" y1="120" x2="147" y2="124" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <line x1="154" y1="122" x2="152" y2="125" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <line x1="140" y1="122" x2="142" y2="125" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <line x1="158" y1="128" x2="155" y2="129" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <line x1="136" y1="128" x2="139" y2="129" stroke="#1a0a05" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <!-- Pupil - contracted -->
  <circle cx="147" cy="131" r="5.5" fill="#0a0505" clip-path="url(#eyeClipR)"/>
  <circle cx="147" cy="131" r="3" fill="#000000" clip-path="url(#eyeClipR)"/>
  <!-- Highlights -->
  <circle cx="143" cy="127" r="4.5" fill="white" opacity="0.95" clip-path="url(#eyeClipR)"/>
  <circle cx="151" cy="135" r="2.5" fill="white" opacity="0.55" clip-path="url(#eyeClipR)"/>
  <circle cx="145" cy="136" r="1" fill="white" opacity="0.3" clip-path="url(#eyeClipR)"/>
  <!-- Eyelash flicks -->
  <path d="M162,132 Q165,127 167,125" fill="none" stroke="#1a1020" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M161,129 Q163,127 165,126" fill="none" stroke="#1a1020" stroke-width="0.8"/>
  <!-- Lower lid -->
  <path d="M133,135 Q147,141 159,135" fill="none" stroke="#2a2035" stroke-width="0.5" opacity="0.5"/>

  <!-- Eyebrows - raised high, arched in fear -->
  <path d="M95,114 Q104,109 114,111 Q119,112 122,115" fill="none" stroke="#1a1020" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M134,115 Q137,112 142,111 Q152,109 161,114" fill="none" stroke="#1a1020" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Forehead creases -->
  <path d="M106,103 Q111,100 116,103" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.4"/>
  <path d="M140,103 Q145,100 150,103" fill="none" stroke="#d4a878" stroke-width="0.5" opacity="0.4"/>
  <path d="M118,99 Q123,97 128,99" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>

  <!-- Nose -->
  <path d="M127,150 L126,157 Q128,159 130,157" fill="none" stroke="#d4a878" stroke-width="1" opacity="0.6"/>

  <!-- Mouth - open in gasp -->
  <path d="M118,170 Q123,167 128,167 Q133,167 138,170" fill="none" stroke="#c47070" stroke-width="1.2"/>
  <ellipse cx="128" cy="176" rx="9" ry="6" fill="#2a0a0a" stroke="#b06060" stroke-width="0.8"/>
  <!-- Teeth hint -->
  <path d="M121,172 L135,172" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <!-- Inner mouth shadow -->
  <ellipse cx="128" cy="178" rx="6" ry="3.5" fill="#150505" opacity="0.5"/>

  <!-- Ears -->
  <path d="M84,130 Q78,130 76,140 Q75,150 80,155" fill="#f0d5b8" stroke="#d4a878" stroke-width="0.5"/>
  <path d="M172,130 Q178,130 180,140 Q181,150 176,155" fill="#f0d5b8" stroke="#d4a878" stroke-width="0.5"/>

  <!-- === TECH EARRING - rapid pulse === -->
  <circle cx="180" cy="150" r="4" fill="none" stroke="#ff0066" stroke-width="1.2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="180" cy="150" r="2" fill="#ff0066" opacity="0.8"/>
  <circle cx="180" cy="150" r="10" fill="url(#earringGlow)" opacity="0.5"/>
  <line x1="180" y1="154" x2="180" y2="162" stroke="#ff0066" stroke-width="0.8" opacity="0.8"/>
  <path d="M177,162 L180,168 L183,162 Z" fill="#ff0066" opacity="0.6" filter="url(#glow)"/>
  <circle cx="180" cy="150" r="1.2" fill="#ff99bb" opacity="0.9"/>

  <!-- === AMBIENT EFFECTS === -->
  <line x1="0" y1="100" x2="256" y2="100" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>

  <!-- Distress glitch lines -->
  <line x1="20" y1="138" x2="35" y2="138" stroke="#ff0044" stroke-width="0.8" opacity="0.2"/>
  <line x1="222" y1="142" x2="240" y2="142" stroke="#ff0044" stroke-width="0.6" opacity="0.2"/>
  <line x1="15" y1="170" x2="28" y2="170" stroke="#ff0044" stroke-width="0.5" opacity="0.15"/>
  <line x1="230" y1="125" x2="242" y2="125" stroke="#ff0044" stroke-width="0.5" opacity="0.15"/>
  <line x1="10" y1="155" x2="22" y2="155" stroke="#ff0044" stroke-width="0.4" opacity="0.12"/>

  <!-- Corner accents -->
  <path d="M10,10 L30,10 M10,10 L10,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,10 L226,10 M246,10 L246,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M10,374 L30,374 M10,374 L10,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,374 L226,374 M246,374 L246,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="monospace" font-size="10" fill="#ff0066" text-anchor="middle" opacity="0.5">[FRIGHTENED]</text>
</svg>