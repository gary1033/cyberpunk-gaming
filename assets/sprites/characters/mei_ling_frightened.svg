<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edd4b8"/>
      <stop offset="50%" stop-color="#e8ccb0"/>
      <stop offset="100%" stop-color="#e0bf9a"/>
    </linearGradient>
    <linearGradient id="skinPale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0dcc6"/>
      <stop offset="100%" stop-color="#e8d0b4"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="40%" stop-color="#0d0a15"/>
      <stop offset="70%" stop-color="#1a0d28"/>
      <stop offset="100%" stop-color="#0d0a15"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#141424"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
    <radialGradient id="earringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fearAura" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="trembleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bgGrad)"/>
  <rect width="256" height="384" fill="url(#fearAura)"/>

  <!-- Ambient neon light - tense, unsettling -->
  <ellipse cx="0" cy="200" rx="80" ry="200" fill="#ff0033" opacity="0.04"/>
  <ellipse cx="256" cy="180" rx="60" ry="180" fill="#6600ff" opacity="0.04"/>

  <!-- Border frame -->
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff0066" stroke-width="1.5" opacity="0.5"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.2"/>
  <!-- Glitch offset on frame -->
  <rect x="5" y="148" width="246" height="3" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.15"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="16" fill="#ff0066" text-anchor="middle" filter="url(#neonGlow)" opacity="0.95">美玲</text>
  <text x="128" y="28" font-family="monospace" font-size="16" fill="#ff0066" text-anchor="middle">美玲</text>
  <line x1="40" y1="35" x2="216" y2="35" stroke="#ff0066" stroke-width="0.5" opacity="0.3"/>

  <!-- === BODY / JACKET === -->
  <!-- Shoulders hunched, defensive, pulled back posture -->
  <path d="M52,320 Q62,260 86,240 Q100,232 115,228 L128,225 L141,228 Q156,232 170,240 Q194,260 204,320 L204,390 L52,390 Z" fill="url(#jacketGrad)" stroke="#2a2a4e" stroke-width="0.5"/>

  <!-- Jacket lapels -->
  <path d="M115,228 L108,270 L128,300 L128,225 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>
  <path d="M141,228 L148,270 L128,300 L128,225 Z" fill="#222240" stroke="#ff0066" stroke-width="0.3" opacity="0.8"/>
  <!-- Lapel fold details -->
  <path d="M112,240 Q110,258 112,272" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.4"/>
  <path d="M144,240 Q146,258 144,272" fill="none" stroke="#2a2a4e" stroke-width="0.5" opacity="0.4"/>

  <!-- Jacket collar -->
  <path d="M106,232 Q110,220 120,218 L128,225 L115,228 Z" fill="#1e1e35"/>
  <path d="M150,232 Q146,220 136,218 L128,225 L141,228 Z" fill="#1e1e35"/>

  <!-- Tech stripes on jacket -->
  <line x1="72" y1="258" x2="72" y2="340" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <line x1="184" y1="258" x2="184" y2="340" stroke="#ff0066" stroke-width="1" opacity="0.4"/>
  <path d="M78,256 L82,256 L82,264 L88,264" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.5"/>
  <circle cx="88" cy="264" r="1" fill="#ff0066" opacity="0.5"/>
  <path d="M178,260 L174,260 L174,268 L168,268" fill="none" stroke="#ff0066" stroke-width="0.5" opacity="0.4"/>
  <circle cx="168" cy="268" r="1" fill="#ff0066" opacity="0.4"/>

  <!-- Hand raised near mouth (right hand) - frightened gesture -->
  <!-- Forearm coming up -->
  <path d="M156,232 Q168,222 174,208 Q178,198 176,190" fill="url(#jacketGrad)" stroke="#2a2a4e" stroke-width="0.5"/>
  <!-- Hand with fingers spread near face -->
  <path d="M168,194 Q165,186 163,180 Q162,176 165,174 Q168,173 170,176 L172,182 Q173,177 175,174 Q177,172 179,174 Q181,176 180,182 L179,186 Q181,182 183,180 Q185,178 187,180 Q188,183 186,188 L183,194 Q185,192 187,190 Q189,189 190,192 Q190,195 187,200 Q182,208 176,212 Q170,216 165,214 Q162,212 163,206 Q164,200 168,194 Z" fill="url(#skinPale)" stroke="#d4a878" stroke-width="0.4"/>
  <!-- Fingernails -->
  <path d="M164,175 Q165,172 167,173" fill="none" stroke="#ddb8a0" stroke-width="0.4" opacity="0.5"/>
  <path d="M176,175 Q177,172 179,173" fill="none" stroke="#ddb8a0" stroke-width="0.4" opacity="0.5"/>
  <path d="M184,179 Q185,177 187,179" fill="none" stroke="#ddb8a0" stroke-width="0.3" opacity="0.4"/>
  <!-- Knuckle details -->
  <circle cx="170" cy="180" r="0.6" fill="#d4a878" opacity="0.3"/>
  <circle cx="178" cy="178" r="0.6" fill="#d4a878" opacity="0.3"/>

  <!-- Inner shirt neckline -->
  <path d="M113,226 Q120,235 128,238 Q136,235 143,226" fill="none" stroke="#333355" stroke-width="1"/>

  <!-- Neck - tense, tendons visible -->
  <path d="M118,218 Q118,200 120,192 L136,192 Q138,200 138,218" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.3"/>
  <line x1="121" y1="196" x2="120" y2="214" stroke="#d4a878" stroke-width="0.4" opacity="0.35"/>
  <line x1="135" y1="196" x2="136" y2="214" stroke="#d4a878" stroke-width="0.4" opacity="0.35"/>
  <!-- Throat hollow -->
  <path d="M126,200 Q128,204 130,200" fill="none" stroke="#d4a878" stroke-width="0.3" opacity="0.25"/>

  <!-- === HAIR (back layer) - flowing behind === -->
  <path d="M74,130 Q64,180 54,262 Q49,302 51,352 Q52,362 57,362 Q64,342 67,282 Q71,222 79,172 Z" fill="url(#hairGrad)"/>
  <path d="M182,130 Q192,180 202,262 Q207,302 205,352 Q204,362 199,362 Q192,342 189,282 Q185,222 177,172 Z" fill="url(#hairGrad)"/>
  <!-- Purple highlights in back hair -->
  <path d="M59,202 Q57,252 54,302" fill="none" stroke="#6b2fa0" stroke-width="1.8" opacity="0.3"/>
  <path d="M197,202 Q199,252 202,302" fill="none" stroke="#6b2fa0" stroke-width="1.8" opacity="0.3"/>
  <!-- Hair strand details -->
  <path d="M62,220 Q60,260 58,310" fill="none" stroke="#2a1840" stroke-width="0.8" opacity="0.3"/>
  <path d="M194,220 Q196,260 198,310" fill="none" stroke="#2a1840" stroke-width="0.8" opacity="0.3"/>

  <!-- === HEAD - pulled back slightly === -->
  <ellipse cx="128" cy="145" rx="43" ry="53" fill="url(#skinPale)"/>
  <path d="M85,145 Q87,176 104,194 Q118,202 128,204 Q138,202 152,194 Q169,176 171,145" fill="url(#skinPale)"/>

  <!-- Pallor overlay - paler from fright -->
  <ellipse cx="128" cy="145" rx="40" ry="50" fill="#f0e0d0" opacity="0.12"/>

  <!-- === HAIR (front layer) === -->
  <path d="M74,130 Q71,100 79,80 Q89,60 109,52 Q124,48 128,48 Q132,48 147,52 Q167,60 177,80 Q185,100 182,130 Q179,115 171,105 Q161,95 146,90 Q128,87 110,90 Q95,95 85,105 Q77,115 74,130 Z" fill="url(#hairGrad)"/>

  <!-- Hair bangs - slightly disheveled from being startled -->
  <path d="M85,112 Q90,84 107,71 Q114,67 119,74 Q108,89 103,112 Z" fill="#0d0a15"/>
  <path d="M102,107 Q108,77 124,64 Q129,62 132,69 Q123,81 118,107 Z" fill="#12101e"/>
  <path d="M118,103 Q126,74 139,67 Q144,66 145,71 Q138,84 133,106 Z" fill="#0d0a15"/>
  <path d="M135,110 Q146,83 160,77 Q165,77 164,83 Q155,94 148,113 Z" fill="#12101e"/>
  <!-- Stray bang strands from startled movement -->
  <path d="M95,100 Q92,90 94,82" fill="none" stroke="#1a1025" stroke-width="1" opacity="0.5"/>
  <path d="M162,98 Q165,88 163,80" fill="none" stroke="#1a1025" stroke-width="0.8" opacity="0.4"/>

  <!-- Purple highlights -->
  <path d="M94,90 Q99,110 101,130" fill="none" stroke="#6b2fa0" stroke-width="1.4" opacity="0.45"/>
  <path d="M156,88 Q159,108 161,128" fill="none" stroke="#6b2fa0" stroke-width="1.4" opacity="0.45"/>
  <!-- Additional purple streaks -->
  <path d="M104,80 Q106,100 105,118" fill="none" stroke="#5520880" stroke-width="0.8" opacity="0.25"/>
  <path d="M150,78 Q152,98 153,116" fill="none" stroke="#552088" stroke-width="0.8" opacity="0.25"/>

  <!-- Side hair -->
  <path d="M79,125 Q74,162 69,212 Q67,242 69,262" fill="url(#hairGrad)" stroke="#1a0d28" stroke-width="0.5"/>
  <path d="M177,125 Q182,162 187,212 Q189,242 187,262" fill="url(#hairGrad)" stroke="#1a0d28" stroke-width="0.5"/>

  <!-- === FACIAL FEATURES - FRIGHTENED === -->

  <!-- Eyebrows - raised very high, arched in fear -->
  <path d="M96,114 Q104,108 114,112 Q118,113 121,115" fill="none" stroke="#1a1020" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M135,115 Q138,113 142,112 Q152,108 160,114" fill="none" stroke="#1a1020" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Forehead creases from raised brows -->
  <path d="M104,104 Q110,100 116,104" fill="none" stroke="#d4a878" stroke-width="0.6" opacity="0.45"/>
  <path d="M140,104 Q146,100 152,104" fill="none" stroke="#d4a878" stroke-width="0.6" opacity="0.45"/>
  <path d="M116,100 Q122,97 128,100" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>

  <!-- Eyes - WIDE OPEN in terror, showing whites all around, contracted pupils -->
  <!-- Left eye -->
  <path d="M96,132 Q110,120 126,132 Q110,144 96,132 Z" fill="white" stroke="#2a2035" stroke-width="0.6"/>
  <circle cx="111" cy="131" r="6" fill="#3a2520"/>
  <circle cx="111" cy="131" r="4" fill="#1a0a0a"/>
  <!-- Contracted pupil - fear response -->
  <circle cx="111" cy="131" r="2" fill="#000000"/>
  <!-- Bright fear-highlight -->
  <circle cx="109" cy="129" r="1.5" fill="white" opacity="0.95"/>
  <circle cx="113" cy="133" r="0.7" fill="white" opacity="0.5"/>
  <!-- Slight redness around eye from stress -->
  <path d="M96,132 Q110,120 126,132" fill="none" stroke="#cc6666" stroke-width="0.4" opacity="0.2"/>
  <!-- Upper eyelid line -->
  <path d="M96,132 Q110,119 126,132" fill="none" stroke="#1a1020" stroke-width="1.6"/>
  <!-- Lower eyelid tension -->
  <path d="M98,134 Q110,142 124,134" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>
  <!-- Inner corner detail -->
  <path d="M96,132 Q94,128 92,127" fill="none" stroke="#1a1020" stroke-width="0.8"/>

  <!-- Right eye -->
  <path d="M130,132 Q146,120 160,132 Q146,144 130,132 Z" fill="white" stroke="#2a2035" stroke-width="0.6"/>
  <circle cx="145" cy="131" r="6" fill="#3a2520"/>
  <circle cx="145" cy="131" r="4" fill="#1a0a0a"/>
  <circle cx="145" cy="131" r="2" fill="#000000"/>
  <circle cx="143" cy="129" r="1.5" fill="white" opacity="0.95"/>
  <circle cx="147" cy="133" r="0.7" fill="white" opacity="0.5"/>
  <path d="M130,132 Q146,120 160,132" fill="none" stroke="#cc6666" stroke-width="0.4" opacity="0.2"/>
  <path d="M130,132 Q146,119 160,132" fill="none" stroke="#1a1020" stroke-width="1.6"/>
  <path d="M132,134 Q146,142 158,134" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>
  <path d="M160,132 Q162,128 164,127" fill="none" stroke="#1a1020" stroke-width="0.8"/>

  <!-- Nose - slightly flared -->
  <path d="M126,142 Q128,150 125,156" fill="none" stroke="#d4a878" stroke-width="1" opacity="0.6"/>
  <path d="M121,158 Q128,160 135,158" fill="none" stroke="#d4a878" stroke-width="0.9" opacity="0.5"/>
  <!-- Nostril flare detail -->
  <path d="M123,157 Q121,155 122,153" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>
  <path d="M133,157 Q135,155 134,153" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.3"/>

  <!-- Mouth - open in gasp, terrified -->
  <path d="M116,169 Q122,165 128,165 Q134,165 140,169" fill="none" stroke="#c47070" stroke-width="1.3"/>
  <ellipse cx="128" cy="175" rx="11" ry="8" fill="#2a0a0a" stroke="#b06060" stroke-width="0.8"/>
  <!-- Upper teeth hint -->
  <path d="M119,170 L137,170" fill="none" stroke="white" stroke-width="1.8" opacity="0.3"/>
  <!-- Upper lip -->
  <path d="M119,168 Q124,164 128,165 Q132,164 137,168" fill="#c47070" opacity="0.3"/>
  <!-- Lower lip trembling -->
  <path d="M120,180 Q128,184 136,180" fill="none" stroke="#b06060" stroke-width="0.6" opacity="0.4"/>
  <!-- Mouth interior shadow -->
  <ellipse cx="128" cy="175" rx="7" ry="4" fill="#1a0505" opacity="0.5"/>

  <!-- Pallor from fear - paler skin around mouth area -->
  <ellipse cx="128" cy="166" rx="20" ry="10" fill="#f5e0cc" opacity="0.15"/>

  <!-- Blush faded from fear (very pale) -->
  <ellipse cx="99" cy="148" rx="10" ry="5" fill="#ff6688" opacity="0.03"/>
  <ellipse cx="157" cy="148" rx="10" ry="5" fill="#ff6688" opacity="0.03"/>

  <!-- Ears -->
  <path d="M83,130 Q77,130 75,140 Q74,150 79,156" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.5"/>
  <path d="M173,130 Q179,130 181,140 Q182,150 177,156" fill="url(#skinGrad)" stroke="#d4a878" stroke-width="0.5"/>
  <!-- Inner ear detail -->
  <path d="M78,136 Q76,142 78,148" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.4"/>
  <path d="M178,136 Q180,142 178,148" fill="none" stroke="#d4a878" stroke-width="0.4" opacity="0.4"/>

  <!-- Tech earring - rapid flickering pulse from stress -->
  <circle cx="181" cy="150" r="4.5" fill="none" stroke="#ff0066" stroke-width="1.3" filter="url(#neonGlow)" opacity="0.9"/>
  <circle cx="181" cy="150" r="2.5" fill="#ff0066" opacity="0.8"/>
  <circle cx="181" cy="150" r="8" fill="url(#earringGlow)" opacity="0.6"/>
  <circle cx="181" cy="150" r="12" fill="url(#earringGlow)" opacity="0.2"/>
  <line x1="181" y1="155" x2="181" y2="163" stroke="#ff0066" stroke-width="0.8" opacity="0.8"/>
  <path d="M178,163 L181,170 L184,163 Z" fill="#ff0066" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- === AMBIENT EFFECTS === -->
  <!-- Scanlines -->
  <line x1="0" y1="100" x2="256" y2="100" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="200" x2="256" y2="200" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff0066" stroke-width="0.3" opacity="0.1"/>

  <!-- Distress glitch lines -->
  <line x1="18" y1="136" x2="36" y2="136" stroke="#ff0044" stroke-width="0.8" opacity="0.22"/>
  <line x1="220" y1="140" x2="242" y2="140" stroke="#ff0044" stroke-width="0.7" opacity="0.22"/>
  <line x1="14" y1="172" x2="30" y2="172" stroke="#ff0044" stroke-width="0.5" opacity="0.18"/>
  <line x1="228" y1="126" x2="244" y2="126" stroke="#ff0044" stroke-width="0.5" opacity="0.18"/>
  <line x1="10" y1="250" x2="24" y2="250" stroke="#ff0044" stroke-width="0.4" opacity="0.12"/>
  <line x1="232" y1="260" x2="248" y2="260" stroke="#ff0044" stroke-width="0.4" opacity="0.12"/>

  <!-- Corner accents -->
  <path d="M10,10 L30,10 M10,10 L10,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,10 L226,10 M246,10 L246,30" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M10,374 L30,374 M10,374 L10,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
  <path d="M246,374 L226,374 M246,374 L246,354" fill="none" stroke="#ff0066" stroke-width="1" opacity="0.5"/>
</svg>