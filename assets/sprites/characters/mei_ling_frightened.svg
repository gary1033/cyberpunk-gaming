  <ellipse cx="128" cy="165" rx="18" ry="8" fill="#f5e0cc" opacity="0.15"/>
  <path d="M90,170 Q100,185 115,195 Q122,199 128,203 Q118,200 108,192 Q95,180 90,170 Z" fill="#d4a878" opacity="0.3"/>
  <path d="M166,170 Q156,185 141,195 Q134,199 128,203 Q138,200 148,192 Q161,178 166,170 Z" fill="#d4a878" opacity="0.2"/>

