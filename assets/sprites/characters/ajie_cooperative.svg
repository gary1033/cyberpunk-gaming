<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0f00" />
      <stop offset="100%" stop-color="#0a0a1a" />
    </radialGradient>
    <filter id="neon_orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft_glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6a4a" />
      <stop offset="100%" stop-color="#6b5040" />
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0d0d1a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#neon_orange)">阿傑</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle">阿傑</text>

  <!-- Neck - relaxed -->
  <rect x="108" y="167" width="40" height="33" rx="4" fill="url(#skin_grad)"/>
  <line x1="118" y1="170" x2="118" y2="197" stroke="#7a5a3a" stroke-width="1" opacity="0.3"/>
  <line x1="138" y1="170" x2="138" y2="197" stroke="#7a5a3a" stroke-width="1" opacity="0.3"/>

  <!-- Body / Shoulders - relaxed, open posture -->
  <path d="M128,196 Q128,210 128,220 L128,384 L42,384 L42,262 Q42,224 82,214 Q108,204 128,196 Z" fill="url(#shirt_grad)"/>
  <path d="M128,196 Q128,210 128,220 L128,384 L214,384 L214,262 Q214,224 174,214 Q148,204 128,196 Z" fill="url(#shirt_grad)"/>

  <!-- Shoulders - relaxed, slightly dropped -->
  <path d="M82,214 Q62,219 47,239 Q42,249 42,262" fill="none" stroke="#2a2a4e" stroke-width="2"/>
  <path d="M174,214 Q194,219 209,239 Q214,249 214,262" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Arms - open posture, one resting, one gesturing openly -->
  <!-- Left arm relaxed at side -->
  <path d="M42,262 Q46,288 52,314 Q56,338 62,362" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="1"/>
  <!-- Left hand relaxed open -->
  <path d="M62,362 Q58,366 56,370 Q54,374 58,376 Q62,374 64,370 Q66,366 64,362" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>

  <!-- Right arm slightly raised, open palm gesture -->
  <path d="M214,262 Q208,278 198,294 Q186,310 174,316" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="1"/>
  <!-- Open hand - welcoming gesture -->
  <path d="M174,316 Q170,312 167,306 Q165,300 168,296" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>
  <path d="M174,316 Q171,320 172,326" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>
  <path d="M174,316 Q177,322 179,328" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>
  <path d="M174,316 Q180,318 184,324" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>
  <path d="M174,316 Q182,314 186,318" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="0.8"/>

  <!-- Left arm muscle definition -->
  <path d="M46,268 Q50,282 54,298" fill="none" stroke="#7a5a3a" stroke-width="1.5" opacity="0.4"/>

  <!-- Right arm muscle -->
  <path d="M210,268 Q206,280 200,294" fill="none" stroke="#7a5a3a" stroke-width="1.5" opacity="0.4"/>

  <!-- Circuit tattoos - warm steady glow, calmer -->
  <g filter="url(#neon_orange)" opacity="0.65">
    <path d="M48,272 L55,272 L55,284 L62,284 L62,298" fill="none" stroke="#ff8800" stroke-width="1.5"/>
    <circle cx="48" cy="272" r="2" fill="#ff8800"/>
    <circle cx="62" cy="284" r="2" fill="#ff8800"/>
    <circle cx="62" cy="298" r="2" fill="#ff8800"/>
    <path d="M52,278 L58,278 L58,292" fill="none" stroke="#ffaa44" stroke-width="1" opacity="0.5"/>
  </g>

  <g filter="url(#neon_orange)" opacity="0.65">
    <path d="M208,268 L202,271 L196,278 L190,284" fill="none" stroke="#ff8800" stroke-width="1.5"/>
    <circle cx="208" cy="268" r="2" fill="#ff8800"/>
    <circle cx="196" cy="278" r="2" fill="#ff8800"/>
    <circle cx="190" cy="284" r="2" fill="#ff8800"/>
  </g>

  <!-- Shirt collar V-neck -->
  <path d="M100,204 L128,234 L156,204" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Head - slight nod, chin tilted slightly down showing respect -->
  <path d="M88,93 Q88,58 128,53 Q168,58 168,93 L168,133 Q168,148 158,158 Q148,171 128,173 Q108,171 98,158 Q88,148 88,133 Z" fill="url(#skin_grad)"/>

  <!-- Jaw definition - relaxed -->
  <path d="M98,153 Q108,168 128,171 Q148,168 158,153" fill="none" stroke="#5a4030" stroke-width="1.5" opacity="0.4"/>

  <!-- Bald head -->
  <path d="M95,78 Q128,58 161,78" fill="none" stroke="#9a7a5a" stroke-width="1" opacity="0.3"/>
  <ellipse cx="128" cy="68" rx="25" ry="8" fill="#9a7a5a" opacity="0.15"/>
  <path d="M92,85 Q128,55 164,85" fill="#3a2a1a" opacity="0.3"/>

  <!-- Ears -->
  <ellipse cx="86" cy="118" rx="6" ry="10" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="1"/>
  <ellipse cx="170" cy="118" rx="6" ry="10" fill="url(#skin_grad)" stroke="#6b5040" stroke-width="1"/>

  <!-- Eyes - open, warm, direct eye contact -->
  <ellipse cx="108" cy="113" rx="12" ry="7" fill="#1a1a2e"/>
  <ellipse cx="148" cy="113" rx="12" ry="7" fill="#1a1a2e"/>
  <circle cx="108" cy="113" r="4" fill="#554422"/>
  <circle cx="148" cy="113" r="4" fill="#554422"/>
  <circle cx="108" cy="113" r="2" fill="#0a0a1a"/>
  <circle cx="148" cy="113" r="2" fill="#0a0a1a"/>
  <!-- Warm highlights -->
  <circle cx="110" cy="111" r="1.3" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="111" r="1.3" fill="#ffffff" opacity="0.8"/>
  <!-- Slight crinkle from smiling -->
  <path d="M96,118 Q100,120 96,122" fill="none" stroke="#6b5040" stroke-width="0.6" opacity="0.4"/>
  <path d="M160,118 Q156,120 160,122" fill="none" stroke="#6b5040" stroke-width="0.6" opacity="0.4"/>

  <!-- Eyebrows - relaxed, slightly raised in friendly way -->
  <path d="M95,104 Q108,100 120,103" fill="none" stroke="#3a2a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M136,103 Q148,100 161,104" fill="none" stroke="#3a2a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M128,115 L124,133 Q128,137 132,133 Z" fill="#7a5a3a" opacity="0.5"/>

  <!-- Mouth - genuine warm smile -->
  <path d="M113,149 Q120,154 128,155 Q136,154 143,149" fill="none" stroke="#5a3a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Slight teeth showing through smile -->
  <path d="M117,150 Q128,153 139,150" fill="#ddccbb" opacity="0.25"/>

  <!-- Scar -->
  <line x1="95" y1="131" x2="102" y2="138" stroke="#9a7a5a" stroke-width="1" opacity="0.5"/>

  <!-- Circuit glow on neck - warm steady -->
  <path d="M115,178 L115,188 L125,188" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.35" filter="url(#neon_orange)"/>
  <circle cx="125" cy="188" r="1.5" fill="#ff8800" opacity="0.4"/>

  <!-- Warm ambient glow -->
  <ellipse cx="128" cy="300" rx="80" ry="30" fill="#ff8800" opacity="0.03"/>
</svg>