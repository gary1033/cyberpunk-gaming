<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="dx_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="dx_skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a882"/>
      <stop offset="100%" stop-color="#a8906e"/>
    </linearGradient>
    <linearGradient id="dx_collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="dx_hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="40%" stop-color="#c0c0cc"/>
      <stop offset="60%" stop-color="#2a2a35"/>
      <stop offset="85%" stop-color="#c0c0cc"/>
      <stop offset="100%" stop-color="#2a2a35"/>
    </linearGradient>
    <radialGradient id="dx_glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <filter id="dx_neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dx_shadow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#dx_bg)"/>
  <rect width="256" height="384" fill="url(#dx_glow)"/>

  <!-- Frame border -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#ff3344" stroke-width="1.5" opacity="0.4"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="monospace" font-size="16" fill="#ff3344" text-anchor="middle" filter="url(#dx_neon)">蕭博士</text>

  <!-- Body / high-collar dark outfit -->
  <path d="M60,220 Q55,240 48,290 L42,380 H214 L208,290 Q202,240 196,220 Q185,200 172,190 L165,186 Q150,178 128,175 Q106,178 91,186 L84,190 Q71,200 60,220 Z" fill="#0d0d1a" stroke="#ff3344" stroke-width="0.5" opacity="0.9"/>
  <!-- Outfit seam lines -->
  <path d="M128,180 L128,380" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.2"/>
  <path d="M95,195 Q98,250 96,320" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.15"/>
  <path d="M161,195 Q158,250 160,320" fill="none" stroke="#ff3344" stroke-width="0.3" opacity="0.15"/>
  <!-- Outfit shoulder pads -->
  <path d="M60,220 Q65,215 75,212 Q85,210 91,212" fill="none" stroke="#ff3344" stroke-width="0.6" opacity="0.3"/>
  <path d="M196,220 Q191,215 181,212 Q171,210 165,212" fill="none" stroke="#ff3344" stroke-width="0.6" opacity="0.3"/>

  <!-- High collar -->
  <path d="M92,190 Q95,175 105,165 L110,160 Q115,156 120,154 L128,152 L136,154 Q141,156 146,160 L151,165 Q161,175 164,190 L158,198 Q148,188 138,183 Q132,180 128,179 Q124,180 118,183 Q108,188 98,198 Z" fill="#151528" stroke="#ff3344" stroke-width="0.8" opacity="0.95"/>
  <!-- Collar inner fold -->
  <path d="M105,180 Q112,172 120,168 Q125,166 128,165 Q131,166 136,168 Q144,172 151,180" fill="none" stroke="#ff3344" stroke-width="0.5" opacity="0.4"/>
  <!-- Red accent line on collar -->
  <path d="M98,192 Q108,184 118,180 Q124,178 128,177 Q132,178 138,180 Q148,184 158,192" fill="none" stroke="#ff3344" stroke-width="1" opacity="0.6"/>

  <!-- Neck -->
  <path d="M118,165 Q118,155 120,148 L128,145 L136,148 Q138,155 138,165" fill="url(#dx_skin)" opacity="0.9"/>

  <!-- Head shape -->
  <ellipse cx="128" cy="110" rx="38" ry="45" fill="url(#dx_skin)" opacity="0.95"/>

  <!-- Face shadow / structure -->
  <path d="M100,120 Q105,135 115,145 Q122,150 128,152 Q134,150 141,145 Q151,135 156,120" fill="#b09870" opacity="0.3"/>
  <!-- Cheekbone highlights -->
  <ellipse cx="105" cy="120" rx="8" ry="4" fill="#d4b896" opacity="0.15"/>
  <ellipse cx="151" cy="120" rx="8" ry="4" fill="#d4b896" opacity="0.15"/>

  <!-- Eyes - sharp, piercing, slightly superior -->
  <!-- Left eye -->
  <path d="M106,108 Q112,103 120,105 Q122,107 122,110 Q120,114 112,115 Q106,113 106,108 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="114" cy="109" r="3.5" fill="#1a0808"/>
  <circle cx="115" cy="108.5" r="1.5" fill="#ff3344" opacity="0.8"/>
  <circle cx="116" cy="108" r="0.5" fill="#ffffff"/>
  <!-- Right eye -->
  <path d="M134,105 Q142,103 150,108 Q150,113 144,115 Q136,114 134,110 Q134,107 134,105 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="142" cy="109" r="3.5" fill="#1a0808"/>
  <circle cx="141" cy="108.5" r="1.5" fill="#ff3344" opacity="0.8"/>
  <circle cx="140" cy="108" r="0.5" fill="#ffffff"/>
  <!-- Eyebrows - strong, slightly raised with superiority -->
  <path d="M104,100 Q112,96 122,99" fill="none" stroke="#2a2a35" stroke-width="2" opacity="0.8"/>
  <path d="M134,99 Q144,96 152,100" fill="none" stroke="#2a2a35" stroke-width="2" opacity="0.8"/>
  <!-- Slight eyelid droop - confident look -->
  <path d="M108,107 Q114,105 120,106" fill="none" stroke="#b09870" stroke-width="0.5" opacity="0.3"/>
  <path d="M136,106 Q142,105 148,107" fill="none" stroke="#b09870" stroke-width="0.5" opacity="0.3"/>
  <!-- Crow's feet -->
  <path d="M100,110 L96,108" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.4"/>
  <path d="M100,112 L97,113" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>
  <path d="M156,110 L160,108" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.4"/>
  <path d="M156,112 L159,113" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>

  <!-- Nose -->
  <path d="M128,108 Q127,118 125,126 Q124,130 126,132 Q128,133 130,132 Q132,130 131,126 Q129,118 128,108" fill="none" stroke="#a08060" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - composed, slight superior curl -->
  <path d="M118,138 Q123,139 128,139.5 Q133,139 138,138" fill="none" stroke="#8a6050" stroke-width="1.2" opacity="0.7"/>
  <!-- Nasolabial folds -->
  <path d="M112,128 Q114,134 117,138" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.25"/>
  <path d="M144,128 Q142,134 139,138" fill="none" stroke="#a08060" stroke-width="0.4" opacity="0.25"/>
  <!-- Chin -->
  <path d="M115,148 Q122,155 128,156 Q134,155 141,148" fill="none" stroke="#a08060" stroke-width="0.5" opacity="0.3"/>

  <!-- Hair - silver streaked, slicked back -->
  <path d="M90,95 Q88,80 90,68 Q95,52 108,44 Q118,38 128,36 Q138,38 148,44 Q161,52 166,68 Q168,80 166,95 Q162,88 155,82 Q145,75 135,72 Q128,70 121,72 Q111,75 101,82 Q94,88 90,95 Z" fill="url(#dx_hair)" opacity="0.95"/>
  <!-- Hair detail lines -->
  <path d="M100,90 Q105,75 115,65 Q122,60 128,58" fill="none" stroke="#e0e0ee" stroke-width="0.8" opacity="0.4"/>
  <path d="M156,90 Q151,75 141,65 Q134,60 128,58" fill="none" stroke="#e0e0ee" stroke-width="0.8" opacity="0.4"/>
  <path d="M95,85 Q100,70 112,60 Q120,55 128,54" fill="none" stroke="#888899" stroke-width="0.5" opacity="0.3"/>
  <path d="M161,85 Q156,70 144,60 Q136,55 128,54" fill="none" stroke="#888899" stroke-width="0.5" opacity="0.3"/>
  <!-- Temple silver streaks -->
  <path d="M92,100 Q90,90 92,78" fill="none" stroke="#c0c0cc" stroke-width="2" opacity="0.6"/>
  <path d="M164,100 Q166,90 164,78" fill="none" stroke="#c0c0cc" stroke-width="2" opacity="0.6"/>

  <!-- Ears -->
  <path d="M90,105 Q85,100 84,108 Q84,116 88,118 Q90,115 90,105 Z" fill="url(#dx_skin)" opacity="0.8"/>
  <path d="M166,105 Q171,100 172,108 Q172,116 168,118 Q166,115 166,105 Z" fill="url(#dx_skin)" opacity="0.8"/>

  <!-- Red accent details on outfit -->
  <circle cx="128" cy="200" r="3" fill="none" stroke="#ff3344" stroke-width="0.8" opacity="0.5"/>
  <circle cx="128" cy="200" r="1" fill="#ff3344" opacity="0.4"/>
  <line x1="128" y1="205" x2="128" y2="230" stroke="#ff3344" stroke-width="0.5" opacity="0.3"/>

  <!-- Ambient red particles -->
  <circle cx="30" cy="80" r="1.2" fill="#ff3344" opacity="0.2"/>
  <circle cx="225" cy="95" r="0.8" fill="#ff3344" opacity="0.15"/>
  <circle cx="40" cy="260" r="1" fill="#ff3344" opacity="0.15"/>
  <circle cx="215" cy="240" r="0.7" fill="#ff3344" opacity="0.2"/>
  <circle cx="20" cy="180" r="0.9" fill="#ff3344" opacity="0.1"/>
  <circle cx="235" cy="170" r="1.1" fill="#ff3344" opacity="0.15"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#ff3344" stroke-width="0.3" opacity="0.06"/>
</svg>