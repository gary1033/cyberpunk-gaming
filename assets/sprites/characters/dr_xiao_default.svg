<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080818"/>
      <stop offset="100%" stop-color="#040410"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#88bbff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#88bbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisL" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="40%" stop-color="#99aabb"/>
      <stop offset="100%" stop-color="#667788"/>
    </radialGradient>
    <radialGradient id="irisR" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="40%" stop-color="#99aabb"/>
      <stop offset="100%" stop-color="#667788"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="384" fill="url(#bg)"/>
  <rect width="256" height="384" fill="url(#bgGlow)"/>

  <!-- Frame -->
  <rect x="4" y="4" width="248" height="376" rx="8" fill="none" stroke="#88bbff" stroke-width="1" opacity="0.3"/>

  <!-- Character name -->
  <text x="128" y="28" font-family="monospace" font-size="14" fill="#aaccff" text-anchor="middle" filter="url(#glow)">蕭博士</text>

  <!-- Holographic data patterns -->
  <line x1="20" y1="340" x2="70" y2="340" stroke="#88bbff" stroke-width="0.4" opacity="0.15"/>
  <line x1="20" y1="344" x2="55" y2="344" stroke="#88bbff" stroke-width="0.3" opacity="0.1"/>
  <line x1="186" y1="336" x2="236" y2="336" stroke="#88bbff" stroke-width="0.4" opacity="0.15"/>
  <line x1="196" y1="340" x2="236" y2="340" stroke="#88bbff" stroke-width="0.3" opacity="0.1"/>
  <rect x="22" y="348" width="24" height="2" rx="1" fill="#88bbff" opacity="0.08"/>
  <rect x="210" y="344" width="20" height="2" rx="1" fill="#88bbff" opacity="0.08"/>

  <!-- Body - elegant dark coat -->
  <path d="M56,230 Q50,250 44,302 L38,384 H218 L212,302 Q206,250 200,230 Q188,208 174,198 L166,194 Q152,186 128,182 Q104,186 90,194 L82,198 Q68,208 56,230 Z" fill="#0c0c1a"/>
  <!-- Coat shadows -->
  <path d="M56,230 Q62,250 66,280 L68,384 H100 L96,280 Q92,250 86,230 Z" fill="#08081a" opacity="0.6"/>
  <path d="M200,230 Q194,250 190,280 L188,384 H156 L160,280 Q164,250 170,230 Z" fill="#08081a" opacity="0.6"/>
  <!-- Center seam -->
  <path d="M128,188 L128,384" fill="none" stroke="#aaccff" stroke-width="0.3" opacity="0.1"/>
  <!-- Coat lapel lines -->
  <path d="M108,198 Q104,220 100,260" fill="none" stroke="#aaccff" stroke-width="0.3" opacity="0.12"/>
  <path d="M148,198 Q152,220 156,260" fill="none" stroke="#aaccff" stroke-width="0.3" opacity="0.12"/>

  <!-- High collar -->
  <path d="M90,198 Q94,178 104,168 L110,162 Q116,158 122,156 L128,154 L134,156 Q140,158 146,162 L152,168 Q162,178 166,198 L158,206 Q148,196 138,190 Q132,188 128,186 Q124,188 118,190 Q108,196 98,206 Z" fill="#141428" stroke="#aaccff" stroke-width="0.6" opacity="0.9"/>
  <!-- Collar inner edge -->
  <path d="M100,200 Q110,192 118,188 Q124,186 128,184 Q132,186 138,188 Q146,192 156,200" fill="none" stroke="#aaccff" stroke-width="0.8" opacity="0.4"/>
  <!-- Collar glow trim -->
  <path d="M104,168 Q116,158 128,154 Q140,158 152,168" fill="none" stroke="#88bbff" stroke-width="0.5" opacity="0.2" filter="url(#glow)"/>

  <!-- Neck -->
  <rect x="118" y="154" width="20" height="20" rx="4" fill="#eedcca" opacity="0.9"/>

  <!-- Head - sharp V-chin, angular -->
  <path d="M88,118 Q86,94 90,74 Q96,54 110,44 Q120,38 128,36 Q136,38 146,44 Q160,54 166,74 Q170,94 168,118 Q166,134 160,146 Q152,156 140,162 Q132,166 128,166 Q124,166 116,162 Q104,156 96,146 Q90,134 88,118 Z" fill="#f2d4b8" opacity="0.95"/>
  <!-- Face shadows - cel shading -->
  <path d="M88,118 Q90,130 96,140 L104,148 Q96,138 92,126 Q90,118 88,118 Z" fill="#d4b498" opacity="0.5"/>
  <path d="M168,118 Q166,130 160,140 L152,148 Q160,138 164,126 Q166,118 168,118 Z" fill="#d4b498" opacity="0.5"/>
  <!-- Cheekbone shadows -->
  <path d="M92,112 Q96,120 100,126 Q104,130 106,128 Q102,122 98,114 Z" fill="#d4b498" opacity="0.35"/>
  <path d="M164,112 Q160,120 156,126 Q152,130 150,128 Q154,122 158,114 Z" fill="#d4b498" opacity="0.35"/>

  <!-- Neural interface on left temple -->
  <circle cx="86" cy="100" r="4" fill="none" stroke="#88bbff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="86" cy="100" r="2" fill="#88bbff" opacity="0.3"/>
  <circle cx="86" cy="100" r="1" fill="#aaccff" opacity="0.6"/>
  <line x1="82" y1="100" x2="76" y2="98" stroke="#88bbff" stroke-width="0.5" opacity="0.3"/>
  <line x1="86" y1="96" x2="84" y2="90" stroke="#88bbff" stroke-width="0.5" opacity="0.3"/>
  <line x1="90" y1="100" x2="92" y2="104" stroke="#88bbff" stroke-width="0.4" opacity="0.2"/>

  <!-- Eyes - half-lidded, calculating, superior (villain eyes) -->
  <!-- Left eye -->
  <path d="M102,112 Q108,108 118,109 Q122,112 121,117 Q116,120 108,120 Q103,118 102,114 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Thick upper eyelid -->
  <path d="M102,112 Q108,108 118,109 Q122,112" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Iris with radialGradient -->
  <ellipse cx="112" cy="114" rx="5.5" ry="5" fill="url(#irisL)"/>
  <!-- Pupil -->
  <ellipse cx="112" cy="114" rx="2.5" ry="2.8" fill="#0a0a14"/>
  <!-- 3 highlight spots -->
  <circle cx="109" cy="112" r="2.2" fill="#ffffff" opacity="0.95"/>
  <circle cx="114" cy="116" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="111" cy="116" r="0.6" fill="#ffffff" opacity="0.4"/>
  <!-- Lower eyelid hint -->
  <path d="M104,118 Q110,120 118,118" fill="none" stroke="#d4b498" stroke-width="0.5" opacity="0.4"/>

  <!-- Right eye -->
  <path d="M134,109 Q144,108 154,112 Q154,118 148,120 Q138,120 134,117 Q134,112 134,109 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Thick upper eyelid -->
  <path d="M134,112 Q144,108 154,112" fill="none" stroke="#1a1a2a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Iris -->
  <ellipse cx="144" cy="114" rx="5.5" ry="5" fill="url(#irisR)"/>
  <!-- Pupil -->
  <ellipse cx="144" cy="114" rx="2.5" ry="2.8" fill="#0a0a14"/>
  <!-- 3 highlights -->
  <circle cx="141" cy="112" r="2.2" fill="#ffffff" opacity="0.95"/>
  <circle cx="146" cy="116" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="143" cy="116" r="0.6" fill="#ffffff" opacity="0.4"/>
  <path d="M136,118 Q142,120 150,118" fill="none" stroke="#d4b498" stroke-width="0.5" opacity="0.4"/>

  <!-- Eyebrows - thin, sharp, slightly raised with superiority -->
  <path d="M100,104 Q108,100 120,103" fill="none" stroke="#8a8a9a" stroke-width="2" opacity="0.85"/>
  <path d="M136,103 Q148,100 156,104" fill="none" stroke="#8a8a9a" stroke-width="2" opacity="0.85"/>

  <!-- Small nose -->
  <path d="M126,130 Q128,134 130,130" fill="none" stroke="#c8aa90" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - composed, slight superior smile -->
  <path d="M118,142 Q123,144 128,144 Q133,144 138,142" fill="none" stroke="#a07060" stroke-width="1" opacity="0.7"/>
  <!-- Slight upward curl at corners -->
  <path d="M117,142 Q116,141 116,140" fill="none" stroke="#a07060" stroke-width="0.5" opacity="0.3"/>
  <path d="M139,142 Q140,141 140,140" fill="none" stroke="#a07060" stroke-width="0.5" opacity="0.3"/>

  <!-- Hair - silver/grey, swept back elegantly, chunky geometric shapes -->
  <path d="M86,108 Q82,86 86,64 Q92,44 108,34 Q120,26 128,24 Q136,26 148,34 Q164,44 170,64 Q174,86 170,108 Q166,96 158,86 Q148,76 138,72 Q128,68 118,72 Q108,76 98,86 Q90,96 86,108 Z" fill="#6a6a7a"/>
  <!-- Geometric hair chunks -->
  <path d="M92,90 Q96,72 110,56 Q120,44 128,40 L118,48 Q106,58 98,76 Z" fill="#8a8a9a" opacity="0.7"/>
  <path d="M164,90 Q160,72 146,56 Q136,44 128,40 L138,48 Q150,58 158,76 Z" fill="#8a8a9a" opacity="0.7"/>
  <!-- Shine bands -->
  <path d="M104,52 Q116,44 128,42 Q140,44 152,52" fill="none" stroke="#d0d0e0" stroke-width="2.5" opacity="0.5"/>
  <path d="M100,66 Q114,56 128,54 Q142,56 156,66" fill="none" stroke="#c0c0d0" stroke-width="1.5" opacity="0.35"/>
  <path d="M96,80 Q108,70 128,68 Q148,70 160,80" fill="none" stroke="#b0b0c0" stroke-width="1" opacity="0.25"/>
  <!-- Temple silver streaks - longer, reaching collar -->
  <path d="M88,104 Q86,90 88,74" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.6"/>
  <path d="M168,104 Q170,90 168,74" fill="none" stroke="#c8c8d8" stroke-width="3" opacity="0.6"/>
  <!-- Hair reaching collar -->
  <path d="M86,108 Q84,116 84,126 Q84,134 86,140" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>
  <path d="M170,108 Q172,116 172,126 Q172,134 170,140" fill="none" stroke="#6a6a7a" stroke-width="3" opacity="0.5"/>

  <!-- Ears (partially behind hair) -->
  <path d="M88,108 Q82,104 82,112 Q82,120 86,122" fill="#f2d4b8" opacity="0.5"/>
  <path d="M168,108 Q174,104 174,112 Q174,120 170,122" fill="#f2d4b8" opacity="0.5"/>

  <!-- Coat accent detail -->
  <circle cx="128" cy="212" r="3" fill="none" stroke="#aaccff" stroke-width="0.6" opacity="0.3"/>
  <circle cx="128" cy="212" r="1" fill="#88bbff" opacity="0.3"/>
  <line x1="128" y1="216" x2="128" y2="240" stroke="#88bbff" stroke-width="0.4" opacity="0.15"/>

  <!-- Ambient ice-blue particles -->
  <circle cx="28" cy="78" r="1.2" fill="#88bbff" opacity="0.15"/>
  <circle cx="228" cy="92" r="0.8" fill="#aaccff" opacity="0.12"/>
  <circle cx="38" cy="260" r="1" fill="#88bbff" opacity="0.1"/>
  <circle cx="218" cy="244" r="0.7" fill="#aaccff" opacity="0.15"/>
  <circle cx="18" cy="178" r="0.9" fill="#88bbff" opacity="0.08"/>
  <circle cx="238" cy="168" r="1.1" fill="#aaccff" opacity="0.12"/>

  <!-- Scanline overlay -->
  <line x1="0" y1="60" x2="256" y2="60" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="120" x2="256" y2="120" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="180" x2="256" y2="180" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="240" x2="256" y2="240" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="300" x2="256" y2="300" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>
  <line x1="0" y1="360" x2="256" y2="360" stroke="#aaccff" stroke-width="0.3" opacity="0.04"/>

  <!-- Expression label -->
  <text x="128" y="374" font-family="monospace" font-size="10" fill="#aaccff" text-anchor="middle" opacity="0.6">DEFAULT</text>
</svg>
