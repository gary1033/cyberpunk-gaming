  <line x1="212" y1="368" x2="212" y2="378" stroke="#a08060" stroke-width="1" opacity="0.4"/>
  <line x1="218" y1="368" x2="218" y2="378" stroke="#a08060" stroke-width="1" opacity="0.4"/>

