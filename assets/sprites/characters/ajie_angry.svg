  <line x1="131" y1="94" x2="133" y2="104" stroke="#a07050" stroke-width="1.5" opacity="0.5"/>

  <!-- Nose - flared -->
  <path d="M124,130 Q128,136 132,130" fill="none" stroke="#a07050" stroke-width="1.5" opacity="0.5"/>
  <circle cx="122" cy="132" r="2.5" fill="#a07050" opacity="0.25"/>
  <circle cx="134" cy="132" r="2.5" fill="#a07050" opacity="0.25"/>

  <!-- Mouth - baring teeth, snarling -->
  <path d="M108,148 Q118,144 128,145 Q138,144 148,148" fill="none" stroke="#5a2a18" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Teeth block -->
  <rect x="113" y="147" width="30" height="5" rx="1" fill="#ddccbb" opacity="0.6"/>
  <line x1="119" y1="147" x2="119" y2="152" stroke="#0a0a1a" stroke-width="0.8" opacity="0.35"/>
  <line x1="125" y1="147" x2="125" y2="152" stroke="#0a0a1a" stroke-width="0.8" opacity="0.35"/>
  <line x1="131" y1="147" x2="131" y2="152" stroke="#0a0a1a" stroke-width="0.8" opacity="0.35"/>
  <line x1="137" y1="147" x2="137" y2="152" stroke="#0a0a1a" stroke-width="0.8" opacity="0.35"/>
  <path d="M114,154 Q128,158 142,154" fill="none" stroke="#5a2a18" stroke-width="1.5" opacity="0.4"/>

  <!-- Stubble -->
  <g opacity="0.08" fill="#3a2a1a">
    <circle cx="112" cy="160" r="0.8"/><circle cx="116" cy="162" r="0.8"/>
    <circle cx="120" cy="161" r="0.8"/><circle cx="128" cy="162" r="0.8"/>
    <circle cx="136" cy="161" r="0.8"/><circle cx="140" cy="160" r="0.8"/>
    <circle cx="144" cy="162" r="0.8"/>
