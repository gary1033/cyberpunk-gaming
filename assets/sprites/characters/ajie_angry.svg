  <path d="M130,114 Q148,109 166,114" fill="#f0ece8"/>
  <path d="M130,114 Q148,118 166,114" fill="#f0ece8"/>
  <circle cx="148" cy="114" r="6" fill="url(#iris_grad)"/>
  <circle cx="148" cy="114" r="3" fill="#0a0a0a"/>
  <circle cx="150" cy="113" r="1.5" fill="#ffaa44" opacity="0.7"/>
  <circle cx="146" cy="115" r="0.8" fill="#ffffff" opacity="0.4"/>
  <path d="M128,114 Q148,107 168,114" fill="none" stroke="#1a0a00" stroke-width="4" stroke-linecap="round"/>

