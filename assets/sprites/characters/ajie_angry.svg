  <circle cx="108" cy="114" r="3" fill="#0a0a0a"/>
  <circle cx="106" cy="113" r="1.5" fill="#ffaa44" opacity="0.7"/>
  <circle cx="110" cy="115" r="0.8" fill="#ffffff" opacity="0.4"/>
  <path d="M88,114 Q108,107 128,114" fill="none" stroke="#1a0a00" stroke-width="4" stroke-linecap="round"/>

