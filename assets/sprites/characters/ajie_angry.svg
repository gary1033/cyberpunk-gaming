<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0800"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="intense_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="iris_grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c08040"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
  </defs>

  <!-- Background - angry red tint -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <ellipse cx="128" cy="130" rx="100" ry="80" fill="#ff4400" opacity="0.04"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.6"/>
  <rect x="6" y="6" width="244" height="372" rx="4" fill="none" stroke="#ff6600" stroke-width="0.5" opacity="0.25"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ff6600" text-anchor="middle" filter="url(#neonGlow)">阿傑 AJIE</text>
  <line x1="40" y1="37" x2="216" y2="37" stroke="#ff6600" stroke-width="0.5" opacity="0.3"/>

  <!-- Neck - thick, tensed -->
