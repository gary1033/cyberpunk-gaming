  <path d="M26,258 Q28,280 30,300 L36,300 Q34,280 32,258 Z" fill="#2a1a0a" opacity="0.3"/>
  <path d="M230,258 Q226,288 220,318 Q216,348 212,370" fill="#c89068"/>

