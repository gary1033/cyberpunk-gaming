  <path d="M32,370 Q38,364 50,364 Q56,364 56,372 Q56,380 50,384 Q38,384 32,378 Z" fill="#2a1a0a" opacity="0.2"/>
  <line x1="36" y1="370" x2="36" y2="378" stroke="#a08060" stroke-width="1" opacity="0.4"/>
