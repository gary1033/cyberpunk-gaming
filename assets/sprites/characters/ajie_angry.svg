  <!-- Scar - more visible when angry -->
  <line x1="86" y1="130" x2="95" y2="140" stroke="#c09060" stroke-width="1.5" opacity="0.6"/>

  <!-- Circuit glow on neck - bright pulsing -->
  <g filter="url(#intense_glow)" opacity="0.9">
    <path d="M108,176 L108,192 L120,192 L120,202" fill="none" stroke="#ffaa00" stroke-width="1.8"/>
    <circle cx="120" cy="202" r="3" fill="#ffdd66"/>
    <path d="M148,176 L148,192 L136,192" fill="none" stroke="#ffaa00" stroke-width="1.8"/>
    <circle cx="136" cy="192" r="3" fill="#ffdd66"/>
  </g>

  <!-- Ambient angry glow -->
  <ellipse cx="128" cy="310" rx="110" ry="50" fill="#ff4400" opacity="0.04"/>

  <!-- Corner accents -->
  <path d="M10,10 L30,10 M10,10 L10,30" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.5"/>
  <path d="M246,10 L226,10 M246,10 L246,30" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.5"/>
  <path d="M10,374 L30,374 M10,374 L10,354" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.5"/>
  <path d="M246,374 L226,374 M246,374 L246,354" fill="none" stroke="#ff6600" stroke-width="1" opacity="0.5"/>

  <!-- Expression label -->
  <text x="128" y="372" font-family="'Courier New', monospace" font-size="11" fill="#ff6600" text-anchor="middle" opacity="0.6">[ANGRY]</text>
</svg>