<svg xmlns="http://www.w3.org/2000/svg" width="256" height="384" viewBox="0 0 256 384">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0800"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <filter id="neon_orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="intense_glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d08060"/>
      <stop offset="100%" stop-color="#a06048"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- Background - angry red tint -->
  <rect width="256" height="384" fill="url(#bg_glow)"/>
  <ellipse cx="128" cy="130" rx="100" ry="80" fill="#ff4400" opacity="0.04"/>
  <rect x="3" y="3" width="250" height="378" rx="6" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.6"/>

  <!-- Character name -->
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#neon_orange)">阿傑</text>
  <text x="128" y="30" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#ff8800" text-anchor="middle">阿傑</text>

  <!-- Neck - thick, tensed -->
  <rect x="100" y="172" width="56" height="35" rx="6" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1"/>
  <!-- Neck tendons -->
  <line x1="114" y1="175" x2="114" y2="205" stroke="#8a5040" stroke-width="1.5" opacity="0.5"/>
  <line x1="142" y1="175" x2="142" y2="205" stroke="#8a5040" stroke-width="1.5" opacity="0.5"/>

  <!-- Body - wider aggressive stance -->
  <path d="M128,205 L128,384 L26,384 L26,258 Q26,216 74,208 Q108,200 128,205 Z" fill="url(#shirt_grad)"/>
  <path d="M128,205 L128,384 L230,384 L230,258 Q230,216 182,208 Q148,200 128,205 Z" fill="url(#shirt_grad)"/>
  <path d="M74,208 Q46,214 32,238 Q26,252 26,258" fill="none" stroke="#2a2a4e" stroke-width="2.5"/>
  <path d="M182,208 Q210,214 224,238 Q230,252 230,258" fill="none" stroke="#2a2a4e" stroke-width="2.5"/>

  <!-- Arms - fists at sides -->
  <path d="M26,258 Q30,288 36,318 Q40,348 44,370" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1"/>
  <path d="M230,258 Q226,288 220,318 Q216,348 212,370" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1"/>

  <!-- Clenched fists -->
  <ellipse cx="44" cy="374" rx="14" ry="12" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1"/>
  <line x1="36" y1="370" x2="36" y2="378" stroke="#8a5040" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="368" x2="42" y2="378" stroke="#8a5040" stroke-width="1" opacity="0.5"/>
  <line x1="48" y1="368" x2="48" y2="378" stroke="#8a5040" stroke-width="1" opacity="0.5"/>
  <ellipse cx="212" cy="374" rx="14" ry="12" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1"/>
  <line x1="206" y1="370" x2="206" y2="378" stroke="#8a5040" stroke-width="1" opacity="0.5"/>
  <line x1="212" y1="368" x2="212" y2="378" stroke="#8a5040" stroke-width="1" opacity="0.5"/>
  <line x1="218" y1="368" x2="218" y2="378" stroke="#8a5040" stroke-width="1" opacity="0.5"/>

  <!-- Circuit tattoos - BRIGHT, intensified -->
  <g filter="url(#intense_glow)" opacity="1">
    <path d="M30,268 L40,268 L40,284 L52,284 L52,300 L60,300" fill="none" stroke="#ffaa00" stroke-width="2.5"/>
    <circle cx="30" cy="268" r="3.5" fill="#ffdd66"/>
    <circle cx="52" cy="284" r="3.5" fill="#ffdd66"/>
    <circle cx="60" cy="300" r="3.5" fill="#ffdd66"/>
    <path d="M36,274 L46,274 L46,290" fill="none" stroke="#ffdd66" stroke-width="1.5"/>
    <path d="M38,304 L38,322 L46,322 L46,340" fill="none" stroke="#ffaa00" stroke-width="2"/>
    <circle cx="46" cy="340" r="3" fill="#ffdd66"/>
  </g>
  <g filter="url(#intense_glow)" opacity="1">
    <path d="M226,268 L216,268 L216,284 L204,284 L204,300 L196,300" fill="none" stroke="#ffaa00" stroke-width="2.5"/>
    <circle cx="226" cy="268" r="3.5" fill="#ffdd66"/>
    <circle cx="204" cy="284" r="3.5" fill="#ffdd66"/>
    <circle cx="196" cy="300" r="3.5" fill="#ffdd66"/>
    <path d="M220,274 L210,274 L210,290" fill="none" stroke="#ffdd66" stroke-width="1.5"/>
    <path d="M218,304 L218,322 L210,322 L210,340" fill="none" stroke="#ffaa00" stroke-width="2"/>
    <circle cx="210" cy="340" r="3" fill="#ffdd66"/>
  </g>

  <!-- Shirt V-neck -->
  <path d="M94,208 L128,242 L162,208" fill="none" stroke="#2a2a4e" stroke-width="2"/>

  <!-- Head - slightly forward, aggressive -->
  <path d="M82,85 Q82,38 128,32 Q174,38 174,85 L174,140 Q174,156 162,166 Q150,178 128,180 Q106,178 94,166 Q82,156 82,140 Z" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="2"/>

  <!-- Forehead veins -->
  <path d="M106,58 Q110,54 114,58 Q118,62 122,60" fill="none" stroke="#a06048" stroke-width="1.5" opacity="0.6"/>
  <path d="M138,60 Q142,56 146,60" fill="none" stroke="#a06048" stroke-width="1.2" opacity="0.4"/>

  <!-- Bald head -->
  <path d="M88,68 Q128,36 168,68" fill="#5a4030" opacity="0.25"/>

  <!-- Ears - flushed -->
  <ellipse cx="80" cy="120" rx="8" ry="14" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1.5"/>
  <ellipse cx="176" cy="120" rx="8" ry="14" fill="url(#skin_grad)" stroke="#8a5040" stroke-width="1.5"/>
  <ellipse cx="80" cy="120" rx="5" ry="9" fill="#c05040" opacity="0.2"/>
  <ellipse cx="176" cy="120" rx="5" ry="9" fill="#c05040" opacity="0.2"/>

  <!-- Eyes - narrowed rage slits -->
  <path d="M90,116 Q108,110 126,116" fill="#1a1a2e"/>
  <path d="M90,116 Q108,120 126,116" fill="#1a1a2e"/>
  <circle cx="108" cy="116" r="5" fill="#8b5a2b"/>
  <circle cx="108" cy="116" r="3" fill="#0a0a1a"/>
  <circle cx="106" cy="115" r="1.5" fill="#ffaa44" opacity="0.7"/>
  <path d="M88,116 Q108,108 128,116" fill="none" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>

  <path d="M130,116 Q148,110 166,116" fill="#1a1a2e"/>
  <path d="M130,116 Q148,120 166,116" fill="#1a1a2e"/>
  <circle cx="148" cy="116" r="5" fill="#8b5a2b"/>
  <circle cx="148" cy="116" r="3" fill="#0a0a1a"/>
  <circle cx="150" cy="115" r="1.5" fill="#ffaa44" opacity="0.7"/>
  <path d="M128,116 Q148,108 168,116" fill="none" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyebrows - deeply furrowed V -->
  <path d="M88,106 Q100,94 126,105" fill="none" stroke="#2a1a0a" stroke-width="5" stroke-linecap="round"/>
  <path d="M130,105 Q156,94 168,106" fill="none" stroke="#2a1a0a" stroke-width="5" stroke-linecap="round"/>
  <!-- Furrow lines between brows -->
  <line x1="125" y1="96" x2="123" y2="106" stroke="#8a5040" stroke-width="1.5" opacity="0.6"/>
  <line x1="131" y1="96" x2="133" y2="106" stroke="#8a5040" stroke-width="1.5" opacity="0.6"/>

  <!-- Nose - flared -->
  <path d="M124,132 Q128,138 132,132" fill="none" stroke="#8a5040" stroke-width="1.5" opacity="0.5"/>
  <circle cx="122" cy="134" r="2.5" fill="#8a5040" opacity="0.3"/>
  <circle cx="134" cy="134" r="2.5" fill="#8a5040" opacity="0.3"/>

  <!-- Mouth - baring teeth, snarling -->
  <path d="M108,150 Q118,146 128,147 Q138,146 148,150" fill="none" stroke="#6a3020" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="113" y="149" width="30" height="5" rx="1" fill="#ddccbb" opacity="0.65"/>
  <line x1="119" y1="149" x2="119" y2="154" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
  <line x1="125" y1="149" x2="125" y2="154" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
  <line x1="131" y1="149" x2="131" y2="154" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
  <line x1="137" y1="149" x2="137" y2="154" stroke="#1a1a2e" stroke-width="1" opacity="0.4"/>
  <path d="M114,156 Q128,160 142,156" fill="none" stroke="#6a3020" stroke-width="1.5" opacity="0.4"/>

  <!-- Scar - more visible -->
  <line x1="88" y1="132" x2="97" y2="142" stroke="#c09060" stroke-width="1.5" opacity="0.7"/>

  <!-- Circuit glow on neck - bright pulsing -->
  <g filter="url(#intense_glow)" opacity="0.9">
    <path d="M108,178 L108,192 L120,192 L120,202" fill="none" stroke="#ffaa00" stroke-width="1.8"/>
    <circle cx="120" cy="202" r="3" fill="#ffdd66"/>
    <path d="M148,178 L148,192 L136,192" fill="none" stroke="#ffaa00" stroke-width="1.8"/>
    <circle cx="136" cy="192" r="3" fill="#ffdd66"/>
  </g>

  <!-- Ambient angry glow -->
  <ellipse cx="128" cy="310" rx="110" ry="50" fill="#ff4400" opacity="0.04"/>
</svg>