  <path d="M80,85 Q80,38 128,32 Q176,38 176,85 L176,140 Q176,156 164,166 Q152,178 128,180 Q104,178 92,166 Q80,156 80,140 Z" fill="#c89068"/>
  <path d="M80,85 L80,140 Q80,156 92,166 Q98,171 104,174 L104,96 Q92,90 80,85 Z" fill="#2a1a0a" opacity="0.25"/>
  <path d="M92,166 Q104,178 128,180 L128,173 Q110,171 100,164 Z" fill="#2a1a0a" opacity="0.2"/>

