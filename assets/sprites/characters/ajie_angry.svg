  <line x1="142" y1="175" x2="142" y2="205" stroke="#2a1a0a" stroke-width="1.5" opacity="0.35"/>

  <!-- Body - wider aggressive stance -->
  <path d="M128,205 L128,384 L26,384 L26,258 Q26,216 74,208 Q108,200 128,205 Z" fill="#1a1a2e"/>
  <path d="M128,205 L128,384 L230,384 L230,258 Q230,216 182,208 Q148,200 128,205 Z" fill="#1a1a2e"/>
  <path d="M128,205 L128,384 L76,384 L76,250 Q80,225 128,205 Z" fill="#0d0d1a" opacity="0.45"/>
  <path d="M74,208 Q46,214 32,238 Q26,252 26,258" fill="none" stroke="#2a2a4e" stroke-width="2.5"/>
  <path d="M182,208 Q210,214 224,238 Q230,252 230,258" fill="none" stroke="#2a2a4e" stroke-width="2.5"/>

