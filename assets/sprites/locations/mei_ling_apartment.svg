<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1525"/>
      <stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2535"/>
      <stop offset="100%" stop-color="#1a1520"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="40%" stop-color="#0f0f30"/>
      <stop offset="100%" stop-color="#1a1540"/>
    </linearGradient>
    <linearGradient id="couchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3545"/>
      <stop offset="100%" stop-color="#2a2530"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffddaa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffddaa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9944cc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6622aa" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="holoGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="200" y="30" width="880" height="350"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Wall -->
  <rect x="0" y="0" width="1280" height="460" fill="#18152a"/>
  <!-- Subtle wall texture -->
  <rect x="0" y="0" width="1280" height="460" fill="#1c1830" opacity="0.3"/>

  <!-- Floor -->
  <polygon points="0,460 1280,460 1280,720 0,720" fill="url(#floorGrad)"/>
  <!-- Polished floor tiles -->
  <line x1="0" y1="530" x2="1280" y2="530" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="600" x2="1280" y2="600" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="670" x2="1280" y2="670" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="160" y1="460" x2="160" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="320" y1="460" x2="320" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="480" y1="460" x2="480" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="640" y1="460" x2="640" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="800" y1="460" x2="800" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="960" y1="460" x2="960" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>
  <line x1="1120" y1="460" x2="1120" y2="720" stroke="#332e40" stroke-width="0.5" opacity="0.5"/>

  <!-- Large panoramic window -->
  <rect x="200" y="30" width="880" height="350" fill="#050510"/>
  <!-- Window frame -->
  <rect x="195" y="25" width="890" height="360" fill="none" stroke="#3a3550" stroke-width="5"/>
  <line x1="640" y1="25" x2="640" y2="385" stroke="#3a3550" stroke-width="3"/>

  <!-- City skyline through window -->
  <g clip-path="url(#windowClip)">
    <rect x="200" y="30" width="880" height="350" fill="url(#windowSky)"/>
    <!-- Distant cityscape -->
    <rect x="210" y="200" width="60" height="180" fill="#0c0c25"/>
    <rect x="280" y="150" width="45" height="230" fill="#0e0e28"/>
    <rect x="340" y="180" width="70" height="200" fill="#0a0a22"/>
    <rect x="420" y="120" width="55" height="260" fill="#0d0d26"/>
    <rect x="490" y="160" width="40" height="220" fill="#0b0b24"/>
    <rect x="545" y="100" width="80" height="280" fill="#0e0e28"/>
    <rect x="640" y="140" width="50" height="240" fill="#0c0c25"/>
    <rect x="700" y="170" width="65" height="210" fill="#0a0a22"/>
    <rect x="780" y="110" width="70" height="270" fill="#0d0d26"/>
    <rect x="860" y="160" width="45" height="220" fill="#0b0b24"/>
    <rect x="920" y="130" width="60" height="250" fill="#0e0e28"/>
    <rect x="990" y="190" width="80" height="190" fill="#0c0c25"/>
    <!-- Building windows -->
    <g opacity="0.5">
      <rect x="225" y="220" width="4" height="3" fill="#ffdd55"/>
      <rect x="240" y="250" width="4" height="3" fill="#00cccc"/>
      <rect x="290" y="170" width="4" height="3" fill="#ff88aa"/>
      <rect x="305" y="200" width="4" height="3" fill="#ffdd55"/>
      <rect x="360" y="200" width="5" height="3" fill="#00cccc"/>
      <rect x="380" y="240" width="5" height="3" fill="#ffdd55"/>
      <rect x="435" y="140" width="5" height="3" fill="#ff88aa"/>
      <rect x="450" y="180" width="5" height="3" fill="#00cccc"/>
      <rect x="560" y="120" width="6" height="4" fill="#ffdd55"/>
      <rect x="580" y="160" width="6" height="4" fill="#ff88aa"/>
      <rect x="600" y="200" width="6" height="4" fill="#00cccc"/>
      <rect x="655" y="160" width="5" height="3" fill="#ffdd55"/>
      <rect x="720" y="190" width="5" height="3" fill="#ff88aa"/>
      <rect x="740" y="230" width="5" height="3" fill="#00cccc"/>
      <rect x="800" y="130" width="6" height="4" fill="#ffdd55"/>
      <rect x="820" y="170" width="6" height="4" fill="#ff88aa"/>
      <rect x="930" y="150" width="5" height="3" fill="#00cccc"/>
      <rect x="950" y="190" width="5" height="3" fill="#ffdd55"/>
      <rect x="1010" y="210" width="5" height="3" fill="#ff88aa"/>
    </g>
    <!-- Distant neon signs -->
    <rect x="350" y="280" width="60" height="8" rx="2" fill="#9944cc" opacity="0.5" filter="url(#holoGlow)"/>
    <rect x="550" y="250" width="50" height="8" rx="2" fill="#00ccff" opacity="0.4" filter="url(#holoGlow)"/>
    <rect x="800" y="270" width="55" height="8" rx="2" fill="#ff4488" opacity="0.4" filter="url(#holoGlow)"/>
    <!-- Stars/sky -->
    <circle cx="300" cy="50" r="1" fill="#ffffff" opacity="0.3"/>
    <circle cx="500" cy="70" r="0.8" fill="#ffffff" opacity="0.2"/>
    <circle cx="750" cy="45" r="1" fill="#ffffff" opacity="0.25"/>
    <circle cx="900" cy="65" r="0.7" fill="#ffffff" opacity="0.2"/>
    <circle cx="1050" cy="55" r="1" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Window sill -->
  <rect x="190" y="380" width="900" height="12" fill="#2a2540"/>

  <!-- Left wall section -->
  <rect x="0" y="0" width="200" height="460" fill="#1a1530"/>

  <!-- Right wall section -->
  <rect x="1080" y="0" width="200" height="460" fill="#1a1530"/>

  <!-- Minimalist couch (left area) -->
  <rect x="40" y="380" width="280" height="80" rx="8" fill="url(#couchGrad)"/>
  <rect x="40" y="370" width="280" height="20" rx="5" fill="#3e3850"/>
  <!-- Couch cushions -->
  <rect x="50" y="375" width="85" height="15" rx="4" fill="#444055"/>
  <rect x="145" y="375" width="85" height="15" rx="4" fill="#444055"/>
  <rect x="240" y="375" width="70" height="15" rx="4" fill="#444055"/>
  <!-- Couch arm -->
  <rect x="30" y="350" width="20" height="110" rx="5" fill="#353045"/>
  <rect x="310" y="350" width="20" height="110" rx="5" fill="#353045"/>
  <!-- Throw pillow -->
  <rect x="60" y="355" width="45" height="30" rx="8" fill="#7744aa" opacity="0.6"/>
  <rect x="270" y="360" width="35" height="25" rx="6" fill="#9955cc" opacity="0.5"/>
  <!-- Couch legs -->
  <rect x="55" y="460" width="5" height="15" fill="#2a2535"/>
  <rect x="300" y="460" width="5" height="15" fill="#2a2535"/>

  <!-- Coffee table -->
  <rect x="130" y="490" width="180" height="10" rx="2" fill="#2a2a3a"/>
  <rect x="130" y="490" width="180" height="10" rx="2" fill="none" stroke="#3a3a4a" stroke-width="1"/>
  <rect x="145" y="500" width="6" height="35" fill="#252535"/>
  <rect x="290" y="500" width="6" height="35" fill="#252535"/>
  <!-- Items on coffee table -->
  <rect x="150" y="483" width="50" height="8" rx="1" fill="#1a1a2a" stroke="#9944cc" stroke-width="0.5" opacity="0.6"/>
  <circle cx="245" cy="487" r="8" fill="#222235" stroke="#3a3a50" stroke-width="1"/>
  <circle cx="245" cy="487" r="4" fill="#aa6600" opacity="0.3"/>

  <!-- Holographic photo frames on wall -->
  <!-- Frame 1 -->
  <rect x="50" y="150" width="80" height="60" rx="2" fill="#0a0a1a"/>
  <rect x="50" y="150" width="80" height="60" rx="2" fill="none" stroke="#9944cc" stroke-width="1.5" opacity="0.5" filter="url(#holoGlow)"/>
  <rect x="58" y="158" width="30" height="44" fill="#9944cc" opacity="0.08"/>
  <circle cx="73" cy="172" r="8" fill="#9944cc" opacity="0.1"/>
  <rect x="60" y="185" width="26" height="2" fill="#9944cc" opacity="0.15"/>
  <rect x="60" y="190" width="20" height="2" fill="#9944cc" opacity="0.1"/>
  <!-- Holographic shimmer -->
  <line x1="50" y1="160" x2="130" y2="160" stroke="#cc88ff" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="180" x2="130" y2="180" stroke="#cc88ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Frame 2 -->
  <rect x="80" y="80" width="70" height="55" rx="2" fill="#0a0a1a"/>
  <rect x="80" y="80" width="70" height="55" rx="2" fill="none" stroke="#9944cc" stroke-width="1.5" opacity="0.4" filter="url(#holoGlow)"/>
  <rect x="88" y="88" width="54" height="39" fill="#9944cc" opacity="0.06"/>
  <!-- Holographic image hint -->
  <circle cx="105" cy="100" r="6" fill="#9944cc" opacity="0.1"/>
  <circle cx="125" cy="105" r="5" fill="#9944cc" opacity="0.08"/>

  <!-- Frame 3 (right wall) -->
  <rect x="1110" y="120" width="100" height="75" rx="2" fill="#0a0a1a"/>
  <rect x="1110" y="120" width="100" height="75" rx="2" fill="none" stroke="#9944cc" stroke-width="1.5" opacity="0.45" filter="url(#holoGlow)"/>
  <rect x="1118" y="128" width="84" height="59" fill="#9944cc" opacity="0.07"/>

  <!-- Modern side table (right) -->
  <rect x="1100" y="400" width="100" height="8" rx="2" fill="#2a2a3a"/>
  <rect x="1110" y="408" width="5" height="52" fill="#252535"/>
  <rect x="1185" y="408" width="5" height="52" fill="#252535"/>
  <!-- Lamp on side table -->
  <rect x="1135" y="350" width="30" height="50" rx="15" fill="#1a1a2a" stroke="#9944cc" stroke-width="1" opacity="0.4"/>
  <ellipse cx="1150" cy="350" rx="20" ry="5" fill="#9944cc" opacity="0.15"/>
  <!-- Lamp glow -->
  <ellipse cx="1150" cy="380" rx="50" ry="60" fill="#ffddaa" opacity="0.04" filter="url(#softGlow)"/>

  <!-- Modern shelf unit (right wall) -->
  <rect x="1100" y="230" width="140" height="130" fill="#1c1c30"/>
  <rect x="1100" y="230" width="140" height="130" fill="none" stroke="#2a2a45" stroke-width="1.5"/>
  <line x1="1100" y1="280" x2="1240" y2="280" stroke="#2a2a45" stroke-width="2"/>
  <line x1="1100" y1="320" x2="1240" y2="320" stroke="#2a2a45" stroke-width="2"/>
  <!-- Items on shelves -->
  <rect x="1110" y="240" width="25" height="35" fill="#334455" opacity="0.5"/>
  <rect x="1140" y="245" width="20" height="30" fill="#445566" opacity="0.4"/>
  <circle cx="1200" cy="260" r="12" fill="#1a1a30" stroke="#9944cc" stroke-width="1" opacity="0.3"/>
  <rect x="1115" y="290" width="45" height="25" fill="#222240" rx="3"/>
  <rect x="1180" y="285" width="15" height="30" fill="#553366" opacity="0.4"/>

  <!-- Tech accent - wall panel with subtle lights -->
  <rect x="380" y="400" width="300" height="55" fill="#1c1830"/>
  <rect x="380" y="400" width="300" height="55" fill="none" stroke="#2a2545" stroke-width="1"/>
  <!-- Panel lights -->
  <circle cx="400" cy="427" r="3" fill="#9944cc" opacity="0.4"/>
  <circle cx="420" cy="427" r="3" fill="#9944cc" opacity="0.2"/>
  <circle cx="440" cy="427" r="3" fill="#44cc88" opacity="0.3"/>
  <rect x="460" y="420" width="200" height="3" fill="#9944cc" opacity="0.15"/>
  <rect x="460" y="430" width="150" height="2" fill="#9944cc" opacity="0.1"/>

  <!-- Modern rug on floor -->
  <rect x="100" y="540" width="350" height="120" rx="5" fill="#2a2040" opacity="0.4"/>
  <rect x="110" y="550" width="330" height="100" rx="3" fill="none" stroke="#9944cc" stroke-width="1" opacity="0.15"/>
  <line x1="120" y1="600" x2="430" y2="600" stroke="#9944cc" stroke-width="0.5" opacity="0.1"/>

  <!-- Potted plant (far right) -->
  <rect x="1200" y="430" width="40" height="30" rx="3" fill="#2a2a3a"/>
  <!-- Plant leaves -->
  <path d="M1220 430 Q1210 400 1200 380" fill="none" stroke="#336644" stroke-width="2" opacity="0.6"/>
  <path d="M1220 430 Q1225 395 1235 375" fill="none" stroke="#336644" stroke-width="2" opacity="0.5"/>
  <path d="M1220 430 Q1215 405 1205 395" fill="none" stroke="#447755" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="1200" cy="378" rx="10" ry="6" fill="#336644" opacity="0.4"/>
  <ellipse cx="1235" cy="373" rx="8" ry="5" fill="#336644" opacity="0.35"/>
  <ellipse cx="1205" cy="393" rx="7" ry="4" fill="#447755" opacity="0.3"/>

  <!-- Warm ambient light overlay -->
  <rect width="1280" height="720" fill="url(#warmLight)"/>

  <!-- Purple accent lighting from ceiling -->
  <rect x="0" y="0" width="1280" height="5" fill="#9944cc" opacity="0.15"/>
  <rect x="0" y="0" width="1280" height="30" fill="#9944cc" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Subtle floor reflections -->
  <rect x="200" y="460" width="880" height="40" fill="#6688aa" opacity="0.02"/>
</svg>