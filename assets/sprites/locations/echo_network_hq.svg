  <circle cx="1203" cy="237" r="2" fill="#4488ff" opacity="0.5" filter="url(#blinkGlow)"/>

  <!-- Ominous red accent lighting -->
  <rect x="0" y="415" width="1280" height="5" fill="#ff2244" opacity="0.15" filter="url(#holoGlow)"/>
  <ellipse cx="640" cy="420" rx="640" ry="50" fill="url(#redAccent)"/>

  <!-- Floor reflections -->
  <rect x="100" y="430" width="180" height="40" fill="#4488ff" opacity="0.01"/>
  <rect x="1000" y="430" width="220" height="40" fill="#44ff44" opacity="0.01"/>

  <!-- Clean corridor atmosphere -->
  <rect width="1280" height="720" fill="#e0e0f0" opacity="0.03"/>
</svg>