<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#d0d0e0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c8d8"/>
      <stop offset="100%" stop-color="#b0b0c0"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0ea"/>
      <stop offset="100%" stop-color="#d0d0da"/>
    </linearGradient>
    <radialGradient id="redAccent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2244" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff2244" stop-opacity="0"/>
    </radialGradient>
    <filter id="holoGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blinkGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background - clean white -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Corridor walls -->
  <rect x="0" y="0" width="1280" height="420" fill="url(#wallGrad)"/>
  <!-- Wall panel lines -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#b0b0c0" stroke-width="1"/>
    <line x1="0" y1="210" x2="1280" y2="210" stroke="#b0b0c0" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#b0b0c0" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="420" stroke="#b0b0c0" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="420" stroke="#b0b0c0" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="420" stroke="#b0b0c0" stroke-width="1"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="420" width="1280" height="300" fill="url(#floorGrad)"/>
  <!-- Polished floor tiles -->
  <g opacity="0.08">
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1280" y2="540" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="0" y1="660" x2="1280" y2="660" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="160" y1="420" x2="160" y2="720" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="320" y1="420" x2="320" y2="720" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="480" y1="420" x2="480" y2="720" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="640" y1="420" x2="640" y2="720" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="800" y1="420" x2="800" y2="720" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="960" y1="420" x2="960" y2="720" stroke="#9090a0" stroke-width="0.5"/>
    <line x1="1120" y1="420" x2="1120" y2="720" stroke="#9090a0" stroke-width="0.5"/>
  </g>

  <!-- Ceiling LED strip -->
  <rect x="0" y="0" width="1280" height="4" fill="#ffffff" opacity="0.4"/>
  <rect x="0" y="0" width="1280" height="15" fill="#ffffff" opacity="0.03" filter="url(#softGlow)"/>

  <!-- Red accent lighting strip on ceiling -->
  <rect x="0" y="8" width="1280" height="2" fill="#ff2244" opacity="0.3" filter="url(#holoGlow)"/>

  <!-- Holographic displays (floating blue panels) -->
  <!-- Display 1 -->
  <rect x="100" y="120" width="180" height="120" rx="5" fill="#0a1a3a" opacity="0.3"/>
  <rect x="100" y="120" width="180" height="120" rx="5" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5" filter="url(#holoGlow)"/>
  <rect x="112" y="135" width="80" height="3" fill="#4488ff" opacity="0.3"/>
  <rect x="112" y="145" width="60" height="3" fill="#4488ff" opacity="0.25"/>
  <rect x="112" y="155" width="100" height="3" fill="#4488ff" opacity="0.3"/>
  <rect x="112" y="165" width="45" height="3" fill="#4488ff" opacity="0.2"/>
  <circle cx="240" cy="170" r="20" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.2"/>
  <circle cx="240" cy="170" r="12" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.15"/>
  <rect x="100" y="120" width="180" height="120" fill="#4488ff" opacity="0.01" filter="url(#softGlow)"/>

  <!-- Display 2 -->
  <rect x="400" y="80" width="200" height="140" rx="5" fill="#0a1a3a" opacity="0.3"/>
  <rect x="400" y="80" width="200" height="140" rx="5" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5" filter="url(#holoGlow)"/>
  <!-- Brain scan display -->
  <ellipse cx="500" cy="140" rx="50" ry="35" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.3"/>
  <path d="M470 130 Q485 115 500 130 Q515 145 530 130" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.25"/>
  <path d="M460 150 Q480 165 500 150 Q520 135 540 150" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.2"/>
  <rect x="412" y="190" width="60" height="2" fill="#4488ff" opacity="0.2"/>
  <rect x="412" y="198" width="80" height="2" fill="#4488ff" opacity="0.15"/>
  <rect x="520" y="190" width="50" height="2" fill="#ff4444" opacity="0.2"/>
  <rect x="400" y="80" width="200" height="140" fill="#4488ff" opacity="0.01" filter="url(#softGlow)"/>

  <!-- Display 3 -->
  <rect x="750" y="100" width="170" height="130" rx="5" fill="#0a1a3a" opacity="0.3"/>
  <rect x="750" y="100" width="170" height="130" rx="5" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5" filter="url(#holoGlow)"/>
  <rect x="762" y="115" width="90" height="3" fill="#4488ff" opacity="0.3"/>
  <rect x="762" y="125" width="70" height="3" fill="#4488ff" opacity="0.25"/>
  <rect x="762" y="135" width="110" height="3" fill="#4488ff" opacity="0.3"/>
  <polyline points="762,175 780,165 800,172 820,158 840,168 860,155 880,170 900,160" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.3"/>

  <!-- Neural interface pods (oval shapes with tubes) -->
  <!-- Pod 1 -->
  <ellipse cx="180" cy="380" rx="60" ry="40" fill="#c0c0d8" stroke="#a0a0b8" stroke-width="2"/>
  <ellipse cx="180" cy="380" rx="45" ry="28" fill="#d8d8e8"/>
  <ellipse cx="180" cy="380" rx="30" ry="18" fill="#e8e8f0" stroke="#b0b0c0" stroke-width="1"/>
  <!-- Tubes from pod -->
