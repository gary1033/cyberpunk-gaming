  <path d="M140 360 Q120 340 120 310" fill="none" stroke="#a0a0b8" stroke-width="3"/>
  <path d="M220 360 Q240 340 240 310" fill="none" stroke="#a0a0b8" stroke-width="3"/>
  <!-- Pod status light -->
  <circle cx="180" cy="380" r="5" fill="#4488ff" opacity="0.4" filter="url(#blinkGlow)"/>

  <!-- Pod 2 -->
  <ellipse cx="500" cy="370" rx="65" ry="45" fill="#c0c0d8" stroke="#a0a0b8" stroke-width="2"/>
  <ellipse cx="500" cy="370" rx="50" ry="32" fill="#d8d8e8"/>
  <ellipse cx="500" cy="370" rx="33" ry="20" fill="#e8e8f0" stroke="#b0b0c0" stroke-width="1"/>
  <path d="M500 325 Q500 290 520 270" fill="none" stroke="#a0a0b8" stroke-width="4"/>
  <path d="M455 345 Q435 325 435 300" fill="none" stroke="#a0a0b8" stroke-width="3"/>
  <path d="M545 345 Q565 325 565 300" fill="none" stroke="#a0a0b8" stroke-width="3"/>
  <circle cx="500" cy="370" r="5" fill="#44ff44" opacity="0.4" filter="url(#blinkGlow)"/>

