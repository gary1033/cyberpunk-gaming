  <rect x="1005" y="110" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="130" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="150" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="170" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="190" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="210" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="230" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="250" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="270" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="290" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="310" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="330" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="350" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="370" width="50" height="15" fill="#1a1a30"/>
  <rect x="1005" y="390" width="50" height="15" fill="#1a1a30"/>
  <!-- Blinking lights on rack -->
  <circle cx="1048" cy="117" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="137" r="2" fill="#4488ff" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="157" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="177" r="2" fill="#ff4444" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="197" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="217" r="2" fill="#4488ff" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="237" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="257" r="2" fill="#44ff44" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="277" r="2" fill="#ff4444" opacity="0.4" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="297" r="2" fill="#4488ff" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="317" r="2" fill="#44ff44" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="337" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="357" r="2" fill="#4488ff" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="377" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1048" cy="397" r="2" fill="#ff4444" opacity="0.4" filter="url(#blinkGlow)"/>

  <!-- Rack 2 -->
  <rect x="1080" y="100" width="60" height="320" fill="#2a2a40" stroke="#3a3a55" stroke-width="2"/>
  <rect x="1085" y="110" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="130" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="150" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="170" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="190" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="210" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="230" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="250" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="270" width="50" height="15" fill="#1a1a30"/>
  <rect x="1085" y="290" width="50" height="15" fill="#1a1a30"/>
  <circle cx="1128" cy="117" r="2" fill="#44ff44" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="137" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="157" r="2" fill="#ff4444" opacity="0.4" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="177" r="2" fill="#4488ff" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="197" r="2" fill="#44ff44" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="217" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="237" r="2" fill="#ff4444" opacity="0.4" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="257" r="2" fill="#4488ff" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="277" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1128" cy="297" r="2" fill="#44ff44" opacity="0.5" filter="url(#blinkGlow)"/>

  <!-- Rack 3 -->
  <rect x="1160" y="120" width="55" height="300" fill="#2a2a40" stroke="#3a3a55" stroke-width="2"/>
  <rect x="1165" y="130" width="45" height="15" fill="#1a1a30"/>
  <rect x="1165" y="150" width="45" height="15" fill="#1a1a30"/>
  <rect x="1165" y="170" width="45" height="15" fill="#1a1a30"/>
  <rect x="1165" y="190" width="45" height="15" fill="#1a1a30"/>
  <rect x="1165" y="210" width="45" height="15" fill="#1a1a30"/>
  <rect x="1165" y="230" width="45" height="15" fill="#1a1a30"/>
  <circle cx="1203" cy="137" r="2" fill="#4488ff" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1203" cy="157" r="2" fill="#44ff44" opacity="0.6" filter="url(#blinkGlow)"/>
  <circle cx="1203" cy="177" r="2" fill="#44ff44" opacity="0.5" filter="url(#blinkGlow)"/>
  <circle cx="1203" cy="197" r="2" fill="#ff4444" opacity="0.4" filter="url(#blinkGlow)"/>
