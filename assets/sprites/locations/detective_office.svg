  <line x1="0" y1="200" x2="1280" y2="200" stroke="#1a1830" stroke-width="1"/>
  <line x1="0" y1="300" x2="1280" y2="300" stroke="#1a1830" stroke-width="1"/>
  <line x1="0" y1="400" x2="1280" y2="400" stroke="#1a1830" stroke-width="1"/>

  <!-- Floor -->
