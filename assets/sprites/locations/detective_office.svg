<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1428"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampRadial" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1428"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#2a1c12"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5e5"/>
      <stop offset="50%" stop-color="#006666"/>
      <stop offset="100%" stop-color="#003333"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="screenFlicker">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="windowClip">
      <rect x="700" y="60" width="520" height="380"/>
    </clipPath>
  </defs>

  <!-- Background layer -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Back wall -->
  <rect x="0" y="0" width="1280" height="500" fill="#12101e"/>
