<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5d5e5"/>
      <stop offset="100%" stop-color="#b5b5c8"/>
    </linearGradient>
    <linearGradient id="benchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a60"/>
      <stop offset="100%" stop-color="#6a5a40"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0a0b0"/>
      <stop offset="100%" stop-color="#909098"/>
    </linearGradient>
    <radialGradient id="workLight" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#ffeedd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffeedd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenAmbient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00cccc" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00cccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00bbcc"/>
      <stop offset="50%" stop-color="#007788"/>
      <stop offset="100%" stop-color="#003844"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="ledGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

