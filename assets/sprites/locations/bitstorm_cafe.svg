  <rect x="1072" y="175" width="55" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="1072" y="182" width="70" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="1082" y="189" width="40" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="1072" y="196" width="60" height="2" fill="#44ff44" opacity="0.3"/>
