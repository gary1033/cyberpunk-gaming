  <rect x="910" y="275" width="20" height="8" fill="#1a1a30"/>

  <!-- Terminal row 6 -->
  <rect x="1040" y="280" width="160" height="15" rx="2" fill="#1a1830"/>
  <rect x="1050" y="295" width="8" height="80" fill="#141228"/>
  <rect x="1182" y="295" width="8" height="80" fill="#141228"/>
  <rect x="1060" y="160" width="120" height="115" rx="3" fill="#0a0a14"/>
