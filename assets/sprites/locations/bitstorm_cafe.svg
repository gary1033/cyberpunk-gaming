  <rect x="672" y="196" width="75" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="682" y="203" width="45" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="660" y="160" width="120" height="115" fill="#44ff44" opacity="0.02" filter="url(#softGlow)"/>
  <rect x="710" y="275" width="20" height="8" fill="#1a1a30"/>

