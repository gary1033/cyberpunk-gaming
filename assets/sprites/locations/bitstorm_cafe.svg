  <rect x="282" y="238" width="35" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="260" y="160" width="120" height="115" fill="#44ff44" opacity="0.02" filter="url(#softGlow)"/>
  <rect x="310" y="275" width="20" height="8" fill="#1a1a30"/>

  <!-- Terminal row 3 -->
  <rect x="440" y="280" width="160" height="15" rx="2" fill="#1a1830"/>
  <rect x="450" y="295" width="8" height="80" fill="#141228"/>
  <rect x="582" y="295" width="8" height="80" fill="#141228"/>
  <rect x="460" y="160" width="120" height="115" rx="3" fill="#0a0a14"/>
  <rect x="460" y="160" width="120" height="115" rx="3" fill="none" stroke="#1a1a30" stroke-width="2"/>
  <rect x="466" y="166" width="108" height="103" fill="url(#screenGrad)"/>
  <rect x="472" y="175" width="55" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="472" y="182" width="70" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="482" y="189" width="40" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="472" y="196" width="80" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="482" y="203" width="50" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="472" y="210" width="60" height="2" fill="#44ff44" opacity="0.5"/>
