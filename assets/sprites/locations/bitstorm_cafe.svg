  <rect x="1110" y="275" width="20" height="8" fill="#1a1a30"/>

  <!-- Gaming chairs -->
  <rect x="90" y="350" width="60" height="50" rx="8" fill="#1a1035" stroke="#2a204a" stroke-width="1"/>
  <rect x="100" y="400" width="40" height="15" rx="3" fill="#1a1035"/>
  <rect x="290" y="350" width="60" height="50" rx="8" fill="#1a1035" stroke="#2a204a" stroke-width="1"/>
  <rect x="300" y="400" width="40" height="15" rx="3" fill="#1a1035"/>
  <rect x="490" y="350" width="60" height="50" rx="8" fill="#1a1035" stroke="#2a204a" stroke-width="1"/>
  <rect x="500" y="400" width="40" height="15" rx="3" fill="#1a1035"/>
  <rect x="690" y="350" width="60" height="50" rx="8" fill="#1a1035" stroke="#2a204a" stroke-width="1"/>
  <rect x="700" y="400" width="40" height="15" rx="3" fill="#1a1035"/>
  <rect x="890" y="350" width="60" height="50" rx="8" fill="#1a1035" stroke="#2a204a" stroke-width="1"/>
  <rect x="900" y="400" width="40" height="15" rx="3" fill="#1a1035"/>
  <rect x="1090" y="350" width="60" height="50" rx="8" fill="#1a1035" stroke="#2a204a" stroke-width="1"/>
  <rect x="1100" y="400" width="40" height="15" rx="3" fill="#1a1035"/>

  <!-- VR headsets hanging from ceiling -->
  <line x1="150" y1="40" x2="150" y2="80" stroke="#2a2a40" stroke-width="1.5"/>
  <rect x="138" y="80" width="24" height="15" rx="4" fill="#1a1a30" stroke="#3a3a55" stroke-width="1"/>
  <line x1="550" y1="40" x2="550" y2="75" stroke="#2a2a40" stroke-width="1.5"/>
  <rect x="538" y="75" width="24" height="15" rx="4" fill="#1a1a30" stroke="#3a3a55" stroke-width="1"/>
  <line x1="950" y1="40" x2="950" y2="78" stroke="#2a2a40" stroke-width="1.5"/>
  <rect x="938" y="78" width="24" height="15" rx="4" fill="#1a1a30" stroke="#3a3a55" stroke-width="1"/>

  <!-- Neon wall decorations -->
  <rect x="0" y="60" width="1280" height="2" fill="#8844cc" opacity="0.3" filter="url(#neonGlow)"/>
  <rect x="0" y="130" width="1280" height="1" fill="#44ff44" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Neon sign on wall -->
  <rect x="50" y="70" width="180" height="50" rx="3" fill="#0a0814" stroke="#44ff44" stroke-width="1.5" opacity="0.5" filter="url(#screenGlow)"/>
  <text x="140" y="102" font-family="monospace" font-size="22" fill="#44ff44" text-anchor="middle" opacity="0.8" filter="url(#neonGlow)">BITSTORM</text>

  <!-- Snack wrappers on desks/floor -->
  <rect x="90" y="275" width="15" height="8" fill="#cc4444" opacity="0.2" transform="rotate(10 97 279)"/>
  <rect x="500" y="273" width="12" height="10" fill="#4444cc" opacity="0.15" transform="rotate(-15 506 278)"/>
  <rect x="350" y="450" width="18" height="8" fill="#cccc44" opacity="0.1" transform="rotate(25 359 454)"/>
  <rect x="750" y="460" width="14" height="9" fill="#44cccc" opacity="0.12" transform="rotate(-8 757 464)"/>

  <!-- Energy drink cans -->
  <rect x="185" y="268" width="10" height="18" rx="3" fill="#1a3a1a" opacity="0.5"/>
  <rect x="785" y="270" width="10" height="18" rx="3" fill="#3a1a1a" opacity="0.5"/>

  <!-- Purple ambient underglow -->
  <rect x="0" y="440" width="1280" height="280" fill="url(#purpleAmbient)"/>

  <!-- Green screen glow ambient -->
  <rect width="1280" height="720" fill="url(#limeAmbient)"/>

  <!-- Atmosphere overlay -->
  <rect width="1280" height="720" fill="#060412" opacity="0.15"/>
</svg>