<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0818"/>
      <stop offset="100%" stop-color="#060412"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#080614"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003300"/>
      <stop offset="100%" stop-color="#001a00"/>
    </linearGradient>
    <radialGradient id="limeAmbient" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#44ff44" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#44ff44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleAmbient" cx="0.5" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#8844cc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8844cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Back wall -->
  <rect x="0" y="0" width="1280" height="440" fill="#0c0a18"/>

  <!-- Ceiling -->
  <rect x="0" y="0" width="1280" height="40" fill="#080614"/>
  <!-- Ceiling neon strip -->
  <rect x="100" y="38" width="1080" height="3" fill="#44ff44" opacity="0.3" filter="url(#neonGlow)"/>
  <rect x="100" y="38" width="1080" height="1" fill="#88ff88" opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="440" width="1280" height="280" fill="url(#floorGrad)"/>
  <!-- Floor tiles -->
  <g opacity="0.06">
    <line x1="0" y1="500" x2="1280" y2="500" stroke="#44ff44" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#44ff44" stroke-width="0.5"/>
    <line x1="0" y1="620" x2="1280" y2="620" stroke="#44ff44" stroke-width="0.5"/>
    <line x1="0" y1="680" x2="1280" y2="680" stroke="#44ff44" stroke-width="0.5"/>
  </g>

  <!-- Terminal row 1 (left side) -->
  <!-- Desk -->
  <rect x="40" y="280" width="160" height="15" rx="2" fill="#1a1830"/>
  <rect x="50" y="295" width="8" height="80" fill="#141228"/>
  <rect x="182" y="295" width="8" height="80" fill="#141228"/>
  <!-- Monitor -->
  <rect x="60" y="160" width="120" height="115" rx="3" fill="#0a0a14"/>
  <rect x="60" y="160" width="120" height="115" rx="3" fill="none" stroke="#1a1a30" stroke-width="2"/>
  <rect x="66" y="166" width="108" height="103" fill="url(#screenGrad)"/>
  <!-- Code on screen -->
  <rect x="72" y="175" width="50" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="72" y="182" width="70" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="82" y="189" width="40" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="82" y="196" width="60" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="72" y="203" width="55" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="72" y="210" width="80" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="82" y="217" width="45" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="72" y="224" width="65" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="72" y="231" width="35" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="82" y="238" width="50" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="72" y="245" width="70" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="72" y="252" width="40" height="2" fill="#44ff44" opacity="0.3"/>
  <!-- Screen glow -->
  <rect x="60" y="160" width="120" height="115" fill="#44ff44" opacity="0.02" filter="url(#softGlow)"/>
  <!-- Monitor stand -->
  <rect x="110" y="275" width="20" height="8" fill="#1a1a30"/>

  <!-- Terminal row 2 -->
  <rect x="240" y="280" width="160" height="15" rx="2" fill="#1a1830"/>
  <rect x="250" y="295" width="8" height="80" fill="#141228"/>
  <rect x="382" y="295" width="8" height="80" fill="#141228"/>
  <rect x="260" y="160" width="120" height="115" rx="3" fill="#0a0a14"/>
  <rect x="260" y="160" width="120" height="115" rx="3" fill="none" stroke="#1a1a30" stroke-width="2"/>
  <rect x="266" y="166" width="108" height="103" fill="url(#screenGrad)"/>
  <rect x="272" y="175" width="60" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="272" y="182" width="45" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="282" y="189" width="55" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="272" y="196" width="70" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="282" y="203" width="40" height="2" fill="#44ff44" opacity="0.5"/>
  <rect x="272" y="210" width="65" height="2" fill="#44ff44" opacity="0.4"/>
  <rect x="272" y="217" width="80" height="2" fill="#44ff44" opacity="0.3"/>
  <rect x="282" y="224" width="50" height="2" fill="#44ff44" opacity="0.5"/>
