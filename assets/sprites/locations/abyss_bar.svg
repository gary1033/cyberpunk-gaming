<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0008"/>
      <stop offset="100%" stop-color="#180012"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a22"/>
      <stop offset="100%" stop-color="#1a0e15"/>
    </linearGradient>
    <linearGradient id="neonStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ff0066"/>
      <stop offset="85%" stop-color="#ff3388"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0d0008"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e000a"/>
      <stop offset="100%" stop-color="#060004"/>
    </linearGradient>
    <linearGradient id="boothShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050003"/>
      <stop offset="100%" stop-color="#0a0008"/>
    </linearGradient>
    <radialGradient id="smokeGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#aa4488" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#aa4488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceilingLight" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff0066" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="smokeFilter">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

