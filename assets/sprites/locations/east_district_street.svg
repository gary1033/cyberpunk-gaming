<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040412"/>
      <stop offset="100%" stop-color="#0a0a20"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="buildingL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0c1e"/>
      <stop offset="100%" stop-color="#08081a"/>
    </linearGradient>
    <linearGradient id="buildingR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#0c0c1e"/>
    </linearGradient>
    <linearGradient id="wetGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a25" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#060615" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff1493" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff1493" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffdd00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffdd00" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="signGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Left building block -->
