  <rect x="0" y="0" width="115" height="720" fill="#0b0b1c"/>
  <rect x="120" y="0" width="200" height="720" fill="#0a0a1a"/>
  <rect x="0" y="200" width="320" height="4" fill="#141428"/>
  <rect x="0" y="350" width="320" height="3" fill="#141428"/>
  <!-- Left windows -->
  <g opacity="0.5">
    <rect x="15" y="35" width="14" height="10" fill="#ffdd44" opacity="0.45"/>
    <rect x="45" y="35" width="14" height="10" fill="#00cccc" opacity="0.35"/>
