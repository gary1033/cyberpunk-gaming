  <rect x="1115" y="0" width="165" height="720" fill="#0b0b1c"/>
  <rect x="960" y="180" width="320" height="4" fill="#141428"/>
  <rect x="960" y="330" width="320" height="3" fill="#141428"/>
  <!-- Right windows -->
