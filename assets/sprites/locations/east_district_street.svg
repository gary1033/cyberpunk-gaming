    <rect x="145" y="90" width="16" height="12" fill="#00cccc" opacity="0.5"/>
    <rect x="180" y="90" width="16" height="12" fill="#ffdd44" opacity="0.4"/>
    <rect x="255" y="90" width="16" height="12" fill="#ff66aa" opacity="0.3"/>
    <rect x="145" y="135" width="16" height="12" fill="#ffdd44" opacity="0.3"/>
    <rect x="215" y="135" width="16" height="12" fill="#00cccc" opacity="0.4"/>
    <rect x="145" y="225" width="16" height="12" fill="#ff66aa" opacity="0.4"/>
    <rect x="180" y="225" width="16" height="12" fill="#ffdd44" opacity="0.3"/>
