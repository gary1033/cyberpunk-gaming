  <ellipse cx="500" cy="575" rx="80" ry="25" fill="#ff1493" opacity="0.035"/>
  <ellipse cx="500" cy="573" rx="30" ry="8" fill="#ff1493" opacity="0.05"/>
  <ellipse cx="750" cy="625" rx="70" ry="22" fill="#0a0a25" opacity="0.5"/>
  <ellipse cx="750" cy="625" rx="70" ry="22" fill="#00e5ff" opacity="0.035"/>
  <ellipse cx="750" cy="623" rx="25" ry="7" fill="#00e5ff" opacity="0.045"/>
