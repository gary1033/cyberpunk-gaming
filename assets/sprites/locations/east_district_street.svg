    <rect x="1005" y="40" width="15" height="11" fill="#ffdd44" opacity="0.5"/>
    <rect x="1035" y="40" width="15" height="11" fill="#ff66aa" opacity="0.3"/>
    <rect x="1070" y="40" width="15" height="11" fill="#ffdd44" opacity="0.4"/>
    <rect x="975" y="85" width="15" height="11" fill="#ffdd44" opacity="0.3"/>
