  <rect x="320" y="470" width="80" height="250" fill="#0e0e1e"/>
  <line x1="320" y1="470" x2="320" y2="720" stroke="#1a1a2a" stroke-width="2"/>
  <rect x="880" y="470" width="80" height="250" fill="#0e0e1e"/>
  <line x1="960" y1="470" x2="960" y2="720" stroke="#1a1a2a" stroke-width="2"/>
