<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa840"/>
      <stop offset="30%" stop-color="#ffcc66"/>
      <stop offset="60%" stop-color="#88aacc"/>
      <stop offset="100%" stop-color="#6688aa"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221a12"/>
      <stop offset="100%" stop-color="#18120c"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3825"/>
      <stop offset="100%" stop-color="#3a2a18"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.7" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunbeam" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#ffdd88" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffdd88" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="warmFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="windowClip">
      <rect x="700" y="60" width="520" height="380"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Back wall - warmer tone -->
  <rect x="0" y="0" width="1280" height="500" fill="#1e1810"/>
  <line x1="0" y1="100" x2="1280" y2="100" stroke="#2a2218" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="200" x2="1280" y2="200" stroke="#2a2218" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="300" x2="1280" y2="300" stroke="#2a2218" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="400" x2="1280" y2="400" stroke="#2a2218" stroke-width="1" opacity="0.3"/>

  <!-- Floor -->
  <polygon points="0,500 1280,500 1280,720 0,720" fill="url(#floorGrad)"/>
  <line x1="0" y1="540" x2="1280" y2="540" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="580" x2="1280" y2="580" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="630" x2="1280" y2="630" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="680" x2="1280" y2="680" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="500" x2="200" y2="720" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="500" x2="450" y2="720" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="500" x2="700" y2="720" stroke="#2a2015" stroke-width="1" opacity="0.3"/>
  <line x1="950" y1="500" x2="950" y2="720" stroke="#2a2015" stroke-width="1" opacity="0.3"/>

  <!-- Window with morning golden light -->
  <rect x="700" y="60" width="520" height="380" fill="url(#windowSky)"/>
  <rect x="695" y="55" width="530" height="390" fill="none" stroke="#3a3025" stroke-width="6" rx="3"/>
  <line x1="960" y1="55" x2="960" y2="445" stroke="#3a3025" stroke-width="4"/>
  <line x1="695" y1="250" x2="1225" y2="250" stroke="#3a3025" stroke-width="4"/>

  <!-- Morning city through window -->
  <g clip-path="url(#windowClip)">
    <rect x="700" y="60" width="520" height="380" fill="url(#windowSky)"/>
    <!-- Silhouette buildings in morning light -->
    <rect x="710" y="220" width="40" height="220" fill="#2a3040" opacity="0.5"/>
    <rect x="755" y="190" width="55" height="250" fill="#253040" opacity="0.45"/>
    <rect x="815" y="240" width="35" height="200" fill="#2a3545" opacity="0.4"/>
    <rect x="860" y="170" width="50" height="270" fill="#253040" opacity="0.5"/>
    <rect x="920" y="210" width="45" height="230" fill="#2a3040" opacity="0.45"/>
    <rect x="975" y="150" width="60" height="290" fill="#253545" opacity="0.4"/>
    <rect x="1045" y="200" width="40" height="240" fill="#2a3040" opacity="0.45"/>
    <rect x="1090" y="230" width="55" height="210" fill="#253040" opacity="0.4"/>
    <rect x="1150" y="180" width="50" height="260" fill="#2a3545" opacity="0.45"/>
  </g>

  <!-- Sunbeams from window -->
  <polygon points="700,60 900,60 1100,500 700,500" fill="#ffcc66" opacity="0.04"/>
  <polygon points="800,60 960,60 1000,500 780,500" fill="#ffdd88" opacity="0.03"/>
  <polygon points="960,60 1100,60 1050,500 900,500" fill="#ffcc66" opacity="0.025"/>
  <!-- Venetian blind sunbeam stripes -->
  <g opacity="0.06">
    <rect x="700" y="460" width="500" height="8" fill="#ffcc66"/>
    <rect x="710" y="480" width="480" height="8" fill="#ffcc66"/>
    <rect x="720" y="500" width="460" height="8" fill="#ffcc66"/>
    <rect x="730" y="520" width="440" height="8" fill="#ffcc66"/>
    <rect x="740" y="540" width="420" height="8" fill="#ffcc66"/>
    <rect x="750" y="560" width="400" height="8" fill="#ffcc66"/>
  </g>

  <!-- Golden light spill from window -->
  <rect x="700" y="60" width="520" height="380" fill="#ffcc66" opacity="0.05"/>
  <rect x="700" y="440" width="520" height="80" fill="url(#windowLight)" opacity="0.5"/>

  <!-- Filing cabinets (same as original but warmer) -->
  <rect x="30" y="250" width="130" height="250" rx="3" fill="#2a2518"/>
  <rect x="30" y="250" width="130" height="250" rx="3" fill="none" stroke="#3a3020" stroke-width="2"/>
  <rect x="40" y="260" width="110" height="55" rx="2" fill="#2e2818"/>
  <rect x="40" y="325" width="110" height="55" rx="2" fill="#2e2818"/>
  <rect x="40" y="390" width="110" height="55" rx="2" fill="#2e2818"/>
  <rect x="40" y="455" width="110" height="35" rx="2" fill="#2e2818"/>
  <rect x="80" y="283" width="30" height="4" rx="2" fill="#4a4030"/>
  <rect x="80" y="348" width="30" height="4" rx="2" fill="#4a4030"/>
  <rect x="80" y="413" width="30" height="4" rx="2" fill="#4a4030"/>
  <rect x="80" y="470" width="30" height="4" rx="2" fill="#4a4030"/>

  <!-- Second cabinet -->
  <rect x="180" y="300" width="110" height="200" rx="3" fill="#2c2618"/>
  <rect x="180" y="300" width="110" height="200" rx="3" fill="none" stroke="#3a3020" stroke-width="2"/>
  <rect x="190" y="310" width="90" height="45" rx="2" fill="#302a1a"/>
  <rect x="190" y="365" width="90" height="45" rx="2" fill="#302a1a"/>
  <rect x="190" y="420" width="90" height="45" rx="2" fill="#302a1a"/>
  <rect x="225" y="328" width="25" height="4" rx="2" fill="#4a4030"/>
  <rect x="225" y="383" width="25" height="4" rx="2" fill="#4a4030"/>
  <rect x="225" y="438" width="25" height="4" rx="2" fill="#4a4030"/>

  <!-- Cleaner desk -->
  <rect x="320" y="400" width="360" height="20" rx="2" fill="url(#deskGrad)"/>
  <rect x="320" y="400" width="360" height="20" rx="2" fill="none" stroke="#5a4530" stroke-width="1"/>
  <rect x="330" y="420" width="12" height="100" fill="#3a2a18"/>
  <rect x="658" y="420" width="12" height="100" fill="#3a2a18"/>
  <rect x="340" y="430" width="140" height="60" fill="#352818" stroke="#4a3825" stroke-width="1" rx="2"/>
  <rect x="395" y="456" width="30" height="4" rx="2" fill="#5a4535"/>
  <rect x="520" y="430" width="140" height="60" fill="#352818" stroke="#4a3825" stroke-width="1" rx="2"/>
  <rect x="575" y="456" width="30" height="4" rx="2" fill="#5a4535"/>

  <!-- Coffee cup (steaming) -->
  <ellipse cx="345" cy="395" rx="14" ry="5" fill="#3a3028"/>
  <rect x="331" y="375" width="28" height="20" rx="3" fill="#3a3028"/>
  <ellipse cx="345" cy="375" rx="14" ry="5" fill="#2a2018"/>
  <path d="M359 380 Q368 383 368 390 Q368 397 359 398" fill="none" stroke="#3a3028" stroke-width="3"/>
  <!-- More visible steam (morning warmth) -->
  <path d="M340 370 Q338 355 342 342" fill="none" stroke="#ccbb99" stroke-width="1.5" opacity="0.25"/>
  <path d="M348 370 Q350 352 346 340" fill="none" stroke="#ccbb99" stroke-width="1.5" opacity="0.2"/>
  <path d="M336 368 Q333 358 338 348" fill="none" stroke="#ccbb99" stroke-width="1" opacity="0.15"/>

  <!-- Newspaper on desk -->
  <rect x="400" y="388" width="60" height="40" fill="#d8d0b8" opacity="0.25"/>
  <rect x="405" y="393" width="50" height="2" fill="#8a8068" opacity="0.2"/>
  <rect x="405" y="400" width="40" height="1.5" fill="#8a8068" opacity="0.15"/>
  <rect x="405" y="406" width="45" height="1.5" fill="#8a8068" opacity="0.15"/>
  <rect x="405" y="412" width="35" height="1.5" fill="#8a8068" opacity="0.12"/>

  <!-- Small plant on desk -->
  <rect x="480" y="385" width="20" height="18" rx="3" fill="#3a3528"/>
  <ellipse cx="490" cy="380" rx="15" ry="10" fill="#2a5520" opacity="0.6"/>
  <ellipse cx="485" cy="372" rx="10" ry="12" fill="#2a6625" opacity="0.5"/>
  <ellipse cx="497" cy="375" rx="12" ry="10" fill="#2a5a22" opacity="0.5"/>
  <path d="M490 385 Q488 370 482 360" fill="none" stroke="#2a6630" stroke-width="1" opacity="0.4"/>
  <path d="M490 385 Q493 368 498 358" fill="none" stroke="#2a6630" stroke-width="1" opacity="0.4"/>

  <!-- Bookshelf (warmer) -->
  <rect x="560" y="100" width="120" height="340" fill="#2a2418"/>
  <rect x="560" y="100" width="120" height="340" fill="none" stroke="#352e1e" stroke-width="2"/>
  <line x1="560" y1="180" x2="680" y2="180" stroke="#352e1e" stroke-width="3"/>
  <line x1="560" y1="260" x2="680" y2="260" stroke="#352e1e" stroke-width="3"/>
  <line x1="560" y1="340" x2="680" y2="340" stroke="#352e1e" stroke-width="3"/>
  <rect x="568" y="110" width="12" height="65" fill="#8b5544" opacity="0.6"/>
  <rect x="583" y="115" width="10" height="60" fill="#5a7088" opacity="0.6"/>
  <rect x="596" y="108" width="14" height="67" fill="#558b5a" opacity="0.5"/>
  <rect x="613" y="112" width="11" height="63" fill="#8b8044" opacity="0.6"/>
  <rect x="627" y="118" width="9" height="57" fill="#7755aa" opacity="0.5"/>
  <rect x="640" y="110" width="13" height="65" fill="#aa6066" opacity="0.5"/>
  <rect x="656" y="114" width="10" height="61" fill="#5a88aa" opacity="0.5"/>

  <!-- Wall clock -->
  <circle cx="300" cy="150" r="25" fill="#2a2518" stroke="#3a3020" stroke-width="2"/>
  <circle cx="300" cy="150" r="2" fill="#ffcc66" opacity="0.5"/>
  <line x1="300" y1="150" x2="300" y2="132" stroke="#ffcc66" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="150" x2="315" y2="155" stroke="#ffcc66" stroke-width="1" opacity="0.3"/>

  <!-- Chair -->
  <rect x="440" y="520" width="120" height="15" rx="5" fill="#2a2518"/>
  <rect x="445" y="535" width="10" height="40" fill="#2a2518"/>
  <rect x="545" y="535" width="10" height="40" fill="#2a2518"/>
  <rect x="435" y="475" width="130" height="50" rx="8" fill="#302a1e"/>
  <rect x="435" y="475" width="130" height="50" rx="8" fill="none" stroke="#3a3525" stroke-width="1"/>
  <circle cx="450" cy="578" r="5" fill="#2a2518"/>
  <circle cx="555" cy="578" r="5" fill="#2a2518"/>
  <circle cx="500" cy="580" r="5" fill="#2a2518"/>

  <!-- Warm golden light overlay -->
  <rect width="1280" height="720" fill="url(#warmGlow)"/>
  <rect width="1280" height="720" fill="url(#sunbeam)"/>

  <!-- Golden morning dust particles -->
  <circle cx="800" cy="200" r="1.5" fill="#ffcc66" opacity="0.2"/>
  <circle cx="850" cy="300" r="1.2" fill="#ffcc66" opacity="0.18"/>
  <circle cx="780" cy="350" r="1" fill="#ffcc66" opacity="0.15"/>
  <circle cx="900" cy="250" r="1.3" fill="#ffcc66" opacity="0.22"/>
  <circle cx="820" cy="400" r="0.8" fill="#ffcc66" opacity="0.12"/>
  <circle cx="750" cy="280" r="1.4" fill="#ffcc66" opacity="0.16"/>
  <circle cx="870" cy="180" r="1.1" fill="#ffcc66" opacity="0.2"/>
  <circle cx="950" cy="320" r="1" fill="#ffcc66" opacity="0.14"/>
  <circle cx="830" cy="450" r="0.9" fill="#ffcc66" opacity="0.1"/>
  <circle cx="760" cy="150" r="1.2" fill="#ffcc66" opacity="0.18"/>

  <!-- Soft warm atmosphere -->
  <rect width="1280" height="720" fill="#ffcc66" opacity="0.02"/>
</svg>