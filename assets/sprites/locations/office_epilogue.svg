<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2810"/>
      <stop offset="100%" stop-color="#2a1c0e"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3820"/>
      <stop offset="100%" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#2e2010"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc44"/>
      <stop offset="30%" stop-color="#ff9922"/>
      <stop offset="60%" stop-color="#ff7744"/>
      <stop offset="100%" stop-color="#cc5533"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4428"/>
      <stop offset="100%" stop-color="#4a3620"/>
    </linearGradient>
    <linearGradient id="cabinetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a3a22"/>
      <stop offset="50%" stop-color="#5a4830"/>
      <stop offset="100%" stop-color="#4a3a22"/>
    </linearGradient>
    <linearGradient id="lampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffee88"/>
      <stop offset="100%" stop-color="#ffcc44"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ff9922" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff9922" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffcc44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmAmbient" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff9922" stop-opacity="0"/>
    </radialGradient>
    <filter id="warmGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="steamBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="sunbeamBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background wall -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Wall -->
  <rect x="0" y="0" width="1280" height="460" fill="url(#wallGrad)"/>
  <!-- Wainscoting -->
  <rect x="0" y="350" width="1280" height="110" fill="#3e2c16" opacity="0.5"/>
  <line x1="0" y1="350" x2="1280" y2="350" stroke="#5a4428" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="460" x2="1280" y2="460" stroke="#5a4428" stroke-width="2" opacity="0.3"/>

  <!-- Floor -->
  <rect x="0" y="460" width="1280" height="260" fill="url(#floorGrad)"/>
  <!-- Floor boards -->
  <g opacity="0.08">
    <line x1="0" y1="520" x2="1280" y2="520" stroke="#6a5838" stroke-width="0.5"/>
    <line x1="0" y1="580" x2="1280" y2="580" stroke="#6a5838" stroke-width="0.5"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#6a5838" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1280" y2="700" stroke="#6a5838" stroke-width="0.5"/>
    <line x1="200" y1="460" x2="200" y2="720" stroke="#6a5838" stroke-width="0.3"/>
    <line x1="400" y1="460" x2="400" y2="720" stroke="#6a5838" stroke-width="0.3"/>
    <line x1="600" y1="460" x2="600" y2="720" stroke="#6a5838" stroke-width="0.3"/>
    <line x1="800" y1="460" x2="800" y2="720" stroke="#6a5838" stroke-width="0.3"/>
    <line x1="1000" y1="460" x2="1000" y2="720" stroke="#6a5838" stroke-width="0.3"/>
  </g>

  <!-- Window (morning sky) -->
  <rect x="520" y="60" width="340" height="300" rx="3" fill="#2a1c0e" stroke="#6a5838" stroke-width="6"/>
  <rect x="530" y="70" width="320" height="280" fill="url(#skyGrad)"/>
  <!-- Window frame cross -->
  <line x1="690" y1="70" x2="690" y2="350" stroke="#6a5838" stroke-width="4"/>
  <line x1="530" y1="210" x2="850" y2="210" stroke="#6a5838" stroke-width="4"/>
  <!-- Sun glow in window -->
  <circle cx="690" cy="140" r="30" fill="#ffee88" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="690" cy="140" r="15" fill="#ffffff" opacity="0.5"/>
  <!-- Distant buildings silhouette in window -->
  <rect x="535" y="270" width="30" height="80" fill="#cc5533" opacity="0.3"/>
  <rect x="570" y="285" width="25" height="65" fill="#cc5533" opacity="0.25"/>
  <rect x="600" y="260" width="35" height="90" fill="#cc5533" opacity="0.3"/>
  <rect x="730" y="275" width="28" height="75" fill="#cc5533" opacity="0.25"/>
  <rect x="765" y="255" width="40" height="95" fill="#cc5533" opacity="0.3"/>
  <rect x="810" y="280" width="30" height="70" fill="#cc5533" opacity="0.25"/>
  <!-- Window glow onto wall -->
  <ellipse cx="690" cy="200" rx="250" ry="200" fill="url(#sunGlow)"/>

  <!-- Sunbeams coming through window -->
  <g opacity="0.12">
    <rect x="560" y="100" width="80" height="500" fill="#ffcc44" transform="rotate(15, 600, 350)" filter="url(#sunbeamBlur)"/>
    <rect x="650" y="100" width="60" height="500" fill="#ffcc44" transform="rotate(12, 680, 350)" filter="url(#sunbeamBlur)"/>
    <rect x="740" y="100" width="70" height="500" fill="#ffcc44" transform="rotate(8, 775, 350)" filter="url(#sunbeamBlur)"/>
  </g>

  <!-- Filing cabinet (cleaned, left side) -->
  <rect x="60" y="260" width="120" height="200" rx="3" fill="url(#cabinetGrad)" stroke="#5a4428" stroke-width="2"/>
  <!-- Drawer lines -->
  <line x1="65" y1="310" x2="175" y2="310" stroke="#3a2a18" stroke-width="1.5"/>
  <line x1="65" y1="360" x2="175" y2="360" stroke="#3a2a18" stroke-width="1.5"/>
  <line x1="65" y1="410" x2="175" y2="410" stroke="#3a2a18" stroke-width="1.5"/>
  <!-- Drawer handles -->
  <rect x="108" y="278" width="24" height="4" rx="2" fill="#8a7858"/>
  <rect x="108" y="328" width="24" height="4" rx="2" fill="#8a7858"/>
  <rect x="108" y="378" width="24" height="4" rx="2" fill="#8a7858"/>
  <rect x="108" y="428" width="24" height="4" rx="2" fill="#8a7858"/>

  <!-- Small plant on filing cabinet -->
  <rect x="95" y="235" width="30" height="25" rx="3" fill="#6a4422" stroke="#5a3818" stroke-width="1"/>
  <!-- Soil -->
  <ellipse cx="110" cy="238" rx="13" ry="4" fill="#3a2a12"/>
  <!-- Plant leaves -->
  <path d="M110 235 Q105 215 95 210" fill="none" stroke="#44aa44" stroke-width="2.5"/>
  <path d="M110 235 Q115 210 125 205" fill="none" stroke="#55bb55" stroke-width="2.5"/>
  <path d="M110 235 Q108 218 100 215" fill="none" stroke="#338833" stroke-width="2"/>
  <path d="M110 235 Q113 212 120 208" fill="none" stroke="#44aa44" stroke-width="2"/>
  <ellipse cx="95" cy="209" rx="8" ry="5" fill="#44aa44" opacity="0.7" transform="rotate(-20,95,209)"/>
  <ellipse cx="125" cy="204" rx="8" ry="5" fill="#55bb55" opacity="0.7" transform="rotate(20,125,204)"/>
  <ellipse cx="100" cy="214" rx="6" ry="4" fill="#338833" opacity="0.6" transform="rotate(-15,100,214)"/>
  <ellipse cx="120" cy="207" rx="6" ry="4" fill="#44aa44" opacity="0.6" transform="rotate(15,120,207)"/>

  <!-- Desk -->
  <rect x="300" y="400" width="600" height="20" rx="2" fill="url(#deskGrad)" stroke="#5a4428" stroke-width="1.5"/>
  <!-- Desk legs -->
  <rect x="320" y="420" width="15" height="180" fill="#4a3620"/>
  <rect x="870" y="420" width="15" height="180" fill="#4a3620"/>
  <!-- Desk panel (modesty panel) -->
  <rect x="330" y="420" width="545" height="140" fill="#3e2c16" opacity="0.5"/>

  <!-- Clean desk surface items -->
  <!-- Coffee cup -->
  <rect x="730" y="373" width="28" height="27" rx="3" fill="#e8e0d0" stroke="#c8c0b0" stroke-width="1.5"/>
  <ellipse cx="744" cy="373" rx="14" ry="4" fill="#e8e0d0" stroke="#c8c0b0" stroke-width="1"/>
  <!-- Coffee inside -->
  <ellipse cx="744" cy="376" rx="11" ry="3" fill="#5a3818"/>
  <!-- Cup handle -->
  <path d="M758 380 Q770 380 770 390 Q770 396 758 396" fill="none" stroke="#c8c0b0" stroke-width="2"/>
  <!-- Steam from coffee (wavy lines) -->
  <path d="M740 368 Q738 358 742 348 Q746 338 740 328" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.15" filter="url(#steamBlur)"/>
  <path d="M748 366 Q750 356 746 346 Q742 336 748 326" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" filter="url(#steamBlur)"/>
  <path d="M736 370 Q733 360 737 350 Q741 340 735 330" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.1" filter="url(#steamBlur)"/>

  <!-- Newspaper on desk -->
  <g transform="translate(420, 380) rotate(-5)">
    <rect width="140" height="90" rx="1" fill="#e8e0c8" opacity="0.8"/>
    <rect x="8" y="8" width="80" height="5" fill="#2a2010" opacity="0.4"/>
    <rect x="8" y="18" width="60" height="2" fill="#2a2010" opacity="0.2"/>
    <rect x="8" y="24" width="55" height="2" fill="#2a2010" opacity="0.2"/>
    <rect x="8" y="30" width="65" height="2" fill="#2a2010" opacity="0.2"/>
    <rect x="8" y="36" width="50" height="2" fill="#2a2010" opacity="0.15"/>
    <rect x="8" y="42" width="58" height="2" fill="#2a2010" opacity="0.15"/>
    <rect x="80" y="18" width="50" height="40" fill="#c8c0a8" opacity="0.4"/>
    <rect x="8" y="55" width="120" height="1" fill="#2a2010" opacity="0.1"/>
    <rect x="8" y="62" width="55" height="2" fill="#2a2010" opacity="0.15"/>
    <rect x="8" y="68" width="45" height="2" fill="#2a2010" opacity="0.15"/>
    <rect x="8" y="74" width="60" height="2" fill="#2a2010" opacity="0.15"/>
    <rect x="75" y="62" width="55" height="2" fill="#2a2010" opacity="0.15"/>
    <rect x="75" y="68" width="45" height="2" fill="#2a2010" opacity="0.15"/>
  </g>

  <!-- Desk lamp (brighter, warm) -->
  <rect x="340" y="365" width="8" height="35" fill="#6a5838"/>
  <!-- Lamp arm -->
  <path d="M344 365 Q344 340 360 325" fill="none" stroke="#6a5838" stroke-width="4"/>
  <!-- Lamp shade -->
  <polygon points="345,325 375,325 380,310 340,310" fill="url(#lampGrad)" stroke="#8a7848" stroke-width="1"/>
  <!-- Lamp light bulb glow -->
  <circle cx="360" cy="318" r="5" fill="#ffee88" opacity="0.6" filter="url(#warmGlow)"/>
  <!-- Lamp light cone -->
  <ellipse cx="360" cy="400" rx="60" ry="30" fill="url(#lampLight)"/>

  <!-- Bookshelf (right side) -->
  <rect x="1000" y="180" width="200" height="280" rx="2" fill="#4a3a22" stroke="#5a4428" stroke-width="2"/>
  <!-- Shelves -->
  <line x1="1005" y1="250" x2="1195" y2="250" stroke="#5a4428" stroke-width="3"/>
  <line x1="1005" y1="320" x2="1195" y2="320" stroke="#5a4428" stroke-width="3"/>
  <line x1="1005" y1="390" x2="1195" y2="390" stroke="#5a4428" stroke-width="3"/>
  <!-- Books -->
  <rect x="1010" y="190" width="12" height="58" fill="#884422" rx="1"/>
  <rect x="1025" y="195" width="10" height="53" fill="#446688" rx="1"/>
  <rect x="1038" y="192" width="14" height="56" fill="#668844" rx="1"/>
  <rect x="1055" y="198" width="10" height="50" fill="#886644" rx="1"/>
  <rect x="1068" y="190" width="12" height="58" fill="#aa6644" rx="1"/>
  <rect x="1083" y="194" width="10" height="54" fill="#446666" rx="1"/>
  <rect x="1096" y="192" width="14" height="56" fill="#886688" rx="1"/>
  <rect x="1010" y="258" width="14" height="60" fill="#668866" rx="1"/>
  <rect x="1027" y="262" width="10" height="56" fill="#884444" rx="1"/>
  <rect x="1040" y="256" width="12" height="62" fill="#448888" rx="1"/>
  <rect x="1055" y="260" width="10" height="58" fill="#886644" rx="1"/>
  <rect x="1068" y="258" width="14" height="60" fill="#aa8844" rx="1"/>
  <rect x="1010" y="328" width="10" height="60" fill="#446644" rx="1"/>
  <rect x="1023" y="332" width="12" height="56" fill="#664488" rx="1"/>
  <rect x="1038" y="326" width="14" height="62" fill="#886644" rx="1"/>
  <rect x="1055" y="330" width="10" height="58" fill="#448866" rx="1"/>

  <!-- Wall clock -->
  <circle cx="250" cy="150" r="40" fill="#5a4428" stroke="#6a5838" stroke-width="3"/>
  <circle cx="250" cy="150" r="35" fill="#e8e0d0"/>
  <circle cx="250" cy="150" r="2" fill="#2a2010"/>
  <!-- Clock hands -->
  <line x1="250" y1="150" x2="250" y2="125" stroke="#2a2010" stroke-width="2"/>
  <line x1="250" y1="150" x2="270" y2="145" stroke="#2a2010" stroke-width="1.5"/>
  <!-- Hour markers -->
  <g opacity="0.5">
    <line x1="250" y1="118" x2="250" y2="122" stroke="#2a2010" stroke-width="1.5"/>
    <line x1="250" y1="178" x2="250" y2="182" stroke="#2a2010" stroke-width="1.5"/>
    <line x1="218" y1="150" x2="222" y2="150" stroke="#2a2010" stroke-width="1.5"/>
    <line x1="278" y1="150" x2="282" y2="150" stroke="#2a2010" stroke-width="1.5"/>
  </g>

  <!-- Warm ambient light overlay -->
  <rect width="1280" height="720" fill="url(#warmAmbient)"/>

  <!-- Golden morning tone overlay -->
  <rect width="1280" height="720" fill="#ffcc44" opacity="0.04"/>
  <rect width="1280" height="720" fill="#ff9922" opacity="0.02"/>
</svg>