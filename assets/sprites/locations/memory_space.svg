<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000008"/>
      <stop offset="50%" stop-color="#000004"/>
      <stop offset="100%" stop-color="#000008"/>
    </linearGradient>
    <linearGradient id="cubeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="cubeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="cubeGrad3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="cubeGrad4" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4488"/>
      <stop offset="100%" stop-color="#44ff88"/>
    </linearGradient>
    <linearGradient id="cubeGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8844ff"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
    <linearGradient id="cubeGrad6" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="cubeGrad7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="cubeGrad8" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff0066"/>
    </linearGradient>
    <linearGradient id="cubeGrad9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc44ff"/>
      <stop offset="100%" stop-color="#44ffcc"/>
    </linearGradient>
    <linearGradient id="cubeGrad10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6644"/>
      <stop offset="100%" stop-color="#4466ff"/>
    </linearGradient>
    <linearGradient id="streamGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0066" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff0066" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff00ff" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#0066ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00ffaa" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffff00" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#ffaa00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aa00ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#aa00ff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#00ffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff4400" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ff00aa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4400ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mist1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#8800aa" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#0088aa" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#aa8800" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cubeGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="streamGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Black void background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Ethereal mist (large semi-transparent ellipses) -->
  <ellipse cx="350" cy="300" rx="350" ry="250" fill="url(#mist1)"/>
  <ellipse cx="900" cy="450" rx="400" ry="280" fill="url(#mist2)"/>
  <ellipse cx="640" cy="200" rx="300" ry="200" fill="url(#mist3)"/>

  <!-- Stars and particles scattered across the void -->
  <g>
    <!-- White stars -->
    <circle cx="45" cy="25" r="1.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="110" cy="72" r="0.8" fill="#ffffff" opacity="0.35"/>
    <circle cx="195" cy="40" r="1.4" fill="#ffffff" opacity="0.45"/>
    <circle cx="280" cy="115" r="0.7" fill="#ffffff" opacity="0.3"/>
    <circle cx="370" cy="55" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="445" cy="140" r="0.9" fill="#ffffff" opacity="0.35"/>
    <circle cx="525" cy="25" r="1.3" fill="#ffffff" opacity="0.4"/>
    <circle cx="610" cy="85" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="695" cy="45" r="1" fill="#ffffff" opacity="0.35"/>
    <circle cx="775" cy="125" r="0.7" fill="#ffffff" opacity="0.3"/>
    <circle cx="845" cy="35" r="1.3" fill="#ffffff" opacity="0.45"/>
    <circle cx="925" cy="95" r="0.9" fill="#ffffff" opacity="0.35"/>
    <circle cx="1005" cy="55" r="1.1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1075" cy="135" r="0.8" fill="#ffffff" opacity="0.35"/>
    <circle cx="1145" cy="30" r="1.2" fill="#ffffff" opacity="0.3"/>
    <circle cx="1225" cy="75" r="0.7" fill="#ffffff" opacity="0.4"/>
    <circle cx="75" cy="595" r="1" fill="#ffffff" opacity="0.35"/>
    <circle cx="165" cy="645" r="0.8" fill="#ffffff" opacity="0.3"/>
    <circle cx="255" cy="575" r="1.3" fill="#ffffff" opacity="0.4"/>
    <circle cx="395" cy="665" r="0.9" fill="#ffffff" opacity="0.35"/>
    <circle cx="545" cy="615" r="1.1" fill="#ffffff" opacity="0.5"/>
    <circle cx="675" cy="675" r="0.7" fill="#ffffff" opacity="0.35"/>
    <circle cx="795" cy="605" r="1.2" fill="#ffffff" opacity="0.3"/>
    <circle cx="915" cy="655" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="1045" cy="585" r="1" fill="#ffffff" opacity="0.35"/>
    <circle cx="1175" cy="635" r="0.9" fill="#ffffff" opacity="0.4"/>
    <circle cx="95" cy="345" r="0.8" fill="#ffffff" opacity="0.25"/>
    <circle cx="1195" cy="375" r="1" fill="#ffffff" opacity="0.3"/>
    <circle cx="55" cy="445" r="0.7" fill="#ffffff" opacity="0.25"/>
    <circle cx="1235" cy="285" r="0.9" fill="#ffffff" opacity="0.35"/>
    <!-- Colored particles -->
    <circle cx="150" cy="200" r="1.5" fill="#ff66cc" opacity="0.35" filter="url(#starGlow)"/>
    <circle cx="320" cy="310" r="2" fill="#ff0066" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="550" cy="420" r="2.5" fill="#0066ff" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="730" cy="350" r="2" fill="#00ffaa" opacity="0.35" filter="url(#starGlow)"/>
    <circle cx="900" cy="380" r="1.5" fill="#ffaa00" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="400" cy="500" r="2" fill="#aa00ff" opacity="0.25" filter="url(#starGlow)"/>
    <circle cx="640" cy="260" r="3" fill="#00ffff" opacity="0.25" filter="url(#starGlow)"/>
    <circle cx="1100" cy="300" r="2" fill="#ff4488" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="200" cy="400" r="1.5" fill="#44ffcc" opacity="0.25" filter="url(#starGlow)"/>
    <circle cx="1000" cy="180" r="1.8" fill="#ffcc44" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="480" cy="600" r="2" fill="#ff44aa" opacity="0.25" filter="url(#starGlow)"/>
    <circle cx="820" cy="520" r="1.5" fill="#44aaff" opacity="0.3" filter="url(#starGlow)"/>
    <circle cx="1150" cy="480" r="2" fill="#aaff44" opacity="0.2" filter="url(#starGlow)"/>
    <circle cx="60" cy="280" r="1.8" fill="#ff8844" opacity="0.25" filter="url(#starGlow)"/>
    <circle cx="710" cy="140" r="1.5" fill="#cc44ff" opacity="0.3" filter="url(#starGlow)"/>
  </g>

  <!-- Data streams (curved paths with gradient strokes) -->
  <!-- Stream 1 - pink to blue -->
  <path d="M0 300 Q200 180 400 340 Q600 500 800 280 Q1000 60 1280 220" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" filter="url(#streamGlow)"/>
  <path d="M0 310 Q200 190 400 350 Q600 510 800 290 Q1000 70 1280 230" fill="none" stroke="url(#streamGrad1)" stroke-width="1" opacity="0.4"/>

  <!-- Stream 2 - green to gold -->
  <path d="M0 520 Q280 370 480 460 Q680 550 900 380 Q1100 210 1280 360" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" filter="url(#streamGlow)"/>
  <path d="M0 530 Q280 380 480 470 Q680 560 900 390 Q1100 220 1280 370" fill="none" stroke="url(#streamGrad2)" stroke-width="1" opacity="0.4"/>

  <!-- Stream 3 - purple to cyan (vertical) -->
  <path d="M220 0 Q350 200 280 360 Q210 520 380 620 Q550 720 720 720" fill="none" stroke="url(#streamGrad3)" stroke-width="2.5" filter="url(#streamGlow)"/>
  <path d="M230 0 Q360 200 290 360 Q220 520 390 620 Q560 720 730 720" fill="none" stroke="url(#streamGrad3)" stroke-width="1" opacity="0.4"/>

  <!-- Stream 4 - orange to violet -->
  <path d="M980 0 Q880 200 940 350 Q1000 500 860 600 Q720 700 600 720" fill="none" stroke="url(#streamGrad4)" stroke-width="2" filter="url(#streamGlow)"/>

  <!-- Floating memory cubes (rotated squares with gradient fills and glow) -->
  <!-- Cube 1 - large center -->
  <g transform="translate(640,340) rotate(25)">
    <rect x="-55" y="-55" width="110" height="110" fill="none" stroke="url(#cubeGrad1)" stroke-width="2.5" opacity="0.6" filter="url(#cubeGlow)"/>
    <rect x="-45" y="-45" width="90" height="90" fill="url(#cubeGrad1)" opacity="0.04"/>
    <rect x="-38" y="-20" width="35" height="2" fill="#00ffff" opacity="0.3"/>
    <rect x="-38" y="-10" width="22" height="2" fill="#cc44ff" opacity="0.25"/>
    <rect x="-38" y="0" width="45" height="2" fill="#ff00ff" opacity="0.3"/>
    <rect x="-38" y="10" width="28" height="2" fill="#00ffff" opacity="0.2"/>
  </g>
  <ellipse cx="640" cy="340" rx="80" ry="80" fill="url(#cubeGrad1)" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Cube 2 - upper left -->
  <g transform="translate(240,170) rotate(42)">
    <rect x="-38" y="-38" width="76" height="76" fill="none" stroke="url(#cubeGrad2)" stroke-width="2" opacity="0.5" filter="url(#cubeGlow)"/>
    <rect x="-30" y="-30" width="60" height="60" fill="url(#cubeGrad2)" opacity="0.04"/>
    <rect x="-22" y="-10" width="28" height="2" fill="#ff00ff" opacity="0.25"/>
    <rect x="-22" y="0" width="18" height="2" fill="#ffcc00" opacity="0.2"/>
  </g>
  <ellipse cx="240" cy="170" rx="55" ry="55" fill="#ff00ff" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Cube 3 - lower right -->
  <g transform="translate(960,490) rotate(62)">
    <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="url(#cubeGrad3)" stroke-width="2" opacity="0.5" filter="url(#cubeGlow)"/>
    <rect x="-34" y="-34" width="68" height="68" fill="url(#cubeGrad3)" opacity="0.04"/>
    <rect x="-28" y="-15" width="32" height="2" fill="#00ffff" opacity="0.25"/>
    <rect x="-28" y="-5" width="22" height="2" fill="#ffcc00" opacity="0.2"/>
    <rect x="-28" y="5" width="38" height="2" fill="#00ffff" opacity="0.25"/>
  </g>
  <ellipse cx="960" cy="490" rx="60" ry="60" fill="#ffcc00" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Cube 4 - upper right -->
  <g transform="translate(1060,140) rotate(18)">
    <rect x="-28" y="-28" width="56" height="56" fill="none" stroke="url(#cubeGrad4)" stroke-width="1.5" opacity="0.45" filter="url(#cubeGlow)"/>
    <rect x="-20" y="-20" width="40" height="40" fill="url(#cubeGrad4)" opacity="0.03"/>
  </g>

  <!-- Cube 5 - lower left -->
  <g transform="translate(170,530) rotate(52)">
    <rect x="-32" y="-32" width="64" height="64" fill="none" stroke="url(#cubeGrad5)" stroke-width="1.5" opacity="0.4" filter="url(#cubeGlow)"/>
    <rect x="-24" y="-24" width="48" height="48" fill="url(#cubeGrad5)" opacity="0.03"/>
  </g>

  <!-- Cube 6 - small scattered -->
  <g transform="translate(490,95) rotate(33)">
    <rect x="-18" y="-18" width="36" height="36" fill="none" stroke="url(#cubeGrad6)" stroke-width="1.2" opacity="0.35" filter="url(#cubeGlow)"/>
    <rect x="-12" y="-12" width="24" height="24" fill="url(#cubeGrad6)" opacity="0.03"/>
  </g>

  <!-- Cube 7 -->
  <g transform="translate(810,610) rotate(72)">
    <rect x="-22" y="-22" width="44" height="44" fill="none" stroke="url(#cubeGrad7)" stroke-width="1.2" opacity="0.35" filter="url(#cubeGlow)"/>
    <rect x="-15" y="-15" width="30" height="30" fill="url(#cubeGrad7)" opacity="0.03"/>
  </g>

  <!-- Cube 8 -->
  <g transform="translate(1160,360) rotate(12)">
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="url(#cubeGrad8)" stroke-width="1" opacity="0.3" filter="url(#cubeGlow)"/>
  </g>

  <!-- Cube 9 -->
  <g transform="translate(380,420) rotate(55)">
    <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="url(#cubeGrad9)" stroke-width="1.2" opacity="0.35" filter="url(#cubeGlow)"/>
    <rect x="-13" y="-13" width="26" height="26" fill="url(#cubeGrad9)" opacity="0.03"/>
  </g>

  <!-- Cube 10 - tiny -->
  <g transform="translate(70,160) rotate(28)">
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="url(#cubeGrad10)" stroke-width="1" opacity="0.3" filter="url(#cubeGlow)"/>
  </g>

  <!-- Geometric shapes - triangles -->
  <polygon points="520,250 545,210 570,250" fill="none" stroke="#ff44aa" stroke-width="0.8" opacity="0.18"/>
  <polygon points="760,420 790,370 820,420" fill="none" stroke="#44aaff" stroke-width="0.8" opacity="0.15"/>
  <polygon points="1100,520 1120,490 1140,520" fill="none" stroke="#ffaa44" stroke-width="0.7" opacity="0.12"/>
  <polygon points="140,380 160,350 180,380" fill="none" stroke="#44ffaa" stroke-width="0.7" opacity="0.15"/>

  <!-- Geometric shapes - hexagons -->
  <polygon points="430,320 445,308 460,320 460,340 445,352 430,340" fill="none" stroke="#cc44ff" stroke-width="0.8" opacity="0.15"/>
  <polygon points="870,260 890,245 910,260 910,285 890,300 870,285" fill="none" stroke="#44ffcc" stroke-width="0.8" opacity="0.15"/>
  <polygon points="300,560 315,550 330,560 330,578 315,588 300,578" fill="none" stroke="#ff8844" stroke-width="0.7" opacity="0.12"/>
  <polygon points="1050,440 1062,432 1074,440 1074,455 1062,463 1050,455" fill="none" stroke="#ffff44" stroke-width="0.7" opacity="0.12"/>

  <!-- Prismatic light overlay -->
  <rect width="1280" height="720" fill="#000010" opacity="0.08"/>
</svg>