  <path d="M250 80 Q350 40 450 75" fill="none" stroke="#2a2a48" stroke-width="1.5" opacity="0.15"/>
  <path d="M700 110 Q850 55 1000 95" fill="none" stroke="#2a2a48" stroke-width="2" opacity="0.2"/>
