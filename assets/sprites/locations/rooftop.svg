<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080820"/>
      <stop offset="40%" stop-color="#0c1030"/>
      <stop offset="70%" stop-color="#141848"/>
      <stop offset="100%" stop-color="#1a2050"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a48"/>
      <stop offset="100%" stop-color="#2a2a38"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2288" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#ff44aa" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#ffaa44" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#00ffff" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#4488ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2288" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="horizonGlow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff44aa" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff44aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff44aa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="buildingGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <linearGradient id="buildingGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181830"/>
      <stop offset="100%" stop-color="#0c0c20"/>
    </linearGradient>
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="cloudGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2a2a48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a38" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="cityGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="windowGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Cloud shapes (lighter gray arcs) -->
  <ellipse cx="200" cy="80" rx="180" ry="50" fill="url(#cloudGlow)"/>
  <ellipse cx="350" cy="60" rx="120" ry="40" fill="url(#cloudGlow)"/>
  <ellipse cx="800" cy="100" rx="200" ry="55" fill="url(#cloudGlow)"/>
  <ellipse cx="1000" cy="70" rx="150" ry="45" fill="url(#cloudGlow)"/>
  <ellipse cx="600" cy="40" rx="160" ry="35" fill="url(#cloudGlow)"/>
  <!-- Cloud arcs -->
