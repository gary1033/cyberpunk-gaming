<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d0a"/>
      <stop offset="100%" stop-color="#050805"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1e15"/>
      <stop offset="50%" stop-color="#12150f"/>
      <stop offset="100%" stop-color="#1a1e15"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1510" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050a08" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="redGlow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Tunnel arch ceiling -->
  <path d="M0 300 Q640 0 1280 300 L1280 0 L0 0 Z" fill="#0a0d0a"/>
  <path d="M20 300 Q640 20 1260 300" fill="none" stroke="#1a1e15" stroke-width="4"/>
  <path d="M50 280 Q640 30 1230 280" fill="none" stroke="#151a12" stroke-width="3"/>
  <path d="M80 260 Q640 50 1200 260" fill="none" stroke="#121510" stroke-width="2"/>

  <!-- Tunnel walls -->
  <rect x="0" y="200" width="80" height="520" fill="url(#wallGrad)"/>
  <rect x="1200" y="200" width="80" height="520" fill="url(#wallGrad)"/>

  <!-- Wall texture -->
  <g opacity="0.08">
    <rect x="85" y="250" width="50" height="30" fill="none" stroke="#2a3020" stroke-width="1"/>
    <rect x="85" y="285" width="50" height="30" fill="none" stroke="#2a3020" stroke-width="1"/>
    <rect x="85" y="320" width="50" height="30" fill="none" stroke="#2a3020" stroke-width="1"/>
    <rect x="1145" y="250" width="50" height="30" fill="none" stroke="#2a3020" stroke-width="1"/>
    <rect x="1145" y="285" width="50" height="30" fill="none" stroke="#2a3020" stroke-width="1"/>
    <rect x="1145" y="320" width="50" height="30" fill="none" stroke="#2a3020" stroke-width="1"/>
  </g>

  <!-- Large pipes along ceiling -->
  <!-- Pipe 1 (left) -->
  <rect x="50" y="180" width="300" height="40" rx="20" fill="#2a2e25" opacity="0.7"/>
  <rect x="50" y="180" width="300" height="40" rx="20" fill="none" stroke="#353a30" stroke-width="1.5"/>
  <ellipse cx="350" cy="200" rx="20" ry="20" fill="#2a2e25" stroke="#353a30" stroke-width="1.5"/>
  <!-- Pipe joint -->
  <rect x="150" y="175" width="15" height="50" rx="3" fill="#353a30"/>

  <!-- Pipe 2 (center, large) -->
  <rect x="400" y="150" width="480" height="50" rx="25" fill="#2a2e25" opacity="0.7"/>
  <rect x="400" y="150" width="480" height="50" rx="25" fill="none" stroke="#353a30" stroke-width="1.5"/>
  <rect x="550" y="145" width="15" height="60" rx="3" fill="#353a30"/>
  <rect x="730" y="145" width="15" height="60" rx="3" fill="#353a30"/>

  <!-- Pipe 3 (right) -->
  <rect x="930" y="170" width="300" height="35" rx="17" fill="#2a2e25" opacity="0.7"/>
  <rect x="930" y="170" width="300" height="35" rx="17" fill="none" stroke="#353a30" stroke-width="1.5"/>
  <rect x="1050" y="165" width="12" height="45" rx="3" fill="#353a30"/>

  <!-- Vertical pipes on walls -->
  <rect x="100" y="250" width="25" height="300" rx="12" fill="#252a22" opacity="0.6"/>
  <rect x="100" y="250" width="25" height="300" rx="12" fill="none" stroke="#303528" stroke-width="1"/>
  <rect x="1155" y="240" width="25" height="310" rx="12" fill="#252a22" opacity="0.6"/>
  <rect x="1155" y="240" width="25" height="310" rx="12" fill="none" stroke="#303528" stroke-width="1"/>

  <!-- Walkway / ground -->
  <rect x="80" y="480" width="400" height="240" fill="#12150f"/>
  <rect x="800" y="480" width="400" height="240" fill="#12150f"/>
  <!-- Walkway edge -->
  <rect x="80" y="478" width="400" height="5" fill="#1e2218"/>
  <rect x="800" y="478" width="400" height="5" fill="#1e2218"/>

  <!-- Dark water channel (center) -->
  <rect x="480" y="500" width="320" height="220" fill="url(#waterGrad)"/>
  <!-- Water surface ripples -->
  <ellipse cx="560" cy="560" rx="40" ry="5" fill="#1a2a20" opacity="0.15"/>
  <ellipse cx="640" cy="600" rx="50" ry="4" fill="#1a2a20" opacity="0.12"/>
  <ellipse cx="700" cy="640" rx="35" ry="4" fill="#1a2a20" opacity="0.1"/>
  <ellipse cx="580" cy="680" rx="45" ry="5" fill="#1a2a20" opacity="0.08"/>

  <!-- Dripping water drops -->
  <circle cx="300" cy="350" r="2" fill="#3388aa" opacity="0.3"/>
  <circle cx="300" cy="370" r="1.5" fill="#3388aa" opacity="0.2"/>
  <circle cx="300" cy="385" r="1" fill="#3388aa" opacity="0.15"/>
  <circle cx="600" cy="280" r="2" fill="#3388aa" opacity="0.25"/>
  <circle cx="600" cy="300" r="1.5" fill="#3388aa" opacity="0.18"/>
  <circle cx="900" cy="310" r="2" fill="#3388aa" opacity="0.3"/>
  <circle cx="900" cy="328" r="1.5" fill="#3388aa" opacity="0.2"/>
  <circle cx="1100" cy="340" r="1.8" fill="#3388aa" opacity="0.22"/>

  <!-- Red emergency lights -->
  <!-- Light 1 (left) -->
  <circle cx="200" cy="280" r="8" fill="#ff2200" opacity="0.6" filter="url(#neonGlow)"/>
  <circle cx="200" cy="280" r="4" fill="#ff4422" opacity="0.9"/>
  <ellipse cx="200" cy="280" rx="80" ry="60" fill="url(#redGlow1)"/>
  <!-- Red glow on wall -->
  <rect x="140" y="270" width="120" height="30" fill="#ff2200" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Light 2 (center) -->
  <circle cx="640" cy="250" r="8" fill="#ff2200" opacity="0.6" filter="url(#neonGlow)"/>
  <circle cx="640" cy="250" r="4" fill="#ff4422" opacity="0.9"/>
  <ellipse cx="640" cy="250" rx="90" ry="70" fill="url(#redGlow1)"/>

  <!-- Light 3 (right) -->
  <circle cx="1080" cy="270" r="8" fill="#ff2200" opacity="0.6" filter="url(#neonGlow)"/>
  <circle cx="1080" cy="270" r="4" fill="#ff4422" opacity="0.9"/>
  <ellipse cx="1080" cy="270" rx="80" ry="60" fill="url(#redGlow2)"/>

  <!-- Graffiti circuit patterns on walls -->
  <!-- Left wall circuit -->
  <g opacity="0.15">
    <line x1="140" y1="350" x2="200" y2="350" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="200" y1="350" x2="200" y2="380" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="200" y1="380" x2="240" y2="380" stroke="#00ff88" stroke-width="1.5"/>
    <circle cx="240" cy="380" r="4" fill="none" stroke="#00ff88" stroke-width="1"/>
    <line x1="170" y1="350" x2="170" y2="400" stroke="#00ff88" stroke-width="1"/>
    <rect x="160" y="400" width="20" height="12" fill="none" stroke="#00ff88" stroke-width="1"/>
    <line x1="140" y1="365" x2="160" y2="365" stroke="#00ff88" stroke-width="1"/>
    <line x1="160" y1="365" x2="160" y2="390" stroke="#00ff88" stroke-width="1"/>
  </g>
  <!-- Right wall circuit -->
  <g opacity="0.12">
    <line x1="1060" y1="330" x2="1120" y2="330" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="1120" y1="330" x2="1120" y2="360" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="1120" y1="360" x2="1160" y2="360" stroke="#00ff88" stroke-width="1.5"/>
    <rect x="1090" y="370" width="15" height="10" fill="none" stroke="#00ff88" stroke-width="1"/>
    <line x1="1097" y1="360" x2="1097" y2="370" stroke="#00ff88" stroke-width="1"/>
    <circle cx="1160" cy="360" r="3" fill="none" stroke="#00ff88" stroke-width="1"/>
    <line x1="1060" y1="345" x2="1080" y2="345" stroke="#00ff88" stroke-width="1"/>
    <line x1="1080" y1="345" x2="1080" y2="375" stroke="#00ff88" stroke-width="1"/>
  </g>

  <!-- Red light reflections on water -->
  <ellipse cx="550" cy="550" rx="60" ry="15" fill="#ff2200" opacity="0.02" filter="url(#softGlow)"/>
  <ellipse cx="700" cy="580" rx="50" ry="12" fill="#ff2200" opacity="0.015" filter="url(#softGlow)"/>

  <!-- Green-brown atmosphere -->
  <rect width="1280" height="720" fill="#0a1a10" opacity="0.08"/>

  <!-- Dark vignette -->
  <rect width="1280" height="720" fill="#030503" opacity="0.2"/>
</svg>