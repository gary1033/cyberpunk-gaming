<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="moonShaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaccee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#aaccee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a20"/>
      <stop offset="100%" stop-color="#3a2515"/>
    </linearGradient>
    <radialGradient id="dustGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ccbb99" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ccbb99" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Back wall -->
  <rect x="0" y="0" width="1280" height="480" fill="#12100d"/>
  <!-- Brick texture hints -->
  <g opacity="0.06">
    <rect x="0" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="70" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="140" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="210" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="35" y="85" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="105" y="85" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="175" y="85" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="900" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="970" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="1040" y="50" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="935" y="85" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="1005" y="85" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
    <rect x="1075" y="85" width="65" height="30" fill="none" stroke="#2a2015" stroke-width="1"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="480" width="1280" height="240" fill="url(#floorGrad)"/>
  <!-- Floor cracks -->
  <path d="M200 500 L250 550 L230 600 L280 680" fill="none" stroke="#1a1810" stroke-width="1" opacity="0.3"/>
  <path d="M700 490 L750 530 L720 580 L760 650" fill="none" stroke="#1a1810" stroke-width="1" opacity="0.25"/>
  <path d="M1000 510 L980 560 L1020 620" fill="none" stroke="#1a1810" stroke-width="1" opacity="0.2"/>

  <!-- Rusted ceiling beams -->
  <rect x="0" y="30" width="1280" height="18" fill="url(#rustGrad)" opacity="0.7"/>
  <rect x="100" y="30" width="12" height="180" fill="#4a2a15" opacity="0.6"/>
  <rect x="400" y="30" width="12" height="200" fill="#4a2a15" opacity="0.5"/>
  <rect x="700" y="30" width="12" height="190" fill="#4a2a15" opacity="0.6"/>
  <rect x="1000" y="30" width="12" height="185" fill="#4a2a15" opacity="0.5"/>
  <!-- Cross beams -->
  <line x1="100" y1="120" x2="400" y2="130" stroke="#4a2a15" stroke-width="8" opacity="0.5"/>
  <line x1="400" y1="130" x2="700" y2="120" stroke="#4a2a15" stroke-width="8" opacity="0.4"/>
  <line x1="700" y1="120" x2="1000" y2="125" stroke="#4a2a15" stroke-width="8" opacity="0.5"/>
  <line x1="1000" y1="125" x2="1280" y2="118" stroke="#4a2a15" stroke-width="8" opacity="0.4"/>
  <!-- Diagonal bracing -->
  <line x1="100" y1="30" x2="250" y2="130" stroke="#3a2010" stroke-width="5" opacity="0.3"/>
  <line x1="700" y1="30" x2="550" y2="120" stroke="#3a2010" stroke-width="5" opacity="0.3"/>

  <!-- Broken windows (back wall, upper) -->
  <!-- Window 1 -->
  <rect x="180" y="80" width="120" height="100" fill="#0a0a20" opacity="0.6"/>
  <rect x="180" y="80" width="120" height="100" fill="none" stroke="#2a2515" stroke-width="3"/>
  <line x1="240" y1="80" x2="240" y2="180" stroke="#2a2515" stroke-width="2"/>
  <line x1="180" y1="130" x2="300" y2="130" stroke="#2a2515" stroke-width="2"/>
  <!-- Broken glass shards -->
  <polygon points="180,80 220,80 200,110" fill="#0a0a20" opacity="0.3"/>
  <polygon points="260,130 300,130 300,160 280,150" fill="#0a0a20" opacity="0.4"/>
  <!-- Moonlight through -->
  <rect x="185" y="85" width="50" height="40" fill="#4466aa" opacity="0.05"/>

  <!-- Window 2 -->
  <rect x="500" y="70" width="140" height="110" fill="#0a0a20" opacity="0.6"/>
  <rect x="500" y="70" width="140" height="110" fill="none" stroke="#2a2515" stroke-width="3"/>
  <line x1="570" y1="70" x2="570" y2="180" stroke="#2a2515" stroke-width="2"/>
  <line x1="500" y1="125" x2="640" y2="125" stroke="#2a2515" stroke-width="2"/>
  <polygon points="570,70 620,70 600,100" fill="#0a0a20" opacity="0.3"/>

  <!-- Window 3 -->
  <rect x="850" y="75" width="130" height="105" fill="#0a0a20" opacity="0.6"/>
  <rect x="850" y="75" width="130" height="105" fill="none" stroke="#2a2515" stroke-width="3"/>
  <line x1="915" y1="75" x2="915" y2="180" stroke="#2a2515" stroke-width="2"/>
  <line x1="850" y1="128" x2="980" y2="128" stroke="#2a2515" stroke-width="2"/>
  <polygon points="915,128 960,128 950,150" fill="#0a0a20" opacity="0.35"/>
  <polygon points="850,75 890,75 870,105" fill="#0a0a20" opacity="0.3"/>

  <!-- Ceiling holes with light shafts -->
  <!-- Light shaft 1 -->
  <polygon points="320,0 380,0 500,480 400,480" fill="url(#moonShaft)" opacity="0.6"/>
  <ellipse cx="450" cy="480" rx="50" ry="10" fill="#aaccee" opacity="0.03" filter="url(#softGlow)"/>
  <!-- Light shaft 2 -->
  <polygon points="800,0 850,0 920,480 840,480" fill="url(#moonShaft)" opacity="0.5"/>
  <ellipse cx="880" cy="480" rx="40" ry="8" fill="#aaccee" opacity="0.025" filter="url(#softGlow)"/>

  <!-- Old crates -->
  <rect x="80" y="380" width="100" height="100" fill="#2a2015" stroke="#352a18" stroke-width="2"/>
  <line x1="80" y1="430" x2="180" y2="430" stroke="#352a18" stroke-width="1"/>
  <line x1="130" y1="380" x2="130" y2="480" stroke="#352a18" stroke-width="1"/>

  <rect x="190" y="420" width="80" height="60" fill="#28200a" stroke="#352a18" stroke-width="2"/>
  <line x1="230" y1="420" x2="230" y2="480" stroke="#352a18" stroke-width="1"/>

  <rect x="60" y="340" width="70" height="50" fill="#2c2210" stroke="#352a18" stroke-width="2" transform="rotate(-3 95 365)"/>

  <!-- Stacked crates (right side) -->
  <rect x="1050" y="400" width="90" height="80" fill="#2a2015" stroke="#352a18" stroke-width="2"/>
  <rect x="1060" y="350" width="70" height="55" fill="#28200a" stroke="#352a18" stroke-width="2"/>
  <rect x="1150" y="430" width="80" height="50" fill="#2c2210" stroke="#352a18" stroke-width="2"/>

  <!-- Debris on floor -->
  <rect x="350" y="510" width="30" height="8" fill="#2a2015" opacity="0.4" transform="rotate(15 365 514)"/>
  <rect x="600" y="530" width="25" height="6" fill="#2a2015" opacity="0.3" transform="rotate(-20 612 533)"/>
  <rect x="450" y="550" width="15" height="15" fill="#2a2015" opacity="0.25" transform="rotate(45 457 557)"/>
  <circle cx="550" cy="520" r="4" fill="#1a1510" opacity="0.3"/>
  <circle cx="800" cy="540" r="3" fill="#1a1510" opacity="0.25"/>
  <rect x="900" y="515" width="20" height="5" fill="#2a2015" opacity="0.3" transform="rotate(30 910 517)"/>

  <!-- Broken pipe on ground -->
  <rect x="620" y="500" width="200" height="20" rx="10" fill="#3a3530" opacity="0.5"/>
  <ellipse cx="620" cy="510" rx="10" ry="10" fill="#3a3530" opacity="0.5"/>
  <ellipse cx="820" cy="510" rx="10" ry="10" fill="#3a3530" opacity="0.5"/>

  <!-- Rust stains on walls -->
  <ellipse cx="400" cy="300" rx="30" ry="60" fill="#3a2510" opacity="0.08"/>
  <ellipse cx="900" cy="250" rx="25" ry="50" fill="#3a2510" opacity="0.06"/>

  <!-- Dust particles in light shafts -->
  <circle cx="430" cy="200" r="1.5" fill="#ccbb99" opacity="0.15"/>
  <circle cx="450" cy="280" r="1" fill="#ccbb99" opacity="0.12"/>
  <circle cx="420" cy="350" r="1.2" fill="#ccbb99" opacity="0.1"/>
  <circle cx="460" cy="150" r="0.8" fill="#ccbb99" opacity="0.18"/>
  <circle cx="440" cy="400" r="1.3" fill="#ccbb99" opacity="0.08"/>
  <circle cx="870" cy="180" r="1" fill="#ccbb99" opacity="0.12"/>
  <circle cx="890" cy="300" r="1.2" fill="#ccbb99" opacity="0.1"/>
  <circle cx="860" cy="250" r="0.8" fill="#ccbb99" opacity="0.15"/>
  <circle cx="880" cy="380" r="1.1" fill="#ccbb99" opacity="0.08"/>

  <!-- Dusty atmosphere -->
  <rect width="1280" height="720" fill="url(#dustGlow)"/>

  <!-- Blue moonlight tint -->
  <rect width="1280" height="720" fill="#2244aa" opacity="0.03"/>

  <!-- Dark vignette -->
  <rect width="1280" height="720" fill="#050403" opacity="0.15"/>
</svg>