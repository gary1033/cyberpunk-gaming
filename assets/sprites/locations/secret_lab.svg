<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#0e0618"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150a22"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a55"/>
      <stop offset="30%" stop-color="#5a5a78"/>
      <stop offset="70%" stop-color="#5a5a78"/>
      <stop offset="100%" stop-color="#3a3a55"/>
    </linearGradient>
    <linearGradient id="chairSeatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a65"/>
      <stop offset="100%" stop-color="#2a2a40"/>
    </linearGradient>
    <linearGradient id="headrestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a78"/>
      <stop offset="100%" stop-color="#3a3a55"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a35" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2a2a50" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a1a35" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#041008"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleAmbient" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#6622aa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6622aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tubeInnerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6622aa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6622aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tubeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Walls -->
  <rect x="0" y="0" width="1280" height="460" fill="#12081e"/>
  <!-- Wall panel lines -->
  <g opacity="0.06">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#2a1a3e" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#2a1a3e" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#2a1a3e" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#2a1a3e" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#2a1a3e" stroke-width="1"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="460" width="1280" height="260" fill="url(#floorGrad)"/>
  <g opacity="0.05">
    <line x1="0" y1="520" x2="1280" y2="520" stroke="#2a2a50" stroke-width="0.5"/>
    <line x1="0" y1="580" x2="1280" y2="580" stroke="#2a2a50" stroke-width="0.5"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#2a2a50" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1280" y2="700" stroke="#2a2a50" stroke-width="0.5"/>
  </g>

  <!-- Dim overhead lights -->
  <circle cx="200" cy="20" r="12" fill="#ffee88" opacity="0.15" filter="url(#lightGlow)"/>
  <circle cx="200" cy="20" r="4" fill="#ffee88" opacity="0.4"/>
  <circle cx="500" cy="20" r="12" fill="#ffee88" opacity="0.12" filter="url(#lightGlow)"/>
  <circle cx="500" cy="20" r="4" fill="#ffee88" opacity="0.35"/>
  <circle cx="800" cy="20" r="12" fill="#ffee88" opacity="0.15" filter="url(#lightGlow)"/>
  <circle cx="800" cy="20" r="4" fill="#ffee88" opacity="0.4"/>
  <circle cx="1100" cy="20" r="12" fill="#ffee88" opacity="0.12" filter="url(#lightGlow)"/>
  <circle cx="1100" cy="20" r="4" fill="#ffee88" opacity="0.35"/>

  <!-- Central memory extraction chair -->
  <!-- Chair base platform -->
  <ellipse cx="640" cy="520" rx="100" ry="25" fill="#1e1e38" stroke="#2a2a50" stroke-width="2"/>
  <ellipse cx="640" cy="515" rx="85" ry="18" fill="#252548"/>

  <!-- Chair seat -->
  <rect x="575" y="380" width="130" height="135" rx="12" fill="url(#chairSeatGrad)" stroke="#3a3a55" stroke-width="2"/>
  <!-- Seat cushion detail -->
  <rect x="585" y="390" width="110" height="115" rx="8" fill="#2a2a42" opacity="0.4"/>

  <!-- Chair back (reclined) -->
  <rect x="560" y="250" width="160" height="135" rx="14" fill="url(#chairGrad)" stroke="#3a3a55" stroke-width="2"/>
  <!-- Back padding -->
  <rect x="575" y="265" width="130" height="105" rx="10" fill="#2e2e48" opacity="0.4"/>

  <!-- Headrest with neural interface -->
  <rect x="600" y="225" width="80" height="35" rx="10" fill="url(#headrestGrad)" stroke="#4a4a65" stroke-width="1.5"/>
  <!-- Neural interface ring -->
  <circle cx="640" cy="242" r="16" fill="#1a1a35" stroke="#6622aa" stroke-width="2" opacity="0.7"/>
  <circle cx="640" cy="242" r="8" fill="#6622aa" opacity="0.35" filter="url(#neonGlow)"/>
  <!-- Secondary interface nodes -->
  <circle cx="615" cy="240" r="4" fill="#1a1a35" stroke="#6622aa" stroke-width="1" opacity="0.5"/>
  <circle cx="665" cy="240" r="4" fill="#1a1a35" stroke="#6622aa" stroke-width="1" opacity="0.5"/>

  <!-- Arm rests with straps -->
  <rect x="550" y="370" width="30" height="100" rx="6" fill="#3a3a55" stroke="#4a4a65" stroke-width="1"/>
  <rect x="700" y="370" width="30" height="100" rx="6" fill="#3a3a55" stroke="#4a4a65" stroke-width="1"/>
  <!-- Straps -->
  <rect x="550" y="395" width="30" height="5" fill="#6622aa" opacity="0.35"/>
  <rect x="700" y="395" width="30" height="5" fill="#6622aa" opacity="0.35"/>
  <rect x="550" y="430" width="30" height="5" fill="#6622aa" opacity="0.3"/>
  <rect x="700" y="430" width="30" height="5" fill="#6622aa" opacity="0.3"/>

  <!-- Tubes from chair to ceiling -->
  <path d="M640 225 Q640 180 620 140 Q600 100 600 60" fill="none" stroke="#2a2a55" stroke-width="6"/>
  <path d="M610 235 Q570 210 540 180 Q510 150 490 100" fill="none" stroke="#2a2a55" stroke-width="4.5"/>
  <path d="M670 235 Q710 210 740 180 Q770 150 790 100" fill="none" stroke="#2a2a55" stroke-width="4.5"/>
  <!-- Tube glow -->
  <path d="M640 225 Q640 180 620 140 Q600 100 600 60" fill="none" stroke="#6622aa" stroke-width="2" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Wall of monitors -->
  <!-- Monitor 1 -->
  <rect x="60" y="80" width="190" height="130" rx="4" fill="#0a0a1a" stroke="#2a2a50" stroke-width="2"/>
  <rect x="68" y="88" width="174" height="114" fill="url(#monitorGrad)"/>
  <path d="M75 145 Q105 120 135 150 Q165 180 195 140 Q225 100 235 135" fill="none" stroke="#00ff66" stroke-width="1.8" opacity="0.6" filter="url(#screenGlow)"/>
  <path d="M75 160 Q105 140 135 165 Q165 190 195 155 Q225 120 235 150" fill="none" stroke="#00aa44" stroke-width="1" opacity="0.35"/>
  <rect x="75" y="95" width="50" height="2" fill="#00ff66" opacity="0.3"/>
  <rect x="75" y="102" width="35" height="2" fill="#00ff66" opacity="0.25"/>
  <rect x="160" y="95" width="40" height="2" fill="#ff4444" opacity="0.2"/>
  <ellipse cx="155" cy="145" rx="120" ry="80" fill="url(#greenGlow)"/>
  <rect x="140" y="210" width="20" height="25" fill="#2a2a50"/>

  <!-- Monitor 2 -->
  <rect x="280" y="60" width="190" height="130" rx="4" fill="#0a0a1a" stroke="#2a2a50" stroke-width="2"/>
  <rect x="288" y="68" width="174" height="114" fill="url(#monitorGrad)"/>
  <path d="M295 125 Q325 100 355 130 Q385 160 415 120 Q445 80 455 115" fill="none" stroke="#00ff66" stroke-width="1.8" opacity="0.6" filter="url(#screenGlow)"/>
  <path d="M295 140 Q325 120 355 145 Q385 170 415 135 Q445 100 455 130" fill="none" stroke="#00aa44" stroke-width="1" opacity="0.35"/>
  <rect x="295" y="75" width="55" height="2" fill="#00ff66" opacity="0.3"/>
  <rect x="295" y="82" width="40" height="2" fill="#00ff66" opacity="0.25"/>
  <ellipse cx="375" cy="125" rx="120" ry="80" fill="url(#greenGlow)"/>
  <rect x="365" y="190" width="20" height="30" fill="#2a2a50"/>

  <!-- Monitor 3 -->
  <rect x="810" y="60" width="190" height="130" rx="4" fill="#0a0a1a" stroke="#2a2a50" stroke-width="2"/>
  <rect x="818" y="68" width="174" height="114" fill="url(#monitorGrad)"/>
  <path d="M825 125 Q855 95 885 130 Q915 165 945 115 Q975 65 985 110" fill="none" stroke="#00ff66" stroke-width="1.8" opacity="0.6" filter="url(#screenGlow)"/>
  <path d="M825 140 Q855 115 885 145 Q915 175 945 130 Q975 85 985 125" fill="none" stroke="#00aa44" stroke-width="1" opacity="0.35"/>
  <rect x="825" y="75" width="50" height="2" fill="#00ff66" opacity="0.3"/>
  <rect x="825" y="82" width="35" height="2" fill="#00ff66" opacity="0.25"/>
  <rect x="940" y="75" width="40" height="2" fill="#ff4444" opacity="0.2"/>
  <ellipse cx="905" cy="125" rx="120" ry="80" fill="url(#greenGlow)"/>
  <rect x="895" y="190" width="20" height="30" fill="#2a2a50"/>

  <!-- Monitor 4 -->
  <rect x="1030" y="80" width="190" height="130" rx="4" fill="#0a0a1a" stroke="#2a2a50" stroke-width="2"/>
  <rect x="1038" y="88" width="174" height="114" fill="url(#monitorGrad)"/>
  <path d="M1045 145 Q1075 115 1105 150 Q1135 185 1165 135 Q1195 85 1205 130" fill="none" stroke="#00ff66" stroke-width="1.8" opacity="0.6" filter="url(#screenGlow)"/>
  <path d="M1045 160 Q1075 135 1105 165 Q1135 195 1165 150 Q1195 105 1205 145" fill="none" stroke="#00aa44" stroke-width="1" opacity="0.35"/>
  <rect x="1045" y="95" width="50" height="2" fill="#00ff66" opacity="0.3"/>
  <rect x="1045" y="102" width="35" height="2" fill="#00ff66" opacity="0.25"/>
  <ellipse cx="1125" cy="145" rx="120" ry="80" fill="url(#greenGlow)"/>
  <rect x="1115" y="210" width="20" height="25" fill="#2a2a50"/>

  <!-- Monitor 5 (smaller, above chair) -->
  <rect x="555" y="70" width="170" height="100" rx="4" fill="#0a0a1a" stroke="#2a2a50" stroke-width="2"/>
  <rect x="563" y="78" width="154" height="84" fill="url(#monitorGrad)"/>
  <path d="M570 120 Q595 100 620 125 Q645 150 670 110 Q695 70 710 105" fill="none" stroke="#00ff66" stroke-width="1.5" opacity="0.55" filter="url(#screenGlow)"/>
  <rect x="570" y="85" width="45" height="2" fill="#00ff66" opacity="0.25"/>
  <rect x="570" y="92" width="30" height="2" fill="#00ff66" opacity="0.2"/>
  <ellipse cx="640" cy="120" rx="100" ry="60" fill="url(#greenGlow)"/>

  <!-- Vertical glass tubes with floating particles -->
  <!-- Tube 1 -->
  <rect x="40" y="250" width="45" height="210" fill="url(#tubeGrad)" rx="5"/>
  <rect x="40" y="250" width="45" height="210" fill="none" stroke="#2a2a55" stroke-width="2" rx="5"/>
  <ellipse cx="62" cy="355" rx="18" ry="80" fill="url(#tubeInnerGlow)"/>
  <circle cx="55" cy="280" r="3" fill="#8844cc" opacity="0.45" filter="url(#tubeGlow)"/>
  <circle cx="70" cy="310" r="2.5" fill="#6622aa" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="58" cy="345" r="3.5" fill="#aa66ee" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="68" cy="380" r="2" fill="#6622aa" opacity="0.45" filter="url(#tubeGlow)"/>
  <circle cx="60" cy="415" r="3" fill="#8844cc" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="65" cy="440" r="2.5" fill="#6622aa" opacity="0.35" filter="url(#tubeGlow)"/>
  <rect x="40" y="250" width="45" height="210" fill="#6622aa" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Tube 2 -->
  <rect x="110" y="280" width="40" height="180" fill="url(#tubeGrad)" rx="5"/>
  <rect x="110" y="280" width="40" height="180" fill="none" stroke="#2a2a55" stroke-width="2" rx="5"/>
  <ellipse cx="130" cy="370" rx="16" ry="70" fill="url(#tubeInnerGlow)"/>
  <circle cx="125" cy="310" r="2.5" fill="#00ff88" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="135" cy="350" r="3" fill="#00cc66" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="122" cy="390" r="2" fill="#00ff88" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="132" cy="420" r="2.5" fill="#00cc66" opacity="0.3" filter="url(#tubeGlow)"/>
  <rect x="110" y="280" width="40" height="180" fill="#00ff88" opacity="0.015" filter="url(#softGlow)"/>

  <!-- Tube 3 -->
  <rect x="1120" y="260" width="45" height="200" fill="url(#tubeGrad)" rx="5"/>
  <rect x="1120" y="260" width="45" height="200" fill="none" stroke="#2a2a55" stroke-width="2" rx="5"/>
  <ellipse cx="1142" cy="360" rx="18" ry="75" fill="url(#tubeInnerGlow)"/>
  <circle cx="1135" cy="290" r="3" fill="#6622aa" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="1148" cy="325" r="2.5" fill="#8844cc" opacity="0.45" filter="url(#tubeGlow)"/>
  <circle cx="1138" cy="360" r="3.5" fill="#aa66ee" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="1150" cy="395" r="2" fill="#6622aa" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="1140" cy="430" r="3" fill="#8844cc" opacity="0.35" filter="url(#tubeGlow)"/>
  <rect x="1120" y="260" width="45" height="200" fill="#6622aa" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Tube 4 -->
  <rect x="1190" y="290" width="40" height="170" fill="url(#tubeGrad)" rx="5"/>
  <rect x="1190" y="290" width="40" height="170" fill="none" stroke="#2a2a55" stroke-width="2" rx="5"/>
  <ellipse cx="1210" cy="375" rx="16" ry="65" fill="url(#tubeInnerGlow)"/>
  <circle cx="1205" cy="320" r="2.5" fill="#00ff88" opacity="0.3" filter="url(#tubeGlow)"/>
  <circle cx="1215" cy="360" r="3" fill="#00cc66" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="1202" cy="400" r="2" fill="#00ff88" opacity="0.3" filter="url(#tubeGlow)"/>
  <circle cx="1212" cy="435" r="2.5" fill="#00cc66" opacity="0.25" filter="url(#tubeGlow)"/>
  <rect x="1190" y="290" width="40" height="170" fill="#00ff88" opacity="0.015" filter="url(#softGlow)"/>

  <!-- Cable bundles on floor -->
  <path d="M200 520 Q300 540 400 510 Q500 480 580 510" fill="none" stroke="#1a1a30" stroke-width="8" opacity="0.6"/>
  <path d="M200 520 Q300 540 400 510 Q500 480 580 510" fill="none" stroke="#2a2a45" stroke-width="5" opacity="0.4"/>
  <path d="M700 505 Q800 490 900 520 Q1000 550 1100 510" fill="none" stroke="#1a1a30" stroke-width="8" opacity="0.6"/>
  <path d="M700 505 Q800 490 900 520 Q1000 550 1100 510" fill="none" stroke="#2a2a45" stroke-width="5" opacity="0.4"/>
  <path d="M580 510 Q620 530 640 540 Q660 530 700 505" fill="none" stroke="#1a1a30" stroke-width="7" opacity="0.5"/>
  <path d="M580 510 Q620 530 640 540 Q660 530 700 505" fill="none" stroke="#2a2a45" stroke-width="4" opacity="0.35"/>
  <!-- Thinner cable strands -->
  <path d="M100 550 Q200 530 300 560 Q400 580 500 550" fill="none" stroke="#1a1a30" stroke-width="4" opacity="0.4"/>
  <path d="M800 560 Q900 540 1000 570 Q1100 590 1200 555" fill="none" stroke="#1a1a30" stroke-width="4" opacity="0.4"/>

  <!-- Purple/blue ambient -->
  <rect width="1280" height="720" fill="url(#purpleAmbient)"/>

  <!-- Dark underground atmosphere -->
  <rect width="1280" height="720" fill="#0a0518" opacity="0.12"/>
</svg>