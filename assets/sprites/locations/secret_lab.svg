<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e20"/>
      <stop offset="100%" stop-color="#080816"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a35" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2a2a50" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1a35" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="greenDisplay" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleAmbient" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#6622aa" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6622aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="tubeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Walls -->
  <rect x="0" y="0" width="1280" height="450" fill="#0c0c20"/>
  <!-- Wall panel lines -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#1a1a35" stroke-width="1"/>
    <line x1="0" y1="200" x2="1280" y2="200" stroke="#1a1a35" stroke-width="1"/>
    <line x1="0" y1="300" x2="1280" y2="300" stroke="#1a1a35" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#1a1a35" stroke-width="1"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="450" width="1280" height="270" fill="url(#floorGrad)"/>
  <g opacity="0.06">
    <line x1="0" y1="510" x2="1280" y2="510" stroke="#2a2a50" stroke-width="0.5"/>
    <line x1="0" y1="570" x2="1280" y2="570" stroke="#2a2a50" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1280" y2="630" stroke="#2a2a50" stroke-width="0.5"/>
    <line x1="0" y1="690" x2="1280" y2="690" stroke="#2a2a50" stroke-width="0.5"/>
  </g>

  <!-- Memory extraction chair 1 (center-left) -->
  <!-- Chair base -->
  <ellipse cx="300" cy="500" rx="80" ry="20" fill="#1a1a35" stroke="#2a2a50" stroke-width="1.5"/>
  <!-- Chair seat -->
  <rect x="245" y="390" width="110" height="110" rx="10" fill="#1e1e38" stroke="#2a2a50" stroke-width="1.5"/>
  <!-- Chair back (reclined) -->
  <rect x="230" y="280" width="140" height="115" rx="12" fill="#222245" stroke="#2a2a50" stroke-width="1.5"/>
  <!-- Head rest with neural interface -->
  <rect x="270" y="260" width="60" height="30" rx="8" fill="#2a2a55"/>
  <circle cx="300" cy="275" r="12" fill="#1a1a35" stroke="#6622aa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="300" cy="275" r="6" fill="#6622aa" opacity="0.3" filter="url(#neonGlow)"/>
  <!-- Arm rests with straps -->
  <rect x="225" y="380" width="25" height="80" rx="5" fill="#252550"/>
  <rect x="350" y="380" width="25" height="80" rx="5" fill="#252550"/>
  <rect x="225" y="400" width="25" height="4" fill="#6622aa" opacity="0.3"/>
  <rect x="350" y="400" width="25" height="4" fill="#6622aa" opacity="0.3"/>
  <!-- Tubes from chair -->
  <path d="M300 260 Q300 230 280 200 Q260 170 260 140" fill="none" stroke="#2a2a55" stroke-width="5"/>
  <path d="M270 270 Q240 250 220 230 Q200 210 180 200" fill="none" stroke="#2a2a55" stroke-width="4"/>
  <path d="M330 270 Q360 250 380 230 Q400 210 420 200" fill="none" stroke="#2a2a55" stroke-width="4"/>

  <!-- Memory extraction chair 2 (center-right) -->
  <ellipse cx="750" cy="500" rx="80" ry="20" fill="#1a1a35" stroke="#2a2a50" stroke-width="1.5"/>
  <rect x="695" y="390" width="110" height="110" rx="10" fill="#1e1e38" stroke="#2a2a50" stroke-width="1.5"/>
  <rect x="680" y="280" width="140" height="115" rx="12" fill="#222245" stroke="#2a2a50" stroke-width="1.5"/>
  <rect x="720" y="260" width="60" height="30" rx="8" fill="#2a2a55"/>
  <circle cx="750" cy="275" r="12" fill="#1a1a35" stroke="#6622aa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="750" cy="275" r="6" fill="#6622aa" opacity="0.3" filter="url(#neonGlow)"/>
  <rect x="675" y="380" width="25" height="80" rx="5" fill="#252550"/>
  <rect x="800" y="380" width="25" height="80" rx="5" fill="#252550"/>
  <path d="M750 260 Q750 230 730 200 Q710 170 710 140" fill="none" stroke="#2a2a55" stroke-width="5"/>

  <!-- Brain scan monitors -->
  <!-- Monitor 1 (above chair 1) -->
  <rect x="150" y="80" width="200" height="130" rx="4" fill="#0a0a1a"/>
  <rect x="150" y="80" width="200" height="130" rx="4" fill="none" stroke="#2a2a50" stroke-width="2"/>
  <rect x="158" y="88" width="184" height="114" fill="#000a08"/>
  <!-- Brain wave patterns -->
  <polyline points="165,140 180,125 195,150 210,120 225,145 240,115 255,140 270,130 285,150 300,118 315,142 330,128" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
  <polyline points="165,165 180,155 195,170 210,148 225,168 240,145 255,162 270,155 285,172 300,148 315,165 330,152" fill="none" stroke="#00aa66" stroke-width="1" opacity="0.4"/>
  <!-- Data readouts -->
  <rect x="165" y="95" width="50" height="2" fill="#00ff88" opacity="0.3"/>
  <rect x="165" y="102" width="35" height="2" fill="#00ff88" opacity="0.25"/>
  <rect x="280" y="95" width="40" height="2" fill="#ff4444" opacity="0.2"/>
  <rect x="280" y="102" width="55" height="2" fill="#ff4444" opacity="0.15"/>
  <rect x="150" y="80" width="200" height="130" fill="#00ff88" opacity="0.015" filter="url(#softGlow)"/>
  <!-- Monitor stand -->
  <rect x="240" y="210" width="20" height="30" fill="#2a2a50"/>

  <!-- Monitor 2 (above chair 2) -->
  <rect x="600" y="70" width="200" height="130" rx="4" fill="#0a0a1a"/>
  <rect x="600" y="70" width="200" height="130" rx="4" fill="none" stroke="#2a2a50" stroke-width="2"/>
  <rect x="608" y="78" width="184" height="114" fill="#000a08"/>
  <polyline points="615,130 630,115 645,140 660,108 675,135 690,105 705,130 720,120 735,142 750,110 765,135 780,118" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6"/>
  <polyline points="615,155 630,145 645,160 660,138 675,158 690,135 705,152 720,145 735,162 750,138 765,155 780,142" fill="none" stroke="#00aa66" stroke-width="1" opacity="0.4"/>
  <rect x="615" y="85" width="50" height="2" fill="#00ff88" opacity="0.3"/>
  <rect x="615" y="92" width="35" height="2" fill="#00ff88" opacity="0.25"/>
  <rect x="600" y="70" width="200" height="130" fill="#00ff88" opacity="0.015" filter="url(#softGlow)"/>
  <rect x="690" y="200" width="20" height="30" fill="#2a2a50"/>

  <!-- Vertical data tubes (with floating particles) -->
  <!-- Tube 1 -->
  <rect x="460" y="50" width="40" height="400" fill="url(#tubeGrad)"/>
  <rect x="460" y="50" width="40" height="400" fill="none" stroke="#2a2a55" stroke-width="2" rx="5"/>
  <!-- Particles inside tube -->
  <circle cx="475" cy="100" r="3" fill="#6622aa" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="485" cy="160" r="2.5" fill="#8844cc" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="472" cy="220" r="3" fill="#6622aa" opacity="0.45" filter="url(#tubeGlow)"/>
  <circle cx="488" cy="280" r="2" fill="#aa66ee" opacity="0.3" filter="url(#tubeGlow)"/>
  <circle cx="478" cy="340" r="3.5" fill="#6622aa" opacity="0.4" filter="url(#tubeGlow)"/>
  <circle cx="483" cy="400" r="2.5" fill="#8844cc" opacity="0.35" filter="url(#tubeGlow)"/>
  <!-- Tube glow -->
  <rect x="460" y="50" width="40" height="400" fill="#6622aa" opacity="0.02" filter="url(#softGlow)"/>

  <!-- Tube 2 -->
  <rect x="530" y="80" width="35" height="370" fill="url(#tubeGrad)"/>
  <rect x="530" y="80" width="35" height="370" fill="none" stroke="#2a2a55" stroke-width="2" rx="5"/>
  <circle cx="545" cy="130" r="2.5" fill="#00ff88" opacity="0.3" filter="url(#tubeGlow)"/>
  <circle cx="550" cy="200" r="3" fill="#00cc66" opacity="0.35" filter="url(#tubeGlow)"/>
  <circle cx="542" cy="270" r="2" fill="#00ff88" opacity="0.3" filter="url(#tubeGlow)"/>
  <circle cx="548" cy="340" r="2.5" fill="#00cc66" opacity="0.25" filter="url(#tubeGlow)"/>
  <circle cx="540" cy="400" r="3" fill="#00ff88" opacity="0.3" filter="url(#tubeGlow)"/>
  <rect x="530" y="80" width="35" height="370" fill="#00ff88" opacity="0.015" filter="url(#softGlow)"/>

  <!-- Equipment rack (right side) -->
  <rect x="980" y="150" width="120" height="300" fill="#1a1a35" stroke="#2a2a50" stroke-width="2"/>
  <rect x="985" y="160" width="110" height="20" fill="#0a0a1a"/>
  <rect x="985" y="185" width="110" height="20" fill="#0a0a1a"/>
  <rect x="985" y="210" width="110" height="20" fill="#0a0a1a"/>
  <rect x="985" y="235" width="110" height="20" fill="#0a0a1a"/>
  <rect x="985" y="260" width="110" height="20" fill="#0a0a1a"/>
  <rect x="985" y="285" width="110" height="20" fill="#0a0a1a"/>
  <rect x="985" y="310" width="110" height="20" fill="#0a0a1a"/>
  <!-- Status lights -->
  <circle cx="1088" cy="170" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="1088" cy="195" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="1088" cy="220" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="1088" cy="245" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="1088" cy="270" r="2" fill="#6622aa" opacity="0.5"/>
  <circle cx="1088" cy="295" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="1088" cy="320" r="2" fill="#ff4444" opacity="0.4"/>

  <!-- Control console (far right) -->
  <rect x="1130" y="300" width="120" height="150" rx="5" fill="#1a1a35" stroke="#2a2a50" stroke-width="1.5"/>
  <!-- Small screens on console -->
  <rect x="1140" y="310" width="45" height="35" fill="#000a08" stroke="#1a1a30" stroke-width="1"/>
  <polyline points="1145,330 1155,322 1165,335 1175,318" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <rect x="1195" y="310" width="45" height="35" fill="#000a08" stroke="#1a1a30" stroke-width="1"/>
  <rect x="1200" y="318" width="30" height="2" fill="#6622aa" opacity="0.4"/>
  <rect x="1200" y="325" width="20" height="2" fill="#6622aa" opacity="0.3"/>
  <!-- Buttons -->
  <circle cx="1155" cy="370" r="5" fill="#2a2a55" stroke="#3a3a65" stroke-width="1"/>
  <circle cx="1180" cy="370" r="5" fill="#2a2a55" stroke="#3a3a65" stroke-width="1"/>
  <circle cx="1205" cy="370" r="5" fill="#ff2244" opacity="0.4" stroke="#ff4466" stroke-width="1"/>
  <circle cx="1230" cy="370" r="5" fill="#2a2a55" stroke="#3a3a65" stroke-width="1"/>

  <!-- Purple/blue ambient -->
  <rect width="1280" height="720" fill="url(#purpleAmbient)"/>

  <!-- Green display glow -->
  <ellipse cx="250" cy="150" rx="150" ry="100" fill="url(#greenDisplay)"/>
  <ellipse cx="700" cy="140" rx="150" ry="100" fill="url(#greenDisplay)"/>

  <!-- Dark science atmosphere -->
  <rect width="1280" height="720" fill="#060612" opacity="0.15"/>
</svg>