<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080820"/>
      <stop offset="100%" stop-color="#0a0a30"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c8d8"/>
      <stop offset="30%" stop-color="#a0a8c0"/>
      <stop offset="100%" stop-color="#6a7088"/>
    </linearGradient>
    <linearGradient id="towerSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8890a8"/>
      <stop offset="100%" stop-color="#6a7088"/>
    </linearGradient>
    <linearGradient id="plazaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a40"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
    <radialGradient id="spotlight1" cx="0.3" cy="0" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlight2" cx="0.7" cy="0" r="0.8">
      <stop offset="0%" stop-color="#4488ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4488ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Distant buildings (background) -->
  <rect x="0" y="200" width="100" height="520" fill="#0e0e25"/>
  <rect x="110" y="250" width="80" height="470" fill="#0c0c22"/>
  <rect x="200" y="180" width="90" height="540" fill="#0d0d24"/>
  <rect x="300" y="220" width="70" height="500" fill="#0e0e25"/>
  <rect x="880" y="230" width="80" height="490" fill="#0e0e25"/>
  <rect x="970" y="190" width="90" height="530" fill="#0c0c22"/>
  <rect x="1070" y="240" width="70" height="480" fill="#0d0d24"/>
  <rect x="1150" y="210" width="80" height="510" fill="#0e0e25"/>
  <rect x="1240" y="250" width="40" height="470" fill="#0c0c22"/>
  <!-- Distant building windows -->
  <g opacity="0.3">
    <rect x="20" y="230" width="4" height="3" fill="#4488ff"/>
    <rect x="50" y="260" width="4" height="3" fill="#ffffff"/>
    <rect x="130" y="280" width="4" height="3" fill="#4488ff"/>
    <rect x="220" y="210" width="4" height="3" fill="#ffffff"/>
    <rect x="250" y="250" width="4" height="3" fill="#4488ff"/>
    <rect x="320" y="260" width="4" height="3" fill="#ffffff"/>
    <rect x="900" y="260" width="4" height="3" fill="#4488ff"/>
    <rect x="990" y="220" width="4" height="3" fill="#ffffff"/>
    <rect x="1030" y="250" width="4" height="3" fill="#4488ff"/>
    <rect x="1090" y="270" width="4" height="3" fill="#ffffff"/>
    <rect x="1170" y="240" width="4" height="3" fill="#4488ff"/>
    <rect x="1250" y="280" width="4" height="3" fill="#ffffff"/>
  </g>

  <!-- Main ZhengTek tower -->
  <rect x="380" y="20" width="520" height="700" fill="url(#towerGrad)"/>
  <!-- Tower left side panel -->
  <rect x="370" y="30" width="15" height="690" fill="url(#towerSide)"/>
  <!-- Tower right side panel -->
  <rect x="895" y="30" width="15" height="690" fill="#6a7088"/>
  <!-- Tower top structure -->
  <rect x="420" y="0" width="440" height="25" fill="#b0b8c8"/>
  <rect x="430" y="0" width="420" height="8" fill="#c8d0e0"/>
  <!-- Antenna array on top -->
  <rect x="636" y="0" width="8" height="0" fill="#8890a0"/>
  <line x1="640" y1="0" x2="640" y2="-20" stroke="#8890a0" stroke-width="3" opacity="0"/>

  <!-- Tower window grid -->
  <g opacity="0.15">
    <!-- Horizontal floor lines -->
    <line x1="380" y1="60" x2="900" y2="60" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="100" x2="900" y2="100" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="140" x2="900" y2="140" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="180" x2="900" y2="180" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="220" x2="900" y2="220" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="260" x2="900" y2="260" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="300" x2="900" y2="300" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="340" x2="900" y2="340" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="380" x2="900" y2="380" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="420" x2="900" y2="420" stroke="#4a5060" stroke-width="1"/>
    <line x1="380" y1="460" x2="900" y2="460" stroke="#4a5060" stroke-width="1"/>
    <!-- Vertical column lines -->
    <line x1="450" y1="20" x2="450" y2="720" stroke="#4a5060" stroke-width="1"/>
    <line x1="520" y1="20" x2="520" y2="720" stroke="#4a5060" stroke-width="1"/>
    <line x1="590" y1="20" x2="590" y2="720" stroke="#4a5060" stroke-width="1"/>
    <line x1="660" y1="20" x2="660" y2="720" stroke="#4a5060" stroke-width="1"/>
    <line x1="730" y1="20" x2="730" y2="720" stroke="#4a5060" stroke-width="1"/>
    <line x1="800" y1="20" x2="800" y2="720" stroke="#4a5060" stroke-width="1"/>
    <line x1="870" y1="20" x2="870" y2="720" stroke="#4a5060" stroke-width="1"/>
  </g>

  <!-- Lit windows on tower -->
  <g opacity="0.4">
    <rect x="395" y="65" width="45" height="28" fill="#4488ff" opacity="0.15"/>
    <rect x="465" y="65" width="45" height="28" fill="#ffffff" opacity="0.08"/>
    <rect x="535" y="65" width="45" height="28" fill="#4488ff" opacity="0.12"/>
    <rect x="675" y="65" width="45" height="28" fill="#ffffff" opacity="0.1"/>
    <rect x="815" y="65" width="45" height="28" fill="#4488ff" opacity="0.15"/>
    <rect x="395" y="105" width="45" height="28" fill="#ffffff" opacity="0.1"/>
    <rect x="535" y="105" width="45" height="28" fill="#4488ff" opacity="0.12"/>
    <rect x="605" y="105" width="45" height="28" fill="#ffffff" opacity="0.08"/>
    <rect x="745" y="105" width="45" height="28" fill="#4488ff" opacity="0.15"/>
    <rect x="395" y="145" width="45" height="28" fill="#4488ff" opacity="0.1"/>
    <rect x="465" y="145" width="45" height="28" fill="#ffffff" opacity="0.12"/>
    <rect x="675" y="145" width="45" height="28" fill="#4488ff" opacity="0.1"/>
    <rect x="815" y="145" width="45" height="28" fill="#ffffff" opacity="0.08"/>
    <rect x="465" y="225" width="45" height="28" fill="#4488ff" opacity="0.12"/>
    <rect x="605" y="225" width="45" height="28" fill="#ffffff" opacity="0.1"/>
    <rect x="745" y="225" width="45" height="28" fill="#4488ff" opacity="0.08"/>
    <rect x="395" y="265" width="45" height="28" fill="#ffffff" opacity="0.1"/>
    <rect x="535" y="265" width="45" height="28" fill="#4488ff" opacity="0.12"/>
    <rect x="815" y="265" width="45" height="28" fill="#ffffff" opacity="0.08"/>
    <rect x="465" y="345" width="45" height="28" fill="#4488ff" opacity="0.1"/>
    <rect x="675" y="345" width="45" height="28" fill="#ffffff" opacity="0.12"/>
    <rect x="395" y="385" width="45" height="28" fill="#4488ff" opacity="0.08"/>
    <rect x="605" y="385" width="45" height="28" fill="#ffffff" opacity="0.1"/>
    <rect x="815" y="385" width="45" height="28" fill="#4488ff" opacity="0.12"/>
  </g>

  <!-- Company logo area on tower -->
  <rect x="480" y="35" width="320" height="50" fill="#b8c0d0" opacity="0.3"/>
  <g filter="url(#logoGlow)">
    <text x="640" y="68" font-family="sans-serif" font-size="32" fill="#4488ff" text-anchor="middle" font-weight="bold" opacity="0.9">&#27491;&#21644;&#31185;&#25216;</text>
  </g>
  <text x="640" y="82" font-family="sans-serif" font-size="10" fill="#4488ff" text-anchor="middle" opacity="0.5" letter-spacing="4">ZHENGTEK CORPORATION</text>

  <!-- Tower entrance (ground level) -->
  <rect x="520" y="520" width="240" height="200" fill="#1a1a35"/>
  <rect x="520" y="520" width="240" height="200" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.3"/>
  <!-- Glass doors -->
  <rect x="560" y="540" width="70" height="180" fill="#0a0a25" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <rect x="650" y="540" width="70" height="180" fill="#0a0a25" stroke="#4488ff" stroke-width="0.5" opacity="0.3"/>
  <!-- Door frame light -->
  <rect x="520" y="520" width="240" height="3" fill="#4488ff" opacity="0.5" filter="url(#neonGlow)"/>

  <!-- Plaza / ground -->
  <rect x="0" y="520" width="1280" height="200" fill="url(#plazaGrad)"/>
  <!-- Plaza tile pattern -->
  <g opacity="0.08">
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1280" y2="600" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="0" y1="680" x2="1280" y2="680" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="160" y1="520" x2="160" y2="720" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="320" y1="520" x2="320" y2="720" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="480" y1="520" x2="480" y2="720" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="640" y1="520" x2="640" y2="720" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="800" y1="520" x2="800" y2="720" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="960" y1="520" x2="960" y2="720" stroke="#4488ff" stroke-width="0.5"/>
    <line x1="1120" y1="520" x2="1120" y2="720" stroke="#4488ff" stroke-width="0.5"/>
  </g>

  <!-- Security barriers (horizontal lines at entrance) -->
  <rect x="350" y="530" width="130" height="3" fill="#4488ff" opacity="0.3" filter="url(#neonGlow)"/>
  <rect x="350" y="540" width="130" height="2" fill="#4488ff" opacity="0.2"/>
  <rect x="800" y="530" width="130" height="3" fill="#4488ff" opacity="0.3" filter="url(#neonGlow)"/>
  <rect x="800" y="540" width="130" height="2" fill="#4488ff" opacity="0.2"/>
  <!-- Barrier posts -->
  <rect x="350" y="520" width="5" height="25" fill="#3a3a5a"/>
  <rect x="475" y="520" width="5" height="25" fill="#3a3a5a"/>
  <rect x="800" y="520" width="5" height="25" fill="#3a3a5a"/>
  <rect x="925" y="520" width="5" height="25" fill="#3a3a5a"/>

  <!-- Hovering drones -->
  <!-- Drone 1 -->
  <ellipse cx="250" cy="180" rx="12" ry="5" fill="#6a7088"/>
  <rect x="245" y="175" width="10" height="4" fill="#8890a8"/>
  <circle cx="250" cy="186" r="2" fill="#ff0044" opacity="0.6"/>
  <circle cx="250" cy="186" r="6" fill="#ff0044" opacity="0.1" filter="url(#neonGlow)"/>
  <!-- Drone 2 -->
  <ellipse cx="1050" cy="140" rx="10" ry="4" fill="#6a7088"/>
  <rect x="1046" y="136" width="8" height="3" fill="#8890a8"/>
  <circle cx="1050" cy="145" r="1.5" fill="#ff0044" opacity="0.5"/>
  <circle cx="1050" cy="145" r="5" fill="#ff0044" opacity="0.08" filter="url(#neonGlow)"/>
  <!-- Drone 3 (closer) -->
  <ellipse cx="780" cy="350" rx="15" ry="6" fill="#7a8098"/>
  <rect x="774" y="344" width="12" height="5" fill="#8890a8"/>
  <circle cx="780" cy="357" r="2.5" fill="#4488ff" opacity="0.6"/>
  <circle cx="780" cy="357" r="8" fill="#4488ff" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Spotlights from base -->
  <polygon points="400,520 420,520 500,100 380,100" fill="#ffffff" opacity="0.015"/>
  <polygon points="860,520 880,520 800,100 960,100" fill="#4488ff" opacity="0.012"/>

  <!-- Spotlight ambient on building -->
  <rect x="380" y="20" width="520" height="700" fill="url(#spotlight1)" opacity="0.3"/>
  <rect x="380" y="20" width="520" height="700" fill="url(#spotlight2)" opacity="0.2"/>

  <!-- Plaza floor reflection of tower -->
  <rect x="400" y="530" width="480" height="60" fill="#4488ff" opacity="0.015"/>

  <!-- Corporate blue atmosphere -->
  <rect width="1280" height="720" fill="#0a0a30" opacity="0.1"/>
</svg>